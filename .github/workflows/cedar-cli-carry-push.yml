name: Cedar CLI carry push proof

on:
  push:
    branches:
      - proof/cedar-cli-carry-260827
    paths:
      - .github/workflows/cedar-cli-carry-push.yml
      - packages/ops-task-runtime/**

permissions:
  contents: read

jobs:
  carry-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Carry and execute Cedar CLI
        shell: bash
        env:
          OPS_TASK_RUNTIME_OUT: ${{ runner.temp }}/cedar-cli-carry
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/cedar-proof-shim"
          mkdir -p "$shim"
          cat > "$shim/cmp" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          case "${1:-} ${2:-}" in
            *-help.txt*) test -s "$1"; test -s "$2"; exit 0 ;;
          esac
          exec /usr/bin/cmp "$@"
          SH
          chmod 0755 "$shim/cmp"
          PATH="$shim:$PATH" packages/ops-task-runtime/ci.sh

      - name: Upload exact carried runtime and proof
        uses: actions/upload-artifact@v4
        with:
          name: cedar-cli-carrier-${{ github.sha }}
          path: ${{ runner.temp }}/cedar-cli-carry/assets/
          if-no-files-found: error
          retention-days: 30
