name: Proof JSONL Artifact App identities

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/proof-jsonl-artifact-app-identities.yml'

permissions:
  contents: read
  issues: write

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UI_COMMIT: 1a7be63b9ddea94eece0b693d90df48f34c1575d
      UI_TREE: 1cff1b75ddcbae6faf518d2ae1ac177757f9e95a
      EXPECTED_PUBLICATION_TREE: sha256:b5c164f7b8a9dd8c612cfdb6747d649f4ae2a809a5ddaa02d744a509a4d40c52
      EXPECTED_FILES: '63'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Materialize exact accepted UI source from GitHub Git
        shell: bash
        run: |
          set -euo pipefail
          ui="$RUNNER_TEMP/ui"
          git clone --filter=blob:none --no-checkout https://github.com/roccho-dev/ui.git "$ui"
          git -C "$ui" fetch --depth=1 origin "$UI_COMMIT"
          git -C "$ui" checkout --detach "$UI_COMMIT"
          test "$(git -C "$ui" rev-parse HEAD)" = "$UI_COMMIT"
          test "$(git -C "$ui" rev-parse 'HEAD^{tree}')" = "$UI_TREE"
          test "$(git -C "$ui" rev-parse --is-shallow-repository)" = true
          test "$(git -C "$ui" rev-list --count HEAD)" = 1
          test -z "$(git -C "$ui" status --porcelain)"
          git -C "$ui" fsck --no-dangling

      - name: Build and verify exact JSONL-only publication identities
        shell: bash
        run: |
          set -euo pipefail
          ui="$RUNNER_TEMP/ui"
          out="$RUNNER_TEMP/publication"
          archive="$RUNNER_TEMP/artifact-runtime.tar.gz"
          carrier="$RUNNER_TEMP/artifact-runtime.tar.gz.b64.txt"
          report="$RUNNER_TEMP/jsonl-app-identities.json"

          (cd "$ui" && npm run check:artifact-runtime)
          (cd "$ui" && node apps/artifact-shell/scripts/build-publication.mjs --out="$out") > "$RUNNER_TEMP/publication-build.json"
          python3 - "$RUNNER_TEMP/publication-build.json" "$out" <<'PY'
          import json,pathlib,sys
          receipt=json.load(open(sys.argv[1],encoding='utf-8')); root=pathlib.Path(sys.argv[2])
          assert receipt=={
            'schema':'artifact-shell-publication-build-receipt/2','status':'PASS','capabilities':3,'files':63,
            'treeDigest':'sha256:b5c164f7b8a9dd8c612cfdb6747d649f4ae2a809a5ddaa02d744a509a4d40c52',
          }
          artifact=json.loads((root/'artifact-manifest.json').read_text(encoding='utf-8'))
          catalog=json.loads((root/'catalog.json').read_text(encoding='utf-8'))
          assert artifact['treeDigest']==receipt['treeDigest'] and len(artifact['files'])==receipt['files']
          assert [f"{x['capability']['id']}@{x['capability']['version']}" for x in catalog['capabilities']]==[
            'inspect.json@1','render.a2ui@1','render.a2ui.app@1'
          ]
          required=[
            'packages/a2ui-browser/src/jsonl-surface.mjs',
            'packages/core-port/src/jsonl.mjs',
            'packages/core-port/src/project.mjs',
            'packages/core-port/src/catalog.mjs',
            'packages/core-port/src/registry.mjs',
          ]
          for suffix in required: assert sum(row['path'].endswith(suffix) for row in artifact['files'])==1,suffix
          for name in ('base','graph','map','seq'):
            suffix=f'apps/artifact-shell/fixtures/jsonl/{name}.jsonl'
            assert sum(row['path'].endswith(suffix) for row in artifact['files'])==1,suffix
          PY

          (cd "$out" && tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX,go-s' -cf - .) | gzip -n > "$archive"
          base64 -w0 "$archive" > "$carrier"
          base64 --decode "$carrier" | cmp - "$archive"

          python3 - "$out" "$archive" "$carrier" "$report" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); archive=pathlib.Path(sys.argv[2]); carrier=pathlib.Path(sys.argv[3]); report=pathlib.Path(sys.argv[4])
          artifact=json.loads((root/'artifact-manifest.json').read_text(encoding='utf-8'))
          catalog=json.loads((root/'catalog.json').read_text(encoding='utf-8'))
          kernel=catalog['kernel']; kernel_id=kernel['digest'].removeprefix('sha256:')
          fixtures={}
          for name in ('base','graph','map','seq'):
            matches=[row for row in artifact['files'] if row['path'].endswith(f'apps/artifact-shell/fixtures/jsonl/{name}.jsonl')]
            assert len(matches)==1
            fixtures[name]=matches[0]
          value={
            'schema':'ops.jsonlArtifactAppIdentityProof/1','status':'PASS','authority':False,
            'source':{'repository':'roccho-dev/ui','commit':'1a7be63b9ddea94eece0b693d90df48f34c1575d','tree':'1cff1b75ddcbae6faf518d2ae1ac177757f9e95a'},
            'publication':{
              'treeDigest':artifact['treeDigest'],'kernelDigest':kernel['digest'],'kernelId':kernel_id,
              'listedFiles':len(artifact['files']),
              'capabilities':[f"{x['capability']['id']}@{x['capability']['version']}" for x in catalog['capabilities']],
              'archive':{'bytes':archive.stat().st_size,'sha256':'sha256:'+hashlib.sha256(archive.read_bytes()).hexdigest()},
              'carrier':{'bytes':carrier.stat().st_size,'sha256':'sha256:'+hashlib.sha256(carrier.read_bytes()).hexdigest(),'codec':'standard-base64-no-whitespace'},
            },
            'entrypoints':{
              'browser':'index.html','catalog':'catalog.json','artifactManifest':'artifact-manifest.json',
              'codec':f'kernel/{kernel_id}/packages/url-module/src/index.mjs',
              'invocation':f'kernel/{kernel_id}/packages/artifact-invocation/src/index.mjs',
              'jsonlSurface':f'kernel/{kernel_id}/packages/a2ui-browser/src/jsonl-surface.mjs',
              'shell':f'kernel/{kernel_id}/apps/artifact-shell/src/shell-core.mjs',
            },
            'fixtures':fixtures,
            'transport':{'uploadedZipInputUsed':False,'sourceBuildRequiredAfterCarry':False},
          }
          report.write_text(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(value,indent=2,sort_keys=True))
          PY

      - name: Record exact identities on Ops issue 223
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/jsonl-app-identities.json" > "$RUNNER_TEMP/comment.md" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8')); p=x['publication']; s=x['source']
          print('## Exact JSONL-only Artifact App identities — PASS')
          print()
          print(f"- UI source: `{s['commit']}` / tree `{s['tree']}`")
          print(f"- publication tree: `{p['treeDigest']}`")
          print(f"- kernel: `{p['kernelDigest']}`")
          print(f"- capabilities: `{', '.join(p['capabilities'])}`")
          print(f"- listed files: `{p['listedFiles']}`")
          print(f"- archive: `{p['archive']['bytes']}` bytes / `{p['archive']['sha256']}`")
          print(f"- Carrier: `{p['carrier']['bytes']}` bytes / `{p['carrier']['sha256']}`")
          print('- carried JSONL fixtures:')
          for name,row in x['fixtures'].items(): print(f"  - `{name}`: `{row['path']}` / `{row['sha256']}`")
          print('- entrypoints:')
          for name,path in x['entrypoints'].items(): print(f"  - `{name}`: `{path}`")
          print()
          print('Input was exact GitHub Git only. The four JSONL fixtures, parser, reducer, registry and generic projector are all inside the immutable publication closure. No uploaded ZIP or hand-built surface object was used.')
          PY
          gh issue comment 223 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
