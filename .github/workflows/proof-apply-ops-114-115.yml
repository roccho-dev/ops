name: One-shot apply ops 114 and 115 proof package

on:
  push:
    branches:
      - proof/ops-114-115-260818

permissions:
  contents: write

jobs:
  apply-exact-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/proof/ops-114-115-260818' ]]
          mapfile -t parts < <(find .github/proof-requests -maxdepth 1 -type f -name 'ops-114-115.patch.xz.b64.part-*' -print | LC_ALL=C sort)
          [[ "${#parts[@]}" == 5 ]]
          cat "${parts[@]}" > "$RUNNER_TEMP/implementation.patch.xz.b64.txt"
          [[ "$(sha256sum "$RUNNER_TEMP/implementation.patch.xz.b64.txt" | awk '{print $1}')" == 'f64fb41debca11ca697f8f4b848063643e93db31d23e22e2a050b277ca33d5a7' ]]
          base64 --decode "$RUNNER_TEMP/implementation.patch.xz.b64.txt" > "$RUNNER_TEMP/implementation.patch.xz"
          [[ "$(sha256sum "$RUNNER_TEMP/implementation.patch.xz" | awk '{print $1}')" == '822d849462662c985e3276af5e70ea4e7acb69c521b6da416e3a483dac4dea2c' ]]
          xz --decompress --stdout "$RUNNER_TEMP/implementation.patch.xz" > "$RUNNER_TEMP/implementation.patch"
          [[ "$(sha256sum "$RUNNER_TEMP/implementation.patch" | awk '{print $1}')" == '3f2ef4cd3b6ab5d41260ff37629d61c3654af6e22e3ef7e869c9915058a8959b' ]]
          git apply --check "$RUNNER_TEMP/implementation.patch"
          git apply "$RUNNER_TEMP/implementation.patch"

      - name: Acquire exact DuckDB proof runtime
        shell: bash
        run: |
          set -euo pipefail
          tag='duckdb-carrier-v1.5.5-3d33b1df037c'
          asset='carrier.native.linux-amd64.3d33b1df037cb049155c393778df7853fafb23e9d49d7c9cacdde4dd67155788.b64.txt'
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error "$url" -o "$RUNNER_TEMP/duckdb.b64.txt"
          [[ "$(stat -c %s "$RUNNER_TEMP/duckdb.b64.txt")" == '82582200' ]]
          [[ "$(sha256sum "$RUNNER_TEMP/duckdb.b64.txt" | awk '{print $1}')" == '82bd7897b89896632db7d6b56884cd48edc36f22336564b0c0bb8c0a48bf72a4' ]]
          base64 --decode "$RUNNER_TEMP/duckdb.b64.txt" > "$RUNNER_TEMP/duckdb"
          [[ "$(sha256sum "$RUNNER_TEMP/duckdb" | awk '{print $1}')" == '3d33b1df037cb049155c393778df7853fafb23e9d49d7c9cacdde4dd67155788' ]]
          chmod 0555 "$RUNNER_TEMP/duckdb"
          echo "OPS_DUCKDB=$RUNNER_TEMP/duckdb" >> "$GITHUB_ENV"

      - name: Execute bounded proof gates
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/ops-git-write-closure/bin/ops-git-write-closure.mjs
          node packages/ops-git-write-closure/tests/e2e.mjs
          python3 -c "compile(open('packages/ops-decision-closure/bin/ops-decision-closure.py',encoding='utf-8').read(),'ops-decision-closure.py','exec')"
          node packages/ops-decision-closure/tests/e2e.mjs
          node packages/ops-capability-loop/tests/e2e.mjs
          git diff --check
          python3 - <<'PY'
          import json
          for path in ('build/packages.jsonl','build/checks.jsonl'):
              rows=[json.loads(line) for line in open(path) if line.strip()]
              names=[row['name'] for row in rows]
              assert len(names)==len(set(names)), path
          PY

      - name: Commit tested source and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/proof-requests/ops-114-115.patch.xz.b64.part-*
          rmdir .github/proof-requests 2>/dev/null || true
          rm -f .github/workflows/proof-ops-114-115-current-thread.yml
          rm -f .github/workflows/proof-apply-ops-114-115.yml
          git config user.name 'roccho'
          git config user.email '40359643+roccho-dev@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: prove Git write and decision closure contracts'
          git push origin HEAD:proof/ops-114-115-260818
