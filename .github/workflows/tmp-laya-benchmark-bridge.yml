name: Temporary Laya benchmark bridge

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-laya-benchmark-bridge.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: laya-benchmark-fixtures-${{ github.sha }}
          path: |
            packages/parallel-development/tests/cases.jsonl
            packages/parallel-development/tests/expected.jsonl
          if-no-files-found: error
          retention-days: 1
