name: Artifact Runtime release projection

on:
  pull_request:
    paths:
      - '.github/workflows/artifact-runtime-release.yml'
      - 'verification/artifact-runtime-publication/**'
      - 'ci.intent.v1.jsonl'
  push:
    branches: [proposals]
    paths:
      - '.github/workflows/artifact-runtime-release.yml'
      - 'verification/artifact-runtime-publication/**'
      - 'ci.intent.v1.jsonl'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve immutable publication contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          m=json.load(open('verification/artifact-runtime-publication/manifest.json', encoding='utf-8'))
          s=m['source']; p=m['publication']
          values={
            'UI_COMMIT':s['commit'], 'UI_TREE':s['tree'],
            'TREE_DIGEST':p['treeDigest'], 'TAG':p['tag'],
            'ARCHIVE_NAME':p['archive']['name'], 'ARCHIVE_BYTES':str(p['archive']['bytes']), 'ARCHIVE_SHA':p['archive']['sha256'].removeprefix('sha256:'),
            'CARRIER_NAME':p['carrier']['name'], 'CARRIER_BYTES':str(p['carrier']['bytes']), 'CARRIER_SHA':p['carrier']['sha256'].removeprefix('sha256:'),
          }
          for k,v in values.items(): print(f'{k}={v}')
          PY

      - name: Materialize exact accepted UI source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/roccho-dev/ui.git "$RUNNER_TEMP/ui"
          git -C "$RUNNER_TEMP/ui" fetch --depth=1 origin "$UI_COMMIT"
          git -C "$RUNNER_TEMP/ui" checkout --detach "$UI_COMMIT"
          test "$(git -C "$RUNNER_TEMP/ui" rev-parse HEAD)" = "$UI_COMMIT"
          test "$(git -C "$RUNNER_TEMP/ui" rev-parse HEAD^{tree})" = "$UI_TREE"

      - name: Build and verify deterministic publication
        shell: bash
        run: |
          set -euo pipefail
          ui="$RUNNER_TEMP/ui"
          out="$RUNNER_TEMP/publication"
          archive="$RUNNER_TEMP/$ARCHIVE_NAME"
          carrier="$RUNNER_TEMP/$CARRIER_NAME"
          manifest_copy="$RUNNER_TEMP/artifact-runtime.publication.manifest.json"
          receipt="$RUNNER_TEMP/artifact-runtime.publication.receipt.json"

          (cd "$ui" && npm run check:artifact-runtime)
          (cd "$ui" && node apps/artifact-shell/scripts/build-publication.mjs --out="$out")
          python3 - "$out/artifact-manifest.json" "$TREE_DIGEST" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1], encoding='utf-8'))
          assert x['treeDigest'] == sys.argv[2], (x['treeDigest'], sys.argv[2])
          PY

          (cd "$out" && tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - .) | gzip -n > "$archive"
          test "$(wc -c < "$archive")" -eq "$ARCHIVE_BYTES"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$ARCHIVE_SHA"
          base64 -w0 "$archive" > "$carrier"
          test "$(wc -c < "$carrier")" -eq "$CARRIER_BYTES"
          test "$(sha256sum "$carrier" | cut -d' ' -f1)" = "$CARRIER_SHA"
          test -z "$(LC_ALL=C tr -d 'A-Za-z0-9+/=' < "$carrier")"
          base64 --decode "$carrier" | cmp - "$archive"
          cp verification/artifact-runtime-publication/manifest.json "$manifest_copy"

          python3 - "$manifest_copy" ".github/workflows/artifact-runtime-release.yml" "$receipt" <<'PY'
          import hashlib,json,sys
          def sha(path): return 'sha256:'+hashlib.sha256(open(path,'rb').read()).hexdigest()
          m=json.load(open(sys.argv[1], encoding='utf-8'))
          p=m['publication']; s=m['source']
          r={
            'schema':'ops.artifactRuntimePublicationReceipt/1','status':'PASS','authority':False,
            'source':{'repository':s['repository'],'commit':s['commit'],'tree':s['tree']},
            'publication':{'treeDigest':p['treeDigest'],'archive':p['archive'],'carrier':p['carrier']},
            'manifestSha256':sha(sys.argv[1]),'workflowSha256':sha(sys.argv[2]),
          }
          open(sys.argv[3],'w',encoding='utf-8').write(json.dumps(r,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Publish immutable GitHub Release projection
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$ARCHIVE_NAME"
          carrier="$RUNNER_TEMP/$CARRIER_NAME"
          manifest="$RUNNER_TEMP/artifact-runtime.publication.manifest.json"
          receipt="$RUNNER_TEMP/artifact-runtime.publication.receipt.json"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Artifact Runtime $TREE_DIGEST" \
              --notes "Immutable non-authority projection of roccho-dev/ui@$UI_COMMIT. Source authority remains Git." \
              "$archive" "$carrier" "$manifest" "$receipt"
          fi

      - name: Public readback
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for name in "$ARCHIVE_NAME" "$CARRIER_NAME" artifact-runtime.publication.manifest.json artifact-runtime.publication.receipt.json; do
            curl --fail-with-body --location --retry 4 --retry-all-errors --silent --show-error "$base/$name" -o "$RUNNER_TEMP/readback-$name"
          done
          cmp "$RUNNER_TEMP/$ARCHIVE_NAME" "$RUNNER_TEMP/readback-$ARCHIVE_NAME"
          cmp "$RUNNER_TEMP/$CARRIER_NAME" "$RUNNER_TEMP/readback-$CARRIER_NAME"
          cmp "$RUNNER_TEMP/artifact-runtime.publication.manifest.json" "$RUNNER_TEMP/readback-artifact-runtime.publication.manifest.json"
          cmp "$RUNNER_TEMP/artifact-runtime.publication.receipt.json" "$RUNNER_TEMP/readback-artifact-runtime.publication.receipt.json"

      - name: Upload non-authority publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-runtime-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/artifact-runtime.publication.manifest.json
            ${{ runner.temp }}/artifact-runtime.publication.receipt.json
            ${{ runner.temp }}/${{ env.ARCHIVE_NAME }}
            ${{ runner.temp }}/${{ env.CARRIER_NAME }}
          if-no-files-found: error
          retention-days: 30
