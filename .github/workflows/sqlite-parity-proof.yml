name: sqlite-parity-proof

on:
  pull_request:
    paths:
      - packages/policy-semantic-compiler/**
      - evidence/duckdb-usage-review.jsonl
      - evidence/duckdb-usage-review-ci.jsonl
      - evidence/ops-90-sqlite-parity.expected.json
      - evidence/ops-90-sqlite-parity.expected.sha256
      - evidence/ops-90-sqlite-parity-v2/**
      - build/checks.jsonl
      - build/packages.jsonl
      - flake.nix
      - flake.base.nix
      - ci.intent.v1.jsonl
      - .github/workflows/sqlite-parity-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Build exact SQLite parity Nix check
        id: build
        run: |
          set -euo pipefail
          out_path="$(nix build -L --no-link --print-out-paths .#checks.x86_64-linux.sqlite-parity-proof)"
          test -f "$out_path/ok"
          test -s "$out_path/evidence/sqlite-parity.summary.json"
          test -s "$out_path/evidence/sqlite-parity.differences.jsonl"
          test -s "$out_path/evidence/duckdb-usage.inventory.jsonl"
          test -s "$out_path/evidence/sqlite-parity.results.jsonl"
          printf 'out_path=%s\n' "$out_path" >> "$GITHUB_OUTPUT"
      - name: Upload Nix parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: ops-90-sqlite-parity-evidence
          path: ${{ steps.build.outputs.out_path }}/evidence
          if-no-files-found: error
