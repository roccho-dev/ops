name: sqlite-parity-proof

on:
  pull_request:
    paths:
      - packages/policy-semantic-compiler/**
      - evidence/duckdb-usage-review.jsonl
      - evidence/ops-90-sqlite-parity.expected.json
      - evidence/ops-90-sqlite-parity.expected.sha256
      - build/packages.jsonl
      - flake.nix
      - flake.base.nix
      - ci.intent.v1.jsonl
      - .github/workflows/sqlite-parity-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Build current compiler and locate its DuckDB runtime
        id: runtime
        run: |
          set -euo pipefail
          compiler_path="$(nix build -L --no-link --print-out-paths .#policy-semantic-compiler)"
          duckdb_bin="$(nix-store -q --requisites "$compiler_path" | while read -r path; do
            if test -x "$path/bin/duckdb"; then
              printf '%s\n' "$path/bin/duckdb"
            fi
          done | head -n 1)"
          test -x "$compiler_path/bin/policy-semantic-compiler"
          test -n "$duckdb_bin"
          test -x "$duckdb_bin"
          printf 'compiler_path=%s\n' "$compiler_path" >> "$GITHUB_OUTPUT"
          printf 'duckdb_dir=%s\n' "$(dirname "$duckdb_bin")" >> "$GITHUB_OUTPUT"
          "$duckdb_bin" --version
      - name: Verify expected evidence contract hash
        run: |
          set -euo pipefail
          jq -S -c . evidence/ops-90-sqlite-parity.expected.json > "$RUNNER_TEMP/sqlite-parity.expected.canonical.json"
          actual="$(sha256sum "$RUNNER_TEMP/sqlite-parity.expected.canonical.json" | cut -d' ' -f1)"
          expected="$(cut -d' ' -f1 evidence/ops-90-sqlite-parity.expected.sha256)"
          test "$actual" = "$expected"
      - name: Execute reviewed 27-case DuckDB and SQLite proof
        run: |
          set -euo pipefail
          export PATH="${{ steps.runtime.outputs.duckdb_dir }}:$PATH"
          evidence="$RUNNER_TEMP/sqlite-parity-evidence"
          work="$RUNNER_TEMP/sqlite-parity-work"
          PYTHONPATH=packages/policy-semantic-compiler/src \
            python3 -m policy_semantic_compiler.sqlite_parity_proof_v2 \
              --base-fixture packages/policy-semantic-compiler/tests/adrs-projection-duckdb/accepted \
              --candidate-fixture packages/policy-semantic-compiler/tests/adrs-projection-duckdb/candidate-disposition \
              --repo-root . \
              --usage-review evidence/duckdb-usage-review.jsonl \
              --work-dir "$work" \
              --evidence-dir "$evidence" \
              --compiler "${{ steps.runtime.outputs.compiler_path }}/bin/policy-semantic-compiler" \
              | tee "$RUNNER_TEMP/sqlite-parity.stdout.json"
          PYTHONPATH=packages/policy-semantic-compiler/src \
            python3 -m policy_semantic_compiler.sqlite_parity_classify_v2 \
              --evidence-dir "$evidence" \
              | tee "$RUNNER_TEMP/sqlite-parity-classification.stdout.json"
          test -s "$evidence/duckdb-usage.inventory.jsonl"
          test -s "$evidence/sqlite-parity.results.jsonl"
          test -s "$evidence/sqlite-parity.differences.jsonl"
          test -s "$evidence/sqlite-parity.summary.json"
          test -s "$evidence/sqlite-parity.baseline.json"
          test "$(wc -l < "$evidence/sqlite-parity.results.jsonl")" -eq 54
          jq -e --slurpfile expected evidence/ops-90-sqlite-parity.expected.json '
            .suiteVersion == $expected[0].suiteVersion and
            .totalCases == $expected[0].totalCases and
            .providerCaseIds == $expected[0].providerCaseIds and
            .providerFixtureFailureCaseIds == [] and
            .mismatchCaseIds == $expected[0].expectedMismatchCaseIds and
            .candidateStatus == $expected[0].candidateStatus and
            .migrationClaimAllowed == $expected[0].migrationClaimAllowed and
            .failClosedRegressionCount == $expected[0].failClosedRegressionCount and
            .unknownUsageReferenceCount == $expected[0].unknownUsageReferenceCount and
            .unclassifiedMismatchCount == $expected[0].unclassifiedMismatchCount and
            .generatedIsAuthority == $expected[0].generatedIsAuthority and
            .databaseIsAuthority == $expected[0].databaseIsAuthority
          ' "$evidence/sqlite-parity.summary.json" >/dev/null
          test "$(jq -r 'select(.caseId == "provider-workflow-accepted-results") | .engine' "$evidence/sqlite-parity.results.jsonl" | wc -l)" -eq 2
          test "$(jq -r 'select(.caseId == "provider-workflow-incomplete") | .engine' "$evidence/sqlite-parity.results.jsonl" | wc -l)" -eq 2
          cp "$RUNNER_TEMP/sqlite-parity.stdout.json" "$evidence/"
          cp "$RUNNER_TEMP/sqlite-parity-classification.stdout.json" "$evidence/"
          cp evidence/ops-90-sqlite-parity.expected.json "$evidence/"
          cp evidence/ops-90-sqlite-parity.expected.sha256 "$evidence/"
      - name: Upload parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: ops-90-sqlite-parity-evidence
          path: ${{ runner.temp }}/sqlite-parity-evidence
          if-no-files-found: error
