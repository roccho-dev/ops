name: Proof exact Vim Nix runtime for current sandbox

on:
  push:
    branches:
      - proof/vim-nix-exact-runtime-current-sandbox-20260821
    paths:
      - .github/workflows/proof-vim-nix-exact-runtime-current-sandbox.yml
      - proofs/vim-nix-current-sandbox/**
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: proof-vim-nix-exact-runtime-current-sandbox
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EDITS_REPOSITORY: https://github.com/roccho-dev/edits.git
      EDITS_COMMIT: b6f84f74bb2a1cf9e94b6d77d1d0381679385636
      EDITS_TREE: 7f9da1fad43838e7198cbbf87ee904484d29bc39
      EDITS_REF: refs/heads/proof/vim-nix-herdr-oci-current-20260821
      HANDOFF_SHA256: 6a88215c073a43b82f6e584466b07f6c8265e7d4b48ff5e92acbd14626248d38
      FLAKE_LOCK_SHA256: 35cdda5fa9645ab469924c69f36992db2f8637360fce128e7c7fd372c3a4ce0f
      ARTIFACT: ${{ runner.temp }}/vim-nix-exact-runtime-current-sandbox

    steps:
      - name: Checkout ops proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Announce exact materialization to ops Issue 188
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 188,
              body: [
                '## Vim/Nix exact-runtime materialization started',
                '',
                `run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `edits commit: \`${process.env.EDITS_COMMIT}\``,
                `edits tree: \`${process.env.EDITS_TREE}\``
              ].join('\n')
            });

      - name: Checkout exact edits candidate and verify identity
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/edits"
          git clone --no-checkout "$EDITS_REPOSITORY" "$work"
          git -C "$work" checkout --detach "$EDITS_COMMIT"
          test "$(git -C "$work" rev-parse HEAD^{commit})" = "$EDITS_COMMIT"
          test "$(git -C "$work" rev-parse HEAD^{tree})" = "$EDITS_TREE"
          test -z "$(git -C "$work" status --porcelain=v1)"
          test "$(sha256sum "$work/proofs/vim-nix/flake.lock" | cut -d' ' -f1)" = "$FLAKE_LOCK_SHA256"
          test "$(git -C "$work" rev-parse "$EDITS_REF^{commit}")" = "$EDITS_COMMIT"

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - id: build
        name: Build exact closure and replay offline
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/edits"
          proof="$work/proofs/vim-nix"
          rm -rf "$ARTIFACT"
          mkdir -p "$ARTIFACT"/{source,product,logs,nix-cache}

          lock_before="$(sha256sum "$proof/flake.lock" | cut -d' ' -f1)"
          product="$(nix build --no-link --print-out-paths "$proof#default" 2> >(tee "$ARTIFACT/logs/nix-build.stderr.txt" >&2))"
          lock_mid="$(sha256sum "$proof/flake.lock" | cut -d' ' -f1)"
          test "$lock_before" = "$lock_mid"

          product_offline="$(nix build --offline --no-write-lock-file --no-link --print-out-paths "$proof#default" \
            --option substituters '' \
            2> >(tee "$ARTIFACT/logs/nix-build-offline.stderr.txt" >&2))"
          lock_after="$(sha256sum "$proof/flake.lock" | cut -d' ' -f1)"
          test "$lock_before" = "$lock_after"
          test "$product" = "$product_offline"
          test -d "$product"

          product_drv="$(nix path-info --derivation "$product")"
          test -e "$product_drv"

          printf '%s\n' "$product" > "$ARTIFACT/product/store-path.txt"
          printf '%s\n' "$product_drv" > "$ARTIFACT/product/derivation-path.txt"
          printf '%s\n' "$lock_before" > "$ARTIFACT/product/flake-lock.sha256"
          nix-store --query --requisites "$product" | sort > "$ARTIFACT/product/runtime-closure-paths.txt"
          nix path-info -rS "$product" > "$ARTIFACT/product/runtime-closure-size.txt"
          nix path-info -r --json-format 2 "$product" > "$ARTIFACT/product/runtime-closure.json"

          find "$product/bin" -maxdepth 1 -type f -o -type l | sort > "$ARTIFACT/product/bin-list.txt"
          "$product/bin/herdr" --version > "$ARTIFACT/product/herdr.version.txt"
          "$product/bin/vim" --version > "$ARTIFACT/product/vim.version.txt"
          "$product/bin/hq" --help > "$ARTIFACT/product/hq.help.txt"
          test "$(sed -n '1p' "$ARTIFACT/product/herdr.version.txt")" = "herdr 0.8.0"
          grep -q '^VIM - Vi IMproved 9.2' "$ARTIFACT/product/vim.version.txt"
          grep -q 'Included patches: 1-478' "$ARTIFACT/product/vim.version.txt"

          if grep -Ei '/(gtk|x11|python|ruby|lua)([-/]|$)' "$ARTIFACT/product/runtime-closure-paths.txt" \
              > "$ARTIFACT/product/forbidden-runtime-dependencies.txt"; then
            echo 'forbidden runtime dependency found' >&2
            cat "$ARTIFACT/product/forbidden-runtime-dependencies.txt" >&2
            exit 1
          fi
          : > "$ARTIFACT/product/forbidden-runtime-dependencies.txt"

          {
            nix-store --query --requisites --include-outputs "$product_drv"
            nix-store --query --requisites "$product"
            printf '%s\n' "$product_drv" "$product"
          } | sort -u > "$ARTIFACT/offline-build-paths.txt"

          mapfile -t offline_paths < "$ARTIFACT/offline-build-paths.txt"
          nix copy --to "file://$ARTIFACT/nix-cache" "${offline_paths[@]}"

          git -C "$work" rev-parse HEAD > "$ARTIFACT/source/commit.txt"
          git -C "$work" rev-parse HEAD^{tree} > "$ARTIFACT/source/tree.txt"
          git -C "$work" status --porcelain=v1 > "$ARTIFACT/source/git-status.txt"
          test ! -s "$ARTIFACT/source/git-status.txt"
          git -C "$work" bundle create "$ARTIFACT/source/edits-vim-nix-current.git.bundle" HEAD
          git -C "$work" bundle verify "$ARTIFACT/source/edits-vim-nix-current.git.bundle" \
            > "$ARTIFACT/source/bundle-verify.txt"
          git -C "$work" archive --format=tar.gz --prefix=edits-vim-nix-current/ HEAD \
            > "$ARTIFACT/source/edits-vim-nix-current.source.tar.gz"

          python3 - "$ARTIFACT/receipt.json" "$product" "$product_drv" "$lock_before" \
            "${#offline_paths[@]}" <<'PY'
          import json, pathlib, sys
          output, product, drv, lock_sha, count = sys.argv[1:]
          data = {
              'schema': 'ops.vimNixExactRuntimeCurrentSandbox/1',
              'status': 'PASS',
              'source': {
                  'repository': 'roccho-dev/edits',
                  'commit': 'b6f84f74bb2a1cf9e94b6d77d1d0381679385636',
                  'tree': '7f9da1fad43838e7198cbbf87ee904484d29bc39',
                  'handoffSha256': '6a88215c073a43b82f6e584466b07f6c8265e7d4b48ff5e92acbd14626248d38',
                  'flakeLockSha256': lock_sha,
              },
              'materialization': {
                  'productStorePath': product,
                  'derivationPath': drv,
                  'normalOfflineSamePath': True,
                  'offlineBuildPathCount': int(count),
                  'fileBinaryCache': 'nix-cache',
              },
              'runtime': {
                  'target': 'x86_64-linux',
                  'herdr': '0.8.0',
                  'vim': '9.2.0478',
                  'forbiddenDependenciesAbsent': True,
              },
              'claimBoundary': {
                  'exactRuntimeClosure': 'PASS',
                  'offlineReplayInCI': 'PASS',
                  'currentSandboxImport': 'PENDING_DOWNLOAD',
                  'freshPTYUXScreenshots': 'PENDING_DOWNLOAD',
                  'workerDockerOCIParity': 'SEPARATE_PRODUCT_PROOF',
              },
          }
          pathlib.Path(output).write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

          (cd "$ARTIFACT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$ARTIFACT" && sha256sum --check SHA256SUMS)
          du -sh "$ARTIFACT" "$ARTIFACT/nix-cache"

          {
            echo "product=$product"
            echo "drv=$product_drv"
            echo "offline_path_count=${#offline_paths[@]}"
          } >> "$GITHUB_OUTPUT"

      - id: upload
        name: Upload exact runtime and full offline build cache
        uses: actions/upload-artifact@v4
        with:
          name: vim-nix-exact-runtime-current-sandbox-b6f84f74
          path: ${{ runner.temp }}/vim-nix-exact-runtime-current-sandbox/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Return materialization identity to ops Issue 188
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          PRODUCT: ${{ steps.build.outputs.product }}
          DERIVATION: ${{ steps.build.outputs.drv }}
          OFFLINE_PATH_COUNT: ${{ steps.build.outputs.offline_path_count }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          ## Vim/Nix exact-runtime materialization result

          status: \`$JOB_STATUS\`
          edits-commit: \`$EDITS_COMMIT\`
          edits-tree: \`$EDITS_TREE\`
          product-store-path: \`${PRODUCT:-not-produced}\`
          derivation-path: \`${DERIVATION:-not-produced}\`
          offline-build-path-count: \`${OFFLINE_PATH_COUNT:-not-produced}\`
          artifact-id: \`${ARTIFACT_ID:-not-produced}\`
          artifact-digest: \`${ARTIFACT_DIGEST:-not-produced}\`
          artifact-url: ${ARTIFACT_URL:-not-produced}
          run: $RUN_URL
          workflow-commit: \`$WORKFLOW_COMMIT\`

          The artifact contains the exact source, runtime closure, and all source/build paths required for an offline same-path replay. Current-sandbox import and fresh PTY screenshots are intentionally separate readback steps.
          EOF
          gh issue comment 188 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
