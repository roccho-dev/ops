name: Temporary bootstrap Rollup 2.80.0 standalone

on:
  push:
    branches:
      - bootstrap/rollup-2.80.0-20260803
    paths:
      - .github/workflows/bootstrap-rollup-2.80.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Fetch Rollup and generate standalone artifact
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          pushd "$tmp" >/dev/null
          npm pack rollup@2.80.0 --registry=https://registry.npmjs.org
          tar -xzf rollup-2.80.0.tgz
          test "$(node -p "require('./package/package.json').version")" = "2.80.0"
          test -f package/dist/rollup.browser.js
          test -f package/LICENSE.md

          tarball_sha256="$(sha256sum rollup-2.80.0.tgz | awk '{print $1}')"
          browser_sha256="$(sha256sum package/dist/rollup.browser.js | awk '{print $1}')"
          npm_integrity="$(npm view rollup@2.80.0 dist.integrity --registry=https://registry.npmjs.org)"
          popd >/dev/null

          mkdir -p packages/mjs-bundler/src packages/mjs-bundler/tests dist/mjs-bundler

          cp "$tmp/package/LICENSE.md" packages/mjs-bundler/LICENSE.rollup

          cat > packages/mjs-bundler/vendor.json <<EOF
          {
            "schemaVersion": "ops.mjsBundlerVendor.v1",
            "engine": "rollup",
            "version": "2.80.0",
            "source": "npm:rollup@2.80.0",
            "npmIntegrity": "${npm_integrity}",
            "packageTarballSha256": "${tarball_sha256}",
            "browserBuildPath": "dist/rollup.browser.js",
            "browserBuildSha256": "${browser_sha256}",
            "license": "MIT",
            "standaloneOutput": "dist/mjs-bundler/bundle.mjs"
          }
          EOF

          cat > packages/mjs-bundler/src/adapter.mjs <<'EOF'
          const ENGINE = __rollupModule.exports;
          const rollup = ENGINE.rollup;

          if (typeof rollup !== "function") {
            throw new Error("Rollup browser engine did not expose rollup()");
          }

          export const manifest = Object.freeze({
            id: "urn:roccho-dev:ops:dist:mjs-bundler:rollup",
            version: "0.1.0",
            engine: "rollup",
            engineVersion: "2.80.0",
            runtime: "browser-node",
            externalDependencies: [],
            sideAssets: [],
            entrypoints: ["bundle", "run", "manifest"]
          });

          function normalizeId(value) {
            if (typeof value !== "string" || !value.trim()) {
              throw new TypeError("module id must be a non-empty string");
            }
            if (value.includes("\\") || value.startsWith("/") || /^[A-Za-z]:/.test(value)) {
              throw new Error(`absolute or backslash module id is unsupported: ${value}`);
            }
            const parts = [];
            for (const part of value.split("/")) {
              if (!part || part === ".") continue;
              if (part === "..") {
                if (!parts.length) throw new Error(`module id escapes root: ${value}`);
                parts.pop();
                continue;
              }
              parts.push(part);
            }
            if (!parts.length) throw new Error(`invalid module id: ${value}`);
            return parts.join("/");
          }

          function resolveRelative(source, importer) {
            if (!source.startsWith(".")) {
              throw new Error(`bare or external import is unsupported: ${source}`);
            }
            const base = importer.split("/").slice(0, -1).join("/");
            return normalizeId(`${base}/${source}`);
          }

          function validateModules(modules) {
            if (!modules || typeof modules !== "object" || Array.isArray(modules)) {
              throw new TypeError("modules must be an object keyed by module id");
            }
            const normalized = new Map();
            for (const [id, source] of Object.entries(modules)) {
              const normalizedId = normalizeId(id);
              if (normalized.has(normalizedId)) throw new Error(`duplicate module id: ${normalizedId}`);
              if (typeof source !== "string") throw new TypeError(`module source must be text: ${normalizedId}`);
              normalized.set(normalizedId, source);
            }
            return normalized;
          }

          export async function bundle(request) {
            if (!request || typeof request !== "object") throw new TypeError("request must be an object");
            const modules = validateModules(request.modules);
            const entry = normalizeId(request.entry);
            if (!modules.has(entry)) throw new Error(`entry module is missing: ${entry}`);

            const virtualModules = {
              name: "ops-virtual-modules",
              resolveId(source, importer) {
                if (!importer) return normalizeId(source);
                return resolveRelative(source, importer);
              },
              load(id) {
                if (!modules.has(id)) throw new Error(`module is missing: ${id}`);
                return modules.get(id);
              }
            };

            const build = await rollup({
              input: entry,
              plugins: [virtualModules],
              treeshake: true,
              onwarn(warning) {
                throw new Error(`Rollup warning is rejected: ${warning.code}: ${warning.message}`);
              }
            });

            try {
              const generated = await build.generate({
                format: "es",
                inlineDynamicImports: true,
                sourcemap: false,
                exports: "named"
              });
              const chunks = generated.output.filter((item) => item.type === "chunk");
              const assets = generated.output.filter((item) => item.type === "asset");
              if (chunks.length !== 1 || assets.length !== 0 || generated.output.length !== 1) {
                throw new Error("bundle must produce exactly one JavaScript chunk and no assets");
              }
              return chunks[0].code;
            } finally {
              await build.close();
            }
          }

          export async function run(request) {
            if (!request || request.operation !== "bundle") {
              throw new Error(`unsupported operation: ${String(request?.operation)}`);
            }
            return bundle(request);
          }
          EOF

          {
            printf '%s\n' 'const __rollupModule = { exports: {} };'
            printf '%s\n' 'const module = __rollupModule;'
            printf '%s\n' 'const exports = __rollupModule.exports;'
            cat "$tmp/package/dist/rollup.browser.js"
            cat packages/mjs-bundler/src/adapter.mjs
          } > dist/mjs-bundler/bundle.mjs

          cat > packages/mjs-bundler/tests/selftest.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { bundle, manifest, run } from "../../../dist/mjs-bundler/bundle.mjs";

          const request = {
            operation: "bundle",
            entry: "src/index.mjs",
            modules: {
              "src/index.mjs": "import { twice } from './math.mjs'; export const answer = twice(20) + 1; export function execute(){ return answer; }",
              "src/math.mjs": "export const unused = 999; export function twice(value){ return value * 2; }"
            }
          };

          const first = await run(request);
          const second = await bundle(request);
          assert.equal(first, second, "two builds must be byte-identical");
          assert.equal(/unused\s*=\s*999/.test(first), false, "unused export must be tree-shaken");
          assert.equal(/^\s*import\s/m.test(first), false, "output must not retain static imports");

          const encoded = Buffer.from(first).toString("base64");
          const output = await import(`data:text/javascript;base64,${encoded}`);
          assert.equal(output.execute(), 41);
          assert.equal(manifest.engineVersion, "2.80.0");
          assert.deepEqual(manifest.sideAssets, []);

          const sha256 = createHash("sha256").update(first).digest("hex");
          console.log(JSON.stringify({
            status: "PASS",
            engine: manifest.engine,
            engineVersion: manifest.engineVersion,
            bundledBytes: Buffer.byteLength(first),
            bundledSha256: sha256,
            result: output.execute()
          }));
          EOF

          node packages/mjs-bundler/tests/selftest.mjs | tee packages/mjs-bundler/selftest.receipt.json
          node --check dist/mjs-bundler/bundle.mjs

          artifact_bytes="$(wc -c < dist/mjs-bundler/bundle.mjs)"
          artifact_sha256="$(sha256sum dist/mjs-bundler/bundle.mjs | awk '{print $1}')"
          if [ "$artifact_bytes" -gt 1048576 ]; then
            echo "::warning::standalone bundler exceeds 1 MiB: ${artifact_bytes} bytes"
          fi

          node - "$artifact_bytes" "$artifact_sha256" <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const [bytes, sha256] = process.argv.slice(2);
          const vendor = JSON.parse(readFileSync("packages/mjs-bundler/vendor.json", "utf8"));
          const selftest = JSON.parse(readFileSync("packages/mjs-bundler/selftest.receipt.json", "utf8"));
          writeFileSync("packages/mjs-bundler/bootstrap.receipt.json", JSON.stringify({
            schemaVersion: "ops.mjsBundlerBootstrapReceipt.v1",
            status: "PASS",
            generatedAt: new Date().toISOString(),
            vendor,
            standalone: { path: "dist/mjs-bundler/bundle.mjs", bytes: Number(bytes), sha256 },
            selftest
          }, null, 2) + "\n");
          EOF

      - name: Commit generated artifact and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-rollup-2.80.0.yml
          git add packages/mjs-bundler dist/mjs-bundler
          git commit -m "build(dist): bootstrap standalone Rollup bundler"
          git push origin HEAD:bootstrap/rollup-2.80.0-20260803
