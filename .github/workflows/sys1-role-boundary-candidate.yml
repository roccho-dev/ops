name: Sys1 role-boundary candidate comparison

on:
  push:
    branches: [codex/sys1-eval-loop-20261010]
    paths: [.github/workflows/sys1-role-boundary-candidate.yml]

permissions:
  contents: read

concurrency:
  group: sys1-role-boundary-candidate-20261010
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'roccho-org/ops' && github.ref == 'refs/heads/codex/sys1-eval-loop-20261010' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TRIAL_SOURCE_SHA: cf45390e6b8891b0a50492934c87c97b1d72e054
      TRIAL_SUITE: role-boundaries
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cf45390e6b8891b0a50492934c87c97b1d72e054
          persist-credentials: false

      - name: Verify evaluator, fixed input, candidate and remaining allowance without credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIAL_SOURCE_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git hash-object experiments/sys1-eval-loop/run.mjs)" = ed26428a6bacbaac693c7ae14023cbbf5555b481
          node --test experiments/sys1-eval-loop/test.mjs experiments/sys1-eval-loop/suites.test.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {loadInput,digest} from './experiments/sys1-eval-loop/run.mjs';
          const root='experiments/sys1-eval-loop';
          const input=loadInput(root+'/candidates/role-rules-v1.json',root+'/suites/role-boundaries');
          const before=JSON.parse(fs.readFileSync(root+'/results/role-boundaries/baseline.json','utf8'));
          assert.equal(before.status,'EVALUATED');
          assert.equal(before.mode,'live');
          assert.equal(before.actualCalls,8);
          assert.equal(before.targetReached,false);
          assert.equal(before.contractDigest,input.contractDigest);
          assert.equal(before.casesDigest,input.contract.casesSha256);
          assert.equal(before.goldDigest,input.contract.goldSha256);
          assert.equal(digest(input.candidate),'568369fac68e91616dd31d2998c522f80d6b8374af8b89e092a8ff3dac8ac8a1');
          assert.equal(before.actualCalls+input.contract.maxCallsPerCandidate,input.contract.maxTotalCalls);
          assert.deepEqual(before.models,[input.contract.expectedModel]);
          JS

      - name: Evaluate one revised candidate (remaining maximum eight requests)
        id: live
        continue-on-error: true
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: node experiments/sys1-eval-loop/run.mjs evaluate role-rules-v1 "$RUNNER_TEMP/sys1-role-boundary-candidate"

      - name: Fixed scoring and paired comparison (no model credentials)
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/sys1-role-boundary-candidate/predictions.json" ]; then
            echo 'SYS1_TRIAL_STOP: missing predictions; no quality claim'
            exit 1
          fi
          node experiments/sys1-eval-loop/run.mjs score role-rules-v1 "$RUNNER_TEMP/sys1-role-boundary-candidate"
          node experiments/sys1-eval-loop/run.mjs compare experiments/sys1-eval-loop/results/role-boundaries/baseline.json "$RUNNER_TEMP/sys1-role-boundary-candidate/scored.json"

      - name: Reject masked execution failure
        if: always() && !cancelled()
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: test "$LIVE_OUTCOME" = success
