name: Verify exact Mobile Agent gzip payload

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/proof-mobile-agent-gz-payload.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_REF: transport/mobile-agent-preset-app-release-v2-260821
      SOURCE_PATH: .github/transport/mobile-agent-preset-app.html.gz.b64.part00
      EXPECTED_HTML_BYTES: '2412388'
      EXPECTED_HTML_SHA256: 3a8db8703aeb78ed2aded4292c554930daf16e6825dd1ccde83fd9bf680408d6
    steps:
      - name: Fetch, decode, decompress and verify exact App
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$SOURCE_PATH" -f ref="$SOURCE_REF" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/payload.b64"
          tr -d '\r\n\t ' < "$RUNNER_TEMP/payload.b64" > "$RUNNER_TEMP/payload.clean.b64"
          base64 --decode "$RUNNER_TEMP/payload.clean.b64" > "$RUNNER_TEMP/app.html.gz"
          gzip -t "$RUNNER_TEMP/app.html.gz"
          gzip -dc "$RUNNER_TEMP/app.html.gz" > "$RUNNER_TEMP/app.html"
          test "$(wc -c < "$RUNNER_TEMP/app.html")" -eq "$EXPECTED_HTML_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/app.html" | cut -d' ' -f1)" = "$EXPECTED_HTML_SHA256"
          grep -F 'graph/1' "$RUNNER_TEMP/app.html" >/dev/null
          grep -F 'map/1' "$RUNNER_TEMP/app.html" >/dev/null
          grep -F 'seq/1' "$RUNNER_TEMP/app.html" >/dev/null
          grep -Fi 'maxgraph' "$RUNNER_TEMP/app.html" >/dev/null
          gh pr comment "$GITHUB_EVENT_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Exact gzip payload verified: \`$EXPECTED_HTML_BYTES\` bytes / \`$EXPECTED_HTML_SHA256\`; existing graph/1, map/1, seq/1 and maxGraph markers present."
