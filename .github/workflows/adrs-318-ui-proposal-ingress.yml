name: ADRS 318 UI proposal ingress proof

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/adrs-318-ui-proposal-ingress.yml'
      - 'verification/adrs-318-ui-proposal-ingress/**'

permissions:
  contents: read

jobs:
  proposal-ingress-provider-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare-production
    env:
      ROOT: verification/adrs-318-ui-proposal-ingress
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prove UI submit, R2 queue, manual ADRS bridge and recorded UI state
        run: |
          export EVIDENCE="$RUNNER_TEMP/adrs-ui-proposal-evidence"
          bash "$ROOT/provider-proof.sh"
          bash "$ROOT/manual-bridge-proof.sh"
      - name: Upload exact non-secret evidence
        uses: actions/upload-artifact@v4
        with:
          name: adrs-318-ui-proposal-ingress-${{ github.run_id }}
          path: ${{ runner.temp }}/adrs-ui-proposal-evidence/
          if-no-files-found: error
          retention-days: 30
