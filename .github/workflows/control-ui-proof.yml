name: control-ui dist proof

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - packages/control-ui-dist/**
      - .github/workflows/control-ui-proof.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Build exact dist
        run: nix build .#control-ui-dist --no-write-lock-file --print-build-logs
      - name: Check package and Caddy config
        run: nix build .#checks.x86_64-linux.control-ui-dist --no-write-lock-file --print-build-logs
      - name: Prove runtime HTTP boundary
        run: |
          set -euo pipefail
          dist="$(nix build .#control-ui-dist --no-link --print-out-paths --no-write-lock-file)"
          DIST="$dist" CURL=/usr/bin/curl bash packages/control-ui-dist/tests/e2e.sh
