name: Release text ingress deploy proof

on:
  push:
    paths:
      - ".github/workflows/release-text-ingress-deploy-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TAG: cap-proof2-eefa9f3d9c4a-6a819b1d-0d40-83e8-855a-00e20dd48e56
      PAYLOAD_SHA: 9c5977657e2e4476938f9ca4656f0fdd80d2f0cf552fdc72998e9162beae95e3
      CARRIER_SHA: aab48f3417409f6cbed8e4b189b6491e5c2dfdfc3447470dd48ec5a1c7ea0b45
    steps:
      - uses: actions/checkout@v4

      - name: Detect deploy authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf '{"status":"SKIP","reason":"missing Cloudflare Actions secrets"}\n' > "$RUNNER_TEMP/deploy-proof.json"
          fi

      - name: Deploy isolated ingress Worker
        if: steps.authority.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config packages/chatgpt-capability/ingress/wrangler.toml 2>&1 | tee "$RUNNER_TEMP/wrangler.log"

      - name: Prove public Worker Carrier E2E
        if: steps.authority.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          asset="carrier.native.linux-amd64-static.${PAYLOAD_SHA}.b64.txt"
          base="https://stg-cap02-release-ingress.roccho.workers.dev/release/${TAG}"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error "$base/$asset" -o "$RUNNER_TEMP/carrier.b64.txt"
          test "$(sha256sum "$RUNNER_TEMP/carrier.b64.txt" | cut -d' ' -f1)" = "$CARRIER_SHA"
          tr -d '\r\n' < "$RUNNER_TEMP/carrier.b64.txt" | base64 -d > "$RUNNER_TEMP/bootstrap-intake"
          test "$(sha256sum "$RUNNER_TEMP/bootstrap-intake" | cut -d' ' -f1)" = "$PAYLOAD_SHA"
          chmod +x "$RUNNER_TEMP/bootstrap-intake"
          test "$("$RUNNER_TEMP/bootstrap-intake" selftest)" = "bootstrap-intake selftest PASS"
          python3 - "$base/$asset" "$RUNNER_TEMP/carrier.b64.txt" "$RUNNER_TEMP/bootstrap-intake" > "$RUNNER_TEMP/deploy-proof.json" <<'PY'
          import hashlib,json,pathlib,sys
          url,carrier,payload=sys.argv[1:]
          c=pathlib.Path(carrier).read_bytes(); p=pathlib.Path(payload).read_bytes()
          print(json.dumps({'status':'PASS','url':url,'carrierBytes':len(c),'carrierSha256':hashlib.sha256(c).hexdigest(),'payloadBytes':len(p),'payloadSha256':hashlib.sha256(p).hexdigest(),'execution':'bootstrap-intake selftest PASS'},sort_keys=True))
          PY

      - name: Preserve deploy proof
        uses: actions/upload-artifact@v4
        with:
          name: release-text-ingress-deploy-proof-${{ github.sha }}
          path: ${{ runner.temp }}/deploy-proof.json
          if-no-files-found: error
          retention-days: 30
