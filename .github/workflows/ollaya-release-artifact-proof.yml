name: ollaya-release-artifact-proof

on:
  pull_request:
    branches: [proposals]
    paths:
      - ".github/workflows/ollaya-release-artifact-proof.yml"
      - "verification/ollaya-release-artifact/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify pinned Ollaya release
        env:
          OLLAYA_VERSION: v0.7.5
          OLLAYA_ARCHIVE: ollaya-linux-amd64.tar.zst
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ollaya-proof"
          mkdir -p "$root/runtime"
          base="https://github.com/ollaya-dev/ollaya/releases/download/$OLLAYA_VERSION"

          curl --fail --location --retry 3 --output "$root/$OLLAYA_ARCHIVE" "$base/$OLLAYA_ARCHIVE"
          curl --fail --location --retry 3 --output "$root/sha256sum.txt" "$base/sha256sum.txt"

          (
            cd "$root"
            grep -E "  $OLLAYA_ARCHIVE$" sha256sum.txt > selected.sha256
            test -s selected.sha256
            sha256sum -c selected.sha256
          )

          tar --zstd -xf "$root/$OLLAYA_ARCHIVE" -C "$root/runtime"
          test -x "$root/runtime/bin/ollaya"

      - name: Pull one Laya model into an isolated store
        env:
          OLLAYA_HOST: 127.0.0.1:11435
          OLLAYA_DEVICE: cpu
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ollaya-proof"
          export OLLAYA_MODELS="$root/models"
          export OLLAYA_LIBRARY_PATH="$root/runtime/lib/ollaya"
          mkdir -p "$OLLAYA_MODELS"

          "$root/runtime/bin/ollaya" serve >"$root/producer-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11435/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1

          curl --fail --silent --show-error http://127.0.0.1:11435/api/version | tee "$root/version.json"
          python3 - "$root/version.json" <<'PY'
          import json, pathlib, sys
          x = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert x["version"] == "0.7.5", x
          PY

          curl --fail --silent --show-error             -H 'Content-Type: application/json'             -d '{"model":"laya:multilingual","stream":false}'             http://127.0.0.1:11435/api/pull | tee "$root/pull.json"

          python3 - "$root/pull.json" <<'PY'
          import json, pathlib, sys
          x = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert x["status"] == "success", x
          PY

          kill "$pid"
          wait "$pid" || true
          trap - EXIT

      - name: Pack release-shaped runtime plus model
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ollaya-proof"
          stage="$RUNNER_TEMP/bundle"
          out="$RUNNER_TEMP/out"
          mkdir -p "$stage/ollaya-release/runtime" "$stage/ollaya-release/models" "$out"

          cp -a "$root/runtime/." "$stage/ollaya-release/runtime/"
          cp -a "$root/models/." "$stage/ollaya-release/models/"

          archive_sha="$(sha256sum "$root/ollaya-linux-amd64.tar.zst" | awk '{print $1}')"
          python3 - "$stage/ollaya-release/PROVENANCE.json" "$archive_sha" <<'PY'
          import json, pathlib, sys
          path, source_sha = sys.argv[1:]
          payload = {
              "schema": "ops.ollayaReleaseArtifactProof/1",
              "ollayaVersion": "v0.7.5",
              "platform": "linux-amd64",
              "model": "ollaya.dev/library/laya:multilingual",
              "device": "cpu",
              "sourceArchiveSha256": source_sha,
              "consumerRepositoryCheckoutRequired": False,
              "consumerModelPullRequired": False,
          }
          pathlib.Path(path).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

          tar --sort=name --owner=0 --group=0 --numeric-owner             --mtime='UTC 1970-01-01' --zstd             -cf "$out/ollaya-laya-linux-amd64.tar.zst"             -C "$stage" ollaya-release

          (
            cd "$out"
            sha256sum ollaya-laya-linux-amd64.tar.zst > ollaya-laya-linux-amd64.tar.zst.sha256
            cat ollaya-laya-linux-amd64.tar.zst.sha256
          )

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ollaya-laya-linux-amd64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/out/ollaya-laya-linux-amd64.tar.zst
            ${{ runner.temp }}/out/ollaya-laya-linux-amd64.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  artifact-only-replay:
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ollaya-laya-linux-amd64-${{ github.run_id }}
          path: artifact

      - name: Verify and unpack artifact
        run: |
          set -euo pipefail
          cd artifact
          sha256sum -c ollaya-laya-linux-amd64.tar.zst.sha256
          tar --zstd -xf ollaya-laya-linux-amd64.tar.zst
          test -x ollaya-release/runtime/bin/ollaya
          grep -F '"consumerRepositoryCheckoutRequired": false' ollaya-release/PROVENANCE.json
          grep -F '"consumerModelPullRequired": false' ollaya-release/PROVENANCE.json

      - name: Run typed decision from artifact only
        env:
          OLLAYA_HOST: 127.0.0.1:11435
          OLLAYA_DEVICE: cpu
          OLLAYA_REGISTRY: 127.0.0.1:9
        run: |
          set -euo pipefail
          root="$PWD/artifact/ollaya-release"
          export OLLAYA_MODELS="$root/models"
          export OLLAYA_LIBRARY_PATH="$root/runtime/lib/ollaya"

          "$root/runtime/bin/ollaya" serve >"$RUNNER_TEMP/consumer-server.log" 2>&1 &
          pid=$!
          trap 'cat "$RUNNER_TEMP/consumer-server.log"; kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11435/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1

          curl --fail --silent --show-error             http://127.0.0.1:11435/v1/models | tee "$RUNNER_TEMP/models.json"

          python3 - "$RUNNER_TEMP/models.json" <<'PY'
          import json, pathlib, sys
          x = json.loads(pathlib.Path(sys.argv[1]).read_text())
          rows = x.get("data", x.get("models", []))
          names = {row.get("id", row.get("name")) for row in rows}
          assert "ollaya.dev/library/laya:multilingual" in names, x
          PY

          cat >"$RUNNER_TEMP/request.json" <<'JSON'
          {
            "model": "ollaya.dev/library/laya:multilingual",
            "state": "I was charged twice and want a refund.",
            "questions": {
              "intent": {
                "type": "choice",
                "instructions": "What does the customer want?",
                "criteria": {
                  "refund": "Wants money back for a charge",
                  "other": "Anything else"
                }
              }
            }
          }
          JSON

          curl --fail --silent --show-error             -H 'Authorization: Bearer local'             -H 'Content-Type: application/json'             --data-binary @"$RUNNER_TEMP/request.json"             http://127.0.0.1:11435/v1/systemone | tee "$RUNNER_TEMP/decision.json"

          python3 - "$RUNNER_TEMP/decision.json" <<'PY'
          import json, pathlib, sys
          x = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert x["model"] == "ollaya.dev/library/laya:multilingual", x
          a = x["answers"]["intent"]
          assert a["type"] == "choice", a
          assert a["choice"] in {"refund", "other"}, a
          assert set(a["probabilities"]) == {"refund", "other"}, a
          assert 0.0 <= a["confidence"] <= 1.0, a
          assert all(0.0 <= float(v) <= 1.0 for v in a["probabilities"].values()), a
          print(json.dumps({
              "schema": "ops.ollayaReleaseArtifactReplay/1",
              "status": "PASS",
              "model": x["model"],
              "answerType": a["type"],
              "choice": a["choice"],
              "confidence": a["confidence"],
          }, sort_keys=True))
          PY

          kill "$pid"
          wait "$pid" || true
          trap - EXIT
