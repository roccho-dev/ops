name: Temporary harden selected SQLite query

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [proposals]

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'feat/ops-115-decision-closure-final-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ops-115-decision-closure-final-v2
          fetch-depth: 0

      - name: Require exact manifest identity and closed asset set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/ops-decision-closure/bin/query.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("p.add_argument('--projection',required=True)\n", "p.add_argument('--projection',required=True)\n    p.add_argument('--manifest-sha256',required=True)\n",1)
          s=s.replace("if not manifest_path.is_file(): fail('MANIFEST_MISSING',str(manifest_path))\n    manifest=read_json(manifest_path)\n", "if not manifest_path.is_file(): fail('MANIFEST_MISSING',str(manifest_path))\n    if len(args.manifest_sha256)!=64 or any(c not in '0123456789abcdef' for c in args.manifest_sha256): fail('MANIFEST_SHA_FORMAT',args.manifest_sha256)\n    if sha256_file(manifest_path)!=args.manifest_sha256: fail('MANIFEST_IDENTITY_MISMATCH',manifest_path.name)\n    manifest=read_json(manifest_path)\n",1)
          old="""    expected={x['name']:x for x in manifest.get('assets',[])}
    actual={x.name for x in projection.iterdir() if x.is_file() and x.suffix=='.sqlite'}
    if actual!=set(expected): fail('ASSET_SET_MISMATCH',json.dumps({'expected':sorted(expected),'actual':sorted(actual)}))
"""
          new="""    asset_rows=manifest.get('assets',[])
    if not isinstance(asset_rows,list) or any(not isinstance(x,dict) or not isinstance(x.get('name'),str) for x in asset_rows): fail('ASSET_MANIFEST_SHAPE','assets must be named objects')
    names=[x['name'] for x in asset_rows]
    if len(names)!=len(set(names)): fail('ASSET_NAME_DUPLICATE',json.dumps(names))
    if any(Path(name).name!=name or name in {'.','..'} for name in names): fail('ASSET_PATH_INVALID',json.dumps(names))
    expected={x['name']:x for x in asset_rows}
    actual={x.name for x in projection.iterdir() if x.is_file()}
    allowed=set(expected)|{'manifest.json'}
    if actual!=allowed: fail('ASSET_SET_MISMATCH',json.dumps({'expected':sorted(allowed),'actual':sorted(actual)}))
"""
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          t=Path('packages/ops-decision-closure/tests/final-e2e.mjs')
          x=t.read_text(encoding='utf-8')
          if 'import crypto from "node:crypto";' not in x:
              x=x.replace('import assert from "node:assert/strict";\n','import assert from "node:assert/strict";\nimport crypto from "node:crypto";\n',1)
          old_call='const selected = spawnSync("python3", [path.join(root, "packages/ops-decision-closure/bin/query.py"), "--projection", path.join(out, "checkpoint-selected"), "--query", "current_decisions", "--params-json", JSON.stringify({ domain: "decision-ledger" })], { encoding: "utf8" });'
          new_call='const selectedManifest = path.join(out, "checkpoint-selected", "manifest.json");\n  const selectedManifestSha = crypto.createHash("sha256").update(fs.readFileSync(selectedManifest)).digest("hex");\n  const selected = spawnSync("python3", [path.join(root, "packages/ops-decision-closure/bin/query.py"), "--projection", path.join(out, "checkpoint-selected"), "--manifest-sha256", selectedManifestSha, "--query", "current_decisions", "--params-json", JSON.stringify({ domain: "decision-ledger" })], { encoding: "utf8" });'
          assert old_call in x
          x=x.replace(old_call,new_call,1)
          anchor='  assert.equal(selectedResult.semanticDigest, JSON.parse(fs.readFileSync(path.join(out, "decision-packet.json"), "utf8")).canonical_result_digests.current_decisions);\n'
          extra=anchor+'''  const wrongManifest = spawnSync("python3", [path.join(root, "packages/ops-decision-closure/bin/query.py"), "--projection", path.join(out, "checkpoint-selected"), "--manifest-sha256", "0".repeat(64), "--query", "current_decisions", "--params-json", JSON.stringify({ domain: "decision-ledger" })], { encoding: "utf8" });
  assert.notEqual(wrongManifest.status, 0);
  assert.match(wrongManifest.stderr + wrongManifest.stdout, /MANIFEST_IDENTITY_MISMATCH/);
  const extraPath = path.join(out, "checkpoint-selected", "unexpected.txt");
  fs.writeFileSync(extraPath, "unexpected");
  const extraAsset = spawnSync("python3", [path.join(root, "packages/ops-decision-closure/bin/query.py"), "--projection", path.join(out, "checkpoint-selected"), "--manifest-sha256", selectedManifestSha, "--query", "current_decisions", "--params-json", JSON.stringify({ domain: "decision-ledger" })], { encoding: "utf8" });
  fs.unlinkSync(extraPath);
  assert.notEqual(extraAsset.status, 0);
  assert.match(extraAsset.stderr + extraAsset.stdout, /ASSET_SET_MISMATCH/);
'''
          if 'wrongManifest' not in x:
              assert anchor in x
              x=x.replace(anchor,extra,1)
          t.write_text(x,encoding='utf-8')

          r=Path('packages/ops-decision-closure/README.md')
          text=r.read_text(encoding='utf-8')
          text=text.replace('It depends on Python standard-library SQLite and verifies every manifest asset before query.','It depends on Python standard-library SQLite, requires the expected manifest SHA-256, and verifies a closed set of manifest assets before query.')
          r.write_text(text,encoding='utf-8')
          PY

      - name: Acquire exact DuckDB proof comparator
        id: duck
        shell: bash
        env:
          PAYLOAD_SHA: 3d33b1df037cb049155c393778df7853fafb23e9d49d7c9cacdde4dd67155788
          TAG: duckdb-carrier-v1.5.5-3d33b1df037c
        run: |
          set -euo pipefail
          carrier="$RUNNER_TEMP/duckdb.b64.txt"; duckdb="$RUNNER_TEMP/duckdb"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/carrier.native.linux-amd64.$PAYLOAD_SHA.b64.txt" -o "$carrier"
          python3 - "$carrier" "$duckdb" "$PAYLOAD_SHA" <<'PY'
          import base64,hashlib,pathlib,sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='ascii'); data=base64.b64decode(text,validate=True)
          assert not any(c.isspace() for c in text) and base64.b64encode(data).decode('ascii')==text
          assert hashlib.sha256(data).hexdigest()==sys.argv[3]
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PY
          chmod 0555 "$duckdb"; echo "path=$duckdb" >> "$GITHUB_OUTPUT"

      - name: Replay selected query and negative gates
        shell: bash
        env:
          DUCKDB: ${{ steps.duck.outputs.path }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ops115-final"
          OPS_DUCKDB="$DUCKDB" node packages/ops-decision-closure/tests/final-e2e.mjs
          python3 packages/ops-decision-closure/bin/final-proof.py \
            --out-dir "$RUNNER_TEMP/ops115-final" --duckdb "$DUCKDB" \
            --source-commit 0000000000000000000000000000000000000000 \
            --source-tree 0000000000000000000000000000000000000000
          manifest="$RUNNER_TEMP/ops115-final/checkpoint-selected/manifest.json"
          manifest_sha="$(sha256sum "$manifest" | awk '{print $1}')"
          python3 packages/ops-decision-closure/bin/query.py \
            --projection "$RUNNER_TEMP/ops115-final/checkpoint-selected" \
            --manifest-sha256 "$manifest_sha" \
            --query current_decisions --params-json '{"domain":"decision-ledger"}' \
            > evidence/ops-115-decision-closure/selected-query-proof.json
          python3 - "$manifest_sha" <<'PY'
          from pathlib import Path
          import json,sys
          p=Path('evidence/ops-115-decision-closure/selected-query-proof.json')
          x=json.loads(p.read_text())
          x['manifestSha256']=sys.argv[1]
          p.write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Commit focused result and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-ops115-query-hardening.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: bind selected query to exact manifest'
          git push origin HEAD:feat/ops-115-decision-closure-final-v2
