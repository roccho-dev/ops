name: tmp inspect Mobile Agent Worker
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-capture-mobile-agent-worker.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: cloudflare-production
    steps:
      - name: Capture current Worker and inspect Cloudflare deployment history
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cf"; mkdir -p "$root"
          curl -fsSL -H 'Cache-Control: no-cache' https://mobile-agent.roccho.workers.dev/app/ -o "$root/current-app.html"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -sS "${auth[@]}" "$api/workers/scripts" -o "$root/scripts.json"
          for script in mobile-agent stg-mobile-agent; do
            curl -sS "${auth[@]}" "$api/workers/scripts/$script/deployments" -o "$root/$script-deployments.json" || true
            curl -sS "${auth[@]}" "$api/workers/scripts/$script/versions" -o "$root/$script-versions.json" || true
          done
          python3 - "$root" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          for p in sorted(root.glob('*.json')):
              try:
                  x=json.loads(p.read_text())
                  result=x.get('result')
                  if isinstance(result,list):
                      print(p.name,'success=',x.get('success'),'count=',len(result))
                      for row in result[:20]:
                          if isinstance(row,dict): print(' ',{k:row.get(k) for k in ('id','script','created_on','modified_on','number') if k in row})
                  else: print(p.name,'success=',x.get('success'),'resultType=',type(result).__name__)
              except Exception as e: print(p.name,'ERROR',e)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-worker-history-${{ github.run_id }}
          path: ${{ runner.temp }}/cf/
          if-no-files-found: error
          retention-days: 1
