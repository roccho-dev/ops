name: tmp prove current Mobile Agent Worker
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-capture-mobile-agent-worker.yml'
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prove Graph Map Seq against current Worker
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          python3 - verification/mobile-agent-url-only-runtime/preset-render-cases.json "$RUNNER_TEMP/urls.json" <<'PY'
          import json,pathlib,sys
          x=json.load(open(sys.argv[1]))
          for row in x['cases']:
              row['url']=row['url'].replace('https://stg-mobile-agent.pages.dev/','https://mobile-agent.roccho.workers.dev/')
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'cases':x['cases']},ensure_ascii=False)+'\n')
          PY
          CHROME_BIN="$chrome" python3 verification/mobile-agent-preset-app/browser-smoke.py "$RUNNER_TEMP/urls.json" "$RUNNER_TEMP/receipt.json" "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-worker-behavior-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/receipt.json
            ${{ runner.temp }}/shots/
          if-no-files-found: ignore
          retention-days: 1
