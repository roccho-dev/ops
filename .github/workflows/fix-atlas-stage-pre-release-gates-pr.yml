name: Generate AtlasStage pre-Release PR gate replacements

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/fix-atlas-stage-pre-release-gates-pr.yml'
      - 'verification/atlas-stage-publication/fix-pre-release-gates.py'

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'proposal/atlas-stage-artifact-publication-260821'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Generate and inspect bounded replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/atlas-stage-publication/fix-pre-release-gates.py
          grep -F 'release_bound=false' verification/atlas-stage-publication/pre-release-generated/artifact-runtime-source-carry.yml
          grep -F 'if [ "$GITHUB_EVENT_NAME" = pull_request ]; then' verification/atlas-stage-publication/pre-release-generated/artifact-runtime-static-host.yml
          grep -F 'atlas-stage.mjs' verification/atlas-stage-publication/pre-release-generated/artifact-runtime-static-host.yml
          git diff --check

      - name: Commit regular replacement blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verification/atlas-stage-publication/pre-release-generated
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: make Source Carry and static proof pre-Release safe"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
