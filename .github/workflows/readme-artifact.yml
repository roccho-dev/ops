name: README artifact exporter

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [proposals]

permissions:
  contents: read

jobs:
  export:
    name: build and upload README artifact packet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Build README artifact packet
        run: nix build --show-trace --no-write-lock-file ./packages/ops-readme-artifact
      - name: Check README artifact packet
        run: |
          set -euo pipefail
          test -s result/README.md
          test -s result/manifest.json
          test -s result/sources.jsonl
          test -s result/receipt.json
      - name: Upload README artifact packet
        uses: actions/upload-artifact@v4
        with:
          name: ops-readme-artifact
          path: |
            result/README.md
            result/manifest.json
            result/sources.jsonl
            result/receipt.json
          if-no-files-found: error

  vim-hq-source-complete:
    if: github.event_name == 'pull_request' && github.head_ref == 'proof/vim-hq-complete-carry-trigger'
    name: materialize exact Vim HQ source authorities
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OUT: ${{ runner.temp }}/vim-hq-source-complete
    steps:
      - name: Materialize exact repo snapshots
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT/source"
          : > "$OUT/source-records.tsv"
          snap() {
            name=$1 remote=$2 ref=$3 expected=${4:-}
            work="$RUNNER_TEMP/src-$name"; rm -rf "$work"; git init -q "$work"
            git -C "$work" remote add origin "$remote"
            git -C "$work" fetch -q --depth=1 origin "$ref"
            commit=$(git -C "$work" rev-parse FETCH_HEAD^{commit})
            test -z "$expected" || test "$commit" = "$expected"
            git -C "$work" checkout -q --detach "$commit"
            tree=$(git -C "$work" rev-parse HEAD^{tree})
            git -C "$work" archive --format=tar --prefix="$name-$commit/" HEAD | gzip -n > "$OUT/source/$name.source.tar.gz"
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$remote" "$ref" "$commit" "$tree" >> "$OUT/source-records.tsv"
          }
          snap edits-current https://github.com/roccho-dev/edits.git d6d0f6d584883267b05559b0d058bce127f83d9c d6d0f6d584883267b05559b0d058bce127f83d9c
          snap edits-proof https://github.com/roccho-dev/edits.git 58a1c3e2f329605c016a051c4254e3c04f5d0671 58a1c3e2f329605c016a051c4254e3c04f5d0671
          test "$(awk -F '\t' '$1=="edits-proof"{print $5}' "$OUT/source-records.tsv")" = 133c9d136d718a64b953e3561447e704704c8284
          snap edits-product-base https://github.com/roccho-dev/edits.git d83bf4c4860e02f37d6b41cc54fe8c881af4c779 d83bf4c4860e02f37d6b41cc54fe8c881af4c779
          snap hq https://github.com/roccho-dev/hq.git 3118886f34ac5615e8a7732a6297bd41900e21e1 3118886f34ac5615e8a7732a6297bd41900e21e1
          snap yegappan-lsp https://github.com/yegappan/lsp.git 989016ae2ae4cbf304a9ca29478f47fec794493f 989016ae2ae4cbf304a9ca29478f47fec794493f
          snap vim https://github.com/vim/vim.git v9.2.0478 8aecd377f08e9fbdf0092478ab7ec3ce5e0f04ec
          snap herdr https://github.com/herdrdev/herdr.git v0.8.0 ''
          snap nixpkgs https://github.com/NixOS/nixpkgs.git 0ae2bc1419c3f345984c2629e72e7a631820fa4d 0ae2bc1419c3f345984c2629e72e7a631820fa4d
          snap go-nixpkgs https://github.com/NixOS/nixpkgs.git cbb826608f7d081948eeb4ea0211b0cbd867b9d1 cbb826608f7d081948eeb4ea0211b0cbd867b9d1
          python3 - "$OUT" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); rows=[]
          for line in (root/'source-records.tsv').read_text().splitlines():
              name,remote,ref,commit,tree=line.split('\t')
              rows.append({'name':name,'remote':remote,'ref':ref,'commit':commit,'tree':tree,'artifact':f'source/{name}.source.tar.gz'})
          (root/'manifest.json').write_text(json.dumps({'schema':'ops.vimHqSourceCompleteCarry/1','status':'PASS','sources':rows},indent=2,sort_keys=True)+'\n')
          PY
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: vim-hq-source-complete
          path: ${{ runner.temp }}/vim-hq-source-complete
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
