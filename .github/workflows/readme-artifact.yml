name: README artifact exporter

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [proposals]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Materialize exact HQ and LSP runtime
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hq-vim-runtime-carry"
          tag=hq-artifact-3118886f34ac5615e8a7732a6297bd41900e21e1
          commit=3118886f34ac5615e8a7732a6297bd41900e21e1
          lsp=989016ae2ae4cbf304a9ca29478f47fec794493f
          tree=899cd0db6af40e3b1e0039b679541cd062cfa9e7
          base="https://github.com/roccho-dev/hq/releases/download/$tag"
          mkdir -p "$out/bin" "$out/lsp"
          curl -fL "$base/hq-linux-amd64" -o "$out/bin/hq"
          curl -fL "$base/hq-worker-linux-amd64" -o "$out/bin/hq-worker"
          curl -fL "$base/manifest-linux-amd64.json" -o "$out/manifest-linux-amd64.json"
          test "$(jq -r .source_sha "$out/manifest-linux-amd64.json")" = "$commit"
          test "$(jq -r .go_version "$out/manifest-linux-amd64.json")" = go1.23.12
          test "$(sha256sum "$out/bin/hq" | cut -d' ' -f1)" = "$(jq -r '.artifacts[] | select(.name == "hq-linux-amd64") | .sha256' "$out/manifest-linux-amd64.json")"
          test "$(sha256sum "$out/bin/hq-worker" | cut -d' ' -f1)" = "$(jq -r '.artifacts[] | select(.name == "hq-worker-linux-amd64") | .sha256' "$out/manifest-linux-amd64.json")"
          chmod 0555 "$out/bin/hq" "$out/bin/hq-worker"
          go version -m "$out/bin/hq" | grep -F "vcs.revision=$commit"
          go version -m "$out/bin/hq-worker" | grep -F "vcs.revision=$commit"
          "$out/bin/hq" --help >/dev/null
          "$out/bin/hq-worker" --help >/dev/null
          git init -q "$RUNNER_TEMP/lsp"
          git -C "$RUNNER_TEMP/lsp" remote add origin https://github.com/yegappan/lsp.git
          git -C "$RUNNER_TEMP/lsp" fetch -q --depth=1 origin "$lsp"
          test "$(git -C "$RUNNER_TEMP/lsp" rev-parse FETCH_HEAD^{tree})" = "$tree"
          git -C "$RUNNER_TEMP/lsp" archive "$lsp" | tar -x -C "$out/lsp"
          test -f "$out/lsp/plugin/lsp.vim"
          test -f "$out/lsp/autoload/lsp/lsp.vim"
          printf '%s\n' "$lsp" > "$out/lsp/.pinned-commit"
          printf '%s\n' "$tree" > "$out/lsp/.pinned-tree"
          (cd "$out" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$out" && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: hq-vim-runtime-carry-3118886f-989016ae
          path: ${{ runner.temp }}/hq-vim-runtime-carry
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
