name: README artifact exporter

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [proposals]

permissions:
  contents: read

jobs:
  export:
    name: materialize official HQ and pinned Vim LSP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Materialize exact runtime bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hq-vim-runtime-carry"
          hq_commit=3118886f34ac5615e8a7732a6297bd41900e21e1
          hq_tag=hq-artifact-3118886f34ac5615e8a7732a6297bd41900e21e1
          lsp_commit=989016ae2ae4cbf304a9ca29478f47fec794493f
          lsp_tree=899cd0db6af40e3b1e0039b679541cd062cfa9e7
          mkdir -p "$out"/{release,bin,lsp,logs}

          gh release download "$hq_tag" --repo roccho-dev/hq --dir "$out/release"
          test "$(find "$out/release" -maxdepth 1 -type f | wc -l)" -eq 8
          (cd "$out/release" && sha256sum --check SHA256SUMS)
          test "$(jq -r .source_sha "$out/release/manifest-linux-amd64.json")" = "$hq_commit"
          test "$(jq -r .go_version "$out/release/manifest-linux-amd64.json")" = go1.23.12
          cp "$out/release/hq-linux-amd64" "$out/bin/hq"
          cp "$out/release/hq-worker-linux-amd64" "$out/bin/hq-worker"
          chmod 0555 "$out/bin/hq" "$out/bin/hq-worker"
          go version -m "$out/bin/hq" > "$out/logs/hq.buildinfo.txt"
          go version -m "$out/bin/hq-worker" > "$out/logs/hq-worker.buildinfo.txt"
          grep -F "vcs.revision=$hq_commit" "$out/logs/hq.buildinfo.txt"
          grep -F "vcs.revision=$hq_commit" "$out/logs/hq-worker.buildinfo.txt"
          grep -F 'vcs.modified=false' "$out/logs/hq.buildinfo.txt"
          grep -F 'vcs.modified=false' "$out/logs/hq-worker.buildinfo.txt"
          "$out/bin/hq" --help > "$out/logs/hq.help.txt"
          "$out/bin/hq-worker" --help > "$out/logs/hq-worker.help.txt"

          git init --quiet "$RUNNER_TEMP/lsp"
          git -C "$RUNNER_TEMP/lsp" remote add origin https://github.com/yegappan/lsp.git
          git -C "$RUNNER_TEMP/lsp" fetch --quiet --depth=1 origin "$lsp_commit"
          test "$(git -C "$RUNNER_TEMP/lsp" rev-parse FETCH_HEAD^{commit})" = "$lsp_commit"
          test "$(git -C "$RUNNER_TEMP/lsp" rev-parse FETCH_HEAD^{tree})" = "$lsp_tree"
          git -C "$RUNNER_TEMP/lsp" archive "$lsp_commit" | tar -x -C "$out/lsp"
          test -f "$out/lsp/plugin/lsp.vim"
          test -f "$out/lsp/autoload/lsp/lsp.vim"
          printf '%s\n' "$lsp_commit" > "$out/lsp/.pinned-commit"
          printf '%s\n' "$lsp_tree" > "$out/lsp/.pinned-tree"

          (cd "$out" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$out" && sha256sum --check SHA256SUMS)

      - name: Upload runtime bytes
        uses: actions/upload-artifact@v4
        with:
          name: hq-vim-runtime-carry-3118886f-989016ae
          path: ${{ runner.temp }}/hq-vim-runtime-carry/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
