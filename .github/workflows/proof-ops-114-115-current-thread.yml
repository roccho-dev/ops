name: Proof ops 114 and 115 current thread

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  exact-base-repo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Materialize exact one-commit base repository
        id: base
        shell: bash
        env:
          EXPECTED_BASE: 59457a5667488da34d4ba977fa32c3a101a4a38e
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_BASE" ]]
          [[ "$actual" == "${{ github.event.pull_request.base.sha }}" ]]
          tree="$(git rev-parse 'HEAD^{tree}')"
          shallow="$(git rev-parse --is-shallow-repository)"
          count="$(git rev-list --count HEAD)"
          [[ "$shallow" == true ]]
          [[ "$count" == 1 ]]
          git fsck --no-dangling

          out="$RUNNER_TEMP/exact-base"
          mkdir -p "$out"
          archive="$out/$actual.git.tar.gz"
          receipt="$out/$actual.receipt.json"
          tar -czf "$archive" .git
          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
          archive_bytes="$(stat -c %s "$archive")"

          python3 - "$receipt" "$actual" "$tree" "$archive" "$archive_sha" "$archive_bytes" <<'PY'
          import json,pathlib,sys
          out,head,tree,archive,digest,size=sys.argv[1:]
          pathlib.Path(out).write_text(json.dumps({
            'schema':'ops.proofExactBaseRepo.v1',
            'status':'PASS',
            'repository':'roccho-dev/ops',
            'baseRef':'proposals',
            'head':head,
            'tree':tree,
            'shallow':True,
            'commitCount':1,
            'gitFsck':'PASS',
            'archive':{'name':pathlib.Path(archive).name,'bytes':int(size),'sha256':digest},
          },sort_keys=True,indent=2)+'\n')
          PY
          (
            cd "$out"
            sha256sum "$(basename "$archive")" "$(basename "$receipt")" > SHA256SUMS
          )
          echo "head=$actual" >> "$GITHUB_OUTPUT"

      - name: Upload exact base repository
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ops-114-exact-base-${{ steps.base.outputs.head }}
          path: ${{ runner.temp }}/exact-base/
          if-no-files-found: error
          retention-days: 30

  duckdb-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Acquire, verify, decode, and execute exact DuckDB Carrier
        id: duckdb
        shell: bash
        env:
          TAG: duckdb-carrier-v1.5.5-3d33b1df037c
          ASSET: carrier.native.linux-amd64.3d33b1df037cb049155c393778df7853fafb23e9d49d7c9cacdde4dd67155788.b64.txt
          EXPECTED_CARRIER_BYTES: '82582200'
          EXPECTED_CARRIER_SHA256: 82bd7897b89896632db7d6b56884cd48edc36f22336564b0c0bb8c0a48bf72a4
          EXPECTED_PAYLOAD_SHA256: 3d33b1df037cb049155c393778df7853fafb23e9d49d7c9cacdde4dd67155788
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/duckdb-work"
          out="$RUNNER_TEMP/duckdb-out"
          mkdir -p "$work" "$out" "$work/extensions"
          carrier="$work/$ASSET"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error "$url" -o "$carrier"

          python3 - "$carrier" "$out/duckdb" "$EXPECTED_CARRIER_BYTES" "$EXPECTED_CARRIER_SHA256" "$EXPECTED_PAYLOAD_SHA256" <<'PY'
          import base64,hashlib,pathlib,sys
          src,out,expected_bytes,expected_carrier_sha,expected_payload_sha=sys.argv[1:]
          p=pathlib.Path(src); raw=p.read_bytes()
          assert len(raw)==int(expected_bytes), (len(raw),expected_bytes)
          assert hashlib.sha256(raw).hexdigest()==expected_carrier_sha
          text=raw.decode('ascii')
          assert not any(c.isspace() for c in text)
          data=base64.b64decode(text,validate=True)
          assert base64.b64encode(data).decode('ascii')==text
          assert hashlib.sha256(data).hexdigest()==expected_payload_sha
          pathlib.Path(out).write_bytes(data)
          PY
          chmod 0555 "$out/duckdb"
          version="$($out/duckdb -version)"
          [[ "$version" == *'v1.5.5'* ]]
          file "$out/duckdb" | grep -F 'ELF 64-bit LSB'

          hot="$work/input.jsonl"
          cold="$work/output.parquet"
          printf '%s\n' '{"id":1,"value":10}' '{"id":2,"value":20}' > "$hot"
          guard="SET extension_directory='${work}/extensions'; SET autoinstall_known_extensions=false; SET allow_community_extensions=false;"
          hot_result="$($out/duckdb -csv -noheader -c "$guard SELECT count(*), sum(value) FROM read_ndjson('$hot');")"
          [[ "$hot_result" == '2,30' ]]
          "$out/duckdb" -c "$guard COPY (SELECT * FROM read_ndjson('$hot')) TO '$cold' (FORMAT parquet);"
          cold_result="$($out/duckdb -csv -noheader -c "$guard SELECT count(*), sum(value) FROM read_parquet('$cold');")"
          [[ "$cold_result" == '2,30' ]]
          [[ -z "$(find "$work/extensions" -type f -print -quit)" ]]

          payload_bytes="$(stat -c %s "$out/duckdb")"
          python3 - "$out/receipt.json" "$url" "$ASSET" "$EXPECTED_CARRIER_BYTES" "$EXPECTED_CARRIER_SHA256" "$payload_bytes" "$EXPECTED_PAYLOAD_SHA256" "$version" <<'PY'
          import json,pathlib,sys
          out,url,asset,carrier_bytes,carrier_sha,payload_bytes,payload_sha,version=sys.argv[1:]
          pathlib.Path(out).write_text(json.dumps({
            'schema':'ops.proofDuckDBCarrier.v1',
            'status':'PASS',
            'source':{'url':url,'asset':asset},
            'carrier':{'bytes':int(carrier_bytes),'sha256':carrier_sha,'canonicalBase64':True},
            'payload':{'name':'duckdb','bytes':int(payload_bytes),'sha256':payload_sha,'version':version},
            'fixture':{'directJsonl':'PASS','jsonlToParquetReadback':'PASS','rows':2,'sum':30,'networkExtensionInstall':False},
          },sort_keys=True,indent=2)+'\n')
          PY
          (
            cd "$out"
            sha256sum duckdb receipt.json > SHA256SUMS
          )
          echo "payload_sha=$EXPECTED_PAYLOAD_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload exact DuckDB runtime
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ops-115-duckdb-${{ steps.duckdb.outputs.payload_sha }}
          path: ${{ runner.temp }}/duckdb-out/
          if-no-files-found: error
          retention-days: 30
