name: Cloudflare Pages Wrangler

on:
  workflow_dispatch:
    inputs:
      argv_json:
        description: 'Wrangler argv JSON, e.g. ["pages","project","list","--json"]'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cloudflare-pages-wrangler.yml

permissions:
  contents: read

jobs:
  wrangler:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'chore/cloudflare-pages-wrangler-260915')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_ARGV_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.argv_json || '["pages","project","list","--json"]' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Wrangler argv
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');

          const raw = process.env.WRANGLER_ARGV_JSON;
          let argv;
          try {
            argv = JSON.parse(raw);
          } catch (error) {
            throw new Error(`WRANGLER_ARGV_JSON must be JSON: ${error.message}`);
          }
          if (!Array.isArray(argv) || argv.length === 0 || argv.some((arg) => typeof arg !== 'string' || arg.length === 0)) {
            throw new Error('WRANGLER_ARGV_JSON must be a non-empty JSON string array');
          }
          if (argv[0] !== 'pages') {
            throw new Error('Cloudflare Pages boundary: argv[0] must be "pages"');
          }
          if (!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN) {
            throw new Error('Cloudflare credentials are required');
          }

          console.log(`wrangler argv: ${JSON.stringify(argv)}`);
          const result = spawnSync('npx', ['--yes', 'wrangler@4.112.0', ...argv], {
            env: process.env,
            stdio: 'inherit',
          });
          if (result.error) throw result.error;
          process.exit(typeof result.status === 'number' ? result.status : 1);
          NODE

      - name: Temporary approved UI Pages cleanup
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const targets = ['ui-graph-218', 'stg-artifact-runtime'];
          const keep = ['ui-runtime', 'stg-gov-json-reduce'];

          const run = (argv, capture = false) => {
            const result = spawnSync('npx', ['--yes', 'wrangler@4.112.0', ...argv], {
              env: process.env,
              encoding: capture ? 'utf8' : undefined,
              stdio: capture ? ['ignore', 'pipe', 'inherit'] : 'inherit',
            });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error(`wrangler failed (${result.status}): ${JSON.stringify(argv)}`);
            return capture ? result.stdout : '';
          };

          const list = () => {
            const rows = JSON.parse(run(['pages', 'project', 'list', '--json'], true));
            return new Set(rows.map(row => row['Project Name']));
          };

          const before = list();
          const missingTargets = targets.filter(name => !before.has(name));
          const missingKeep = keep.filter(name => !before.has(name));
          if (missingTargets.length || missingKeep.length) {
            throw new Error(`Pages precondition failed targets=${JSON.stringify(missingTargets)} keep=${JSON.stringify(missingKeep)}`);
          }

          for (const name of targets) {
            console.log(`DELETE ${name}`);
            run(['pages', 'project', 'delete', name, '--yes']);
          }

          const after = list();
          const survivors = targets.filter(name => after.has(name));
          const lostKeep = keep.filter(name => !after.has(name));
          if (survivors.length || lostKeep.length) {
            throw new Error(`Pages postcondition failed survivors=${JSON.stringify(survivors)} lostKeep=${JSON.stringify(lostKeep)}`);
          }
          console.log(`PAGES_AFTER ${JSON.stringify([...after].sort())}`);
          NODE
