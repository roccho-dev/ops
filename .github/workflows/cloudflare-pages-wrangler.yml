name: Cloudflare Pages Wrangler

on:
  workflow_dispatch:
    inputs:
      argv_json:
        description: 'Wrangler argv JSON, e.g. ["pages","project","list","--json"]'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cloudflare-pages-wrangler.yml

permissions:
  contents: read

jobs:
  wrangler:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'chore/cloudflare-pages-wrangler-260915')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_ARGV_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.argv_json || '["pages","project","list","--json"]' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Wrangler argv
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');

          const raw = process.env.WRANGLER_ARGV_JSON;
          let argv;
          try {
            argv = JSON.parse(raw);
          } catch (error) {
            throw new Error(`WRANGLER_ARGV_JSON must be JSON: ${error.message}`);
          }
          if (!Array.isArray(argv) || argv.length === 0 || argv.some((arg) => typeof arg !== 'string' || arg.length === 0)) {
            throw new Error('WRANGLER_ARGV_JSON must be a non-empty JSON string array');
          }
          if (argv[0] !== 'pages') {
            throw new Error('Cloudflare Pages boundary: argv[0] must be "pages"');
          }
          if (!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN) {
            throw new Error('Cloudflare credentials are required');
          }

          console.log(`wrangler argv: ${JSON.stringify(argv)}`);
          const result = spawnSync('npx', ['--yes', 'wrangler@4.112.0', ...argv], {
            env: process.env,
            stdio: 'inherit',
          });
          if (result.error) throw result.error;
          process.exit(typeof result.status === 'number' ? result.status : 1);
          NODE

      - name: Temporary approved Workers cleanup
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node <<'NODE'
          const targets = [
            'stg-cap',
            'stg-cap02',
            'stg-log-projected-semantic-d7d7d21e7d',
            'stg-mobile-agent',
            'stg-waku-init',
            'lazarv-rsc-app',
            'react-ssr-worker-reference',
            'rsc-flows-demo',
            'vite-rsc-app',
            'vite-rsc-cloudflare-poc',
            'vite-rsc-official',
            'vite-rsc-ssr-app',
            'waku-init',
            'waku-init-app',
            'waku-init-prod',
            'waku-init-stg',
            'waku-project',
            'pglite-inmemory-prod',
            'pglite-inmemory-stg',
            'poc-redwoodsdk-duckdb',
            'redwoodsdk-duckdb',
            'redwoodsdk-init-stg',
            'ancient-dust-ddfd',
            'console-test-worker',
            'core',
            'gpt_plugin_api',
            'oauth-test',
            'opennext-stg',
            'pages',
            'shiorin-diary-stg',
            'src',
            'todo',
            'trip',
            'wyz13055',
            'youtube',
          ];

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!account || !token) throw new Error('Cloudflare credentials are required');
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts`;
          const headers = { Authorization: `Bearer ${token}` };

          const readWorkers = async () => {
            const response = await fetch(base, { headers });
            const body = await response.json();
            if (!response.ok || body.success !== true || !Array.isArray(body.result)) {
              throw new Error(`Workers list failed: HTTP ${response.status} ${JSON.stringify(body)}`);
            }
            return body.result.map(({ id, created_on, modified_on }) => ({ id, created_on, modified_on }));
          };

          (async () => {
            const before = await readWorkers();
            const beforeIds = new Set(before.map((worker) => worker.id));
            const missing = targets.filter((id) => !beforeIds.has(id));
            if (missing.length) throw new Error(`Approved targets missing before delete: ${JSON.stringify(missing)}`);
            console.log(`WORKERS_DELETE_TARGETS ${JSON.stringify(targets)}`);

            for (const id of targets) {
              const response = await fetch(`${base}/${encodeURIComponent(id)}`, {
                method: 'DELETE',
                headers,
              });
              const text = await response.text();
              let body = null;
              if (text) {
                try { body = JSON.parse(text); } catch { body = text; }
              }
              if (!response.ok || (body && typeof body === 'object' && body.success === false)) {
                throw new Error(`Worker delete failed: ${id} HTTP ${response.status} ${JSON.stringify(body)}`);
              }
              console.log(`DELETED ${id}`);
            }

            const after = await readWorkers();
            const afterIds = new Set(after.map((worker) => worker.id));
            const survivors = targets.filter((id) => afterIds.has(id));
            if (survivors.length) throw new Error(`Deleted targets still present: ${JSON.stringify(survivors)}`);
            console.log(`WORKERS_AFTER ${JSON.stringify(after)}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
