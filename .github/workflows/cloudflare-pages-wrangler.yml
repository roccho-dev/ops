name: Cloudflare Pages Wrangler

on:
  workflow_dispatch:
    inputs:
      argv_json:
        description: 'Wrangler argv JSON, e.g. ["pages","project","list","--json"]'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cloudflare-pages-wrangler.yml

permissions:
  contents: read

jobs:
  wrangler:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'chore/cloudflare-pages-wrangler-260915')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_ARGV_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.argv_json || '["pages","project","list","--json"]' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Wrangler argv
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');

          const raw = process.env.WRANGLER_ARGV_JSON;
          let argv;
          try {
            argv = JSON.parse(raw);
          } catch (error) {
            throw new Error(`WRANGLER_ARGV_JSON must be JSON: ${error.message}`);
          }
          if (!Array.isArray(argv) || argv.length === 0 || argv.some((arg) => typeof arg !== 'string' || arg.length === 0)) {
            throw new Error('WRANGLER_ARGV_JSON must be a non-empty JSON string array');
          }
          if (argv[0] !== 'pages') {
            throw new Error('Cloudflare Pages boundary: argv[0] must be "pages"');
          }
          if (!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN) {
            throw new Error('Cloudflare credentials are required');
          }

          console.log(`wrangler argv: ${JSON.stringify(argv)}`);
          const result = spawnSync('npx', ['--yes', 'wrangler@4.112.0', ...argv], {
            env: process.env,
            stdio: 'inherit',
          });
          if (result.error) throw result.error;
          process.exit(typeof result.status === 'number' ? result.status : 1);
          NODE

      - name: Temporary approved Pages cleanup and Workers inventory
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');

          const projects = [
            'ui-maxgraph-authoring-217',
            'stg-mobile-agent',
            'stg-mobile',
            'portfolio',
            'hono-pages',
            'init',
          ];

          const runWrangler = (argv) => {
            console.log(`wrangler argv: ${JSON.stringify(argv)}`);
            const result = spawnSync('npx', ['--yes', 'wrangler@4.112.0', ...argv], {
              env: process.env,
              stdio: 'inherit',
            });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error(`wrangler failed (${result.status}): ${JSON.stringify(argv)}`);
          };

          (async () => {
            if (!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN) {
              throw new Error('Cloudflare credentials are required');
            }

            for (const project of projects) {
              runWrangler(['pages', 'project', 'delete', project, '--yes']);
            }

            console.log('PAGES_AFTER_DELETE');
            runWrangler(['pages', 'project', 'list', '--json']);

            const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts`;
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
            });
            const body = await response.json();
            if (!response.ok || body.success !== true || !Array.isArray(body.result)) {
              throw new Error(`Workers list failed: HTTP ${response.status} ${JSON.stringify(body)}`);
            }
            const workers = body.result.map(({ id, created_on, modified_on }) => ({ id, created_on, modified_on }));
            console.log(`WORKERS ${JSON.stringify(workers)}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
