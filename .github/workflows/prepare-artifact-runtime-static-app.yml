name: Prepare static bidirectional Artifact App switch

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/prepare-artifact-runtime-static-app.yml'
      - 'verification/artifact-runtime-publication/**'
      - 'verification/artifact-runtime-static-host/**'

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'proposal/artifact-runtime-static-app-260821'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Generate the bounded static-host workflow as a regular bridge file
        shell: bash
        run: |
          set -euo pipefail
          generated=verification/artifact-runtime-static-host/generated-workflow.yml
          if test -f "$generated"; then
            echo "generated bridge already exists"
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          target=Path('.github/workflows/artifact-runtime-static-host.yml')
          generated=Path('verification/artifact-runtime-static-host/generated-workflow.yml')
          source=target.read_text(encoding='utf-8')

          def replace(old,new,label):
              global source
              count=source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, observed {count}')
              source=source.replace(old,new)

          replace(
              "      - 'verification/artifact-runtime-static-host/**'\n      - 'verification/artifact-runtime-publication/**'\n      - 'ci.intent.v1.jsonl'",
              "      - 'verification/artifact-runtime-static-host/**'\n      - 'verification/artifact-runtime-publication/**'\n      - 'verification/artifact-runtime-app/**'\n      - 'ci.intent.v1.jsonl'",
              'workflow paths',
          )

          lines=source.splitlines()
          output_indexes=[index for index,line in enumerate(lines) if line.startswith('      tree_id:')]
          if len(output_indexes) != 1:
              raise SystemExit(f'materialize outputs: observed {len(output_indexes)} tree_id lines')
          lines.insert(output_indexes[0]+1, '      expected_files: ' + '$' + '{{ steps.contract.outputs.expected_files }}')
          source='\n'.join(lines)+'\n'

          replace(
              "          s=json.load(open('verification/artifact-runtime-static-host/manifest.json', encoding='utf-8'))\n          p=json.load(open('verification/artifact-runtime-publication/manifest.json', encoding='utf-8'))",
              "          s=json.load(open('verification/artifact-runtime-static-host/manifest.json', encoding='utf-8'))\n          p=json.load(open('verification/artifact-runtime-publication/manifest.json', encoding='utf-8'))\n          a=json.load(open('verification/artifact-runtime-app/manifest.json', encoding='utf-8'))",
              'app manifest load',
          )
          replace(
              "          assert s['schema']=='ops.artifactRuntimeStaticHost/1'\n          assert s['authority'] is False\n          assert s['issue']==160",
              "          assert s['schema']=='ops.artifactRuntimeStaticHost/1'\n          assert s['authority'] is False\n          assert s['issue']==160 and s['appIssue']==193\n          assert p['schema']=='ops.artifactRuntimePublication/1'\n          assert p['authority'] is False and p['status']=='accepted-source' and p['issue']==193\n          assert a['schema']=='ops.artifactRuntimeApp/1'\n          assert a['authority'] is False and a['status']=='accepted-source' and a['issue']==193\n          assert a['id']=='artifact-runtime' and a['version']=='1'",
              'contract identities',
          )
          replace(
              "          assert s['publication']['archive']==p['publication']['archive']\n          assert s['provider']['kind']=='cloudflare-pages'",
              "          assert s['publication']['archive']==p['publication']['archive']\n          assert s['publication']['listedFiles']==p['publication']['listedFiles']\n          app_source=a['sourceAuthorities'][0]\n          assert p['source']['repository']==app_source['repository']\n          assert p['source']['commit']==app_source['commit']\n          assert p['source']['tree']==app_source['tree']\n          app_publication=a['publication']\n          for key in ('treeDigest','kernelDigest','tag','archive','carrier','listedFiles'):\n              assert p['publication'][key]==app_publication[key], key\n          assert p['publication']['capabilities']==len(app_publication['capabilities'])==3\n          assert app_publication['capabilities']==['inspect.json@1','render.a2ui@1','render.a2ui.app@1']\n          assert s['provider']['kind']=='cloudflare-pages'",
              'app closure binding',
          )
          replace(
              "          assert s['readback']['required'] is True and s['readback']['verifyAllFileHashes'] is True\n          values={",
              "          assert s['readback']['required'] is True and s['readback']['verifyAllFileHashes'] is True\n          assert s['readback']['expectedListedFiles']==p['publication']['listedFiles']==53\n          assert s['readback']['browserProof']=={\n            'capability':'render.a2ui.app@1','initialState':0,'nextState':1,\n            'requirements':['click-updates-url','back-restores-state','fresh-open-restores-next-state','reload-preserves-next-state'],\n          }\n          values={",
              'browser proof contract',
          )

          lines=source.splitlines()
          step_indexes=[index for index,line in enumerate(lines) if line == '      - name: Write authoritative provider readback to Issue']
          if len(step_indexes) != 1:
              raise SystemExit(f'provider receipt step: observed {len(step_indexes)}')
          start=step_indexes[0]
          source_indexes=[index for index in range(start,len(lines)) if lines[index].startswith('          SOURCE_SHA:')]
          if len(source_indexes) != 1:
              raise SystemExit(f'provider receipt SOURCE_SHA: observed {len(source_indexes)}')
          lines.insert(source_indexes[0]+1, '          EXPECTED_FILES: ' + '$' + '{{ needs.materialize.outputs.expected_files }}')

          listed_indexes=[index for index,line in enumerate(lines) if 'public listed-file size/SHA readback:' in line]
          if len(listed_indexes) != 1:
              raise SystemExit(f'provider listed-file receipt: observed {len(listed_indexes)}')
          lines[listed_indexes[0]]='          - public listed-file size/SHA readback: **$EXPECTED_FILES/$EXPECTED_FILES PASS**'

          browser_indexes=[index for index,line in enumerate(lines) if 'real public' in line and 'Chrome smoke:' in line]
          if len(browser_indexes) != 1:
              raise SystemExit(f'provider browser receipt: observed {len(browser_indexes)}')
          lines[browser_indexes[0]]='          - real public click → URL → Back → fresh-open/reload Chrome smoke: **PASS**'

          generated.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

          python3 -m py_compile verification/artifact-runtime-static-host/browser_smoke.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$generated"
          git commit -m 'chore: materialize static App workflow bridge'
          git push origin HEAD:${GITHUB_HEAD_REF}
