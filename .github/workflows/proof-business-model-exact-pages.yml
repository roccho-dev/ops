name: Proof exact Mobile Agent App ingress for business-model

on:
  pull_request:
    paths:
      - '.github/workflows/proof-business-model-exact-pages.yml'

permissions:
  contents: read
  issues: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Reconstruct exact accepted App from owner-pinned ingress
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '286'
          CHUNK_PREFIX: 'SEQ-APP-BR/1'
          CHUNK_COUNT: '11'
          BASE64_BYTES: '509996'
          BASE64_SHA256: a45fda69531262da67ba592fa026007107a1605117228bf149ccec64e8e3bd01
          BROTLI_BYTES: '382497'
          BROTLI_SHA256: 4bf71a4ba919ec06c55b65eae31c350fcd2a0a9b091c116f270b7816491c6c97
          APP_BYTES: '2412388'
          APP_SHA256: 3a8db8703aeb78ed2aded4292c554930daf16e6825dd1ccde83fd9bf680408d6
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/proof"; mkdir -p "$root/dist/app" "$root/browser"
          gh api -X GET "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f per_page=100 --paginate --slurp > "$root/comments.json"
          python3 - "$root/comments.json" "$root/app.br.b64" <<'PY'
          import hashlib,json,os,pathlib,re,sys
          pages=json.load(open(sys.argv[1],encoding='utf-8'))
          comments=[comment for page in pages for comment in page]
          owner=os.environ['GITHUB_REPOSITORY_OWNER']; prefix=os.environ['CHUNK_PREFIX']; total=int(os.environ['CHUNK_COUNT'])
          header=re.compile(rf'^{re.escape(prefix)} ([0-9]{{2}})/{total:02d}$')
          chunks={}
          for comment in comments:
              if comment.get('user',{}).get('login') != owner: continue
              body=str(comment.get('body','')).replace('\r\n','\n').strip()
              first,sep,rest=body.partition('\n')
              if not sep: continue
              match=header.fullmatch(first.strip())
              if not match: continue
              payload=re.sub(r'\s+','',rest)
              assert re.fullmatch(r'[A-Za-z0-9+/=]+',payload),match.group(1)
              index=int(match.group(1)); assert 0 <= index < total,index
              assert index not in chunks,f'duplicate chunk {index}'
              chunks[index]=payload
          assert sorted(chunks)==list(range(total)),sorted(chunks)
          joined=''.join(chunks[index] for index in range(total))
          assert len(joined)==int(os.environ['BASE64_BYTES']),len(joined)
          assert hashlib.sha256(joined.encode()).hexdigest()==os.environ['BASE64_SHA256']
          pathlib.Path(sys.argv[2]).write_text(joined,encoding='ascii')
          print(json.dumps({'status':'PASS','chunks':total,'base64Bytes':len(joined),'base64Sha256':hashlib.sha256(joined.encode()).hexdigest()}))
          PY
          base64 --decode "$root/app.br.b64" > "$root/app.br"
          test "$(wc -c < "$root/app.br")" -eq "$BROTLI_BYTES"
          test "$(sha256sum "$root/app.br" | cut -d' ' -f1)" = "$BROTLI_SHA256"
          node -e 'const fs=require("node:fs"),z=require("node:zlib");fs.writeFileSync(process.argv[2],z.brotliDecompressSync(fs.readFileSync(process.argv[1])));' "$root/app.br" "$root/dist/app/index.html"
          test "$(wc -c < "$root/dist/app/index.html")" -eq "$APP_BYTES"
          test "$(sha256sum "$root/dist/app/index.html" | cut -d' ' -f1)" = "$APP_SHA256"
          for marker in graph/1 map/1 seq/1 maxgraph; do grep -Fi "$marker" "$root/dist/app/index.html" >/dev/null; done
      - name: Prove existing Graph Map Seq locally in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/proof"
          npm install --ignore-scripts --no-save --no-audit --no-fund playwright-core@1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$chrome"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$root/dist" >/dev/null 2>&1 &
          server=$!; trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:4173/app/ >/dev/null && break; sleep .2; done
          node verification/mobile-agent-live-bootstrap/smoke.mjs verification/mobile-agent-live-bootstrap/cases.json http://127.0.0.1:4173/ "$chrome" "$root/browser"
          cat "$root/browser/receipt.json"
