name: Proof existing preset App projection reconstruction

on:
  push:
    branches:
      - proof/mobile-agent-preset-projection-reconstruct-260822

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proof controller
        uses: actions/checkout@v4

      - name: Checkout exact existing App projection
        uses: actions/checkout@v4
        with:
          ref: projection/mobile-agent-preset-dist-b0af2ab9
          path: projection
          fetch-depth: 1

      - name: Checkout preset URL fixtures and black-box smoke
        uses: actions/checkout@v4
        with:
          ref: proposal/mobile-agent-preset-url-dod-260821
          path: dod
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Reconstruct and verify exact self-contained App
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/result"
          mkdir -p "$result/dist/app" "$result/proof"
          cat projection/projection/mobile-agent-preset-b0af2ab9/app-index.br.b64.part* > "$RUNNER_TEMP/app-index.br.b64"
          test "$(wc -c < "$RUNNER_TEMP/app-index.br.b64")" -eq 30024
          base64 --decode "$RUNNER_TEMP/app-index.br.b64" > "$RUNNER_TEMP/app-index.br"
          node - "$RUNNER_TEMP/app-index.br" "$result/dist/app/index.html" <<'JS'
          const fs=require('node:fs'); const zlib=require('node:zlib');
          fs.writeFileSync(process.argv[3],zlib.brotliDecompressSync(fs.readFileSync(process.argv[2])));
          JS
          test "$(wc -c < "$result/dist/app/index.html")" -eq 2412388
          test "$(sha256sum "$result/dist/app/index.html" | cut -d' ' -f1)" = 3a8db8703aeb78ed2aded4292c554930daf16e6825dd1ccde83fd9bf680408d6
          grep -F 'graph/1' "$result/dist/app/index.html" >/dev/null
          grep -F 'map/1' "$result/dist/app/index.html" >/dev/null
          grep -F 'seq/1' "$result/dist/app/index.html" >/dev/null
          grep -F 'maxgraph' "$result/dist/app/index.html" >/dev/null
          cp dod/verification/mobile-agent-preset-url-dod/cases.json "$result/cases.json"
          python3 - "$result/dist/app/index.html" "$result/materialization.json" <<'PY'
          import hashlib,json,pathlib,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          value={'schema':'ops.mobileAgentPresetProjectionMaterialization/1','status':'PASS','authority':False,'bytes':len(data),'sha256':'sha256:'+hashlib.sha256(data).hexdigest(),'projectionRef':'projection/mobile-agent-preset-dist-b0af2ab9','implementationRewritten':False}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Prove graph/1 map/1 seq/1 and existing maxGraph UX
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-save --no-audit --no-fund playwright-core@1.55.0
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/result/dist" > "$RUNNER_TEMP/result/http.log" 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:4173/app/ >/dev/null; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:4173/app/ >/dev/null
          node dod/verification/mobile-agent-preset-url-dod/smoke.mjs \
            "$RUNNER_TEMP/result/cases.json" http://127.0.0.1:4173/ "$chrome" "$RUNNER_TEMP/result/proof"
          "$chrome" --version > "$RUNNER_TEMP/result/chrome-version.txt"

      - name: Upload non-authority proof
        uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-preset-projection-reconstruction-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 14
