name: Sys1 completion loop finite comparison

on:
  push:
    branches: [codex/sys1-eval-loop-20261010]
    paths: [.github/workflows/sys1-completion-loop.yml]

permissions:
  contents: read

concurrency:
  group: sys1-completion-eo-20261010
  cancel-in-progress: false

jobs:
  regression:
    if: github.repository == 'roccho-org/ops' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      TRIAL_SOURCE_SHA: dfec78800fb7e3b2cf2b4627632de849f35f818e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dfec78800fb7e3b2cf2b4627632de849f35f818e
          persist-credentials: false
      - name: Check frozen candidate, successful prior comparison and allowance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIAL_SOURCE_SHA"
          test "$(git hash-object experiments/sys1-eval-loop/run.mjs)" = ed26428a6bacbaac693c7ae14023cbbf5555b481
          node --test experiments/sys1-eval-loop/*test.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {loadInput,digest,compare} from './experiments/sys1-eval-loop/run.mjs';
          const root='experiments/sys1-eval-loop',dir=root+'/results/completion-loop/';
          const read=n=>JSON.parse(fs.readFileSync(dir+n+'.json','utf8'));
          const base=read('baseline'),v1=read('binary-eo-v1'),best=read('binary-eo-v2');
          const input=loadInput(root+'/candidates/binary-eo-v2.json');
          assert.equal(base.actualCalls+v1.actualCalls+best.actualCalls,40);
          assert.equal(digest(input.candidate),best.candidateDigest);
          assert.equal(compare(base,best).targetReached,true);
          assert.ok(80-40>=16);
          assert.equal(input.contract.goldOrigin.authorIndependent,false);
          JS
      - name: Original suite regression with unchanged candidate (maximum sixteen requests)
        env:
          TRIAL_SUITE: original
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: node experiments/sys1-eval-loop/split.mjs evaluate binary-eo-v2 "$RUNNER_TEMP/eo-regression"
      - name: Fixed scoring without key
        env:
          TRIAL_SUITE: original
        run: node experiments/sys1-eval-loop/split.mjs score binary-eo-v2 "$RUNNER_TEMP/eo-regression"
      - name: Compact regression evidence and session accounting
        if: always() && !cancelled()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p=process.env.RUNNER_TEMP+'/eo-regression/scored.json';
          const r=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;
          const brief=r?({...r,rows:r.rows.map(x=>({id:x.id,status:x.status,prediction:x.prediction,expected:x.expected,correct:x.correct,model:x.model,usage:x.usage,axes:x.modelTrace?.map(q=>({axis:q.axis,answer:q.answer}))}))}):null;
          console.log('SYS1_REGRESSION_COMPACT '+JSON.stringify({result:brief,previousCalls:40,sessionCalls:r?40+r.actualCalls:null,sessionMax:80,independentHoldout:false}));
          JS
