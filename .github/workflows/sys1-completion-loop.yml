name: Sys1 frozen development evidence

# This session spent its 80-call allowance. Further pushes only verify records.
on:
  push:
    branches: [codex/sys1-eval-loop-20261010]
    paths:
      - experiments/sys1-eval-loop/**
      - .github/workflows/sys1-completion-loop.yml

permissions:
  contents: read

concurrency:
  group: sys1-completion-evidence-20261010
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'roccho-org/ops'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Mechanical tests without model credentials
        run: node --test experiments/sys1-eval-loop/*test.mjs
      - name: Reconcile frozen identities, predictions, Gold and exhausted budget
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {digest,loadInput,compare} from './experiments/sys1-eval-loop/run.mjs';
          import {classify,sessionContract} from './experiments/sys1-eval-loop/split.mjs';
          const root='experiments/sys1-eval-loop';
          const read=p=>fs.readFileSync(path.join(root,p),'utf8');
          const json=p=>JSON.parse(read(p));
          const f=json('results/completion-loop/freeze.json');
          const r=json(f.evidence.path);
          assert.equal(digest(read(f.evidence.path)),f.evidence.sha256);
          const gitBlob=p=>{const b=Buffer.from(read(p));return createHash('sha1').update(Buffer.from(`blob ${b.length}\0`)).update(b).digest('hex');};
          for(const unit of [f.candidate,f.processor,f.scorer,f.providerClient])assert.equal(gitBlob(unit.path),unit.blob);
          assert.equal(digest(json(f.candidate.path)),f.candidate.digest);
          assert.equal(f.gates.issueComplete,false);assert.equal(f.gates.adoptionAuthorized,false);
          assert.equal(f.gates.holdout,'NOT_RUN');assert.equal(f.gates.autonomousResume,'NOT_PROVEN');
          for(const [result,suite] of [[r.role,path.join(root,'suites/role-boundaries')],[r.original,root]]){
            const input=loadInput(path.join(root,f.candidate.path),suite);
            const goldText=fs.readFileSync(path.join(suite,'expected.jsonl'),'utf8');
            const gold=goldText.trim().split('\n').map(JSON.parse);
            assert.equal(digest(goldText),result.goldDigest);
            assert.equal(input.contract.casesSha256,result.casesDigest);
            assert.equal(input.contractDigest,result.inheritedContractDigest);
            assert.equal(digest(sessionContract(input.contract)),result.contractDigest);
            assert.equal(result.sourceSha,f.sourceSha);assert.equal(result.runUrl,f.evidence.runUrl);
            assert.equal(result.candidateDigest,f.candidate.digest);
            assert.deepEqual(result.models,['jev-1.13.0']);
            assert.deepEqual(result.rows.map(x=>x.id),input.cases.map(x=>x.id));
            for(const row of result.rows){
              const c=input.cases.find(c=>c.id===row.id),g=gold.find(g=>g.id===row.id);
              const derived=c.purpose==='historical-record'?'not_applicable':c.complete===false?'unknown':classify(row.E,row.O);
              assert.equal(row.prediction,derived);assert.equal(row.prediction,g.label);assert.equal(row.expected,g.label);
              assert.equal(row.correct,true);assert.equal(row.status,'ok');
              const modeled=c.purpose==='task'&&c.complete;
              assert.equal(row.actualCalls,modeled?2:0);
              assert.equal(row.decisionSource,modeled?'model-eo':'declared-input-rule');
              if(!modeled){assert.equal(row.E,null);assert.equal(row.O,null);assert.equal(row.usage,null);}
            }
            assert.equal(result.correct,result.rows.length);assert.equal(result.total,result.rows.length);
            assert.equal(result.rows.reduce((n,x)=>n+x.actualCalls,0),result.actualCalls);
            for(const k of ['input_tokens','output_tokens'])assert.equal(result.rows.reduce((n,x)=>n+(x.usage?.[k]??0),0),result.usage[k]);
            assert.equal(result.targetReached,true);assert.equal(result.falsePositives,0);assert.equal(result.falseNegatives,0);
            assert.equal(result.errors,0);assert.equal(result.status,'EVALUATED');assert.equal(result.mode,'live');
            assert.equal(result.goldAuthorIndependent,false);assert.equal(result.holdout,'NOT_AVAILABLE');assert.equal(result.cost,null);
          }
          const history=['baseline','binary-eo-v1','binary-eo-v2','binary-eo-v2-original'].map(n=>json('results/completion-loop/'+n+'.json'));
          const previous=history.reduce((n,x)=>n+x.actualCalls,0);
          assert.equal(previous,52);assert.equal(previous,r.previousCalls);
          const all=[...history,r.role,r.original],calls=all.reduce((n,x)=>n+x.actualCalls,0);
          assert.equal(calls,80);assert.equal(calls,r.sessionCalls);assert.equal(calls,f.budget.actualHttpCalls);
          assert.equal(f.budget.remainingHttpCalls,0);assert.equal(f.budget.automaticRefill,false);
          assert.equal(all.reduce((n,x)=>n+x.usage.input_tokens,0),f.budget.inputTokens);
          assert.equal(all.reduce((n,x)=>n+x.usage.output_tokens,0),f.budget.outputTokens);
          assert.deepEqual(compare(history[0],r.role),r.comparison);
          assert.equal(r.independentHoldout,false);assert.equal(r.productionAdoption,false);
          console.log('SYS1_FREEZE_VERIFIED '+JSON.stringify({candidate:f.candidate.digest,developmentCases:r.role.total+r.original.total,modeledCases:14,declaredInputCases:2,sessionCalls:calls,remainingCalls:0,verificationLiveCalls:0,holdout:'NOT_RUN',issueComplete:false}));
          JS
