name: tmp probe exact Mobile Agent Artifact

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-probe-mobile-agent-pages.yml'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Find exact App in unexpired GitHub Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          APP_BYTES: '2412388'
          APP_SHA256: 3a8db8703aeb78ed2aded4292c554930daf16e6825dd1ccde83fd9bf680408d6
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/probe"
          mkdir -p "$root/zips" "$root/exact"
          python3 - "$root" <<'PY'
          import bz2, gzip, hashlib, io, json, lzma, os, pathlib, re, subprocess, tarfile, urllib.request, zipfile

          root=pathlib.Path(__import__('sys').argv[1])
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          expected_bytes=int(os.environ['APP_BYTES'])
          expected_sha=os.environ['APP_SHA256']
          max_expanded=128*1024*1024
          name_filter=re.compile(r'(mobile.?agent|preset|seq|carrier|semantic.?map|smap)',re.I)

          def api_json(path):
              request=urllib.request.Request(
                  'https://api.github.com/'+path,
                  headers={
                      'Accept':'application/vnd.github+json',
                      'Authorization':'Bearer '+token,
                      'X-GitHub-Api-Version':'2022-11-28',
                      'User-Agent':'ops-mobile-agent-artifact-probe/1',
                  },
              )
              with urllib.request.urlopen(request,timeout=120) as response:
                  return json.loads(response.read())

          def artifact_zip(artifact_id):
              target=root/'zips'/f'{artifact_id}.zip'
              with target.open('wb') as output:
                  process=subprocess.run(
                      ['gh','api',f'repos/{repo}/actions/artifacts/{artifact_id}/zip'],
                      stdout=output,stderr=subprocess.PIPE,check=False,
                  )
              if process.returncode:
                  raise RuntimeError(process.stderr.decode(errors='replace'))
              value=target.read_bytes()
              if not zipfile.is_zipfile(target):
                  raise RuntimeError('artifact response is not a ZIP')
              return value

          artifacts=[]
          for page in range(1,101):
              value=api_json(f'repos/{repo}/actions/artifacts?per_page=100&page={page}')
              rows=value.get('artifacts') or []
              artifacts.extend(rows)
              if len(rows)<100: break

          active=[row for row in artifacts if not row.get('expired')]
          candidates=[row for row in active if name_filter.search(str(row.get('name','')))]
          (root/'inventory.json').write_text(json.dumps({
              'schema':'ops.mobileAgentArtifactInventory/1',
              'total':len(artifacts),'active':len(active),'candidates':len(candidates),
              'rows':[{
                  'id':row['id'],'name':row['name'],'size':row['size_in_bytes'],
                  'createdAt':row.get('created_at'),'expiresAt':row.get('expires_at'),
                  'runId':(row.get('workflow_run') or {}).get('id'),
                  'headSha':(row.get('workflow_run') or {}).get('head_sha'),
              } for row in candidates],
          },indent=2,sort_keys=True)+'\n')

          def exact(data):
              return len(data)==expected_bytes and hashlib.sha256(data).hexdigest()==expected_sha

          def inspect(data,label,depth=0):
              if exact(data): return data,label
              if depth>=5 or len(data)>max_expanded: return None
              try:
                  with zipfile.ZipFile(io.BytesIO(data)) as source:
                      for info in source.infolist():
                          if info.is_dir() or info.file_size>max_expanded: continue
                          found=inspect(source.read(info),label+'!/'+info.filename,depth+1)
                          if found: return found
              except (zipfile.BadZipFile,RuntimeError,ValueError): pass
              try:
                  with tarfile.open(fileobj=io.BytesIO(data),mode='r:*') as source:
                      for member in source.getmembers():
                          if not member.isfile() or member.size>max_expanded: continue
                          handle=source.extractfile(member)
                          if handle is None: continue
                          value=handle.read(max_expanded+1)
                          if len(value)>max_expanded: continue
                          found=inspect(value,label+'!/'+member.name,depth+1)
                          if found: return found
              except (tarfile.TarError,EOFError,OSError): pass
              for decoder,suffix in ((gzip.decompress,'!gzip'),(bz2.decompress,'!bz2'),(lzma.decompress,'!xz')):
                  try: value=decoder(data)
                  except Exception: continue
                  if len(value)<=max_expanded:
                      found=inspect(value,label+suffix,depth+1)
                      if found: return found
              return None

          report=[]
          for row in candidates:
              artifact_id=row['id']
              label=f"artifact:{artifact_id}:{row['name']}"
              try:
                  data=artifact_zip(artifact_id)
                  found=inspect(data,label)
                  report.append({'id':artifact_id,'name':row['name'],'zipBytes':len(data),'found':bool(found)})
                  if found:
                      payload,source=found
                      (root/'exact'/'app.index.html').write_bytes(payload)
                      (root/'exact'/'source.json').write_text(json.dumps({
                          'schema':'ops.mobileAgentExactArtifactSource/1',
                          'artifactId':artifact_id,'artifactName':row['name'],
                          'workflowRunId':(row.get('workflow_run') or {}).get('id'),
                          'headSha':(row.get('workflow_run') or {}).get('head_sha'),
                          'sourcePath':source,'appBytes':len(payload),'appSha256':expected_sha,
                      },indent=2,sort_keys=True)+'\n')
                      break
              except Exception as error:
                  report.append({'id':artifact_id,'name':row['name'],'error':repr(error),'found':False})
          (root/'report.json').write_text(json.dumps({'schema':'ops.mobileAgentArtifactProbe/1','rows':report},indent=2,sort_keys=True)+'\n')
          target=root/'exact'/'app.index.html'
          if not target.is_file():
              raise SystemExit('BLOCKED_EXACT_APP_NOT_FOUND_IN_ACTIVE_ARTIFACTS')
          payload=target.read_bytes()
          assert exact(payload)
          print((root/'exact'/'source.json').read_text())
          print('PASS_EXACT_APP_FOUND_IN_GITHUB_ARTIFACT')
          PY

      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-exact-artifact-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/probe/
          if-no-files-found: error
          retention-days: 7
