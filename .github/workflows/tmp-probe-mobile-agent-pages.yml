name: tmp verify Mobile Agent Base32768 tail

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-probe-mobile-agent-pages.yml'

permissions:
  contents: read
  issues: read

jobs:
  verify-tail:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify existing chunk 25 equals the exact local encoding tail
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: SEQ-APP-B32768/1
          INDEX: '25'
          TOTAL: '26'
          EXPECTED_SYMBOLS: '748'
          EXPECTED_UTF8_SHA256: bbacd1d01f2f7ddff9fd5b373005767a3b0c07d16244bbcb32b3fdd1e0d35dba
        shell: bash
        run: |
          set -euo pipefail
          gh api -X GET "repos/$GITHUB_REPOSITORY/issues/286/comments" -f per_page=100 --paginate --slurp > "$RUNNER_TEMP/comments.json"
          python3 - "$RUNNER_TEMP/comments.json" <<'PY'
          import hashlib,json,os,re,sys
          pages=json.load(open(sys.argv[1],encoding='utf-8'))
          comments=[c for page in pages for c in page]
          header=f"{os.environ['PREFIX']} {int(os.environ['INDEX']):02d}/{int(os.environ['TOTAL']):02d}"
          values=[]
          for comment in comments:
              body=str(comment.get('body','')).replace('\r\n','\n').strip()
              first,sep,rest=body.partition('\n')
              if sep and first.strip()==header:
                  values.append(''.join(rest.split()))
          assert values,header
          assert all(value==values[0] for value in values), 'conflicting tail chunks'
          value=values[0]
          observed={'symbols':len(value),'utf8Bytes':len(value.encode()),'utf8Sha256':hashlib.sha256(value.encode()).hexdigest(),'head':value[:8],'tail':value[-8:]}
          assert observed['symbols']==int(os.environ['EXPECTED_SYMBOLS']),observed
          assert observed['utf8Sha256']==os.environ['EXPECTED_UTF8_SHA256'],observed
          print(json.dumps({'status':'PASS_BASE32768_TAIL_IDENTITY',**observed},ensure_ascii=False,sort_keys=True))
          PY
