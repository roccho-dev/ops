name: Mobile Agent business-model public projection

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-agent-business-model-public.yml'
      - 'verification/mobile-agent-business-model-presentation/**'
      - 'verification/mobile-agent-business-model-public/**'
      - 'ci.intent.v1.jsonl'
  push:
    branches: [proposals]
    paths:
      - '.github/workflows/mobile-agent-business-model-public.yml'
      - 'verification/mobile-agent-business-model-presentation/**'
      - 'verification/mobile-agent-business-model-public/**'
      - 'ci.intent.v1.jsonl'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the exact App revision to stg-mobile-agent
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      project: ${{ steps.contract.outputs.project }}
      tag: ${{ steps.pack.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Validate contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,pathlib
          x=json.loads(pathlib.Path('verification/mobile-agent-business-model-public/manifest.json').read_text())
          assert x['schema']=='ops.mobileAgentBusinessModelPublic/1'
          assert x['authority'] is False and x['status']=='candidate'
          assert x['pattern']['id']=='business-model/1'
          assert x['pattern']['actorCount']=={'min':2,'max':4}
          assert x['pattern']['urlLimitChars']==8192
          assert x['baseApp']['preservedPatterns']==['graph/1','map/1','seq/1']
          assert x['baseApp']['preserveExactAcceptedAppHtml'] is True
          assert x['boundaries']['existingMaxGraphAppRewritten'] is False
          assert x['boundaries']['missingReleaseDependencyRetired'] is True
          assert x['boundaries']['issueCommentCarrierRetired'] is True
          assert x['boundaries']['baseProjectionAuthority'] is False
          assert x['boundaries']['newUrlCodec'] is False
          p=x['baseApp']['projection']; h=x['baseApp']['appHtml']
          assert p['kind']=='git-projection-parts' and p['authority'] is False
          assert p['repository']=='roccho-dev/ops'
          assert p['ref']=='projection/mobile-agent-preset-dist-b0af2ab9'
          assert p['codec']=='base64+brotli'
          assert len(p['parts'])==2 and p['joinedBase64Bytes']==30024
          for i,row in enumerate(p['parts']):
              assert row['path'].startswith('projection/mobile-agent-preset-b0af2ab9/app-index.br.b64.part')
              print(f'part{i}_path={row["path"]}')
              print(f'part{i}_blob={row["gitBlob"]}')
              print(f'part{i}_bytes={row["bytes"]}')
          for k,v in {
            'project':x['provider']['project'],
            'stable_base':x['provider']['stableBase'],
            'projection_ref':p['ref'],
            'joined_base64_bytes':p['joinedBase64Bytes'],
            'base_app_bytes':h['bytes'],
            'base_app_sha':h['sha256'],
          }.items(): print(f'{k}={v}')
          PY

      - name: Record source identity
        id: identity
        shell: bash
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prove fixed UI and JSONL
        working-directory: verification/mobile-agent-business-model-presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          CHROMIUM_PATH="$chrome" npm test

      - name: Materialize exact accepted App
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECTION_REF: ${{ steps.contract.outputs.projection_ref }}
          PART0_PATH: ${{ steps.contract.outputs.part0_path }}
          PART0_BYTES: ${{ steps.contract.outputs.part0_bytes }}
          PART1_PATH: ${{ steps.contract.outputs.part1_path }}
          PART1_BYTES: ${{ steps.contract.outputs.part1_bytes }}
          JOINED_BASE64_BYTES: ${{ steps.contract.outputs.joined_base64_bytes }}
          BASE_APP_BYTES: ${{ steps.contract.outputs.base_app_bytes }}
          BASE_APP_SHA: ${{ steps.contract.outputs.base_app_sha }}
          STABLE_BASE: ${{ steps.contract.outputs.stable_base }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          src=verification/mobile-agent-business-model-presentation
          contract=verification/mobile-agent-business-model-public/manifest.json
          site="$RUNNER_TEMP/site"; parts="$RUNNER_TEMP/url-parts"; input="$RUNNER_TEMP/base-app"
          mkdir -p "$site/app" "$site/business-model" "$parts" "$input"

          fetch_content() {
            local ref="$1" path="$2" expected_bytes="$3" out="$4"
            gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$path" -f ref="$ref" --jq .content \
              | tr -d '\n' | base64 --decode > "$out"
            test "$(wc -c < "$out")" -eq "$expected_bytes"
          }
          fetch_content "$PROJECTION_REF" "$PART0_PATH" "$PART0_BYTES" "$input/part00"
          fetch_content "$PROJECTION_REF" "$PART1_PATH" "$PART1_BYTES" "$input/part01"
          cat "$input/part00" "$input/part01" > "$input/app-index.br.b64"
          test "$(wc -c < "$input/app-index.br.b64")" -eq "$JOINED_BASE64_BYTES"
          python3 - "$input/app-index.br.b64" "$input/app-index.br" <<'PY'
          import base64,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          alphabet=set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          transport_noise=set(b' \t\r\n.[]')
          invalid=sorted(set(raw)-alphabet-transport_noise)
          assert not invalid,invalid
          compact=bytes(byte for byte in raw if byte in alphabet)
          assert len(compact)%4==0,len(compact)
          decoded=base64.b64decode(compact,validate=True)
          pathlib.Path(sys.argv[2]).write_bytes(decoded)
          print({'status':'PASS','rawBytes':len(raw),'base64Bytes':len(compact),'discardedTransportNoise':len(raw)-len(compact),'decodedBytes':len(decoded)})
          PY
          node - "$input/app-index.br" "$site/app/index.html" <<'JS'
          const fs=require('node:fs'); const zlib=require('node:zlib');
          fs.writeFileSync(process.argv[3],zlib.brotliDecompressSync(fs.readFileSync(process.argv[2])));
          JS
          test "$(wc -c < "$site/app/index.html")" -eq "$BASE_APP_BYTES"
          test "$(sha256sum "$site/app/index.html" | cut -d' ' -f1)" = "$BASE_APP_SHA"
          for marker in graph/1 map/1 seq/1 maxgraph; do grep -Fi "$marker" "$site/app/index.html" >/dev/null; done

          cp "$src/dist/public/index.html" "$site/business-model/index.html"
          for n in 2 3 4; do
            node "$src/scripts/generate-url.mjs" "$src/examples/$n-actors.jsonl" "${STABLE_BASE}business-model/" "$parts/$n.json"
          done
          python3 - "$site" "$parts" "$contract" "$RUNNER_TEMP" "$SOURCE_SHA" <<'PY'
          import hashlib,json,pathlib,sys
          site,parts,contract,out=map(pathlib.Path,sys.argv[1:5]); source=sys.argv[5]
          urls=[]
          for n in (2,3,4):
              x=json.loads((parts/f'{n}.json').read_text())
              assert x['status']=='PASS' and x['pattern']=='business-model/1'
              assert x['actorCount']==n and x['urlChars']<=8192
              urls.append(x)
          (out/'urls.json').write_text(json.dumps({'schema':'mobile-agent.business-model-public-url-test/1','status':'PASS','results':urls},ensure_ascii=False,indent=2)+'\n')
          files={}
          for p in sorted(x for x in site.rglob('*') if x.is_file()):
              b=p.read_bytes(); files[p.relative_to(site).as_posix()]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          assert sorted(files)==['app/index.html','business-model/index.html']
          rows=[{'path':p,**files[p]} for p in sorted(files)]
          digest=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          expected={'schema':'mobile-agent-business-model-publication/1','fileCount':2,'distTreeDigest':'sha256:'+digest,'files':files}
          (out/'expected.json').write_text(json.dumps(expected,indent=2)+'\n')
          c=json.loads(contract.read_text())
          publication={'schema':'ops.mobileAgentBusinessModelPublication/1','status':'PASS','pass':True,'sourceCommit':source,'pattern':c['pattern'],'baseApp':c['baseApp'],'publication':{'tag':'mobile-agent-business-model-'+digest,'fileCount':2,'distTreeDigest':'sha256:'+digest}}
          (out/'publication.json').write_text(json.dumps(publication,indent=2)+'\n')
          (out/'identity.env').write_text(f'digest={digest}\ntag=mobile-agent-business-model-{digest}\n')
          PY
          . "$RUNNER_TEMP/identity.env"
          archive="mobile-agent-business-model.$digest.tar.gz"; carrier="$archive.b64.txt"
          (cd "$site" && tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - .) | gzip -n > "$RUNNER_TEMP/$archive"
          base64 -w0 "$RUNNER_TEMP/$archive" > "$RUNNER_TEMP/$carrier"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "carrier=$carrier" >> "$GITHUB_OUTPUT"

      - name: Prove combined App in Chrome
        shell: bash
        run: |
          set -euo pipefail
          src=verification/mobile-agent-business-model-presentation
          npm install --ignore-scripts --no-save --no-audit --no-fund playwright-core@1.55.0
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" >/dev/null 2>&1 &
          server=$!; trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:4173/app/ >/dev/null && break; sleep .2; done
          node verification/mobile-agent-live-bootstrap/smoke.mjs verification/mobile-agent-live-bootstrap/cases.json http://127.0.0.1:4173/ "$chrome" "$RUNNER_TEMP/existing-proof"
          python3 - "$RUNNER_TEMP/urls.json" "$RUNNER_TEMP/local-urls.json" <<'PY'
          import json,pathlib,sys
          x=json.load(open(sys.argv[1]))
          for row in x['results']: row['url']=row['url'].replace('https://stg-mobile-agent.pages.dev/','http://127.0.0.1:4173/')
          pathlib.Path(sys.argv[2]).write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
          PY
          CHROMIUM_PATH="$chrome" python3 "$src/tests/e2e/public_host_projection.py" "$RUNNER_TEMP/local-urls.json" "$RUNNER_TEMP/business-proof.json"

      - name: Publish immutable Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pack.outputs.tag }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          CARRIER: ${{ steps.pack.outputs.carrier }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("$RUNNER_TEMP/$ARCHIVE" "$RUNNER_TEMP/$CARRIER" "$RUNNER_TEMP/expected.json" "$RUNNER_TEMP/publication.json" "$RUNNER_TEMP/urls.json" "verification/mobile-agent-business-model-public/manifest.json")
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mobile Agent business-model/1 App revision" --notes "Exact accepted Mobile Agent App HTML plus /business-model/." "${assets[@]}"
          else
            mkdir "$RUNNER_TEMP/release-check"
            for f in "${assets[@]}"; do n="$(basename "$f")"; gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$n" --dir "$RUNNER_TEMP/release-check"; cmp "$f" "$RUNNER_TEMP/release-check/$n"; done
          fi

      - name: Stage and upload App revision
        shell: bash
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/result"; mkdir -p "$r"
          cp -a "$RUNNER_TEMP/site" "$r/dist"
          cp "$RUNNER_TEMP"/{expected.json,publication.json,urls.json,business-proof.json} "$r/"
          cp "$RUNNER_TEMP/existing-proof/receipt.json" "$r/existing-proof.json"
          cp verification/mobile-agent-business-model-public/manifest.json "$r/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-business-model-site-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: materialize
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mobile-agent-business-model-site-${{ github.run_id }}
          path: ${{ runner.temp }}/staged
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Deploy and prove public bytes
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: ${{ needs.materialize.outputs.project }}
          SOURCE_SHA: ${{ needs.materialize.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"; test -n "$CLOUDFLARE_API_TOKEN"; test "$PROJECT" = stg-mobile-agent
          o="$(npx --yes wrangler@4.112.0 pages deploy "$RUNNER_TEMP/staged/dist" --project-name "$PROJECT" --branch proposals --commit-hash "$SOURCE_SHA" --commit-message 'Mobile Agent business-model/1' 2>&1)"
          printf '%s\n' "$o"
          urls="$(printf '%s\n' "$o" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | awk '!seen[$0]++')"
          immutable="$(printf '%s\n' "$urls" | grep -v -F "https://$PROJECT.pages.dev" | head -n1)"; test -n "$immutable"
          stable="https://$PROJECT.pages.dev/"
          python3 - "$RUNNER_TEMP/staged/expected.json" "$stable" "$immutable/" "$RUNNER_TEMP/readback.json" <<'PY'
          import hashlib,json,pathlib,sys,urllib.parse,urllib.request
          e=json.load(open(sys.argv[1])); proof=[]
          for base in sys.argv[2:4]:
              for rel,spec in e['files'].items():
                  with urllib.request.urlopen(urllib.parse.urljoin(base,rel),timeout=45) as r: b=r.read()
                  assert len(b)==spec['bytes'] and hashlib.sha256(b).hexdigest()==spec['sha256']
              proof.append({'base':base,'fileCount':e['fileCount'],'status':'PASS'})
          pathlib.Path(sys.argv[4]).write_text(json.dumps({'schema':'mobile-agent-business-model-readback/1','status':'PASS','proofs':proof},indent=2)+'\n')
          PY
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

      - name: Prove stable public URLs in Chrome
        shell: bash
        run: |
          set -euo pipefail
          src=verification/mobile-agent-business-model-presentation
          npm install --ignore-scripts --no-save --no-audit --no-fund playwright-core@1.55.0
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          base="${{ steps.deploy.outputs.stable }}"
          node verification/mobile-agent-live-bootstrap/smoke.mjs verification/mobile-agent-live-bootstrap/cases.json "$base" "$chrome" "$RUNNER_TEMP/existing-proof"
          python3 - "$RUNNER_TEMP/staged/urls.json" "$RUNNER_TEMP/public-urls.json" "$base" <<'PY'
          import json,pathlib,sys
          x=json.load(open(sys.argv[1]))
          for row in x['results']: row['url']=row['url'].replace('https://stg-mobile-agent.pages.dev/',sys.argv[3])
          pathlib.Path(sys.argv[2]).write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
          PY
          CHROMIUM_PATH="$chrome" python3 "$src/tests/e2e/public_host_projection.py" "$RUNNER_TEMP/public-urls.json" "$RUNNER_TEMP/business-proof.json"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-business-model-deployment-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/readback.json
            ${{ runner.temp }}/existing-proof/
            ${{ runner.temp }}/business-proof.json
            ${{ runner.temp }}/public-urls.json
          if-no-files-found: error
          retention-days: 90
