name: gov package validation

on:
  pull_request:
  push:
    branches: [proposals]
  workflow_dispatch:
    inputs:
      governance_release_tag:
        description: Optional exact content-addressed gov release tag; empty resolves the newest compatible published release
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  contract-selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Run primary flake checks
        run: |
          set -euo pipefail
          log="nix-flake-check.log"
          if ! nix flake check --show-trace --no-write-lock-file >"$log" 2>&1; then
            tail -n 220 "$log" >&2
            exit 1
          fi
          tail -n 80 "$log"
      - name: Upload primary flake check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gov-primary-flake-check-log
          path: nix-flake-check.log
          if-no-files-found: ignore
      - name: Prove exact-release package receipt contracts
        run: |
          set -euo pipefail
          mkdir -p package-receipt-selftests
          nix shell --no-write-lock-file .#ops-package-responses -c \
            ops-package-responses selftest --json \
            > package-receipt-selftests/ops-package-responses.json
          nix shell --no-write-lock-file .#ops-gov-package-output -c \
            ops-gov-package-output selftest --json \
            > package-receipt-selftests/ops-gov-package-output.json
          grep -q '"positive_all_packages": "pass"' package-receipt-selftests/ops-package-responses.json
          grep -q '"failing_required_check": "blocked"' package-receipt-selftests/ops-package-responses.json
          grep -q '"exact_release_tamper": "rejected"' package-receipt-selftests/ops-package-responses.json
          grep -q '"dirty_worktree": "rejected"' package-receipt-selftests/ops-package-responses.json
          grep -q '"wrong_governance_source": "rejected"' package-receipt-selftests/ops-package-responses.json
          grep -q '"organization_active_minted": false' package-receipt-selftests/ops-gov-package-output.json
      - name: Upload package receipt contract proofs
        uses: actions/upload-artifact@v4
        with:
          name: package-receipt-selftests
          path: package-receipt-selftests
          if-no-files-found: error
      - name: Emit README materialization residual
        run: |
          set -euo pipefail
          nix build --no-write-lock-file --impure --expr '
            let
              flake = builtins.getFlake (builtins.toString ./.);
              system = builtins.currentSystem;
              pkgs = flake.inputs.nixpkgs.legacyPackages.${system};
              governanceSrc =
                if builtins.isAttrs flake.inputs.governance && flake.inputs.governance ? outPath
                then flake.inputs.governance.outPath
                else flake.inputs.governance;
              readmeChecks = import (governanceSrc + "/nix/readme-materialization-checks.nix") {
                inherit pkgs governanceSrc;
              };
            in readmeChecks.mkReadmeMaterializationResidual {
              repoId = "roccho-dev/ops";
              mode = "checked-handwritten";
              owner = "roccho-dev/ops";
              reason = "A generated README artifact packet exists, but the committed root README is still independently checked and is not byte-materialized from that artifact.";
              nextAction = "Select the artifact as the root README producer, materialize committed README.md, and switch this residual to mkReadmeMaterializedCheck.";
              returnCondition = "The generated artifact is the declared root README source and its README.md is byte-identical to the committed root README under the governance common checker.";
              expires = "2026-09-30";
            }
          ' -o readme-materialization-out
          mkdir -p readme-materialization-artifact
          cp -L readme-materialization-out/residual.json readme-materialization-artifact/residual.json
          cp -L readme-materialization-out/pass readme-materialization-artifact/pass
          grep -q '"kind":"readmeMaterializationResidual.v1"' readme-materialization-artifact/residual.json
          grep -q '"status":"residual"' readme-materialization-artifact/residual.json
          grep -q '"expires":"2026-09-30"' readme-materialization-artifact/residual.json
      - name: Upload README materialization residual
        uses: actions/upload-artifact@v4
        with:
          name: readme-materialization-residual
          path: readme-materialization-artifact
          if-no-files-found: error

  exact-release-package-receipts:
    needs: contract-selftest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Set exact-release paths
        shell: bash
        run: |
          {
            echo "RELEASE_DIR=$RUNNER_TEMP/exact-gov-release"
            echo "RECEIPT_DIR=$RUNNER_TEMP/ops-gov-package-output"
            echo "RESULT_JSON=$RUNNER_TEMP/ops-gov-package-output.result.json"
            echo "VALIDATION_JSON=$RUNNER_TEMP/ops-gov-package-output.validation.json"
          } >> "$GITHUB_ENV"
      - name: Resolve compatible canonical gov release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.governance_release_tag || '' }}
        run: |
          set -euo pipefail
          required_assets=(
            gov-release-manifest.json
            accepted-decision.json
            gov-engine-descriptor.json
            gov-nix-output-descriptor.json
            gov-release-readback-receipt.json
            gov-package-output.tar.gz
            gov-package-output.tar.gz.sha256
          )
          if test -n "$REQUESTED_TAG"; then
            candidates=("$REQUESTED_TAG")
          else
            mapfile -t candidates < <(
              gh release list                 --repo roccho-dev/governance                 --limit 100                 --json tagName,isDraft,isPrerelease,publishedAt                 --jq 'sort_by(.publishedAt) | reverse | .[] | select(.isDraft == false and .isPrerelease == false) | .tagName'
            )
          fi

          selected=''
          for tag in "${candidates[@]}"; do
            rm -rf "$RUNNER_TEMP/gov-release-candidate"
            mkdir -p "$RUNNER_TEMP/gov-release-candidate"
            compatible=true
            for asset in "${required_assets[@]}"; do
              if ! gh release download "$tag"                 --repo roccho-dev/governance                 --pattern "$asset"                 --dir "$RUNNER_TEMP/gov-release-candidate" >/dev/null 2>&1
              then
                compatible=false
                break
              fi
            done
            if test "$compatible" = true; then
              selected="$tag"
              break
            fi
          done

          test -n "$selected" || {
            echo "compatible-governance-release-not-found" >&2
            exit 1
          }
          RELEASE_TAG="$selected" python3 - <<'PY'
          import os,re
          tag=os.environ['RELEASE_TAG']
          if not re.fullmatch(r'gov-release/[^/]+/[0-9a-f]{64}', tag):
              raise SystemExit('release tag must be exact gov-release/<id>/<64-lowercase-hex-digest>')
          PY
          printf 'RELEASE_TAG=%s\n' "$selected" >> "$GITHUB_ENV"
      - name: Download exact gov release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          for asset in             gov-release-manifest.json             accepted-decision.json             gov-engine-descriptor.json             gov-nix-output-descriptor.json             gov-release-readback-receipt.json             gov-package-output.tar.gz             gov-package-output.tar.gz.sha256
          do
            gh release download "$RELEASE_TAG"               --repo roccho-dev/governance               --pattern "$asset"               --dir "$RELEASE_DIR"
          done
          (cd "$RELEASE_DIR" && sha256sum -c gov-package-output.tar.gz.sha256)
          mkdir "$RELEASE_DIR/gov-package-output"
          python3 - <<'PY'
          import os
          import tarfile
          root=os.environ['RELEASE_DIR']
          with tarfile.open(root+'/gov-package-output.tar.gz', 'r:gz') as archive:
              archive.extractall(root+'/gov-package-output', filter='data')
          PY
          test -s "$RELEASE_DIR/gov-package-output/package-obligations.jsonl"
          governance_commit=$(python3 -c "import json,os; print(json.load(open(os.environ['RELEASE_DIR']+'/gov-engine-descriptor.json'))['commitSha'])")
          test -n "$governance_commit"
          printf 'GOVERNANCE_SOURCE=github:roccho-dev/governance/%s\n' "$governance_commit" >> "$GITHUB_ENV"
      - name: Execute every exact ops package obligation
        run: |
          set -euo pipefail
          nix shell --no-write-lock-file .#ops-gov-package-output -c             ops-gov-package-output execute               --release-dir "$RELEASE_DIR"               --repo-root .               --governance-source "$GOVERNANCE_SOURCE"               --out-dir "$RECEIPT_DIR"               --system x86_64-linux               --json               > "$RESULT_JSON"
          nix shell --no-write-lock-file .#ops-gov-package-output -c             ops-gov-package-output validate               --out-dir "$RECEIPT_DIR"               --strict               --json               > "$VALIDATION_JSON"
          grep -q '"status": "pass"' "$VALIDATION_JSON"
      - name: Upload exact package receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-gov-release-package-receipts
          path: |
            ${{ runner.temp }}/ops-gov-package-output
            ${{ runner.temp }}/ops-gov-package-output.result.json
            ${{ runner.temp }}/ops-gov-package-output.validation.json
          if-no-files-found: ignore
