name: gov package validation

on:
  pull_request:
  push:
    branches: [proposals]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ops-package-response:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Run primary flake checks
        run: |
          set -euo pipefail
          log="nix-flake-check.log"
          if ! nix flake check --show-trace --no-write-lock-file >"$log" 2>&1; then
            tail -n 220 "$log" >&2
            exit 1
          fi
          tail -n 80 "$log"
      - name: Upload primary flake check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gov-primary-flake-check-log
          path: nix-flake-check.log
          if-no-files-found: ignore
      - name: Emit README materialization residual
        run: |
          set -euo pipefail
          nix build --no-write-lock-file --impure --expr '
            let
              flake = builtins.getFlake (builtins.toString ./.);
              system = builtins.currentSystem;
              pkgs = flake.inputs.nixpkgs.legacyPackages.${system};
              governanceSrc =
                if builtins.isAttrs flake.inputs.governance && flake.inputs.governance ? outPath
                then flake.inputs.governance.outPath
                else flake.inputs.governance;
              readmeChecks = import (governanceSrc + "/nix/readme-materialization-checks.nix") {
                inherit pkgs governanceSrc;
              };
            in readmeChecks.mkReadmeMaterializationResidual {
              repoId = "roccho-dev/ops";
              mode = "checked-handwritten";
              owner = "roccho-dev/ops";
              reason = "Root README is currently a checked handwritten artifact, not a generated README artifact.";
              nextAction = "Add an ops generated README artifact and switch this residual to mkReadmeMaterializedCheck.";
              returnCondition = "Root README is generated from a repo-local artifact and can be compared against the committed README by the governance common checker.";
              expires = "2026-08-05";
            }
          ' -o readme-materialization-out
          mkdir -p readme-materialization-artifact
          cp -L readme-materialization-out/residual.json readme-materialization-artifact/residual.json
          cp -L readme-materialization-out/pass readme-materialization-artifact/pass
          grep -q '"kind":"readmeMaterializationResidual.v1"' readme-materialization-artifact/residual.json
          grep -q '"status":"residual"' readme-materialization-artifact/residual.json
          grep -q '"expires":"2026-08-05"' readme-materialization-artifact/residual.json
      - name: Upload README materialization residual
        uses: actions/upload-artifact@v4
        with:
          name: readme-materialization-residual
          path: readme-materialization-artifact
          if-no-files-found: error
      - name: Emit ops package response packet
        run: |
          set -euo pipefail
          nix shell --no-write-lock-file .#ops-package-responses -c \
            ops-package-responses emit --out-dir ops-package-response-out --json
      - name: Validate ops package response packet
        run: |
          set -euo pipefail
          nix shell --no-write-lock-file .#ops-package-responses -c \
            ops-package-responses validate --out-dir ops-package-response-out --json
      - name: Check selected package closure pass
        run: |
          set -euo pipefail
          node tools/check-ops-selected-package-closure.mjs --out-dir ops-package-response-out --json
          test -s ops-package-response-out/selected-package-inventory.jsonl
          test -s ops-package-response-out/selected-package-responses.jsonl
          test -s ops-package-response-out/selected-package-receipts.jsonl
          test -s ops-package-response-out/selected-package-closure.json
      - name: Upload ops package response packet
        uses: actions/upload-artifact@v4
        with:
          name: ops-package-response-packet
          path: ops-package-response-out
          if-no-files-found: error
