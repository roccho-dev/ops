name: One-shot PR309 deployed-byte verification

on:
  push:
    branches:
      - proposal/mobile-agent-business-model-public-260823
    paths:
      - '.github/workflows/pr309-deploy-now.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    if: github.repository == 'roccho-dev/ops' && github.ref == 'refs/heads/proposal/mobile-agent-business-model-public-260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: d9be0aebce95f202c5ae3f1cbc78cfcb10b3bfd4
      STABLE_BASE: https://stg-mobile-agent.pages.dev/
      IMMUTABLE_BASE: https://98c3b352.stg-mobile-agent.pages.dev/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build exact public route
        working-directory: verification/mobile-agent-business-model-presentation
        shell: bash
        run: |
          set -euo pipefail
          npm run build:public
          sha256sum dist/public/index.html
          wc -c dist/public/index.html

      - name: Read back stable and deployment-specific bytes with browser headers
        shell: bash
        run: |
          set -euo pipefail
          src=verification/mobile-agent-business-model-presentation/dist/public/index.html
          expected_sha="$(sha256sum "$src" | cut -d' ' -f1)"
          expected_bytes="$(wc -c < "$src")"
          mkdir -p "$RUNNER_TEMP/readback"
          for kind in stable immutable; do
            if [ "$kind" = stable ]; then base="$STABLE_BASE"; else base="$IMMUTABLE_BASE"; fi
            target="$RUNNER_TEMP/readback/$kind.html"
            for attempt in $(seq 1 30); do
              if curl --http1.1 --fail-with-body --location --silent --show-error \
                --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36' \
                -H 'Accept: text/html,application/xhtml+xml' -H 'Cache-Control: no-cache' \
                "${base}business-model/" -o "$target"; then
                actual_sha="$(sha256sum "$target" | cut -d' ' -f1)"
                actual_bytes="$(wc -c < "$target")"
                if [ "$actual_sha" = "$expected_sha" ] && [ "$actual_bytes" -eq "$expected_bytes" ]; then
                  echo "$kind byte readback PASS $actual_bytes $actual_sha"
                  break
                fi
              fi
              if [ "$attempt" -eq 30 ]; then exit 1; fi
              sleep 2
            done
          done

      - name: Prove all stable and immutable URLs in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          src=verification/mobile-agent-business-model-presentation
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          for kind in stable immutable; do
            if [ "$kind" = stable ]; then base="$STABLE_BASE"; else base="$IMMUTABLE_BASE"; fi
            dir="$RUNNER_TEMP/$kind"; mkdir -p "$dir"
            for actors in 2 3 4; do
              node "$src/scripts/generate-url.mjs" "$src/examples/$actors-actors.jsonl" \
                "${base}business-model/" "$dir/$actors.json" >/dev/null
            done
            python3 - "$dir" "$RUNNER_TEMP/$kind-urls.json" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          rows=[json.loads((root/f'{n}.json').read_text()) for n in (2,3,4)]
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'schema':'mobile-agent.business-model-public-url-test/1','status':'PASS','results':rows},ensure_ascii=False,indent=2)+'\n')
          PY
            CHROMIUM_PATH="$chrome" python3 "$src/tests/e2e/public_host_projection.py" \
              "$RUNNER_TEMP/$kind-urls.json" "$RUNNER_TEMP/$kind-proof.json"
          done

      - name: Report verified URLs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" "$SOURCE_SHA" "$RUNNER_TEMP/comment.md" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); sha=sys.argv[2]; out=pathlib.Path(sys.argv[3])
          stable=json.loads((root/'stable-proof.json').read_text())
          immutable=json.loads((root/'immutable-proof.json').read_text())
          su=json.loads((root/'stable-urls.json').read_text())
          iu=json.loads((root/'immutable-urls.json').read_text())
          assert stable['status']==immutable['status']=='PASS'
          lines=['## business-model/1 deployment PASS','',f'- source: `{sha}`','- stable byte readback: `PASS`','- deployment-specific byte readback: `PASS`','- stable real-Chrome 2/3/4 actor proof: `PASS`','- deployment-specific real-Chrome 2/3/4 actor proof: `PASS`','','Stable URLs:']
          for row in su['results']: lines.append(f"- {row['actorCount']} actors: {row['url']}")
          lines += ['', 'Deployment-specific URLs:']
          for row in iu['results']: lines.append(f"- {row['actorCount']} actors: {row['url']}")
          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          gh pr comment 309 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
