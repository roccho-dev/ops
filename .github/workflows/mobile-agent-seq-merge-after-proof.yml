name: Merge Mobile Agent seq Carrier after proof

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/mobile-agent-seq-carrier.yml'
      - '.github/workflows/mobile-agent-seq-merge-after-proof.yml'
      - 'verification/mobile-agent-seq-carrier/**'

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Wait for the exact seq Carrier proof and merge only on PASS
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100")"
            conclusion="$(jq -r '[.check_runs[] | select(.name == "prove") | .conclusion] | map(select(. != null)) | last // empty' <<<"$checks")"
            if [ "$conclusion" = success ]; then
              gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch=false \
                --subject 'feat: publish and deploy existing seq/1 Carrier' \
                --body 'Exact existing App reconstruction, seq/1 maxGraph, interaction, and browser proof passed. Publish and deploy the same Carrier bytes.'
              exit 0
            fi
            if [ -n "$conclusion" ] && [ "$conclusion" != success ]; then
              echo "seq Carrier proof concluded $conclusion" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'seq Carrier proof did not finish' >&2
          exit 1
