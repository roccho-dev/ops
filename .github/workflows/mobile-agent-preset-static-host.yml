name: Mobile Agent preset static host

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-agent-preset-static-host.yml'
      - '.github/scripts/mobile-agent-preset-static-host/**'
      - 'verification/mobile-agent-preset-app/**'
  push:
    branches: [proposals]
    paths:
      - 'verification/mobile-agent-preset-app/**'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_product: ${{ steps.paths.outputs.run_product }}
    steps:
      - id: paths
        uses: actions/github-script@v7
        with:
          script: |
            let runProduct = false;
            if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.number,
                per_page: 100,
              });
              runProduct = files.some(({ filename }) =>
                filename.startsWith('verification/mobile-agent-preset-app/')
              );
            } else if (context.eventName === 'push') {
              runProduct = true;
            } else if (context.eventName === 'issue_comment') {
              runProduct = context.payload.issue.number === 242
                && context.payload.comment.user.login === context.repo.owner
                && context.payload.comment.body === '/mobile-agent-preset-deploy';
            }
            core.info(JSON.stringify({ event: context.eventName, runProduct }));
            core.setOutput('run_product', runProduct ? 'true' : 'false');

  materialize:
    needs: changes
    if: ${{ needs.changes.outputs.run_product == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      archive_name: ${{ steps.contract.outputs.archive_name }}
      carrier_name: ${{ steps.contract.outputs.carrier_name }}
      project: ${{ steps.contract.outputs.project }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
      tag: ${{ steps.contract.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha || 'proposals' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Validate exact closure
        id: contract
        run: |
          set -euo pipefail
          python3 .github/scripts/mobile-agent-preset-static-host/contract.py >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Materialize immutable dist bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ steps.contract.outputs.archive_name }}
          ARCHIVE_BYTES: ${{ steps.contract.outputs.archive_bytes }}
          ARCHIVE_SHA: ${{ steps.contract.outputs.archive_sha }}
          CARRIER_NAME: ${{ steps.contract.outputs.carrier_name }}
          CARRIER_BYTES: ${{ steps.contract.outputs.carrier_bytes }}
          CARRIER_SHA: ${{ steps.contract.outputs.carrier_sha }}
          TAG: ${{ steps.contract.outputs.tag }}
          BOOTSTRAP_BASE: ${{ steps.contract.outputs.bootstrap_base }}
        run: .github/scripts/mobile-agent-preset-static-host/materialize.sh

      - name: Prove existing preset runtime in Chrome
        if: github.event_name != 'issue_comment'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          CHROME_BIN="$chrome" python3 verification/mobile-agent-preset-app/browser-smoke.py \
            "$RUNNER_TEMP/bootstrap-urls.json" \
            "$RUNNER_TEMP/bootstrap-browser-receipt.json" \
            "$RUNNER_TEMP/bootstrap-shots"

      - name: Stage one deterministic App artifact
        env:
          ARCHIVE_NAME: ${{ steps.contract.outputs.archive_name }}
          CARRIER_NAME: ${{ steps.contract.outputs.carrier_name }}
        run: .github/scripts/mobile-agent-preset-static-host/stage.sh

      - name: Upload staged App
        uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-preset-site-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: materialize
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mobile-agent-preset-site-${{ github.run_id }}
          path: ${{ runner.temp }}/staged
      - name: Publish or verify immutable Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.materialize.outputs.tag }}
          ARCHIVE_NAME: ${{ needs.materialize.outputs.archive_name }}
          CARRIER_NAME: ${{ needs.materialize.outputs.carrier_name }}
        run: .github/scripts/mobile-agent-preset-static-host/publish_release.sh

  deploy:
    needs: materialize
    if: ${{ github.event_name == 'issue_comment' }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mobile-agent-preset-site-${{ github.run_id }}
          path: ${{ runner.temp }}/staged

      - name: Create or verify dedicated Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: ${{ needs.materialize.outputs.project }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$PROJECT" = stg-mobile-agent
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          code="$(curl -sS -o "$RUNNER_TEMP/project.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$api")"
          if [ "$code" = 404 ]; then
            npx --yes wrangler@4.112.0 pages project create "$PROJECT" --production-branch proposals
          elif [ "$code" = 200 ]; then
            python3 - "$RUNNER_TEMP/project.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1]))
          assert value['success'] is True
          assert value['result']['name']=='stg-mobile-agent'
          assert value['result']['production_branch']=='proposals'
          PY
          else
            cat "$RUNNER_TEMP/project.json" >&2
            exit 1
          fi

      - name: Deploy exact root-owned App
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: ${{ needs.materialize.outputs.project }}
          SOURCE_SHA: ${{ needs.materialize.outputs.source_sha }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/staged/dist"
          test -f "$site/app/index.html"
          test -f "$site/protocol/v3/codec.mjs"
          output="$(npx --yes wrangler@4.112.0 pages deploy "$site" --project-name "$PROJECT" --branch proposals --commit-hash "$SOURCE_SHA" --commit-message 'Mobile Agent existing preset App' 2>&1)"
          printf '%s\n' "$output"
          urls="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | awk '!seen[$0]++')"
          deployment="$(printf '%s\n' "$urls" | grep -v -F "https://$PROJECT.pages.dev" | head -n1 || true)"
          test -n "$deployment"
          echo "deployment_base=$deployment/" >> "$GITHUB_OUTPUT"
          echo "stable_base=https://$PROJECT.pages.dev/" >> "$GITHUB_OUTPUT"

      - name: Verify public bytes and interactions
        env:
          SOURCE_SHA: ${{ needs.materialize.outputs.source_sha }}
        run: |
          set -euo pipefail
          root=verification/mobile-agent-preset-app
          site="$RUNNER_TEMP/staged/dist"
          READBACK_RECEIPT="$RUNNER_TEMP/readback-immutable.json" python3 "$root/readback.py" "$site" "${{ steps.deploy.outputs.deployment_base }}" "$RUNNER_TEMP/staged/expected.json" "$RUNNER_TEMP/staged/manifest.json" "$SOURCE_SHA"
          READBACK_RECEIPT="$RUNNER_TEMP/readback-stable.json" python3 "$root/readback.py" "$site" "${{ steps.deploy.outputs.stable_base }}" "$RUNNER_TEMP/staged/expected.json" "$RUNNER_TEMP/staged/manifest.json" "$SOURCE_SHA"
          node "$root/generate-urls.mjs" "$site" "$RUNNER_TEMP/staged/manifest.json" "${{ steps.deploy.outputs.stable_base }}" "$RUNNER_TEMP/stable-urls.json"
          node "$root/generate-urls.mjs" "$site" "$RUNNER_TEMP/staged/manifest.json" "${{ steps.deploy.outputs.deployment_base }}" "$RUNNER_TEMP/immutable-urls.json"
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          CHROME_BIN="$chrome" python3 "$root/browser-smoke.py" "$RUNNER_TEMP/stable-urls.json" "$RUNNER_TEMP/browser-receipt.json" "$RUNNER_TEMP/screenshots"
          "$chrome" --version > "$RUNNER_TEMP/chrome-version.txt"

      - name: Upload and record final proof
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-preset-deployment-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/readback-*.json
            ${{ runner.temp }}/*-urls.json
            ${{ runner.temp }}/browser-receipt.json
            ${{ runner.temp }}/chrome-version.txt
            ${{ runner.temp }}/screenshots/
          if-no-files-found: error
          retention-days: 30

      - name: Return exact URLs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/mobile-agent-preset-static-host/comment.py \
            "$RUNNER_TEMP/stable-urls.json" \
            "$RUNNER_TEMP/immutable-urls.json" > "$RUNNER_TEMP/comment.md"
          gh issue comment 242 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          gh issue comment 233 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
