name: Governance Release root JSONL map proof

on:
  pull_request:
    paths:
      - '.github/workflows/gov-release-proxy-proof.yml'
      - 'packages/gov-release-proxy/**'
      - 'ci.intent.v1.jsonl'
  workflow_dispatch:

permissions:
  contents: read

env:
  UI_REPOSITORY: roccho-dev/ui
  UI_COMMIT: 6fd40d961bd6d2ee9c19a44aeebb2206c3021362
  UI_PATH: apps/root-jsonl-map/index.html

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UI_REPOSITORY }}
          ref: ${{ env.UI_COMMIT }}
          path: root-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Stage exact UI source
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/root-ui/$UI_PATH" packages/gov-release-proxy/public/index.html
          test -s packages/gov-release-proxy/public/index.html
          node "$GITHUB_WORKSPACE/root-ui/apps/root-jsonl-map/check.mjs"
      - name: Unit, destructive and contract checks
        working-directory: packages/gov-release-proxy
        run: npm run check
      - name: Wrangler dry-run with staged UI
        working-directory: packages/gov-release-proxy
        run: npm run check:dry-run
      - name: Prove pinned public source bytes directly
        working-directory: packages/gov-release-proxy
        run: |
          set -euo pipefail
          node - <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { PUBLIC_ROOT_ASSET } from './src/assets.mjs';
          import { upstreamUrl } from './src/worker.mjs';
          const response = await fetch(upstreamUrl(PUBLIC_ROOT_ASSET), {
            headers: { accept: 'application/octet-stream', 'user-agent': 'roccho-dev-ops-root-jsonl-map-proof/1', 'x-github-api-version': '2022-11-28' },
            redirect: 'follow',
          });
          assert.equal(response.status, 200);
          const bytes = Buffer.from(await response.arrayBuffer());
          assert.equal(bytes.length, PUBLIC_ROOT_ASSET.bytes);
          assert.equal(`sha256:${createHash('sha256').update(bytes).digest('hex')}`, PUBLIC_ROOT_ASSET.digest);
          console.log(JSON.stringify({schema:'ops.rootPublicOracleReceipt/1',status:'PASS',bytes:bytes.length,digest:PUBLIC_ROOT_ASSET.digest}));
          NODE

  provider-proof:
    needs: candidate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UI_REPOSITORY }}
          ref: ${{ env.UI_COMMIT }}
          path: root-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Stage exact UI source
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/root-ui/$UI_PATH" packages/gov-release-proxy/public/index.html
          test -s packages/gov-release-proxy/public/index.html
          sha256sum packages/gov-release-proxy/public/index.html | tee "$RUNNER_TEMP/ui-sha256.txt"
      - name: Deploy one-root Worker
        id: deploy
        working-directory: packages/gov-release-proxy
        run: |
          set -uo pipefail
          set +e
          output="$(npx --yes wrangler@4.112.0 deploy 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 0
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -n1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify exact root JSON readback
        working-directory: packages/gov-release-proxy
        run: node scripts/verify-remote.mjs '${{ steps.deploy.outputs.url }}' | tee "$RUNNER_TEMP/root-json-receipt.json"
      - name: Verify hosted UI in real Chromium
        working-directory: packages/gov-release-proxy
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          python3 scripts/verify-root-browser.py \
            '${{ steps.deploy.outputs.url }}' \
            "$RUNNER_TEMP/root-browser-receipt.json" \
            "$RUNNER_TEMP/root-browser.png"
      - name: Stage provider receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          def read(name): return json.loads((root/name).read_text())
          ui=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'root-ui/apps/root-jsonl-map/index.html'
          receipt={
            'schema':'ops.rootJsonlMapProviderReceipt/1',
            'status':'PASS',
            'url':'${{ steps.deploy.outputs.url }}',
            'endpoint':'/',
            'ui':{
              'repository':'roccho-dev/ui',
              'commit':'6fd40d961bd6d2ee9c19a44aeebb2206c3021362',
              'path':'apps/root-jsonl-map/index.html',
              'sha256':'sha256:'+hashlib.sha256(ui.read_bytes()).hexdigest(),
            },
            'jsonReadback':read('root-json-receipt.json'),
            'browser':read('root-browser-receipt.json'),
            'authority':False,
            'cutover':False,
          }
          (root/'root-jsonl-map-provider-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: root-jsonl-map-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/root-json-receipt.json
            ${{ runner.temp }}/root-browser-receipt.json
            ${{ runner.temp }}/root-browser.png
            ${{ runner.temp }}/root-jsonl-map-provider-receipt.json
            ${{ runner.temp }}/ui-sha256.txt
          if-no-files-found: error
          retention-days: 14
