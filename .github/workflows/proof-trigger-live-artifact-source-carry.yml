name: Trigger accepted app-ID Source Carry

on:
  push:
    branches:
      - proof/trigger-live-artifact-source-carry-260821

permissions:
  contents: read
  issues: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post one exact Source Carry request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'proof: source carry artifact-runtime.bidirectional from app ID only in:title' --json number,title --jq '.[] | select(.title=="proof: source carry artifact-runtime.bidirectional from app ID only") | .number' | head -n1)"
          test -n "$issue"
          cat > "$RUNNER_TEMP/request.md" <<'EOF'
          /artifact-app-source-carry
          {"schema":"artifact-app-source-carry/1","app_id":"artifact-runtime.bidirectional","request_id":"artifact-runtime-bidirectional-source-live-260821"}
          EOF
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/request.md"
