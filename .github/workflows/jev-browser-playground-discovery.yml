name: jev-browser-playground-discovery

on:
  push:
    branches:
      - proof/jev-browser-playground-260927

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact proof source
        shell: bash
        env:
          TARGET_OPS_SHA: 821c762edb0a748f40146e7f264b17ba2c228900
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TARGET_OPS_SHA" HEAD
          test "$(git diff --name-only "$TARGET_OPS_SHA" HEAD)" = ".github/workflows/jev-browser-playground-discovery.yml"

      - name: Inspect console with real Chrome without submitting a decision
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/jev-browser-discovery"
          profile="$RUNNER_TEMP/jev-browser-profile"
          mkdir -p "$out" "$profile"
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --version | tee "$out/chrome-version.txt"
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir="$profile" \
            about:blank >"$out/chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do
            if curl --silent --fail http://127.0.0.1:9222/json/version > "$out/version.json"; then
              break
            fi
            sleep 0.25
          done
          test -s "$out/version.json"

          cat > "$out/inspect.mjs" <<'JS'
          import fs from 'node:fs';

          const out = process.argv[2];
          const targets = await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const target = targets.find((value) => value.type === 'page');
          if (!target?.webSocketDebuggerUrl) throw new Error('no page target');

          const ws = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });

          let id = 0;
          const pending = new Map();
          const requests = [];
          const responses = [];
          const consoleEvents = [];
          ws.addEventListener('message', (event) => {
            const value = JSON.parse(event.data);
            if (value.id && pending.has(value.id)) {
              const { resolve, reject } = pending.get(value.id);
              pending.delete(value.id);
              value.error ? reject(new Error(JSON.stringify(value.error))) : resolve(value.result);
              return;
            }
            if (value.method === 'Network.requestWillBeSent') {
              requests.push({
                requestId: value.params.requestId,
                method: value.params.request.method,
                url: value.params.request.url,
                type: value.params.type,
              });
            } else if (value.method === 'Network.responseReceived') {
              responses.push({
                requestId: value.params.requestId,
                status: value.params.response.status,
                mimeType: value.params.response.mimeType,
                url: value.params.response.url,
                type: value.params.type,
              });
            } else if (value.method === 'Runtime.consoleAPICalled' || value.method === 'Runtime.exceptionThrown') {
              consoleEvents.push(value);
            }
          });
          const call = (method, params = {}) => new Promise((resolve, reject) => {
            const callId = ++id;
            pending.set(callId, { resolve, reject });
            ws.send(JSON.stringify({ id: callId, method, params }));
          });

          await call('Page.enable');
          await call('Runtime.enable');
          await call('Network.enable');
          await call('Network.setCacheDisabled', { cacheDisabled: true });
          await call('Emulation.setDeviceMetricsOverride', {
            width: 1440,
            height: 1100,
            deviceScaleFactor: 1,
            mobile: false,
          });
          await call('Page.navigate', { url: 'https://console.typesafe.ai/' });
          await new Promise((resolve) => setTimeout(resolve, 15000));

          const expression = `(() => ({
            url: location.href,
            title: document.title,
            text: document.body?.innerText || '',
            html: document.documentElement?.outerHTML || '',
            links: [...document.querySelectorAll('a')].map(a => ({text:(a.innerText||a.textContent||'').trim(), href:a.href})).filter(x => x.text || x.href),
            buttons: [...document.querySelectorAll('button,[role=button]')].map(b => ({text:(b.innerText||b.textContent||'').trim(), disabled:!!b.disabled, aria:b.getAttribute('aria-label')})),
            inputs: [...document.querySelectorAll('input,textarea,select')].map(i => ({tag:i.tagName,type:i.type,name:i.name,placeholder:i.placeholder,aria:i.getAttribute('aria-label')})),
            forms: [...document.querySelectorAll('form')].map(f => ({action:f.action,method:f.method,text:(f.innerText||'').trim().slice(0,1000)})),
          }))()`;
          const evaluated = await call('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
          const page = evaluated.result.value;
          fs.writeFileSync(`${out}/page.json`, JSON.stringify({ ...page, html: undefined }, null, 2));
          fs.writeFileSync(`${out}/page.html`, page.html);
          fs.writeFileSync(`${out}/network.json`, JSON.stringify({ requests, responses }, null, 2));
          fs.writeFileSync(`${out}/console.json`, JSON.stringify(consoleEvents, null, 2));
          const screenshot = await call('Page.captureScreenshot', { format: 'png', captureBeyondViewport: true });
          fs.writeFileSync(`${out}/page.png`, Buffer.from(screenshot.data, 'base64'));

          const meaningful = requests.filter((value) => /typesafe|systemone|playground|api/i.test(value.url));
          console.log(JSON.stringify({
            url: page.url,
            title: page.title,
            textPreview: page.text.slice(0, 4000),
            buttons: page.buttons.slice(0, 80),
            inputs: page.inputs.slice(0, 80),
            links: page.links.slice(0, 80),
            meaningfulRequests: meaningful.slice(0, 120),
            responseStatuses: responses.filter((value) => meaningful.some((request) => request.requestId === value.requestId)).slice(0, 120),
          }, null, 2));
          ws.close();
          JS
          node "$out/inspect.mjs" "$out" | tee "$out/summary.json"

      - uses: actions/upload-artifact@v4
        with:
          name: jev-browser-playground-discovery
          path: ${{ runner.temp }}/jev-browser-discovery
          if-no-files-found: error
          retention-days: 3
