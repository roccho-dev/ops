name: Laya cold-compile PoC

on:
  pull_request:
    paths:
      - .github/workflows/laya-cold-compile-poc.yml
      - experiments/laya-cold-compile/train.py
      - experiments/laya-cold-compile/evaluate.py

permissions:
  contents: read

jobs:
  train:
    if: github.event.pull_request.number == 432
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/laya-cold-compile
            packages/repo-health/design/cases.jsonl
            packages/repo-health/dag/benchmark/cases.jsonl
            packages/repo-health/dag/benchmark/gold.jsonl
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install laya==0.3.20 transformers==5.17.0 tokenizers==0.23.2 safetensors==0.8.0 huggingface_hub
      - name: Train and select without holdout
        env:
          USE_TF: '0'
          OPS_SHA: ${{ github.event.pull_request.head.sha }}
        run: python experiments/laya-cold-compile/train.py --repo-root . --out "$RUNNER_TEMP/selected"
      - uses: actions/upload-artifact@v4
        with:
          name: laya-cold-compile-selected
          path: ${{ runner.temp }}/selected
          compression-level: 0
          retention-days: 7

  evaluate:
    if: github.event.pull_request.number == 432
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/laya-cold-compile
            packages/parallel-development/tests/cases.jsonl
            packages/parallel-development/tests/expected.jsonl
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install laya==0.3.20 transformers==5.17.0 tokenizers==0.23.2 safetensors==0.8.0 huggingface_hub
      - uses: actions/download-artifact@v4
        with:
          name: laya-cold-compile-selected
          path: ${{ runner.temp }}/selected
      - name: Frozen holdout exactly once
        env:
          USE_TF: '0'
        run: |
          python experiments/laya-cold-compile/evaluate.py \
            --checkpoint "$RUNNER_TEMP/selected" \
            --cases packages/parallel-development/tests/cases.jsonl \
            --expected packages/parallel-development/tests/expected.jsonl \
            --out "$RUNNER_TEMP/evidence"
          cat "$RUNNER_TEMP/evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: laya-cold-compile-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 30
