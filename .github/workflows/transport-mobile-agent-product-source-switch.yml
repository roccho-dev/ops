name: Switch Mobile Agent preset App to exact Git source

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/transport-mobile-agent-product-source-switch.yml'
      - '.github/workflows/transport-mobile-agent-source-authority.yml'
      - '.github/transport/mobile-agent-source-v3.tar.xz.chunk*.b64'

permissions:
  contents: write
  pull-requests: write

jobs:
  switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REF: source/mobile-agent-presets-v1
      PRODUCT_REF: proposal/mobile-agent-preset-static-app-260821
    steps:
      - name: Wait for exact source promotion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          for attempt in $(seq 1 60); do
            commit="$(git ls-remote "$remote" "refs/heads/$SOURCE_REF" | awk 'NR==1 {print $1}')"
            if [ -n "$commit" ]; then printf '%s\n' "$commit" > "$RUNNER_TEMP/source-commit"; exit 0; fi
            sleep 5
          done
          echo "source ref was not promoted" >&2
          exit 1

      - name: Resolve exact source tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          source="$RUNNER_TEMP/source"
          git init --quiet "$source"
          git -C "$source" remote add origin "$remote"
          git -C "$source" fetch --quiet --depth=1 origin "$SOURCE_REF"
          git -C "$source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/source-commit")"
          git -C "$source" rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/source-tree"
          test "$(git -C "$source" rev-list --count HEAD)" = 1
          test -z "$(git -C "$source" status --porcelain)"
          test -f "$source/packages/pattern/view-types/registry.js"
          test -f "$source/build.sh"

      - name: Replace old Worker bootstrap with exact Git build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          product="$RUNNER_TEMP/product"
          git clone --quiet --depth=1 --branch "$PRODUCT_REF" "$remote" "$product"
          commit="$(cat "$RUNNER_TEMP/source-commit")"; tree="$(cat "$RUNNER_TEMP/source-tree")"
          python3 - "$product" "$commit" "$tree" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); commit,tree=sys.argv[2:]
          manifest_path=root/'verification/mobile-agent-preset-app/manifest.json'
          app=json.loads(manifest_path.read_text(encoding='utf-8'))
          source=app['source']['sourceAuthorityCandidate']
          source.update({
            'repository':'roccho-dev/ops','ref':'source/mobile-agent-presets-v1',
            'commit':commit,'tree':tree,'status':'promoted',
            'implementationRewritten':False,'generatedDistIncluded':False,'fullHistoryIncluded':False,
          })
          app['bootstrap']={
            'allowedUntilSourceAuthorityPromotion':False,
            'kind':'retired-after-exact-git-source-promotion',
            'formerBaseUrl':'https://mobile-agent.roccho.workers.dev/',
          }
          manifest_path.write_text(json.dumps(app,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          workflow_path=root/'.github/workflows/mobile-agent-preset-static-host.yml'
          text=workflow_path.read_text(encoding='utf-8')
          old="""            'tag':app['publication']['tag'],
            'bootstrap_base':app['bootstrap']['baseUrl'],
"""
          new="""            'tag':app['publication']['tag'],
            'source_repository':app['source']['sourceAuthorityCandidate']['repository'],
            'source_ref':app['source']['sourceAuthorityCandidate']['ref'],
            'source_commit':app['source']['sourceAuthorityCandidate']['commit'],
            'source_tree':app['source']['sourceAuthorityCandidate']['tree'],
"""
          assert text.count(old)==1
          text=text.replace(old,new)
          old="""          TAG: ${{ steps.contract.outputs.tag }}
          BOOTSTRAP_BASE: ${{ steps.contract.outputs.bootstrap_base }}
"""
          new="""          TAG: ${{ steps.contract.outputs.tag }}
          SOURCE_REPOSITORY: ${{ steps.contract.outputs.source_repository }}
          SOURCE_REF: ${{ steps.contract.outputs.source_ref }}
          SOURCE_COMMIT: ${{ steps.contract.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.contract.outputs.source_tree }}
"""
          assert text.count(old)==1
          text=text.replace(old,new)
          old="""          else
            python3 "$root/bootstrap.py" "$root/expected.json" "$BOOTSTRAP_BASE" "$dist" "$RUNNER_TEMP/bootstrap-receipt.json"
            (cd "$dist" && tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX,go-s' -cf - .) | gzip -n > "$archive"
            test "$(wc -c < "$archive")" -eq "$ARCHIVE_BYTES"
            test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$ARCHIVE_SHA"
            base64 -w0 "$archive" > "$carrier"
            test "$(wc -c < "$carrier")" -eq "$CARRIER_BYTES"
            test "$(sha256sum "$carrier" | cut -d' ' -f1)" = "$CARRIER_SHA"
          fi
"""
          new="""          else
            source="$RUNNER_TEMP/source"
            git clone --quiet --filter=blob:none --no-checkout "https://github.com/$SOURCE_REPOSITORY.git" "$source"
            git -C "$source" fetch --quiet --depth=1 origin "$SOURCE_COMMIT"
            git -C "$source" checkout --quiet --detach "$SOURCE_COMMIT"
            test "$(git -C "$source" rev-parse HEAD)" = "$SOURCE_COMMIT"
            test "$(git -C "$source" rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
            test -z "$(git -C "$source" status --porcelain)"
            if [ -x "$source/verify.sh" ]; then (cd "$source" && ./verify.sh); fi
            (cd "$source" && ./build.sh)
            test -d "$source/dist"
            mkdir "$dist"
            cp -a "$source/dist/." "$dist/"
            python3 - "$SOURCE_REPOSITORY" "$SOURCE_REF" "$SOURCE_COMMIT" "$SOURCE_TREE" "$RUNNER_TEMP/source-build-receipt.json" <<'PY2'
            import json,sys
            value={'schema':'ops.mobileAgentPresetSourceBuildReceipt/1','status':'PASS','authority':False,'repository':sys.argv[1],'ref':sys.argv[2],'commit':sys.argv[3],'tree':sys.argv[4],'sourceCloneUsed':True,'existingBuildUsed':True,'implementationRewritten':False}
            open(sys.argv[5],'w',encoding='utf-8').write(json.dumps(value,sort_keys=True,separators=(',',':'))+'\\n')
            PY2
            (cd "$dist" && tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX,go-s' -cf - .) | gzip -n > "$archive"
            test "$(wc -c < "$archive")" -eq "$ARCHIVE_BYTES"
            test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$ARCHIVE_SHA"
            base64 -w0 "$archive" > "$carrier"
            test "$(wc -c < "$carrier")" -eq "$CARRIER_BYTES"
            test "$(sha256sum "$carrier" | cut -d' ' -f1)" = "$CARRIER_SHA"
          fi
"""
          assert text.count(old)==1
          text=text.replace(old,new)
          old='''          node "$root/generate-urls.mjs" "$dist" "$root/manifest.json" "$BOOTSTRAP_BASE" "$RUNNER_TEMP/bootstrap-urls.json"
'''
          assert text.count(old)==1
          text=text.replace(old,'')
          old="""          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"; test -n "$chrome"
          CHROME_BIN="$chrome" python3 verification/mobile-agent-preset-app/browser-smoke.py "$RUNNER_TEMP/bootstrap-urls.json" "$RUNNER_TEMP/bootstrap-browser-receipt.json" "$RUNNER_TEMP/bootstrap-shots"
"""
          new="""          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/dist" >"$RUNNER_TEMP/http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/app/ >/dev/null && break; sleep 1; done
          node verification/mobile-agent-preset-app/generate-urls.mjs "$RUNNER_TEMP/dist" verification/mobile-agent-preset-app/manifest.json http://127.0.0.1:4173/ "$RUNNER_TEMP/bootstrap-urls.json"
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"; test -n "$chrome"
          CHROME_BIN="$chrome" python3 verification/mobile-agent-preset-app/browser-smoke.py "$RUNNER_TEMP/bootstrap-urls.json" "$RUNNER_TEMP/bootstrap-browser-receipt.json" "$RUNNER_TEMP/bootstrap-shots"
"""
          assert text.count(old)==1
          text=text.replace(old,new)
          text=text.replace('"$RUNNER_TEMP/bootstrap-receipt.json"', '"$RUNNER_TEMP/source-build-receipt.json"')
          text=text.replace('bootstrap-receipt.json bootstrap-browser-receipt.json', 'source-build-receipt.json bootstrap-browser-receipt.json')
          workflow_path.write_text(text,encoding='utf-8')

          bootstrap=root/'verification/mobile-agent-preset-app/bootstrap.py'
          assert bootstrap.is_file(); bootstrap.unlink()
          PY

          git -C "$product" diff --check
          test ! -e "$product/verification/mobile-agent-preset-app/bootstrap.py"
          grep -F 'source/mobile-agent-presets-v1' "$product/verification/mobile-agent-preset-app/manifest.json"
          ! grep -F 'BOOTSTRAP_BASE' "$product/.github/workflows/mobile-agent-preset-static-host.yml"
          ! grep -F 'bootstrap.py' "$product/.github/workflows/mobile-agent-preset-static-host.yml"
          grep -F './build.sh' "$product/.github/workflows/mobile-agent-preset-static-host.yml"
          git -C "$product" config user.name github-actions[bot]
          git -C "$product" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$product" add -A
          git -C "$product" commit --quiet -m 'fix: build preset App from exact Git source'
          git -C "$product" push --quiet origin "$PRODUCT_REF"

      - name: Record source switch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(cat "$RUNNER_TEMP/source-commit")"; tree="$(cat "$RUNNER_TEMP/source-tree")"
          gh pr comment 246 --repo "$GITHUB_REPOSITORY" --body "Exact source authority promoted and PR switched to Git build: \`$commit\` / tree \`$tree\`. The former Worker bootstrap is removed; PR proof now serves the newly built dist locally."
