name: Transport identical duplicate Seq comment fix

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/transport-fix-mobile-agent-seq-identical-duplicates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_BRANCH: fix/mobile-agent-seq-identical-duplicate-comments-260823
      EXPECTED_HEAD: ddff5b7e3c141e536683c1ee1c436c4b9e25e23e
      TARGET_PATH: .github/workflows/mobile-agent-seq-comment-ingress-v2.yml
    steps:
      - name: Apply one fail-closed duplicate normalization change
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          observed="$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk 'NR==1 {print $1}')"
          test "$observed" = "$EXPECTED_HEAD"
          git clone --quiet --depth=1 --branch "$TARGET_BRANCH" "$remote" product
          python3 - product/$TARGET_PATH <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1])
          source=path.read_text(encoding='utf-8')
          old="""              assert index not in chunks,f'duplicate chunk {index}'
              chunks[index]=payload
"""
          new="""              if index in chunks:
                  assert chunks[index] == payload,f'conflicting duplicate chunk {index}'
                  continue
              chunks[index]=payload
"""
          assert source.count(old)==1,source.count(old)
          path.write_text(source.replace(old,new),encoding='utf-8')
          PY
          git -C product diff --check
          test "$(git -C product diff --name-only)" = "$TARGET_PATH"
          test "$(git -C product diff --numstat | awk '{print $1, $2}')" = "3 1"
          grep -F "assert chunks[index] == payload,f'conflicting duplicate chunk {index}'" "product/$TARGET_PATH" >/dev/null
          git -C product config user.name github-actions[bot]
          git -C product config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C product add "$TARGET_PATH"
          git -C product commit --quiet -m 'fix: ignore only identical duplicate Seq chunks'
          git -C product push --quiet origin "$TARGET_BRANCH"
