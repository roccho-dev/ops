name: Prove historical preset maxGraph URLs

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/proof-historical-preset-maxgraph-urls.yml'
      - 'verification/mobile-agent-preset-url-dod/**'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Open exact existing preset URLs in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-save --no-audit --no-fund playwright-core@1.55.0
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          sed \
            -e '/envelope: globalThis.semanticMapRuntime.envelope(),/d' \
            -e '/assert.equal(state.envelope.view.pattern/d' \
            verification/mobile-agent-preset-url-dod/historical-smoke.mjs \
            > verification/mobile-agent-preset-url-dod/historical-smoke-run.mjs
          node verification/mobile-agent-preset-url-dod/historical-smoke-run.mjs \
            verification/mobile-agent-preset-url-dod/cases.json \
            https://ea18b86d.stg-mobile.pages.dev/ \
            "$chrome" \
            /tmp/proof
          "$chrome" --version > /tmp/proof/chrome-version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: historical-preset-maxgraph-urls-${{ github.run_id }}
          path: /tmp/proof/
          if-no-files-found: error
          retention-days: 14
