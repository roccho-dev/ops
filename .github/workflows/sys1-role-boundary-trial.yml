name: Sys1 role-boundary trial

on:
  push:
    branches: [codex/sys1-eval-loop-20261010]
    paths: [.github/workflows/sys1-role-boundary-trial.yml]

permissions:
  contents: read

concurrency:
  group: sys1-role-boundary-baseline-20261010
  cancel-in-progress: false

jobs:
  baseline:
    if: github.repository == 'roccho-org/ops' && github.ref == 'refs/heads/codex/sys1-eval-loop-20261010' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TRIAL_SOURCE_SHA: b763260befd352f1649c0df6ca477867980a718f
      TRIAL_SUITE: role-boundaries
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b763260befd352f1649c0df6ca477867980a718f
          persist-credentials: false

      - name: Verify immutable input and tests without credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIAL_SOURCE_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          node --test experiments/sys1-eval-loop/test.mjs experiments/sys1-eval-loop/suites.test.mjs

      - name: Evaluate unchanged baseline once (maximum eight requests)
        id: live
        continue-on-error: true
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: node experiments/sys1-eval-loop/run.mjs evaluate baseline "$RUNNER_TEMP/sys1-role-boundary-baseline"

      - name: Compare predictions with fixed reference (no model credentials)
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/sys1-role-boundary-baseline/predictions.json" ]; then
            echo 'SYS1_TRIAL_STOP: no predictions; no semantic quality claim'
            exit 1
          fi
          node experiments/sys1-eval-loop/run.mjs score baseline "$RUNNER_TEMP/sys1-role-boundary-baseline"

      - name: Reject masked execution failure
        if: always() && !cancelled()
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: test "$LIVE_OUTCOME" = success
