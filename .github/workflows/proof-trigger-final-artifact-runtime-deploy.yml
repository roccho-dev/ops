name: Trigger final accepted Artifact Runtime deployment

on:
  push:
    branches:
      - proof/trigger-final-artifact-runtime-deploy-260821

permissions:
  contents: read
  issues: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger merged static-host workflow after permanent public proof gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '/artifact-runtime-deploy' > "$RUNNER_TEMP/request.md"
          gh issue comment 160 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/request.md"
