name: hayamimi web release
on:
  pull_request:
    paths:
      - 'packages/hayamimi-web/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'ci.intent.v1.jsonl'
      - '.github/workflows/hayamimi-web-release.yml'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Browser test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.63.0
          python3 -m playwright install --with-deps chromium
      - name: Build consumer-ready Nix artifact
        run: |
          set -euo pipefail
          nix build -L .#hayamimi-web --out-link result-hayamimi-web
          python3 packages/hayamimi-web/build/verify-dist.py result-hayamimi-web
          mkdir -p dist/hayamimi-web
          cp -aL result-hayamimi-web/. dist/hayamimi-web/
          python3 packages/hayamimi-web/build/verify-dist.py dist/hayamimi-web
      - name: Fetch pinned browser fixture
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/hayamimi-fixture"
          rev="$(python3 -c 'import json; print(next(json.loads(x)["revision"] for x in open("packages/hayamimi-web/sources.lock.jsonl") if json.loads(x)["id"] == "hayamimi"))')"
          git init "$fixture"
          git -C "$fixture" remote add origin https://github.com/oboroge0/hayamimi.git
          git -C "$fixture" fetch --depth 1 origin "$rev"
          git -C "$fixture" checkout --detach FETCH_HEAD
          test "$(git -C "$fixture" rev-parse HEAD)" = "$rev"
      - name: Package
        run: |
          set -euo pipefail
          (cd dist && zip -qr hayamimi-web.zip hayamimi-web)
          (cd dist && sha256sum hayamimi-web.zip > hayamimi-web.zip.sha256)
      - name: Verify packaged release
        run: |
          set -euo pipefail
          python3 packages/hayamimi-web/build/verify-release.py \
            dist/hayamimi-web.zip dist/hayamimi-web.zip.sha256 \
            --out "$RUNNER_TEMP/release"
          python3 packages/hayamimi-web/build/verify-dist.py "$RUNNER_TEMP/release/hayamimi-web"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/release/hayamimi-web" >"$RUNNER_TEMP/http.log" 2>&1 &
          server=$!; trap 'kill $server || true' EXIT
          python3 packages/hayamimi-web/tests/browser-asr.py \
            http://127.0.0.1:4173/ \
            "$RUNNER_TEMP/hayamimi-fixture/tests/golden/ja/ja_014.wav" \
            "$RUNNER_TEMP/hayamimi-fixture/tests/golden/ja/golden.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hayamimi-web
          path: |
            dist/hayamimi-web.zip
            dist/hayamimi-web.zip.sha256

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hayamimi-web
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "hayamimi-web-${GITHUB_SHA::12}" \
            dist/hayamimi-web.zip dist/hayamimi-web.zip.sha256 \
            --generate-notes --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
