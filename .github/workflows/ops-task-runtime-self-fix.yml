name: Temporary portable task runtime source repair

on:
  push:
    branches: [proposal/adrs-317-task-runtime-carrier]
    paths:
      - ".github/workflows/ops-task-runtime-self-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/adrs-317-task-runtime-carrier
          fetch-depth: 0

      - name: Remove the redundant same-file checksum copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/ops-task-runtime/ci.sh')
          text = path.read_text(encoding='utf-8')
          line = '  cp "$task_checksums" "$work/task_checksums.txt"\n'
          assert text.count(line) == 1
          path.write_text(text.replace(line, ''), encoding='utf-8')
          PY
          bash -n packages/ops-task-runtime/ci.sh
          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          git add packages/ops-task-runtime/ci.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: reuse fetched go-task checksums file'
          git push origin HEAD:refs/heads/proposal/adrs-317-task-runtime-carrier
