name: mobile-merge10 transport export one-shot

on:
  pull_request:
    branches:
      - proposals
    paths:
      - .github/workflows/proof-hq-vim-runtime-carry.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Export current transport bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-merge10-transport"
          cp -a .github/mobile-merge10-transport/. "$RUNNER_TEMP/mobile-merge10-transport/"
          find "$RUNNER_TEMP/mobile-merge10-transport" -type f -printf '%P\t%s\n' | sort > "$RUNNER_TEMP/FILES.tsv"
          (cd "$RUNNER_TEMP/mobile-merge10-transport" && sha256sum * > "$RUNNER_TEMP/SHA256SUMS")
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-merge10-transport-export-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mobile-merge10-transport/
            ${{ runner.temp }}/FILES.tsv
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
