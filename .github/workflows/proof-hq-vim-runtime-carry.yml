name: Proof actions runner exact Carry

on:
  push:
    branches:
      - proof/browser-host-tool-carry-20260830
    paths:
      - .github/workflows/proof-hq-vim-runtime-carry.yml

permissions:
  contents: read

jobs:
  carry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REPOSITORY: actions/runner
      SOURCE_TAG: v2.337.0
      SOURCE_ASSET: actions-runner-linux-x64-2.337.0.tar.gz
      SOURCE_SHA256: 70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613

    steps:
      - name: Materialize exact runner Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/actions-runner-carry"
          smoke="$RUNNER_TEMP/actions-runner-smoke"
          mkdir -p "$out" "$smoke"

          api_digest="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$SOURCE_TAG" --jq ".assets[] | select(.name == \"$SOURCE_ASSET\") | .digest")"
          test "$api_digest" = "sha256:$SOURCE_SHA256"

          gh release download "$SOURCE_TAG" \
            --repo "$SOURCE_REPOSITORY" \
            --pattern "$SOURCE_ASSET" \
            --dir "$out"
          test "$(sha256sum "$out/$SOURCE_ASSET" | cut -d' ' -f1)" = "$SOURCE_SHA256"

          tar -xzf "$out/$SOURCE_ASSET" -C "$smoke"
          test -x "$smoke/bin/Runner.Listener"
          version="$($smoke/bin/Runner.Listener --version)"
          test "$version" = "2.337.0"
          printf '%s\n' "$version" > "$out/version.txt"

          python3 - "$out/receipt.json" <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "actions-runner-carry"
          receipt = {
              "schema": "ops.actionsRunnerCarry/1",
              "status": "PASS",
              "repository": os.environ["SOURCE_REPOSITORY"],
              "tag": os.environ["SOURCE_TAG"],
              "asset": os.environ["SOURCE_ASSET"],
              "sha256": os.environ["SOURCE_SHA256"],
              "observedVersion": (out / "version.txt").read_text().strip(),
              "registered": False,
          }
          pathlib.Path(os.sys.argv[1]).write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          (cd "$out" && sha256sum "$SOURCE_ASSET" version.txt receipt.json > SHA256SUMS)
          cat "$out/receipt.json"

      - name: Upload exact runner Carry
        uses: actions/upload-artifact@v4
        with:
          name: actions-runner-v2.337.0-linux-x64
          path: ${{ runner.temp }}/actions-runner-carry/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
