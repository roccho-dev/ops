name: mobile-merge10 full transport export one-shot

on:
  pull_request:
    branches:
      - proposals
    paths:
      - .github/workflows/proof-hq-vim-runtime-carry.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Export all mobile-merge10 transport bytes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mobile-merge10-all"
          mkdir -p "$out/github"
          find .github -maxdepth 1 -type d -name 'mobile-merge10-*' -print0 \
            | while IFS= read -r -d '' d; do cp -a "$d" "$out/github/"; done
          find "$out" -type f -printf '%P\t%s\n' | sort > "$out/FILES.tsv"
          (cd "$out" && find github -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-merge10-full-transport-${{ github.sha }}
          path: ${{ runner.temp }}/mobile-merge10-all/
          if-no-files-found: error
          retention-days: 1
