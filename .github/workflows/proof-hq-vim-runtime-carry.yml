name: Proof embedding model exact Carry

on:
  push:
    branches:
      - proof/embedding-model-carry-20260830
    paths:
      - .github/workflows/proof-hq-vim-runtime-carry.yml

permissions:
  contents: read

jobs:
  carry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CRISP_REPO: CrispStrobe/CrispEmbed
      CRISP_TAG: v0.3.1
      CRISP_ASSET: crispembed-linux-x86_64.tar.gz
      CRISP_SHA256: cb40fd0c9aa5836b75c80deef0e8a97866aef28972415db0324dc7f4aa10548d
      HF_REPO: cstr/multilingual-e5-small-GGUF
      HF_COMMIT: 81029b587b49626c84c3104a05f66e7b999a771e
      MODEL: multilingual-e5-small-q4_k.gguf

    steps:
      - name: Materialize exact embedding runtime and model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/embedding-model-carry"
          runtime="$RUNNER_TEMP/embedding-runtime"
          mkdir -p "$out" "$runtime"

          api_digest="$(gh api "repos/$CRISP_REPO/releases/tags/$CRISP_TAG" --jq ".assets[] | select(.name == \"$CRISP_ASSET\") | .digest")"
          test "$api_digest" = "sha256:$CRISP_SHA256"
          gh release download "$CRISP_TAG" --repo "$CRISP_REPO" --pattern "$CRISP_ASSET" --dir "$out"
          test "$(sha256sum "$out/$CRISP_ASSET" | cut -d' ' -f1)" = "$CRISP_SHA256"

          model_url="https://huggingface.co/$HF_REPO/resolve/$HF_COMMIT/$MODEL?download=true"
          curl --fail --location --retry 3 --output "$out/$MODEL" "$model_url"
          test -s "$out/$MODEL"

          tar -xzf "$out/$CRISP_ASSET" -C "$runtime"
          bin="$(find "$runtime" -type f -name crispembed -perm -111 -print -quit)"
          test -n "$bin"
          "$bin" --help > "$out/crispembed.help.txt" 2>&1 || true

          runtime_sha="$(sha256sum "$out/$CRISP_ASSET" | cut -d' ' -f1)"
          model_sha="$(sha256sum "$out/$MODEL" | cut -d' ' -f1)"
          model_bytes="$(stat -c '%s' "$out/$MODEL")"
          printf '%s\n' "$model_sha" > "$out/model.sha256"
          printf '%s\n' "$model_bytes" > "$out/model.bytes"

          python3 - "$out/receipt.json" "$runtime_sha" "$model_sha" "$model_bytes" <<'PY'
          import json, os, pathlib, sys
          receipt = {
              "schema": "ops.embeddingModelCarry/1",
              "status": "PASS",
              "target": "linux-x86_64",
              "runtime": {
                  "repository": os.environ["CRISP_REPO"],
                  "tag": os.environ["CRISP_TAG"],
                  "asset": os.environ["CRISP_ASSET"],
                  "sha256": sys.argv[2],
              },
              "model": {
                  "repository": os.environ["HF_REPO"],
                  "commit": os.environ["HF_COMMIT"],
                  "file": os.environ["MODEL"],
                  "bytes": int(sys.argv[4]),
                  "sha256": sys.argv[3],
              },
              "externalEffect": False,
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          (cd "$out" && sha256sum "$CRISP_ASSET" "$MODEL" crispembed.help.txt receipt.json > SHA256SUMS)
          cat "$out/receipt.json"

      - name: Upload exact embedding Carry
        uses: actions/upload-artifact@v4
        with:
          name: embedding-model-carry-${{ github.run_id }}
          path: ${{ runner.temp }}/embedding-model-carry/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

# second push intentionally triggers the registered branch-local proof workflow
