name: Temporary finalize Issue 115 on latest base

on:
  push:
    branches:
      - feat/ops-115-decision-closure-final-v5
    paths:
      - .github/workflows/tmp-ops115-v5-finalize.yml
  pull_request:
    branches:
      - proposals
    paths:
      - .github/workflows/tmp-ops115-v5-finalize.yml

concurrency:
  group: ops115-v5-finalize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'push' || github.head_ref == 'feat/ops-115-decision-closure-final-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ops-115-decision-closure-final-v5
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Register, verify, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:packages/ops-decision-closure)" = a22043414342518e74cbbb995680d82dc6270e3a
          test "$(git rev-parse HEAD:evidence/ops-115-decision-closure)" = cf70e2501bf6070e5473342e58c9d627e3e8d600
          python3 - <<'PY'
          import json
          from pathlib import Path

          rows_to_add = {
              Path('build/packages.jsonl'): {
                  'bin': 'ops-decision-closure',
                  'deps': ['python'],
                  'entry': 'packages/ops-decision-closure/bin/query.py',
                  'env': [],
                  'kind': 'package',
                  'name': 'ops-decision-closure',
                  'runtime': 'python',
              },
              Path('build/checks.jsonl'): {
                  'deps': ['nodejs', 'python3', 'duckdb', 'git', 'ops-decision-closure'],
                  'kind': 'check',
                  'name': 'ops-decision-closure',
                  'script': 'packages/ops-decision-closure/tests/final-e2e.mjs',
              },
          }
          for path, addition in rows_to_add.items():
              rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
              matches = [row for row in rows if row.get('name') == addition['name']]
              if matches and matches != [addition]:
                  raise SystemExit(f'conflicting row in {path}')
              if not matches:
                  rows.append(addition)
              if len(rows) != len({row['name'] for row in rows}):
                  raise SystemExit(f'duplicate names in {path}')
              path.write_text(''.join(json.dumps(row, sort_keys=True, separators=(',', ':')) + '\n' for row in rows))

          human = json.loads(Path('evidence/ops-115-decision-closure/human-adoption-answerability.json').read_text())
          assert human['mandatoryQuestionCount'] == 9
          assert human['mandatoryQuestionAccuracy'] == 1.0
          assert all(item['visible'] for item in human['results'])
          proof = json.loads(Path('evidence/ops-115-decision-closure/implementation-proof.json').read_text())
          assert proof['status'] == 'PASS_IMPLEMENTATION_READY_FOR_RELEASE'
          assert proof['semanticMismatchCount'] == 0
          assert proof['failClosedMismatchCount'] == 0
          assert proof['humanAI']['literalIndependentHumanReview'] == 'REQUIRED_BEFORE_ISSUE_CLOSE'
          PY
          rm .github/workflows/tmp-ops115-v5-finalize.yml
          git diff --check
          nix flake check --show-trace --no-write-lock-file

      - name: Commit clean candidate
        shell: bash
        env:
          TARGET_BRANCH: feat/ops-115-decision-closure-final-v5
        run: |
          set -euo pipefail
          test ! -e .github/workflows/tmp-ops115-v5-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build/checks.jsonl build/packages.jsonl .github/workflows/tmp-ops115-v5-finalize.yml
          git commit -m "feat: register Issue 115 decision closure"
          git push origin "HEAD:$TARGET_BRANCH"
