name: Mobile Agent Seq ingress v2

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/mobile-agent-seq-ingress-v2.yml'
      - 'verification/mobile-agent-seq-ingress-v2/**'
  push:
    branches: [proposals]
    paths:
      - '.github/workflows/mobile-agent-seq-ingress-v2.yml'
      - 'verification/mobile-agent-seq-ingress-v2/**'

permissions:
  contents: write
  issues: write

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify transport, Carrier, codec and local Seq UX
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash verification/mobile-agent-seq-ingress-v2/prove.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-seq-ingress-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 14

  publish-deploy:
    needs: prove
    if: github.event_name == 'push' && github.ref == 'refs/heads/proposals'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          name: mobile-agent-seq-ingress-${{ github.run_id }}
          path: ${{ runner.temp }}/result
      - name: Publish Carrier, deploy Pages and prove public Seq URLs
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: bash verification/mobile-agent-seq-ingress-v2/deploy.sh
      - uses: actions/upload-artifact@v4
        id: evidence
        with:
          name: mobile-agent-seq-public-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/result/stable-proof/
            ${{ runner.temp }}/result/immutable-proof/
            ${{ runner.temp }}/result/transport-receipt.json
            ${{ runner.temp }}/result/compile-receipt.json
            ${{ runner.temp }}/result/carrier/manifest.json
            ${{ runner.temp }}/result/public-chrome-version.txt
          if-no-files-found: error
          retention-days: 30
      - name: Record only the verified stable Seq URL
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          RELEASE_TAG: ${{ steps.deploy.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          stable="$(cat "$RUNNER_TEMP/result/stable-proof/url.txt")"
          immutable="$(cat "$RUNNER_TEMP/result/immutable-proof/url.txt")"
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          ## Existing seq/1 maxGraph public URL — PASS

          - Seq: $stable
          - immutable: $immutable
          - exact App byte readback: PASS on stable and immutable hosts
          - existing seq/1, maxGraph, Source, handoff, review, edit→undo: PASS
          - browser errors / failed product responses: 0 / 0
          - immutable Carrier: $RELEASE_TAG
          - run: $RUN_URL
          - evidence: $ARTIFACT_ID / $ARTIFACT_DIGEST
          EOF
          for issue in 286 242 233; do
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          done
