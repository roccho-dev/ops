name: issue-116-shiftleft-proof

on:
  push:
    branches:
      - feat/issue-116-shiftleft-admission
    paths:
      - ".github/workflows/issue-116-shiftleft-proof.yml"
      - ".github/bootstrap/issue-116-v2-update.parts/**"
  pull_request:
    branches:
      - proposals
    paths:
      - ".github/workflows/issue-116-shiftleft-proof.yml"
      - ".github/bootstrap/issue-116-v2-update.parts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Verify and materialize the reviewed package capsule
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib
          import shutil
          import tarfile
          import tempfile

          part_dir = pathlib.Path('.github/bootstrap/issue-116-v2-update.parts')
          parts = sorted(part_dir.glob('part-*'))
          if [p.name for p in parts] != ['part-00', 'part-01', 'part-02', 'part-03']:
              raise SystemExit('V2_CARRIER_PART_SET_MISMATCH')

          carrier = b''.join(part.read_bytes() for part in parts)
          if hashlib.sha256(carrier).hexdigest() != '5fc1284e4c89fcbcd2c8907d2275617d670e92159abb7100917a87c75ce066d1':
              raise SystemExit('V2_CARRIER_SHA256_MISMATCH')
          if not carrier.endswith(b'\n') or any(chr(c).isspace() for c in carrier[:-1]):
              raise SystemExit('V2_CARRIER_NOT_STRICT_ONE_LINE_BASE64')

          archive = base64.b64decode(carrier[:-1], validate=True)
          if hashlib.sha256(archive).hexdigest() != '4800479e20c2479bb535b16ef271f85c693a851c57cd0d052890c6577aeb53d1':
              raise SystemExit('V2_ARCHIVE_SHA256_MISMATCH')

          with tempfile.TemporaryDirectory() as td:
              root = pathlib.Path(td)
              tar_path = root / 'update.tar.gz'
              tar_path.write_bytes(archive)
              with tarfile.open(tar_path, 'r:gz') as tf:
                  members = tf.getmembers()
                  if len(members) != 74:
                      raise SystemExit(f'V2_ARCHIVE_ENTRY_COUNT_MISMATCH:{len(members)}')
                  total = 0
                  for member in members:
                      name = member.name
                      while name.startswith('./'):
                          name = name[2:]
                      allowed = (
                          name in ('', '.', '.github', '.github/workflows', 'packages', 'packages/shiftleft-admission')
                          or name == '.github/workflows/issue-116-shiftleft-proof.yml'
                          or name.startswith('packages/shiftleft-admission/')
                      )
                      path = pathlib.PurePosixPath(name or '.')
                      if not allowed:
                          raise SystemExit(f'V2_ARCHIVE_UNEXPECTED_PATH:{member.name}')
                      if path.is_absolute() or '..' in path.parts:
                          raise SystemExit(f'V2_ARCHIVE_UNSAFE_PATH:{member.name}')
                      if member.issym() or member.islnk() or member.isdev():
                          raise SystemExit(f'V2_ARCHIVE_UNSUPPORTED_MEMBER:{member.name}')
                      total += member.size
                  if total > 2 * 1024 * 1024:
                      raise SystemExit('V2_ARCHIVE_UNPACKED_LIMIT_EXCEEDED')
                  tf.extractall(root, filter='data')

              source_package = root / 'packages/shiftleft-admission'
              source_workflow = root / '.github/workflows/issue-116-shiftleft-proof.yml'
              if not source_package.is_dir() or not source_workflow.is_file():
                  raise SystemExit('V2_ARCHIVE_REQUIRED_MEMBER_MISSING')

              destination_package = pathlib.Path('packages/shiftleft-admission')
              if destination_package.exists():
                  shutil.rmtree(destination_package)
              shutil.copytree(source_package, destination_package)

          for part in parts:
              part.unlink()
          part_dir.rmdir()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A packages/shiftleft-admission .github/bootstrap
          git commit -m 'fix: make issue 116 fixture evidence executable'
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
