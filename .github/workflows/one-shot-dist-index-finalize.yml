name: one-shot dist index finalization

on:
  push:
    branches: [bootstrap/dist-index-finalize-20260803]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Rebase, apply, prove, and push the three-PR stack
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC
          git config user.name roccho-dev
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          base64 -d bootstrap/ops-finalize-payload.b64 > /tmp/ops-finalize-payload.tar.gz
          test "$(sha256sum /tmp/ops-finalize-payload.tar.gz | cut -d' ' -f1)" = "d6e5f23cb9d7fb4107d90113ec27facff9029f0a7938e097d49a3d868c5a84c2"
          rm -rf /tmp/ops-finalize-payload /tmp/pr100 /tmp/pr98 /tmp/pr103 /tmp/readback
          mkdir -p /tmp/ops-finalize-payload
          tar -xzf /tmp/ops-finalize-payload.tar.gz -C /tmp/ops-finalize-payload

          git fetch origin \
            proposals \
            feat/python-dist-proof-20260803 \
            feat/excalidraw-dist-split-bundler-20260803 \
            feat/dist-runner-20260803
          test "$(git rev-parse origin/proposals)" = "bfce2f5bd5b34b4105b2dbdc8685488b55967d3c"
          test "$(git rev-parse origin/feat/python-dist-proof-20260803)" = "f9b3f41f0b7e39ab384446648edaa05d7dd098a1"
          test "$(git rev-parse origin/feat/excalidraw-dist-split-bundler-20260803)" = "4b5ee79ac664f34f0c158e32ee0386b7c2f21c54"
          test "$(git rev-parse origin/feat/dist-runner-20260803)" = "87ade39da2a22e0f5f9e02ae8d2f029abca75f77"

          # PR #100: clean rebase onto merged #101 / proposals.
          git worktree add --detach /tmp/pr100 origin/proposals
          git -C /tmp/pr100 checkout origin/feat/python-dist-proof-20260803 -- packages/jsonl-inspect dist/jsonl-inspect
          python3 - <<'PY100'
          import json
          from pathlib import Path
          path=Path('/tmp/pr100/build/packages.jsonl')
          rows=[json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          rows=[row for row in rows if row.get('name') != 'jsonl-inspect']
          rows.append({'kind':'package','name':'jsonl-inspect','runtime':'python','entry':'packages/jsonl-inspect/bin/jsonl-inspect','pythonModule':'jsonl_inspect','pythonPath':'src','bin':'jsonl-inspect','deps':['python3'],'env':[]})
          path.write_text(''.join(json.dumps(row,separators=(',',':'))+'\n' for row in rows))
          PY100
          chmod +x /tmp/pr100/packages/jsonl-inspect/build.sh /tmp/pr100/packages/jsonl-inspect/bin/jsonl-inspect
          cp /tmp/pr100/dist/jsonl-inspect/jsonl-inspect.pyz /tmp/jsonl-committed.pyz
          (cd /tmp/pr100 && packages/jsonl-inspect/build.sh)
          cmp /tmp/jsonl-committed.pyz /tmp/pr100/dist/jsonl-inspect/jsonl-inspect.pyz
          (cd /tmp/pr100 && python3 -m unittest discover -s packages/jsonl-inspect/tests -v)
          git -C /tmp/pr100 add -A
          git -C /tmp/pr100 commit -m "feat(dist): rebase Python zipapp proof onto Rollup base"
          C100="$(git -C /tmp/pr100 rev-parse HEAD)"

          # PR #98: stack on #100 and replace the private bundler with merged Rollup.
          git worktree add --detach /tmp/pr98 "$C100"
          git -C /tmp/pr98 checkout origin/feat/excalidraw-dist-split-bundler-20260803 -- packages/excalidraw
          rm -rf /tmp/pr98/packages/excalidraw/evidence
          rm -f /tmp/pr98/packages/excalidraw/tests/html-to-excalidraw.browser.py
          cp -a /tmp/ops-finalize-payload/packages/excalidraw/. /tmp/pr98/packages/excalidraw/
          chmod +x /tmp/pr98/packages/excalidraw/build.mjs
          rm -rf /tmp/pr98/dist/excalidraw
          mkdir -p /tmp/pr98/dist/excalidraw
          (cd /tmp/pr98 && node packages/excalidraw/build.mjs)
          cp /tmp/pr98/dist/excalidraw/html-to-excalidraw.mjs /tmp/html-to-excalidraw.one.mjs
          cp /tmp/pr98/dist/excalidraw/make-excalidraw-url.mjs /tmp/make-excalidraw-url.one.mjs
          (cd /tmp/pr98 && node packages/excalidraw/build.mjs)
          cmp /tmp/html-to-excalidraw.one.mjs /tmp/pr98/dist/excalidraw/html-to-excalidraw.mjs
          cmp /tmp/make-excalidraw-url.one.mjs /tmp/pr98/dist/excalidraw/make-excalidraw-url.mjs
          (cd /tmp/pr98 && node packages/excalidraw/build.mjs --check)
          (cd /tmp/pr98 && node --test packages/excalidraw/tests/*.test.mjs)
          python3 - <<'PY98'
          import json
          from pathlib import Path
          path=Path('/tmp/pr98/build/checks.jsonl')
          rows=[json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          rows=[row for row in rows if row.get('name') not in {'mjs-dist-audit','mjs-dist-repro','excalidraw-dist'}]
          rows.append({'kind':'check','name':'excalidraw-dist','script':'packages/excalidraw/tests/dist-audit.mjs','deps':['nodejs']})
          path.write_text(''.join(json.dumps(row,separators=(',',':'))+'\n' for row in rows))
          PY98
          git -C /tmp/pr98 add -A
          git -C /tmp/pr98 commit -m "refactor(excalidraw): build split dist with merged Rollup"
          C98="$(git -C /tmp/pr98 rev-parse HEAD)"

          # PR #103: generated index + connector wrapper, stacked on both real consumers.
          git worktree add --detach /tmp/pr103 "$C98"
          rm -rf /tmp/pr103/packages/dist-runner
          cp -a /tmp/ops-finalize-payload/packages/dist-runner /tmp/pr103/packages/dist-runner
          cp /tmp/ops-finalize-payload/packages/jsonl-inspect/dist.json /tmp/pr103/packages/jsonl-inspect/dist.json
          cp /tmp/ops-finalize-payload/packages/mjs-bundler/dist.json /tmp/pr103/packages/mjs-bundler/dist.json
          cp /tmp/ops-finalize-payload/packages/excalidraw/dist.json /tmp/pr103/packages/excalidraw/dist.json
          rm -f /tmp/pr103/dist/catalog.jsonl /tmp/pr103/dist/handoff.json
          chmod +x /tmp/pr103/packages/dist-runner/build.sh /tmp/pr103/packages/dist-runner/bin/dist-runner
          (cd /tmp/pr103 && packages/dist-runner/build.sh)
          (cd /tmp/pr103 && python3 dist/dist-runner/dist-runner.pyz index --repo-root . --write)
          python3 - <<'PY103'
          import json
          from pathlib import Path
          packages=Path('/tmp/pr103/build/packages.jsonl')
          rows=[json.loads(line) for line in packages.read_text().splitlines() if line.strip()]
          rows=[row for row in rows if row.get('name') not in {'jsonl-inspect','dist-runner'}]
          rows.extend([
            {'kind':'package','name':'jsonl-inspect','runtime':'python','entry':'packages/jsonl-inspect/bin/jsonl-inspect','pythonModule':'jsonl_inspect','pythonPath':'src','bin':'jsonl-inspect','deps':['python3'],'env':[]},
            {'kind':'package','name':'dist-runner','runtime':'python','entry':'packages/dist-runner/src/__main__.py','bin':'dist-runner','deps':['python3'],'env':[]},
          ])
          packages.write_text(''.join(json.dumps(row,separators=(',',':'))+'\n' for row in rows))
          checks=Path('/tmp/pr103/build/checks.jsonl')
          checks_rows=[json.loads(line) for line in checks.read_text().splitlines() if line.strip()]
          checks_rows=[row for row in checks_rows if row.get('name') != 'dist-runner']
          checks_rows.append({'kind':'check','name':'dist-runner','script':'packages/dist-runner/tests/e2e.mjs','deps':['nodejs','python3','dist-runner']})
          checks.write_text(''.join(json.dumps(row,separators=(',',':'))+'\n' for row in checks_rows))
          PY103
          (cd /tmp/pr103 && node packages/dist-runner/tests/e2e.mjs)
          (cd /tmp/pr103 && node packages/excalidraw/tests/dist-audit.mjs)
          git -C /tmp/pr103 add -A
          git -C /tmp/pr103 commit -m "feat(dist): generate shift-left index for connector reuse"
          C103="$(git -C /tmp/pr103 rev-parse HEAD)"
          (cd /tmp/pr103 && DIST_EXACT_REF="$C103" node /tmp/ops-finalize-payload/bootstrap/browser-smoke.mjs | tee /tmp/browser-proof.json)
          (cd /tmp/pr103 && nix flake check --show-trace --no-write-lock-file)
          test -z "$(git -C /tmp/pr103 status --porcelain)"

          # Push only after every local and full-repository proof is Green.
          git -C /tmp/pr100 push --force origin "$C100":refs/heads/feat/python-dist-proof-20260803
          git -C /tmp/pr98 push --force origin "$C98":refs/heads/feat/excalidraw-dist-split-bundler-20260803
          git -C /tmp/pr103 push --force origin "$C103":refs/heads/feat/dist-runner-20260803

          # Exact remote readback, not the construction worktree.
          git fetch origin feat/dist-runner-20260803
          test "$(git rev-parse origin/feat/dist-runner-20260803)" = "$C103"
          git worktree add --detach /tmp/readback origin/feat/dist-runner-20260803
          (cd /tmp/readback && node packages/dist-runner/tests/e2e.mjs)
          (cd /tmp/readback && DIST_EXACT_REF="$C103" node /tmp/ops-finalize-payload/bootstrap/browser-smoke.mjs | tee /tmp/readback-browser-proof.json)
          python3 - "$C100" "$C98" "$C103" <<'PYSUMMARY'
          import hashlib, json, pathlib, sys
          c100,c98,c103=sys.argv[1:]
          root=pathlib.Path('/tmp/readback')
          files=[
            'dist/dist-runner/dist-runner.pyz',
            'dist/index.jsonl',
            'dist/jsonl-inspect/jsonl-inspect.pyz',
            'dist/mjs-bundler/bundle.mjs',
            'dist/excalidraw/html-to-excalidraw.mjs',
            'dist/excalidraw/make-excalidraw-url.mjs',
          ]
          identities={}
          for relative in files:
            data=(root/relative).read_bytes()
            identities[relative]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'gitBlobSha1':hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()}
          out={'kind':'ops.distIndex.finalize.v1','ok':True,'generatedIsAuthority':False,'commits':{'pr100':c100,'pr98':c98,'pr103':c103},'files':identities,'browser':json.loads(pathlib.Path('/tmp/readback-browser-proof.json').read_text())}
          pathlib.Path('/tmp/finalize-summary.json').write_text(json.dumps(out,sort_keys=True,separators=(',',':'))+'\n')
          PYSUMMARY
          tar -czf /tmp/ops-dist-index-exact-readback.tar.gz -C /tmp/readback \
            dist/dist-runner/dist-runner.pyz \
            dist/index.jsonl \
            dist/jsonl-inspect/jsonl-inspect.pyz \
            dist/mjs-bundler/bundle.mjs \
            dist/excalidraw/html-to-excalidraw.mjs \
            dist/excalidraw/make-excalidraw-url.mjs \
            packages/dist-runner/dist.json \
            packages/jsonl-inspect/dist.json \
            packages/mjs-bundler/dist.json \
            packages/excalidraw/dist.json
          cat /tmp/finalize-summary.json
      - name: Upload exact-readback proof
        uses: actions/upload-artifact@v4
        with:
          name: ops-dist-index-exact-readback
          path: |
            /tmp/ops-dist-index-exact-readback.tar.gz
            /tmp/finalize-summary.json
            /tmp/browser-proof.json
            /tmp/readback-browser-proof.json
          if-no-files-found: error
