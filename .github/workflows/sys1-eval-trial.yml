name: Sys1 bounded evaluation trial

# New user-authorized finite trial; not the old Issue-comment target grant.
# Source is pinned independently of the workflow commit. No auto retries.
on:
  push:
    branches: [codex/sys1-eval-loop-20261010]
    paths: [.github/workflows/sys1-eval-trial.yml]

permissions:
  contents: read

concurrency:
  group: sys1-eval-trial-baseline-20261010
  cancel-in-progress: false

jobs:
  baseline:
    if: github.repository == 'roccho-org/ops' && github.ref == 'refs/heads/codex/sys1-eval-loop-20261010' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TRIAL_SOURCE_SHA: e2fe5ee1338b88cce1ca75a18a1c227480d9a3f3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e2fe5ee1338b88cce1ca75a18a1c227480d9a3f3
          persist-credentials: false

      - name: Verify pinned source and fixed evaluator without credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIAL_SOURCE_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          node --test experiments/sys1-eval-loop/test.mjs

      - name: Evaluate baseline (only key-bearing step, max eight calls)
        id: live
        continue-on-error: true
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: node experiments/sys1-eval-loop/run.mjs evaluate baseline "$RUNNER_TEMP/sys1-eval-baseline"

      - name: Score against frozen reference labels without model credentials
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/sys1-eval-baseline/predictions.json" ]; then
            echo 'SYS1_TRIAL_STOP: result absent; no quality claim; call count unknown'
            exit 1
          fi
          node experiments/sys1-eval-loop/run.mjs score baseline "$RUNNER_TEMP/sys1-eval-baseline"

      - name: Require an actual completed evaluation, not a masked failure
        if: always() && !cancelled()
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: test "$LIVE_OUTCOME" = success
