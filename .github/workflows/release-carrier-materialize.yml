name: Carrier job materialize

on:
  workflow_dispatch:
    inputs:
      request:
        description: Provider-neutral carrier-job/1 request JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Materialize and self-verify exact sources
        shell: bash
        env:
          REQUEST_JSON: ${{ inputs.request }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/request.json"
          out="$RUNNER_TEMP/carrier-job"
          verified="$RUNNER_TEMP/verified.receipt.json"
          printf '%s' "$REQUEST_JSON" > "$request"
          node packages/chatgpt-capability/ingress/carrier-job.mjs materialize --request "$request" --out "$out"
          node packages/chatgpt-capability/ingress/carrier-job.mjs verify --input "$out" --receipt "$verified"
          cmp "$out/receipt.json" "$verified"

      - name: Upload provider-neutral result directory
        uses: actions/upload-artifact@v4
        with:
          name: carrier-job-${{ github.run_id }}
          path: ${{ runner.temp }}/carrier-job/
          if-no-files-found: error
          retention-days: 30
