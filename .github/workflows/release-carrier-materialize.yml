name: Carrier job materialize

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      request:
        description: Provider-neutral carrier-job/1 request JSON
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  materialize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/carrier-job'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve provider-neutral request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DISPATCH_REQUEST: ${{ inputs.request }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/request.json" <<'PY'
          import json, os, pathlib, sys

          if os.environ["EVENT_NAME"] == "issue_comment":
              body = os.environ.get("COMMENT_BODY", "").replace("\r\n", "\n")
              prefix = "/carrier-job\n"
              if not body.startswith(prefix):
                  raise SystemExit("issue comment must be /carrier-job followed by raw request JSON")
              raw = body[len(prefix):].strip()
          else:
              raw = os.environ.get("DISPATCH_REQUEST", "").strip()

          request = json.loads(raw)
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(request, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Bind authenticated same-repository Release sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bound="$RUNNER_TEMP/authenticated-sources"
          bindings="$RUNNER_TEMP/release-bindings.tsv"
          mkdir -p "$bound"
          python3 - "$RUNNER_TEMP/request.json" "$GITHUB_REPOSITORY" > "$bindings" <<'PY'
          import json, re, sys, urllib.parse

          request = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_repo = sys.argv[2]
          for source in request["sources"]:
              url = urllib.parse.urlsplit(source["url"])
              if url.scheme != "https" or url.netloc != "github.com":
                  continue
              parts = [urllib.parse.unquote(value) for value in url.path.split("/") if value]
              if len(parts) != 6 or parts[2:4] != ["releases", "download"]:
                  continue
              repository = "/".join(parts[:2])
              if repository != expected_repo:
                  continue
              tag, asset = parts[4:]
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,255}", tag):
                  raise SystemExit(f"unsupported same-repository Release tag: {tag}")
              if asset != source["name"]:
                  raise SystemExit(f"Release asset basename does not match source.name: {asset}")
              print("\t".join((tag, asset, source["name"])))
          PY

          while IFS=$'\t' read -r tag asset name; do
            test -n "$tag"
            test ! -e "$bound/$name"
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$bound"
            test -f "$bound/$name"
          done < "$bindings"

      - name: Materialize and self-verify exact sources
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/carrier-job"
          verified="$RUNNER_TEMP/verified.receipt.json"
          node packages/chatgpt-capability/ingress/carrier-job.mjs materialize \
            --request "$RUNNER_TEMP/request.json" --out "$out" \
            --source-dir "$RUNNER_TEMP/authenticated-sources"
          node packages/chatgpt-capability/ingress/carrier-job.mjs verify \
            --input "$out" --receipt "$verified"
          cmp "$out/receipt.json" "$verified"

      - name: Upload provider-neutral result directory
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: carrier-job-${{ github.run_id }}
          path: ${{ runner.temp }}/carrier-job/
          if-no-files-found: error
          retention-days: 30

      - name: Return run and artifact identity to the issue
        if: ${{ always() && github.event_name == 'issue_comment' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUEST_COMMENT_URL: ${{ github.event.comment.html_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/comment.json" "$RUNNER_TEMP/carrier-job/request.json" <<'PY'
          import json, os, pathlib, sys

          request_id = "unknown"
          request_path = pathlib.Path(sys.argv[2])
          if request_path.is_file():
              request_id = json.loads(request_path.read_text(encoding="utf-8")).get("request_id", "unknown")

          artifact_url = os.environ.get("ARTIFACT_URL") or "not-created"
          artifact_id = os.environ.get("ARTIFACT_ID") or "not-created"
          artifact_digest = os.environ.get("ARTIFACT_DIGEST") or "not-created"
          body = "\n".join([
              "## Carrier job result",
              "",
              f"status: `{os.environ['JOB_STATUS']}`",
              f"request-id: `{request_id}`",
              f"carrier-job-run: {os.environ['RUN_URL']}",
              f"carrier-job-artifact: {artifact_url}",
              f"artifact-id: `{artifact_id}`",
              f"artifact-digest: `{artifact_digest}`",
              f"request-comment: {os.environ['REQUEST_COMMENT_URL']}",
          ])
          pathlib.Path(sys.argv[1]).write_text(json.dumps({"body": body}), encoding="utf-8")
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --data-binary @"$RUNNER_TEMP/comment.json" >/dev/null
