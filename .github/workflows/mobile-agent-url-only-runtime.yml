name: Mobile Agent all-models URL runtime

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-agent-url-only-runtime.yml'
      - 'verification/mobile-agent-url-only-runtime/**'
      - 'verification/mobile-agent-business-model-presentation/**'
      - 'verification/mobile-agent-preset-app/**'
  push:
    branches: [proposals]
    paths:
      - '.github/workflows/mobile-agent-url-only-runtime.yml'
      - 'verification/mobile-agent-url-only-runtime/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy and accept the exact candidate
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: read

env:
  ROOT: verification/mobile-agent-url-only-runtime
  PRESET_ROOT: verification/mobile-agent-preset-app
  B32768_PREFIX: SEQ-APP-B32768/1
  B32768_COUNT: '26'
  B32768_SYMBOLS: '200748'
  B32768_UTF8_SHA256: 6b09986c342d5042d11b4f6a21c35898e4ef2f7f9865dad7037e83cabe2d106d
  BZIP2_BYTES: '376401'
  BZIP2_SHA256: 8ffbb263eb701ee4c73a14adb9b806859a3ab55fbc34b24d7d4f306917317a4d
  APP_BYTES: '2412388'
  APP_SHA256: 3a8db8703aeb78ed2aded4292c554930daf16e6825dd1ccde83fd9bf680408d6

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.build.outputs.source_sha }}
      project: ${{ steps.build.outputs.project }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0

      - name: Build business-model runtime
        id: build
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          CHROMIUM_PATH="$chrome" CHROME_BIN="$chrome" python3 "$ROOT/build.py" \
            --source-sha "$(git rev-parse HEAD)" --out "$RUNNER_TEMP/result" --github-output "$GITHUB_OUTPUT"

      - name: Restore exact maxGraph App from audited Base32768 transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/result"
          mkdir -p "$root/site/app"
          gh api -X GET "repos/$GITHUB_REPOSITORY/issues/286/comments" -f per_page=100 --paginate --slurp > "$root/comment-pages.json"
          python3 - "$root/comment-pages.json" "$root/site/app/index.html" "$root/app-source.json" <<'PY'
          import bz2,hashlib,json,os,pathlib,re,sys
          pages=json.load(open(sys.argv[1],encoding='utf-8'))
          comments=[c for page in pages for c in page]
          prefix=os.environ['B32768_PREFIX']; total=int(os.environ['B32768_COUNT'])
          header=re.compile(rf'^{re.escape(prefix)} ([0-9]{{2}})/{total:02d}$')
          chunks={}
          for comment in comments:
              body=str(comment.get('body','')).replace('\r\n','\n').strip()
              first,sep,rest=body.partition('\n')
              if not sep: continue
              m=header.fullmatch(first.strip())
              if not m: continue
              i=int(m.group(1)); payload=''.join(rest.split())
              assert payload and all(0x4E00 <= ord(ch) < 0xCE00 for ch in payload),i
              if i in chunks: assert chunks[i]==payload,f'conflicting chunk {i}'
              chunks[i]=payload
          assert sorted(chunks)==list(range(total)),sorted(chunks)
          joined=''.join(chunks[i] for i in range(total))
          assert len(joined)==int(os.environ['B32768_SYMBOLS'])
          assert hashlib.sha256(joined.encode('utf-8')).hexdigest()==os.environ['B32768_UTF8_SHA256']
          expected=int(os.environ['BZIP2_BYTES']); acc=0; bits=0; raw=bytearray()
          for ch in joined:
              acc=(acc<<15)|(ord(ch)-0x4E00); bits+=15
              while bits>=8 and len(raw)<expected:
                  bits-=8; raw.append((acc>>bits)&0xff); acc &= (1<<bits)-1 if bits else 0
          assert len(raw)==expected and acc==0
          packed=bytes(raw)
          assert hashlib.sha256(packed).hexdigest()==os.environ['BZIP2_SHA256']
          app=bz2.decompress(packed)
          assert len(app)==int(os.environ['APP_BYTES'])
          assert hashlib.sha256(app).hexdigest()==os.environ['APP_SHA256']
          text=app.decode('utf-8')
          for marker in ('graph/1','map/1','seq/1','maxgraph'): assert marker.lower() in text.lower(),marker
          pathlib.Path(sys.argv[2]).write_bytes(app)
          value={'schema':'mobile-agent-exact-app-source/1','status':'PASS','source':'issue-286/base32768','bytes':len(app),'sha256':hashlib.sha256(app).hexdigest()}
          pathlib.Path(sys.argv[3]).write_text(json.dumps(value,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps({'status':'PASS','chunks':total,'appBytes':len(app),'appSha256':value['sha256']}))
          PY

      - name: Validate Carrier-compiled Graph Map Seq URLs
        run: |
          python3 - "$ROOT/preset-render-cases.json" "$PRESET_ROOT/manifest.json" <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1])); m=json.load(open(sys.argv[2])); fixtures={x['id']:x for x in m['fixtures']}
          assert c['status']=='PASS' and c['sourceCarrier']['distTreeDigest']==m['publication']['distTreeDigest']
          assert [x['id'] for x in c['cases']]==['graph','map','seq']
          for x in c['cases']:
              f=fixtures[x['id']]
              assert x['fixtureSha256']==f['sha256'] and x['view']==f['view'] and x['labels']==f['labels']
              assert x['roundTripExact'] is True
          PY

      - name: Prove Graph Map Seq and Business Model locally
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/result/site" >/dev/null 2>&1 & server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:4173/app/ >/dev/null && curl -fsS http://127.0.0.1:4173/business-model/ >/dev/null && break
            sleep .2
          done
          python3 - "$ROOT/preset-render-cases.json" "$RUNNER_TEMP/result/preset-local.json" <<'PY'
          import json,pathlib,sys
          x=json.load(open(sys.argv[1]))
          for row in x['cases']: row['url']=row['url'].replace('https://stg-mobile-agent.pages.dev/','http://127.0.0.1:4173/')
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'cases':x['cases']},ensure_ascii=False)+'\n')
          PY
          CHROME_BIN="$chrome" python3 "$PRESET_ROOT/browser-smoke.py" "$RUNNER_TEMP/result/preset-local.json" "$RUNNER_TEMP/result/preset-local-browser.json" "$RUNNER_TEMP/result/preset-local-shots"
          CHROMIUM_PATH="$chrome" python3 "$ROOT/tests/browser_compiler.py" http://127.0.0.1:4173/ verification/mobile-agent-business-model-presentation/examples "$RUNNER_TEMP/result/business-local-browser.json"
          python3 - "$RUNNER_TEMP/result/preset-local-browser.json" "$RUNNER_TEMP/result/business-local-browser.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2]))
          assert p['status']=='PASS' and [x['pattern'] for x in p['cases']]==['graph/1','map/1','seq/1']
          assert b['urlGeneration']==b['urlRendering']=='PASS' and [x['actorCount'] for x in b['cases']]==[2,3,4]
          print(json.dumps({'status':'PASS','models':['graph/1','map/1','seq/1','business-model/1']}))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-all-models-site-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: materialize
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mobile-agent-all-models-site-${{ github.run_id }}
          path: ${{ runner.temp }}/staged
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0

      - name: Verify Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: ${{ needs.materialize.outputs.project }}
        run: |
          set -euo pipefail
          test "$PROJECT" = stg-mobile-agent
          code="$(curl -sS -o "$RUNNER_TEMP/project.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")"
          test "$code" = 200

      - name: Deploy combined root and prove Business Model
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          CHROMIUM_PATH="$chrome" CHROME_BIN="$chrome" python3 "$ROOT/deploy.py" --staged "$RUNNER_TEMP/staged" --source-sha "${{ needs.materialize.outputs.source_sha }}" --out "$RUNNER_TEMP/public-proof" --github-output "$GITHUB_OUTPUT"

      - name: Prove exact App and Graph Map Seq on stable and immutable hosts
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          for pair in "stable:${{ steps.deploy.outputs.stable_base }}" "immutable:${{ steps.deploy.outputs.deployment_base }}"; do
            name="${pair%%:*}"; base="${pair#*:}"
            curl -fsSL --retry 15 --retry-delay 2 -H 'Cache-Control: no-cache' "${base}app/" -o "$RUNNER_TEMP/public-proof/app-$name.html"
            test "$(wc -c < "$RUNNER_TEMP/public-proof/app-$name.html")" -eq "$APP_BYTES"
            test "$(sha256sum "$RUNNER_TEMP/public-proof/app-$name.html" | cut -d' ' -f1)" = "$APP_SHA256"
            python3 - "$ROOT/preset-render-cases.json" "$RUNNER_TEMP/public-proof/preset-$name-urls.json" "$base" <<'PY'
          import json,pathlib,sys
          x=json.load(open(sys.argv[1])); base=sys.argv[3]
          for row in x['cases']: row['url']=row['url'].replace('https://stg-mobile-agent.pages.dev/',base)
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'cases':x['cases']},ensure_ascii=False)+'\n')
          PY
            CHROME_BIN="$chrome" python3 "$PRESET_ROOT/browser-smoke.py" "$RUNNER_TEMP/public-proof/preset-$name-urls.json" "$RUNNER_TEMP/public-proof/preset-$name-browser.json" "$RUNNER_TEMP/public-proof/preset-$name-shots"
          done

      - name: Build all-model receipt
        run: |
          python3 - "$RUNNER_TEMP/public-proof" <<'PY'
          import json,pathlib,sys
          r=pathlib.Path(sys.argv[1]); b=json.load(open(r/'accepted-public-url-receipt.json')); s=json.load(open(r/'preset-stable-browser.json')); i=json.load(open(r/'preset-immutable-browser.json'))
          sm={x['id']:x for x in s['cases']}; im={x['id']:x for x in i['cases']}; models={}
          for key in ('graph','map','seq'):
              a,c=sm[key],im[key]; assert a['status']==c['status']=='PASS'
              models[a['pattern']]={'status':'PASS','stableUrl':a['url'],'immutableUrl':c['url'],'chrome':'PASS'}
          assert b['status']=='PASS' and [x['actorCount'] for x in b['cases']]==[2,3,4]
          models['business-model/1']={'status':'PASS','stableUrl':b['cases'][0]['stableUrl'],'immutableUrl':b['cases'][0]['immutableUrl'],'chrome':'PASS','actorCases':[2,3,4]}
          out={'schema':'ops.mobileAgentAllModelsPublicReceipt/1','status':'PASS','authority':False,'candidateSha':b['candidateSha'],'provider':b['provider'],'app':{'bytes':int('2412388'),'sha256':'sha256:3a8db8703aeb78ed2aded4292c554930daf16e6825dd1ccde83fd9bf680408d6','stableReadback':'PASS','immutableReadback':'PASS'},'models':models,'proof':{'graph':'PASS','map':'PASS','seq':'PASS','businessModel':'PASS','stableChrome':'PASS','immutableChrome':'PASS'}}
          (r/'all-models-public-receipt.json').write_text(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':'PASS','models':list(models)}))
          PY

      - name: Upload accepted proof
        id: accepted
        uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-all-models-public-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/public-proof/
          if-no-files-found: error
          retention-days: 90

      - name: Advance business-model accepted ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: "$ROOT/advance_accepted_ref.sh $RUNNER_TEMP/public-proof/accepted-public-url-receipt.json ${{ needs.materialize.outputs.source_sha }} ${{ steps.accepted.outputs.artifact-digest }}"
