name: Mobile Agent deploy-once URL runtime

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-agent-url-only-runtime.yml'
      - 'verification/mobile-agent-url-only-runtime/**'
      - 'verification/mobile-agent-business-model-presentation/**'
  push:
    branches: [proposals]
    paths:
      - '.github/workflows/mobile-agent-url-only-runtime.yml'
      - 'verification/mobile-agent-url-only-runtime/**'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved 40-character ops commit SHA
        required: true
        type: string
      deploy:
        description: Deploy and accept the exact candidate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  ROOT: verification/mobile-agent-url-only-runtime

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      source_sha: ${{ steps.build.outputs.source_sha }}
      project: ${{ steps.build.outputs.project }}
      stable_base: ${{ steps.build.outputs.stable_base }}
      tag: ${{ steps.build.outputs.tag }}
      archive: ${{ steps.build.outputs.archive }}
      carrier: ${{ steps.build.outputs.carrier }}
      tree_digest: ${{ steps.build.outputs.tree_digest }}
      file_count: ${{ steps.build.outputs.file_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install fixed toolchain provisioner
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Provision approved tools before any credential use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          runtime="$(nix-build tools/provider-effect-runtime.nix --no-out-link)"
          echo "$runtime/bin" >> "$GITHUB_PATH"
          echo "CHROMIUM_PATH=$runtime/bin/chromium" >> "$GITHUB_ENV"
      - name: Admit exact manual candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Build hosted compiler and prove generated URL renders
        id: build
        shell: bash
        run: |
          set -euo pipefail
          chrome="$CHROMIUM_PATH"
          test -n "$chrome"
          CHROMIUM_PATH="$chrome" python3 "$ROOT/build.py" \
            --source-sha "$(git rev-parse HEAD)" \
            --out "$RUNNER_TEMP/result" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-agent-url-only-runtime-site-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: materialize
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install fixed toolchain provisioner
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Provision approved tools before any credential use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          runtime="$(nix-build tools/provider-effect-runtime.nix --no-out-link)"
          echo "$runtime/bin" >> "$GITHUB_PATH"
          echo "CHROMIUM_PATH=$runtime/bin/chromium" >> "$GITHUB_ENV"
      - name: Verify effect source identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = '${{ needs.materialize.outputs.source_sha }}'
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobile-agent-url-only-runtime-site-${{ github.run_id }}
          path: ${{ runner.temp }}/staged
      - name: Create or verify dedicated Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: ${{ needs.materialize.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"; test -n "$CLOUDFLARE_API_TOKEN"; test "$PROJECT" = stg-mobile-agent
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          code="$(curl -sS -o "$RUNNER_TEMP/project.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$api")"
          if [ "$code" = 404 ]; then
            wrangler pages project create "$PROJECT" --production-branch proposals
          elif [ "$code" = 200 ]; then
            python3 - "$RUNNER_TEMP/project.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['success'] is True; assert x['result']['name']=='stg-mobile-agent'; assert x['result']['production_branch']=='proposals'
          PY
          else
            cat "$RUNNER_TEMP/project.json" >&2
            exit 1
          fi
      - name: Deploy and prove URL generation plus rendering
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chrome="$CHROMIUM_PATH"
          test -n "$chrome"
          CHROMIUM_PATH="$chrome" python3 "$ROOT/deploy.py" \
            --staged "$RUNNER_TEMP/staged" \
            --source-sha "${{ needs.materialize.outputs.source_sha }}" \
            --out "$RUNNER_TEMP/public-proof" \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload accepted proof
        id: accepted
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-agent-business-model-public-url-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/public-proof/
          if-no-files-found: error
          retention-days: 90
      - name: Advance accepted receipt ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$ROOT/advance_accepted_ref.sh" \
            "$RUNNER_TEMP/public-proof/accepted-public-url-receipt.json" \
            "${{ needs.materialize.outputs.source_sha }}" \
            "${{ steps.accepted.outputs.artifact-digest }}"
