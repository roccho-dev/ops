name: Mobile Agent all-models URL runtime

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-agent-url-only-runtime.yml'
      - 'verification/mobile-agent-url-only-runtime/**'
      - 'verification/mobile-agent-business-model-presentation/**'
      - 'verification/mobile-agent-preset-app/**'
  push:
    branches: [proposals]
    paths:
      - '.github/workflows/mobile-agent-url-only-runtime.yml'
      - 'verification/mobile-agent-url-only-runtime/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy and accept the exact candidate
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: read

env:
  ROOT: verification/mobile-agent-url-only-runtime
  PRESET_ROOT: verification/mobile-agent-preset-app

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.build.outputs.source_sha }}
      project: ${{ steps.build.outputs.project }}
      stable_base: ${{ steps.build.outputs.stable_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install browser proof dependency
        run: python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0

      - name: Build business-model runtime
        id: build
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          CHROMIUM_PATH="$chrome" CHROME_BIN="$chrome" python3 "$ROOT/build.py" \
            --source-sha "$(git rev-parse HEAD)" \
            --out "$RUNNER_TEMP/result" \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore exact self-contained maxGraph App
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '286'
          CHUNK_PREFIX: SEQ-APP-BR/1
          CHUNK_COUNT: '11'
          BASE64_BYTES: '509996'
          BASE64_SHA256: a45fda69531262da67ba592fa026007107a1605117228bf149ccec64e8e3bd01
          BROTLI_BYTES: '382497'
          BROTLI_SHA256: 4bf71a4ba919ec06c55b65eae31c350fcd2a0a9b091c116f270b7816491c6c97
          APP_BYTES: '2412388'
          APP_SHA256: 3a8db8703aeb78ed2aded4292c554930daf16e6825dd1ccde83fd9bf680408d6
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/result"
          mkdir -p "$root/site/app"
          gh api -X GET "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f per_page=100 --paginate --slurp > "$root/comment-pages.json"
          python3 - "$root/comment-pages.json" "$root/app.br.b64" <<'PY'
          import hashlib,json,os,pathlib,re,sys
          pages=json.load(open(sys.argv[1],encoding='utf-8'))
          comments=[comment for page in pages for comment in page] if pages and isinstance(pages[0],list) else pages
          owner=os.environ['GITHUB_REPOSITORY_OWNER']
          prefix=re.escape(os.environ['CHUNK_PREFIX'])
          total=int(os.environ['CHUNK_COUNT'])
          pattern=re.compile(rf'^{prefix} ([0-9]{{2}})/{total:02d}\n([A-Za-z0-9+/=]+)$')
          chunks={}
          for comment in comments:
              if comment.get('user',{}).get('login') != owner: continue
              match=pattern.fullmatch(str(comment.get('body','')).strip())
              if not match: continue
              index=int(match.group(1)); piece=match.group(2)
              assert 0 <= index < total
              if index in chunks: assert chunks[index] == piece, f'conflicting chunk {index}'
              else: chunks[index]=piece
          assert sorted(chunks)==list(range(total)), sorted(chunks)
          joined=''.join(chunks[index] for index in range(total))
          assert len(joined)==int(os.environ['BASE64_BYTES'])
          assert hashlib.sha256(joined.encode()).hexdigest()==os.environ['BASE64_SHA256']
          pathlib.Path(sys.argv[2]).write_text(joined,encoding='ascii')
          print(json.dumps({'status':'PASS','chunks':total,'base64Bytes':len(joined)}))
          PY
          base64 --decode "$root/app.br.b64" > "$root/app.br"
          test "$(wc -c < "$root/app.br")" -eq "$BROTLI_BYTES"
          test "$(sha256sum "$root/app.br" | cut -d' ' -f1)" = "$BROTLI_SHA256"
          node -e 'const fs=require("node:fs"),zlib=require("node:zlib");fs.writeFileSync(process.argv[2],zlib.brotliDecompressSync(fs.readFileSync(process.argv[1])));' \
            "$root/app.br" "$root/site/app/index.html"
          test "$(wc -c < "$root/site/app/index.html")" -eq "$APP_BYTES"
          test "$(sha256sum "$root/site/app/index.html" | cut -d' ' -f1)" = "$APP_SHA256"
          grep -F 'graph/1' "$root/site/app/index.html" >/dev/null
          grep -F 'map/1' "$root/site/app/index.html" >/dev/null
          grep -F 'seq/1' "$root/site/app/index.html" >/dev/null
          grep -Fi 'maxgraph' "$root/site/app/index.html" >/dev/null

      - name: Validate Carrier-compiled Graph Map Seq URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$ROOT/preset-render-cases.json" "$PRESET_ROOT/manifest.json" <<'PY'
          import json,sys
          cases=json.load(open(sys.argv[1],encoding='utf-8'))
          manifest=json.load(open(sys.argv[2],encoding='utf-8'))
          assert cases['schema']=='mobile-agent-preset-render-cases/1' and cases['status']=='PASS'
          assert cases['sourceCarrier']['distTreeDigest']==manifest['publication']['distTreeDigest']
          by_id={x['id']:x for x in manifest['fixtures']}
          assert [x['id'] for x in cases['cases']]==['graph','map','seq']
          for row in cases['cases']:
              expected=by_id[row['id']]
              assert row['fixtureSha256']==expected['sha256']
              assert row['view']==expected['view']
              assert row['labels']==expected['labels']
              assert row['roundTripExact'] is True
              assert row['url'].startswith('https://stg-mobile-agent.pages.dev/app#smap=')
          print(json.dumps({'status':'PASS','patterns':[x['view']['pattern'] for x in cases['cases']]}))
          PY

      - name: Prove all models coexist locally
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/result/site" >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:4173/app/ >/dev/null && curl -fsS http://127.0.0.1:4173/business-model/ >/dev/null; then break; fi
            sleep .2
          done
          python3 - "$ROOT/preset-render-cases.json" "$RUNNER_TEMP/result/preset-local-urls.json" <<'PY'
          import json,pathlib,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          for row in value['cases']:
              row['url']=row['url'].replace('https://stg-mobile-agent.pages.dev/','http://127.0.0.1:4173/')
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'schema':value['schema'],'cases':value['cases']},ensure_ascii=False,indent=2)+'\n')
          PY
          CHROME_BIN="$chrome" python3 "$PRESET_ROOT/browser-smoke.py" "$RUNNER_TEMP/result/preset-local-urls.json" "$RUNNER_TEMP/result/preset-local-browser.json" "$RUNNER_TEMP/result/preset-local-shots"
          CHROMIUM_PATH="$chrome" python3 "$ROOT/tests/browser_compiler.py" http://127.0.0.1:4173/ verification/mobile-agent-business-model-presentation/examples "$RUNNER_TEMP/result/business-local-browser.json"
          python3 - "$RUNNER_TEMP/result/preset-local-browser.json" "$RUNNER_TEMP/result/business-local-browser.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2]))
          assert p['status']=='PASS'
          assert [x['pattern'] for x in p['cases']]==['graph/1','map/1','seq/1']
          assert b['urlGeneration']==b['urlRendering']=='PASS'
          assert [x['actorCount'] for x in b['cases']]==[2,3,4]
          print(json.dumps({'status':'PASS','models':['graph/1','map/1','seq/1','business-model/1']}))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-all-models-site-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: materialize
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mobile-agent-all-models-site-${{ github.run_id }}
          path: ${{ runner.temp }}/staged
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install public browser proof dependency
        run: python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0

      - name: Verify dedicated Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: ${{ needs.materialize.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"; test -n "$CLOUDFLARE_API_TOKEN"; test "$PROJECT" = stg-mobile-agent
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          code="$(curl -sS -o "$RUNNER_TEMP/project.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$api")"
          test "$code" = 200
          python3 - "$RUNNER_TEMP/project.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['success'] is True; assert x['result']['name']=='stg-mobile-agent'; assert x['result']['production_branch']=='proposals'
          PY

      - name: Deploy combined root and prove Business Model
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          CHROMIUM_PATH="$chrome" CHROME_BIN="$chrome" python3 "$ROOT/deploy.py" \
            --staged "$RUNNER_TEMP/staged" \
            --source-sha "${{ needs.materialize.outputs.source_sha }}" \
            --out "$RUNNER_TEMP/public-proof" \
            --github-output "$GITHUB_OUTPUT"

      - name: Prove exact App and Graph Map Seq on stable and immutable hosts
        env:
          APP_BYTES: '2412388'
          APP_SHA256: 3a8db8703aeb78ed2aded4292c554930daf16e6825dd1ccde83fd9bf680408d6
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          stable="${{ steps.deploy.outputs.stable_base }}"
          immutable="${{ steps.deploy.outputs.deployment_base }}"
          for pair in "stable:$stable" "immutable:$immutable"; do
            name="${pair%%:*}"; base="${pair#*:}"
            curl -fsSL --retry 15 --retry-delay 2 -H 'Cache-Control: no-cache' "${base}app/index.html" -o "$RUNNER_TEMP/public-proof/app-$name.html"
            test "$(wc -c < "$RUNNER_TEMP/public-proof/app-$name.html")" -eq "$APP_BYTES"
            test "$(sha256sum "$RUNNER_TEMP/public-proof/app-$name.html" | cut -d' ' -f1)" = "$APP_SHA256"
            python3 - "$ROOT/preset-render-cases.json" "$RUNNER_TEMP/public-proof/preset-$name-urls.json" "$base" <<'PY'
          import json,pathlib,sys
          value=json.load(open(sys.argv[1],encoding='utf-8')); base=sys.argv[3]
          for row in value['cases']:
              row['url']=row['url'].replace('https://stg-mobile-agent.pages.dev/',base)
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'schema':value['schema'],'cases':value['cases']},ensure_ascii=False,indent=2)+'\n')
          PY
            CHROME_BIN="$chrome" python3 "$PRESET_ROOT/browser-smoke.py" "$RUNNER_TEMP/public-proof/preset-$name-urls.json" "$RUNNER_TEMP/public-proof/preset-$name-browser.json" "$RUNNER_TEMP/public-proof/preset-$name-shots"
          done

      - name: Build all-model receipt
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/public-proof" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          business=json.load(open(root/'accepted-public-url-receipt.json'))
          stable=json.load(open(root/'preset-stable-browser.json'))
          immutable=json.load(open(root/'preset-immutable-browser.json'))
          by_id={x['id']:x for x in stable['cases']}; imm={x['id']:x for x in immutable['cases']}
          models={}
          for key in ('graph','map','seq'):
              a=by_id[key]; b=imm[key]; assert a['status']==b['status']=='PASS'
              models[a['pattern']]={'status':'PASS','stableUrl':a['url'],'immutableUrl':b['url'],'chrome':'PASS'}
          assert business['status']=='PASS'
          assert [x['actorCount'] for x in business['cases']]==[2,3,4]
          models['business-model/1']={'status':'PASS','stableUrl':business['cases'][0]['stableUrl'],'immutableUrl':business['cases'][0]['immutableUrl'],'chrome':'PASS','actorCases':[2,3,4]}
          receipt={
            'schema':'ops.mobileAgentAllModelsPublicReceipt/1','status':'PASS','authority':False,
            'candidateSha':business['candidateSha'],'provider':business['provider'],
            'app':{'bytes':2412388,'sha256':'sha256:3a8db8703aeb78ed2aded4292c554930daf16e6825dd1ccde83fd9bf680408d6','stableReadback':'PASS','immutableReadback':'PASS'},
            'models':models,
            'proof':{'graph':'PASS','map':'PASS','seq':'PASS','businessModel':'PASS','stableChrome':'PASS','immutableChrome':'PASS'}
          }
          (root/'all-models-public-receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':'PASS','models':list(models)}))
          PY

      - name: Upload accepted proof
        id: accepted
        uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-all-models-public-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/public-proof/
          if-no-files-found: error
          retention-days: 90

      - name: Advance business-model accepted receipt ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$ROOT/advance_accepted_ref.sh" \
            "$RUNNER_TEMP/public-proof/accepted-public-url-receipt.json" \
            "${{ needs.materialize.outputs.source_sha }}" \
            "${{ steps.accepted.outputs.artifact-digest }}"
