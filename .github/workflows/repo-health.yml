name: repo-health

on:
  pull_request:
    paths:
      - "packages/repo-health/**"
      - "packages/jev-review/**"
      - "build/packages.jsonl"
      - "build/checks.jsonl"
      - "ci.intent.v1.jsonl"
      - ".github/workflows/repo-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OPS_SHA }}
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Prove repo-health package contract
        shell: bash
        run: |
          set -euo pipefail
          nix build --no-link .#repo-health
          check_out="$(nix build --no-link --print-out-paths .#checks.x86_64-linux.repo-health)"
          test -f "$check_out/ok"
          rm -rf repo-health-contract
          mkdir -p repo-health-contract
          cp "$check_out/ok" repo-health-contract/ok

      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: repo-health-contract-${{ env.OPS_SHA }}
          path: repo-health-contract
          if-no-files-found: error
          retention-days: 14

      - name: Record contract boundary
        shell: bash
        run: |
          {
            echo "### Major Repo Health contract"
            echo "- exact ops SHA: $OPS_SHA"
            echo "- scope contract: 7 repositories"
            echo "- destructive cases: 18+"
            echo "- authority: false"
          } >> "$GITHUB_STEP_SUMMARY"

  live:
    name: live-seven-repo
    needs: contract
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    environment: repo-health
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Create least-privilege private-repository token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.REPO_HEALTH_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_HEALTH_APP_PRIVATE_KEY }}
          owner: roccho-dev
          repositories: |
            adrs
            envs
            flakes
            chatgpt
          permission-contents: read

      - name: Verify App token scope and resolve exact repository heads
        id: heads
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          actual="$(
            GH_TOKEN="$APP_TOKEN" gh api /installation/repositories --paginate --jq '.repositories[].name' |
              sort |
              paste -sd, -
          )"
          test "$actual" = "adrs,chatgpt,envs,flakes"

          private_head() {
            GH_TOKEN="$APP_TOKEN" gh api "/repos/roccho-dev/$1/git/ref/heads/proposals" --jq '.object.sha'
          }
          public_head() {
            git ls-remote "https://github.com/roccho-dev/$1.git" refs/heads/proposals | awk 'NR == 1 {print $1}'
          }
          valid_sha() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]]
          }

          adrs="$(private_head adrs)"
          governance="$(public_head governance)"
          ops="$OPS_SHA"
          ui="$(public_head ui)"
          envs="$(private_head envs)"
          flakes="$(private_head flakes)"
          chatgpt="$(private_head chatgpt)"

          for sha in "$adrs" "$governance" "$ops" "$ui" "$envs" "$flakes" "$chatgpt"; do
            valid_sha "$sha"
          done

          {
            echo "adrs=$adrs"
            echo "governance=$governance"
            echo "ops=$ops"
            echo "ui=$ui"
            echo "envs=$envs"
            echo "flakes=$flakes"
            echo "chatgpt=$chatgpt"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact ops candidate
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/ops
          ref: ${{ steps.heads.outputs.ops }}
          path: repos/ops
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Checkout exact private repositories
        uses: actions/checkout@v4
        with:
          repository: roccho-dev/adrs
          ref: ${{ steps.heads.outputs.adrs }}
          path: repos/adrs
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/checkout@v4
        with:
          repository: roccho-dev/envs
          ref: ${{ steps.heads.outputs.envs }}
          path: repos/envs
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/checkout@v4
        with:
          repository: roccho-dev/flakes
          ref: ${{ steps.heads.outputs.flakes }}
          path: repos/flakes
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/checkout@v4
        with:
          repository: roccho-dev/chatgpt
          ref: ${{ steps.heads.outputs.chatgpt }}
          path: repos/chatgpt
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Materialize exact public repositories
        shell: bash
        env:
          GOVERNANCE_SHA: ${{ steps.heads.outputs.governance }}
          UI_SHA: ${{ steps.heads.outputs.ui }}
        run: |
          set -euo pipefail

          fetch_public() {
            name="$1"
            expected="$2"
            target="$GITHUB_WORKSPACE/repos/$name"
            git init --quiet "$target"
            git -C "$target" remote add origin "https://github.com/roccho-dev/$name.git"
            git -C "$target" fetch --quiet --depth=1 origin refs/heads/proposals
            test "$(git -C "$target" rev-parse FETCH_HEAD)" = "$expected"
            git -C "$target" checkout --quiet --detach FETCH_HEAD
          }

          fetch_public governance "$GOVERNANCE_SHA"
          fetch_public ui "$UI_SHA"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Verify exact clean seven-repository snapshot
        id: snapshot
        shell: bash
        env:
          ADRS_SHA: ${{ steps.heads.outputs.adrs }}
          GOVERNANCE_SHA: ${{ steps.heads.outputs.governance }}
          OPS_SHA_EXACT: ${{ steps.heads.outputs.ops }}
          UI_SHA: ${{ steps.heads.outputs.ui }}
          ENVS_SHA: ${{ steps.heads.outputs.envs }}
          FLAKES_SHA: ${{ steps.heads.outputs.flakes }}
          CHATGPT_SHA: ${{ steps.heads.outputs.chatgpt }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/repo-health-inputs.json"

          python3 - "$GITHUB_WORKSPACE/repos" "$manifest"             "$ADRS_SHA" "$GOVERNANCE_SHA" "$OPS_SHA_EXACT" "$UI_SHA"             "$ENVS_SHA" "$FLAKES_SHA" "$CHATGPT_SHA" <<'PY'
          import hashlib, json, pathlib, subprocess, sys

          root = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          names = ["adrs", "governance", "ops", "ui", "envs", "flakes", "chatgpt"]
          expected = dict(zip(names, sys.argv[3:], strict=True))
          rows = []

          def git(repo, *args):
              return subprocess.check_output(["git", "-C", str(repo), *args], text=True).strip()

          for name in names:
              repo = root / name
              head = git(repo, "rev-parse", "HEAD")
              tree = git(repo, "rev-parse", "HEAD^{tree}")
              dirty = git(repo, "status", "--porcelain=v1")
              if head != expected[name]:
                  raise SystemExit(f"{name}: exact head mismatch")
              if dirty:
                  raise SystemExit(f"{name}: dirty checkout")
              rows.append({"repository": f"roccho-dev/{name}", "revision": head, "tree": tree})

          raw = json.dumps(rows, sort_keys=True, separators=(",", ":")).encode()
          out.write_bytes(raw + b"\n")
          print("sha256:" + hashlib.sha256(raw).hexdigest())
          PY

          input_digest="$(python3 - "$manifest" <<'PY'
          import hashlib, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes().rstrip(b"\n")
          print("sha256:" + hashlib.sha256(raw).hexdigest())
          PY
          )"
          echo "input_digest=$input_digest" >> "$GITHUB_OUTPUT"

      - name: Run real seven-repository Jev health judgment
        id: health
        continue-on-error: true
        shell: bash
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$JEV_API_KEY"

          private_out="$RUNNER_TEMP/repo-health-private"
          stdout_file="$RUNNER_TEMP/repo-health-stdout.json"
          rm -rf "$private_out"

          set +e
          node repos/ops/packages/repo-health/bin/repo-health.mjs             run             --root "$GITHUB_WORKSPACE/repos"             --out "$private_out"             > "$stdout_file"
          rc=$?
          set -e

          test -f "$private_out/report.jsonl"
          test -f "$private_out/receipt.json"
          test -f "$private_out/index.html"

          python3 - "$private_out/receipt.json" "$stdout_file" "$GITHUB_STEP_SUMMARY" "${{ steps.snapshot.outputs.input_digest }}" <<'PY'
          import json, pathlib, sys

          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text())
          stdout = json.loads(pathlib.Path(sys.argv[2]).read_text())
          summary_path = pathlib.Path(sys.argv[3])
          input_digest = sys.argv[4]

          expected = {"expected": 7, "observed": 7, "fail": 0, "unknown": 0}
          for key, value in expected.items():
              if receipt["summary"][key] != value:
                  break

          lines = [
              "### Major Repo Health — live",
              f"- status: {'PASS' if receipt.get('complete') else 'FAIL'}",
              f"- model: {receipt['model']}",
              f"- observed: {receipt['summary']['observed']}/{receipt['summary']['expected']}",
              f"- fail: {receipt['summary']['fail']}",
              f"- unknown: {receipt['summary']['unknown']}",
              f"- input digest: {input_digest}",
              f"- scope digest: {receipt['scopeDigest']}",
              f"- rule digest: {receipt['ruleDigest']}",
              f"- report digest: {receipt['reportDigest']}",
              "- full private report persisted: no",
              "- authority: false",
          ]
          with summary_path.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")

          if stdout.get("expected") != 7 or stdout.get("observed") != 7:
              raise SystemExit("repo-health stdout summary mismatch")
          PY

          rm -f "$stdout_file"
          rm -rf "$private_out"

          exit "$rc"

      - name: Enforce real health verdict
        if: always()
        shell: bash
        run: |
          test "${{ steps.health.outcome }}" = success
