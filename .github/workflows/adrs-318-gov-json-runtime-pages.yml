name: ADRS 318 gov JSON runtime reduce Pages proof

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/adrs-318-gov-json-runtime-pages.yml'
      - 'verification/adrs-318-gov-json-runtime/**'

permissions:
  contents: read

jobs:
  materialize-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Fetch and verify exact governance Release JSON
        run: |
          set -euo pipefail
          root=verification/adrs-318-gov-json-runtime
          out="$RUNNER_TEMP/gov-json-runtime-site"
          node "$root/materialize.mjs" "$root/source.json" "$out"
          test -s "$out/current.json"
          test -s "$out/materialize-receipt.json"

  credential-smoke:
    needs: materialize-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Confirm Cloudflare credential bindings without disclosure
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s\n' 'Cloudflare account and token bindings are available'
