name: ADRS 318 gov JSON runtime reduce Pages proof

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/adrs-318-gov-json-runtime-pages.yml'
      - 'verification/adrs-318-gov-json-runtime/**'

permissions:
  contents: read

jobs:
  materialize-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Fetch and verify exact governance Release JSON
        run: |
          set -euo pipefail
          root=verification/adrs-318-gov-json-runtime
          out="$RUNNER_TEMP/gov-json-runtime-site"
          node "$root/materialize.mjs" "$root/source.json" "$out"
          test -s "$out/current.json"
          test -s "$out/materialize-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: adrs-318-gov-json-materialize-${{ github.run_id }}
          path: ${{ runner.temp }}/gov-json-runtime-site/
          if-no-files-found: error
          retention-days: 7
