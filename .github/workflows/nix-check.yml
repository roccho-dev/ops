name: nix-check

on:
  pull_request:
  push:
    branches: [proposals]

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Run flake check
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/nix-flake-check.log"
          if ! nix flake check --show-trace --no-write-lock-file >"$log" 2>&1; then
            tail -n 220 "$log" >&2
            exit 1
          fi
          tail -n 80 "$log"
