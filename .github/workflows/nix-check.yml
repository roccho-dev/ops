name: nix-check

on:
  pull_request:
  push:
    branches: [proposals]

jobs:
  cdp-tty-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Prove native library and CLI with real Chrome and a PTY
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cdp-tty-proof
          git rev-parse HEAD > cdp-tty-proof/source.commit
          git archive --format=tar.gz HEAD packages/cdp-tty verification/cdp-tty flake.lock .github/workflows/nix-check.yml > cdp-tty-proof/source.tar.gz
          out="$(nix-build packages/cdp-tty/proof.nix --no-out-link 2> >(tee cdp-tty-proof/build.log >&2))"
          cp "$out"/* cdp-tty-proof/
          cat cdp-tty-proof/raws.jsonl
          git diff --exit-code -- flake.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdp-tty-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: cdp-tty-proof/
          if-no-files-found: error
  flake-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Verify portable complete lock
        run: |
          set -euo pipefail
          ! grep -Eq 'file:///home/|ssh://100\.' flake.lock
          before="$(sha256sum flake.lock | cut -d' ' -f1)"
          nix flake metadata --json >/dev/null
          after="$(sha256sum flake.lock | cut -d' ' -f1)"
          test "$before" = "$after"
          git diff --exit-code -- flake.lock
      - name: Verify Git-bound governance golden fixture
        run: node packages/ops-package-responses/tests/governance-fixture-e2e.mjs --json
      - name: Prove installed dispatcher query and record exact output
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dispatcher-query-proof"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/checkout.commit"
          git rev-parse 'HEAD^{tree}' > "$evidence/checkout.tree"
          printf '%s\n' "$EXPECTED_HEAD" > "$evidence/requested.commit"
          git rev-parse "$EXPECTED_HEAD^{tree}" > "$evidence/requested.tree"
          proof="$(nix build -L --no-link --print-out-paths .#checks.x86_64-linux.jev-dispatcher-query 2> >(tee "$evidence/build.log" >&2))"
          cp "$proof" "$evidence/tests.tap"
          sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$evidence/tests.tap" > "$evidence/tests.plain"
          grep -Eq '(^|[[:space:]])skipped 0([[:space:]]|$)' "$evidence/tests.plain"
          artifact="$(nix build -L --no-link --print-out-paths .#jev-dispatcher-query 2> >(tee -a "$evidence/build.log" >&2))"
          nix path-info --json "$artifact" > "$evidence/artifact.json"
          cp "$artifact/share/jev-dispatcher/artifact.jsonl" "$evidence/auth-contract.jsonl"
          cp "$artifact/share/jev-dispatcher/LIVE_E2E.md" "$evidence/LIVE_E2E.md"
          "$artifact/bin/jev-dispatcher-live-e2e" --help > "$evidence/live-e2e.help"
          cat "$evidence/tests.plain"
      - name: Retain installed dispatcher query evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatcher-query-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dispatcher-query-proof/
          if-no-files-found: error
      - name: Run flake check
        run: |
          set -euo pipefail
          log="nix-flake-check.log"
          if ! nix flake check --show-trace >"$log" 2>&1; then
            tail -n 220 "$log" >&2
            exit 1
          fi
          git diff --exit-code -- flake.lock
          tail -n 80 "$log"
      - name: Upload flake check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-flake-check-log
          path: nix-flake-check.log
          if-no-files-found: ignore
