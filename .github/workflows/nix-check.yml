name: nix-check

on:
  pull_request:
  push:
    branches: [proposals]

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Verify Git-bound governance golden fixture
        run: node packages/ops-package-responses/tests/governance-fixture-e2e.mjs --json
      - name: Regenerate portable lock
        run: |
          set -euo pipefail
          rm -f flake.lock
          nix flake lock
          grep -R 'file:///home/\|ssh://100\.' flake.lock && exit 1 || true
      - name: Upload regenerated lock
        uses: actions/upload-artifact@v4
        with:
          name: portable-flake-lock
          path: flake.lock
      - name: Run flake check
        run: |
          set -euo pipefail
          log="nix-flake-check.log"
          if ! nix flake check --show-trace >"$log" 2>&1; then
            tail -n 220 "$log" >&2
            exit 1
          fi
          tail -n 80 "$log"
      - name: Upload flake check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-flake-check-log
          path: nix-flake-check.log
          if-no-files-found: ignore
