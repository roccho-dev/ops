name: nix-check
run-name: ${{ github.event.label.name || github.event.pull_request.title || github.event.head_commit.message }}

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: [proposals]
jobs:
  cdp-tty-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    if: false # DEFERRED_NOT_RUN: ops#460
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Prove native library and CLI with real Chrome and a PTY
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cdp-tty-proof
          git rev-parse HEAD > cdp-tty-proof/source.commit
          git archive --format=tar.gz HEAD packages/cdp-tty verification/cdp-tty flake.lock .github/workflows/nix-check.yml > cdp-tty-proof/source.tar.gz
          out="$(nix-build packages/cdp-tty/proof.nix --no-out-link 2> >(tee cdp-tty-proof/build.log >&2))"
          cp "$out"/* cdp-tty-proof/
          cat cdp-tty-proof/raws.jsonl
          git diff --exit-code -- flake.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdp-tty-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: cdp-tty-proof/
          if-no-files-found: error
  flake-check:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Verify portable complete lock
        run: |
          set -euo pipefail
          ! grep -Eq 'file:///home/|ssh://100\.' flake.lock
          before="$(sha256sum flake.lock | cut -d' ' -f1)"
          nix flake metadata --json >/dev/null
          after="$(sha256sum flake.lock | cut -d' ' -f1)"
          test "$before" = "$after"
          git diff --exit-code -- flake.lock
      - name: Verify Git-bound governance golden fixture
        run: node packages/ops-package-responses/tests/governance-fixture-e2e.mjs --json
      - name: Run flake check
        run: |
          set -euo pipefail
          log="nix-flake-check.log"
          if ! nix flake check --show-trace >"$log" 2>&1; then
            tail -n 220 "$log" >&2
            exit 1
          fi
          git diff --exit-code -- flake.lock
          tail -n 80 "$log"
      - name: Upload flake check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-flake-check-log
          path: nix-flake-check.log
          if-no-files-found: ignore

  # Run 36566120584/1 ended UNKNOWN. No automatic live retry on successor heads.
  # Ordinary jobs above are unchanged; this job proves code, not experiment success.
  ci-relevance-shadow-offline:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 450 && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prove Lane A scope and preserved terminal evidence offline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lane-a-offline"
          git rev-parse HEAD | tee "$RUNNER_TEMP/lane-a-offline/source.commit"
          node --test packages/ci-relevance-shadow/test.mjs packages/ci-relevance-shadow/proof.test.mjs packages/ci-relevance-shadow/parallel.test.mjs | tee "$RUNNER_TEMP/lane-a-offline/tests.tap"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-a-offline-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lane-a-offline/
          if-no-files-found: error

  # P 5898026275: one new separate-runner experiment, NOT a retry of run 36566120584.
  # begin() permits only a direct successor of the frozen parent and attempt 1.
  lane-a-provider:
    name: lane-a-separated-provider
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number == 450 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the one permitted attempt before runtime setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/ci-relevance-shadow/parallel.mjs begin "$RUNNER_TEMP/lane-a-provider" provider
      - name: Prepare fixed local runtime
        env:
          OLLAYA_HOST: 127.0.0.1:11435
          OLLAYA_DEVICE: cpu
          OLLAYA_KEEP_ALIVE: 30m
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/lane-a-runtime"
          mkdir -p "$root/runtime" "$root/models" "$RUNNER_TEMP/lane-a-provider/provider"
          date -u +%FT%T.%3NZ > "$RUNNER_TEMP/lane-a-provider/setup-start.txt"
          base="https://github.com/ollaya-dev/ollaya/releases/download/v0.7.5"
          archive="ollaya-linux-amd64.tar.zst"
          curl --fail --location --max-time 600 -o "$root/$archive" "$base/$archive"
          node --input-type=module - "$root/$archive" <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {PLAN} from './packages/ci-relevance-shadow/parallel.mjs';
          const actual = createHash('sha256').update(readFileSync(process.argv[2])).digest('hex');
          if (actual !== PLAN.archiveSha256) throw new Error('RUNTIME_ARCHIVE_MISMATCH');
          JS
          tar --zstd -xf "$root/$archive" -C "$root/runtime"
          export OLLAYA_MODELS="$root/models"
          export OLLAYA_LIBRARY_PATH="$root/runtime/lib/ollaya"
          "$root/runtime/bin/ollaya" serve > "$root/server.log" 2>&1 &
          echo "$!" > "$root/server.pid"
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11435/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          curl --fail --silent --show-error --max-time 1200 -H 'Content-Type: application/json' \
            -d '{"model":"winnow:e4b","stream":false}' http://127.0.0.1:11435/api/pull > "$RUNNER_TEMP/lane-a-provider/provider/pull.json"
          node --input-type=module - "$root" "$RUNNER_TEMP/lane-a-provider/provider" <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {PLAN} from './packages/ci-relevance-shadow/parallel.mjs';
          const [root,out] = process.argv.slice(2);
          if (JSON.parse(readFileSync(`${out}/pull.json`)).status !== 'success') throw new Error('MODEL_PULL_INCOMPLETE');
          const h = p => createHash('sha256').update(readFileSync(p)).digest('hex');
          const runtime = {version:PLAN.version,archiveSha256:h(`${root}/ollaya-linux-amd64.tar.zst`),binarySha256:h(`${root}/runtime/bin/ollaya`)};
          if (runtime.binarySha256 !== PLAN.binarySha256) throw new Error('RUNTIME_BINARY_MISMATCH');
          writeFileSync(`${out}/runtime-files.json`,JSON.stringify(runtime)+'\n',{flag:'wx'});
          const r=await fetch('http://127.0.0.1:11435/api/tags',{signal:AbortSignal.timeout(10000)});
          const tags=await r.json();
          writeFileSync(`${out}/setup-model.json`,JSON.stringify(tags)+'\n',{flag:'wx'});
          if (!r.ok || tags.models?.filter(x=>x.name===PLAN.model && x.digest===PLAN.manifestSha256).length!==1) throw new Error('PREREGISTERED_MODEL_MISMATCH');
          JS
          date -u +%FT%T.%3NZ > "$RUNNER_TEMP/lane-a-provider/setup-end.txt"
      - name: Observe once without reference execution
        run: node packages/ci-relevance-shadow/parallel.mjs run "$RUNNER_TEMP/lane-a-provider" provider
      - name: Preserve terminal even after setup failure or cancellation
        if: always()
        env:
          LANE_JOB_STATUS: ${{ job.status }}
        run: |
          if test -f "$RUNNER_TEMP/lane-a-runtime/server.pid"; then
            kill "$(cat "$RUNNER_TEMP/lane-a-runtime/server.pid")" 2>/dev/null || true
          fi
          if test -f "$RUNNER_TEMP/lane-a-runtime/server.log"; then
            cp "$RUNNER_TEMP/lane-a-runtime/server.log" "$RUNNER_TEMP/lane-a-provider/provider/server.log"
          fi
          node packages/ci-relevance-shadow/parallel.mjs terminal "$RUNNER_TEMP/lane-a-provider" provider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-a-separated-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-provider
          path: ${{ runner.temp }}/lane-a-provider/
          if-no-files-found: error

  lane-a-reference:
    name: lane-a-separated-${{ matrix.member }}
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number == 450 && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        member: [cdp-tty-proof, flake-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind independent reference before setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/ci-relevance-shadow/parallel.mjs begin "$RUNNER_TEMP/lane-a-reference" "${{ matrix.member }}"
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Execute the preregistered command regardless of Winnow output
        run: node packages/ci-relevance-shadow/parallel.mjs run "$RUNNER_TEMP/lane-a-reference" "${{ matrix.member }}"
      - name: Preserve terminal even after setup failure or cancellation
        if: always()
        env:
          LANE_JOB_STATUS: ${{ job.status }}
        run: node packages/ci-relevance-shadow/parallel.mjs terminal "$RUNNER_TEMP/lane-a-reference" "${{ matrix.member }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-a-separated-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.member }}
          path: ${{ runner.temp }}/lane-a-reference/
          if-no-files-found: error

  lane-a-join:
    needs: [lane-a-provider, lane-a-reference]
    if: always() && github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number == 450 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true # Missing artifacts must reach the UNKNOWN join, not become Green.
        with:
          pattern: lane-a-separated-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/lane-a-terminal-inputs
      - name: Provider-free join after all producer jobs are terminal
        env:
          GH_TOKEN: ${{ github.token }}
          LANE_INPUT: ${{ runner.temp }}/lane-a-terminal-inputs
        run: node packages/ci-relevance-shadow/parallel.mjs join "$RUNNER_TEMP/lane-a-join"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-a-join-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lane-a-join/
          if-no-files-found: error

# Dormant prospective Lane A provider-only surface.
  # A later exact one-shot label/GO authority may activate this job; ordinary activities never do.
  lane-a-prospective-provider:
    name: lane-a-prospective-provider
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.pull_request.number == 450 && github.event.pull_request.head.ref == 'proof/449-winnow-ci-relevance' && startsWith(github.event.label.name, 'lane-a-go-') && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      LANE_OUT: ${{ runner.temp }}/lane-a-prospective
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind prospective packet and evaluator before runtime setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/ci-relevance-shadow/parallel.mjs prospective-begin "$LANE_OUT"
      - name: Prepare existing fixed local runtime
        env:
          OLLAYA_HOST: 127.0.0.1:11435
          OLLAYA_DEVICE: cpu
          OLLAYA_KEEP_ALIVE: 30m
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/lane-a-prospective-runtime"
          mkdir -p "$root/runtime" "$root/models" "$LANE_OUT/provider"
          date -u +%FT%T.%3NZ > "$LANE_OUT/setup-start.txt"
          base="https://github.com/ollaya-dev/ollaya/releases/download/v0.7.5"
          archive="ollaya-linux-amd64.tar.zst"
          curl --fail --location --max-time 600 -o "$root/$archive" "$base/$archive"
          node --input-type=module - "$root/$archive" <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {PLAN} from './packages/ci-relevance-shadow/parallel.mjs';
          const actual = createHash('sha256').update(readFileSync(process.argv[2])).digest('hex');
          if (actual !== PLAN.archiveSha256) throw new Error('RUNTIME_ARCHIVE_MISMATCH');
          JS
          tar --zstd -xf "$root/$archive" -C "$root/runtime"
          export OLLAYA_MODELS="$root/models"
          export OLLAYA_LIBRARY_PATH="$root/runtime/lib/ollaya"
          "$root/runtime/bin/ollaya" serve > "$root/server.log" 2>&1 &
          echo "$!" > "$root/server.pid"
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11435/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          curl --fail --silent --show-error --max-time 1200 -H 'Content-Type: application/json' \
            -d '{"model":"winnow:e4b","stream":false}' http://127.0.0.1:11435/api/pull > "$LANE_OUT/provider/pull.json"
          node --input-type=module - "$root" "$LANE_OUT/provider" <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {PLAN} from './packages/ci-relevance-shadow/parallel.mjs';
          const [root,out] = process.argv.slice(2);
          if (JSON.parse(readFileSync(`${out}/pull.json`)).status !== 'success') throw new Error('MODEL_PULL_INCOMPLETE');
          const h = p => createHash('sha256').update(readFileSync(p)).digest('hex');
          const runtime = {version:PLAN.version,archiveSha256:h(`${root}/ollaya-linux-amd64.tar.zst`),binarySha256:h(`${root}/runtime/bin/ollaya`)};
          if (runtime.binarySha256 !== PLAN.binarySha256) throw new Error('RUNTIME_BINARY_MISMATCH');
          writeFileSync(`${out}/runtime-files.json`,JSON.stringify(runtime)+'\n',{flag:'wx'});
          const r=await fetch('http://127.0.0.1:11435/api/tags',{signal:AbortSignal.timeout(10000)});
          const tags=await r.json();
          writeFileSync(`${out}/setup-model.json`,JSON.stringify(tags)+'\n',{flag:'wx'});
          if (!r.ok || tags.models?.filter(x=>x.name===PLAN.model && x.digest===PLAN.manifestSha256).length!==1) throw new Error('PREREGISTERED_MODEL_MISMATCH');
          JS
          date -u +%FT%T.%3NZ > "$LANE_OUT/setup-end.txt"
      - name: Execute one prospective provider-only evaluation
        run: node packages/ci-relevance-shadow/parallel.mjs prospective-run "$LANE_OUT" "$LANE_OUT/packet.json"
      - name: Preserve prospective terminal even after setup failure or cancellation
        if: always()
        env:
          LANE_JOB_STATUS: ${{ job.status }}
        run: |
          if test -f "$RUNNER_TEMP/lane-a-prospective-runtime/server.pid"; then
            kill "$(cat "$RUNNER_TEMP/lane-a-prospective-runtime/server.pid")" 2>/dev/null || true
          fi
          if test -f "$RUNNER_TEMP/lane-a-prospective-runtime/server.log"; then
            cp "$RUNNER_TEMP/lane-a-prospective-runtime/server.log" "$LANE_OUT/provider/server.log"
          fi
          node packages/ci-relevance-shadow/parallel.mjs prospective-terminal "$LANE_OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-a-prospective-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lane-a-prospective/
          if-no-files-found: error
