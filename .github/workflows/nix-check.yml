name: nix-check

on:
  pull_request:
  push:
    branches: [proposals]

jobs:
  parallel-development-jev-phases:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Prove registered parallel-development Jev check at exact head
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/parallel-development-jev-phases"
          mkdir -p "$receipt"
          git rev-parse HEAD | tee "$receipt/source.commit"
          test "$(cat "$receipt/source.commit")" = "$SOURCE_SHA"
          check=checks.x86_64-linux.parallel-development-jev-phases
          printf '%s\n' "$check" > "$receipt/check"
          nix build ".#$check" --no-link --no-update-lock-file --json --print-build-logs > "$receipt/build.json" 2> >(tee "$receipt/build.log" >&2)
          out="$(jq -er '.[0].outputs.out' "$receipt/build.json")"
          test -f "$out/ok"
          nix log "$(jq -er '.[0].drvPath' "$receipt/build.json")" > "$receipt/test.log" 2>&1
          cat "$receipt/test.log"
          nix path-info --json "$out" > "$receipt/output.json"
          git diff --exit-code -- flake.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-development-jev-phases-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/parallel-development-jev-phases/
          if-no-files-found: error
  cdp-tty-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Prove native library and CLI with real Chrome and a PTY
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cdp-tty-proof
          git rev-parse HEAD > cdp-tty-proof/source.commit
          git archive --format=tar.gz HEAD packages/cdp-tty verification/cdp-tty flake.lock .github/workflows/nix-check.yml > cdp-tty-proof/source.tar.gz
          out="$(nix-build packages/cdp-tty/proof.nix --no-out-link 2> >(tee cdp-tty-proof/build.log >&2))"
          cp "$out"/* cdp-tty-proof/
          cat cdp-tty-proof/raws.jsonl
          git diff --exit-code -- flake.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdp-tty-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: cdp-tty-proof/
          if-no-files-found: error
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Verify portable complete lock
        run: |
          set -euo pipefail
          ! grep -Eq 'file:///home/|ssh://100\.' flake.lock
          before="$(sha256sum flake.lock | cut -d' ' -f1)"
          nix flake metadata --json >/dev/null
          after="$(sha256sum flake.lock | cut -d' ' -f1)"
          test "$before" = "$after"
          git diff --exit-code -- flake.lock
      - name: Verify Git-bound governance golden fixture
        run: node packages/ops-package-responses/tests/governance-fixture-e2e.mjs --json
      - name: Run flake check
        run: |
          set -euo pipefail
          log="nix-flake-check.log"
          if ! nix flake check --show-trace >"$log" 2>&1; then
            tail -n 220 "$log" >&2
            exit 1
          fi
          git diff --exit-code -- flake.lock
          tail -n 80 "$log"
      - name: Upload flake check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-flake-check-log
          path: nix-flake-check.log
          if-no-files-found: ignore
