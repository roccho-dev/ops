name: nix-check

on:
  pull_request:
  push:
    branches: [proposals]

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Verify portable complete lock
        run: |
          set -euo pipefail
          ! grep -Eq 'file:///home/|ssh://100\.' flake.lock
          before="$(sha256sum flake.lock | cut -d' ' -f1)"
          nix flake metadata --json >/dev/null
          after="$(sha256sum flake.lock | cut -d' ' -f1)"
          test "$before" = "$after"
          git diff --exit-code -- flake.lock
      - name: Verify Git-bound governance golden fixture
        run: node packages/ops-package-responses/tests/governance-fixture-e2e.mjs --json
      - name: Run flake check
        run: |
          set -euo pipefail
          log="nix-flake-check.log"
          if ! nix flake check --show-trace >"$log" 2>&1; then
            tail -n 220 "$log" >&2
            exit 1
          fi
          git diff --exit-code -- flake.lock
          tail -n 80 "$log"
      - name: Upload flake check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-flake-check-log
          path: nix-flake-check.log
          if-no-files-found: ignore

  vercel-go-native:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Vercel proof changes
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/changed.txt"
          if grep -Eq '^(packages/deploy-adapter/providers/vercel/|verification/vercel-go-native/)' "$RUNNER_TEMP/changed.txt"; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.changed.outputs.active == 'true'
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.active == 'true'
        with:
          node-version: '22.16.0'

      - name: Local Go proof
        if: steps.changed.outputs.active == 'true'
        working-directory: verification/vercel-go-native
        run: |
          set -euo pipefail
          go test ./...
          go build .

      - name: Require bounded Vercel target
        if: steps.changed.outputs.active == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/vercel-blocker.txt"
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "missing $name" | tee -a "$RUNNER_TEMP/vercel-blocker.txt" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Deploy exact PR source and public readback
        if: steps.changed.outputs.active == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node packages/deploy-adapter/providers/vercel/deploy.mjs \
            --root verification/vercel-go-native \
            --source-revision "${{ github.event.pull_request.head.sha }}" \
            --probe-path /health \
            --target preview > "$RUNNER_TEMP/vercel-deploy-receipt.jsonl"
          node packages/deploy-adapter/verify.mjs "$RUNNER_TEMP/vercel-deploy-receipt.jsonl"
          url="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(x.deploymentUrl)' "$RUNNER_TEMP/vercel-deploy-receipt.jsonl")"
          curl --fail --silent --show-error "$url/health" > "$RUNNER_TEMP/vercel-health.json"
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(JSON.stringify(x)!==JSON.stringify({runtime:"go",status:"ok"})) process.exit(1)' "$RUNNER_TEMP/vercel-health.json"
          cat "$RUNNER_TEMP/vercel-deploy-receipt.jsonl"

      - name: Upload Vercel deployment evidence
        if: always() && steps.changed.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-go-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vercel-blocker.txt
            ${{ runner.temp }}/vercel-deploy-receipt.jsonl
            ${{ runner.temp }}/vercel-health.json
          if-no-files-found: error
          retention-days: 30
