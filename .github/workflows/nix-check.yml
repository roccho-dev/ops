name: nix-check

on:
  pull_request:
  push:
    branches: [proposals]

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact Git head and historical fixture provenance
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          test "$actual_head" = "$EXPECTED_HEAD"
          node packages/ops-package-responses/tests/historical-provenance.mjs | tee historical-git-provenance.json
          printf '{"actualHead":"%s","actualTree":"%s","expectedHead":"%s","status":"PASS"}\n' \
            "$actual_head" "$actual_tree" "$EXPECTED_HEAD" | tee exact-head-receipt.json
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Run flake check
        run: |
          set -euo pipefail
          log="nix-flake-check.log"
          if ! nix flake check --show-trace --no-write-lock-file >"$log" 2>&1; then
            tail -n 220 "$log" >&2
            exit 1
          fi
          tail -n 80 "$log"
      - name: Upload flake check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-flake-check-evidence
          path: |
            exact-head-receipt.json
            historical-git-provenance.json
            nix-flake-check.log
          if-no-files-found: ignore
