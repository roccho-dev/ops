name: nix-check

on:
  pull_request:
  push:
    branches: [proposals]

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
          cache: false

      - name: Run package documentation preflight
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/package-docs-admission"
          mkdir -p "$proof"

          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$base_sha^{commit}"
          git show "$base_sha:build/packages.jsonl" > "$proof/base-packages.jsonl"

          candidate_sha="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse "$base_sha^{tree}")"
          candidate_tree="$(git rev-parse HEAD^{tree})"

          (
            cd packages/shiftleft-admission
            go build -trimpath -o "$proof/package-docs" ./cmd/package-docs
            go build -trimpath -o "$proof/policyctl" ./cmd/policyctl
          )

          "$proof/package-docs" observe \
            --phase preflight \
            --repo "$GITHUB_WORKSPACE" \
            --catalog "$GITHUB_WORKSPACE/build/packages.jsonl" \
            --baseline-catalog "$proof/base-packages.jsonl" \
            --out "$proof/observations.jsonl"

          bundle="$GITHUB_WORKSPACE/packages/shiftleft-admission/policy/package-docs"
          policy_hash="$("$proof/policyctl" hash --bundle "$bundle")"
          cat > "$proof/identity.json" <<EOF
          {
            "schema": "package-docs-ci-identity/1",
            "baseCommit": "$base_sha",
            "baseTree": "git-tree-sha1:$base_tree",
            "candidateCommit": "$candidate_sha",
            "candidateTree": "git-tree-sha1:$candidate_tree",
            "policyHash": "$policy_hash",
            "phase": "preflight"
          }
          EOF

          set +e
          "$proof/policyctl" admit \
            --bundle "$bundle" \
            --policy-ref "$candidate_sha" \
            --policy-sha256 "$policy_hash" \
            --base-tree "git-tree-sha1:$base_tree" \
            --candidate-tree "git-tree-sha1:$candidate_tree" \
            --observations "$proof/observations.jsonl" \
            --out "$proof/receipt.json" \
            > "$proof/gate.stdout" \
            2> "$proof/gate.stderr"
          rc=$?
          set -e

          test -f "$proof/receipt.json"
          cat "$proof/receipt.json"
          if [[ "$rc" -ne 0 ]]; then
            cat "$proof/gate.stderr" >&2
            exit "$rc"
          fi

      - name: Upload package documentation admission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-docs-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/package-docs-admission/
          if-no-files-found: error

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Run flake check
        run: |
          set -euo pipefail
          log="nix-flake-check.log"
          if ! nix flake check --show-trace --no-write-lock-file >"$log" 2>&1; then
            tail -n 220 "$log" >&2
            exit 1
          fi
          tail -n 80 "$log"
      - name: Upload flake check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-flake-check-log
          path: nix-flake-check.log
          if-no-files-found: ignore
