name: Gov Release live current proof

on:
  pull_request:
    paths:
      - '.github/workflows/gov-release-live-current-proof.yml'
      - 'packages/gov-release-proxy/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  UI_COMMIT: f0c1ff68889e21a3cd203dd2a4ef4e2ed0bc6bb7
  UI_PATH: apps/root-jsonl-map/index.html

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: roccho-dev/ui
          ref: ${{ env.UI_COMMIT }}
          path: root-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Stage exact merged UI
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/root-ui/$UI_PATH" packages/gov-release-proxy/public/index.html
          node "$GITHUB_WORKSPACE/root-ui/apps/root-jsonl-map/check.mjs"
      - name: Verify fixture-free current Release package
        working-directory: packages/gov-release-proxy
        run: |
          npm run check
          npm run check:dry-run

  provider-proof:
    needs: candidate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: cloudflare-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WORKER_NAME: stg-gov-release-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: roccho-dev/ui
          ref: ${{ env.UI_COMMIT }}
          path: root-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Stage exact merged UI
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/root-ui/$UI_PATH" packages/gov-release-proxy/public/index.html
          sha256sum packages/gov-release-proxy/public/index.html | tee "$RUNNER_TEMP/ui-sha256.txt"
      - name: Remove legacy runtime fixture switches
        working-directory: packages/gov-release-proxy
        env:
          WORKER_CLEANUP_RECEIPT: ${{ runner.temp }}/legacy-fixture-cleanup.json
        run: node scripts/cleanup-worker-proof.mjs
      - name: Deploy fixture-free current Release Worker
        id: deploy
        working-directory: packages/gov-release-proxy
        run: |
          set -uo pipefail
          set +e
          output="$(npx --yes wrangler@4.112.0 deploy 2>&1)"; status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 0
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -n1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify live real Release and browser projection
        working-directory: packages/gov-release-proxy
        run: |
          set -euo pipefail
          node scripts/verify-remote.mjs '${{ steps.deploy.outputs.url }}' | tee "$RUNNER_TEMP/live-release-readback.json"
          python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0
          python3 scripts/verify-root-browser.py \
            '${{ steps.deploy.outputs.url }}' \
            "$RUNNER_TEMP/live-release-browser.json" \
            "$RUNNER_TEMP/live-release-browser.png"
      - name: Stage closure receipt
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          read=lambda name: json.loads((root/name).read_text())
          ui=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'root-ui/apps/root-jsonl-map/index.html'
          value={
            'schema':'ops.govReleaseLiveCurrentClosure/1',
            'status':'PASS',
            'url':'${{ steps.deploy.outputs.url }}',
            'endpoint':'/',
            'opsCommit':'${{ github.event.pull_request.head.sha }}',
            'ui':{
              'repository':'roccho-dev/ui',
              'commit':'f0c1ff68889e21a3cd203dd2a4ef4e2ed0bc6bb7',
              'path':'apps/root-jsonl-map/index.html',
              'sha256':'sha256:'+hashlib.sha256(ui.read_bytes()).hexdigest(),
            },
            'legacyFixtureCleanup':read('legacy-fixture-cleanup.json'),
            'releaseReadback':read('live-release-readback.json'),
            'browser':read('live-release-browser.json'),
            'runtimeFixture':False,
            'fixedReleaseIdentity':False,
            'authority':False,
            'cutover':False,
          }
          (root/'live-current-closure.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gov-release-live-current-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/legacy-fixture-cleanup.json
            ${{ runner.temp }}/live-release-readback.json
            ${{ runner.temp }}/live-release-browser.json
            ${{ runner.temp }}/live-release-browser.png
            ${{ runner.temp }}/live-current-closure.json
            ${{ runner.temp }}/ui-sha256.txt
          if-no-files-found: error
          retention-days: 14
