name: Mobile Agent exact all-model URL proof

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/mobile-agent-exact-all-model-proof.yml'
      - 'verification/mobile-agent-url-only-runtime/**'
      - 'verification/mobile-agent-business-model-presentation/**'
      - 'verification/mobile-agent-preset-app/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  ROOT: verification/mobile-agent-url-only-runtime
  PRESET_ROOT: verification/mobile-agent-preset-app
  APP_BYTES: '2412388'
  APP_SHA256: 3a8db8703aeb78ed2aded4292c554930daf16e6825dd1ccde83fd9bf680408d6

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.build.outputs.source_sha }}
      project: ${{ steps.build.outputs.project }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - run: python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0

      - name: Build existing Business Model runtime
        id: build
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          CHROMIUM_PATH="$chrome" CHROME_BIN="$chrome" python3 "$ROOT/build.py" \
            --source-sha "$(git rev-parse HEAD)" \
            --out "$RUNNER_TEMP/result" \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore exact Graph Map Seq App from immutable Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/result"
          mkdir -p "$root/site/app"
          python3 "$ROOT/restore_app.py" "$root/site/app/index.html" | tee "$root/app-source.json"
          test "$(wc -c < "$root/site/app/index.html")" -eq "$APP_BYTES"
          test "$(sha256sum "$root/site/app/index.html" | cut -d' ' -f1)" = "$APP_SHA256"

      - name: Validate exact Graph Map Seq URL fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$ROOT/preset-render-cases.json" "$PRESET_ROOT/manifest.json" <<'PY'
          import json,sys
          cases=json.load(open(sys.argv[1],encoding='utf-8'))
          manifest=json.load(open(sys.argv[2],encoding='utf-8'))
          fixtures={row['id']:row for row in manifest['fixtures']}
          assert cases['status']=='PASS'
          assert cases['sourceCarrier']['distTreeDigest']==manifest['publication']['distTreeDigest']
          assert [row['id'] for row in cases['cases']]==['graph','map','seq']
          for row in cases['cases']:
              fixture=fixtures[row['id']]
              assert row['fixtureSha256']==fixture['sha256']
              assert row['view']==fixture['view']
              assert row['labels']==fixture['labels']
              assert row['roundTripExact'] is True
          print(json.dumps({'status':'PASS','models':['graph/1','map/1','seq/1']}))
          PY

      - name: Prove all models locally in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/result/site" >"$RUNNER_TEMP/result/http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:4173/app/ >/dev/null \
              && curl -fsS http://127.0.0.1:4173/business-model/ >/dev/null \
              && break
            sleep .2
          done
          curl -fsS http://127.0.0.1:4173/app/ >/dev/null
          curl -fsS http://127.0.0.1:4173/business-model/ >/dev/null
          python3 - "$ROOT/preset-render-cases.json" "$RUNNER_TEMP/result/preset-local.json" <<'PY'
          import json,pathlib,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          for row in value['cases']:
              row['url']=row['url'].replace('https://stg-mobile-agent.pages.dev/','http://127.0.0.1:4173/')
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'cases':value['cases']},ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          CHROME_BIN="$chrome" python3 "$PRESET_ROOT/browser-smoke.py" \
            "$RUNNER_TEMP/result/preset-local.json" \
            "$RUNNER_TEMP/result/preset-local-browser.json" \
            "$RUNNER_TEMP/result/preset-local-shots"
          CHROMIUM_PATH="$chrome" python3 "$ROOT/tests/browser_compiler.py" \
            http://127.0.0.1:4173/ \
            verification/mobile-agent-business-model-presentation/examples \
            "$RUNNER_TEMP/result/business-local-browser.json"
          python3 - "$RUNNER_TEMP/result/preset-local-browser.json" "$RUNNER_TEMP/result/business-local-browser.json" <<'PY'
          import json,sys
          preset=json.load(open(sys.argv[1],encoding='utf-8'))
          business=json.load(open(sys.argv[2],encoding='utf-8'))
          assert preset['status']=='PASS'
          assert [row['pattern'] for row in preset['cases']]==['graph/1','map/1','seq/1']
          assert all(row['status']=='PASS' for row in preset['cases'])
          assert business['urlGeneration']==business['urlRendering']=='PASS'
          assert [row['actorCount'] for row in business['cases']]==[2,3,4]
          print(json.dumps({'status':'PASS','models':['graph/1','map/1','seq/1','business-model/1']}))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-exact-all-model-site-${{ github.run_id }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: materialize
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: mobile-agent-exact-all-model-site-${{ github.run_id }}
          path: ${{ runner.temp }}/staged

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - run: python3 -m pip install --quiet --disable-pip-version-check playwright==1.55.0

      - name: Verify target Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: ${{ needs.materialize.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT" = stg-mobile-agent
          code="$(curl -sS -o "$RUNNER_TEMP/project.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")"
          test "$code" = 200

      - name: Deploy exact combined root
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          CHROMIUM_PATH="$chrome" CHROME_BIN="$chrome" python3 "$ROOT/deploy.py" \
            --staged "$RUNNER_TEMP/staged" \
            --source-sha "${{ needs.materialize.outputs.source_sha }}" \
            --out "$RUNNER_TEMP/public-proof" \
            --github-output "$GITHUB_OUTPUT"

      - name: Prove exact App and public Graph Map Seq URLs
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          for pair in "stable:${{ steps.deploy.outputs.stable_base }}" "immutable:${{ steps.deploy.outputs.deployment_base }}"; do
            name="${pair%%:*}"
            base="${pair#*:}"
            curl -fsSL --retry 15 --retry-delay 2 -H 'Cache-Control: no-cache' \
              "${base}app/" -o "$RUNNER_TEMP/public-proof/app-$name.html"
            test "$(wc -c < "$RUNNER_TEMP/public-proof/app-$name.html")" -eq "$APP_BYTES"
            test "$(sha256sum "$RUNNER_TEMP/public-proof/app-$name.html" | cut -d' ' -f1)" = "$APP_SHA256"
            python3 - "$ROOT/preset-render-cases.json" "$RUNNER_TEMP/public-proof/preset-$name-urls.json" "$base" <<'PY'
          import json,pathlib,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          base=sys.argv[3]
          for row in value['cases']:
              row['url']=row['url'].replace('https://stg-mobile-agent.pages.dev/',base)
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'cases':value['cases']},ensure_ascii=False)+'\n',encoding='utf-8')
          PY
            CHROME_BIN="$chrome" python3 "$PRESET_ROOT/browser-smoke.py" \
              "$RUNNER_TEMP/public-proof/preset-$name-urls.json" \
              "$RUNNER_TEMP/public-proof/preset-$name-browser.json" \
              "$RUNNER_TEMP/public-proof/preset-$name-shots"
          done

      - name: Build one accepted all-model receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/public-proof" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          business=json.load(open(root/'accepted-public-url-receipt.json',encoding='utf-8'))
          stable=json.load(open(root/'preset-stable-browser.json',encoding='utf-8'))
          immutable=json.load(open(root/'preset-immutable-browser.json',encoding='utf-8'))
          stable_by_id={row['id']:row for row in stable['cases']}
          immutable_by_id={row['id']:row for row in immutable['cases']}
          models={}
          for key in ('graph','map','seq'):
              first=stable_by_id[key]
              second=immutable_by_id[key]
              assert first['status']==second['status']=='PASS'
              models[first['pattern']]={
                  'status':'PASS',
                  'stableUrl':first['url'],
                  'immutableUrl':second['url'],
                  'chrome':'PASS',
              }
          assert business['status']=='PASS'
          assert [row['actorCount'] for row in business['cases']]==[2,3,4]
          models['business-model/1']={
              'status':'PASS',
              'stableUrl':business['cases'][0]['stableUrl'],
              'immutableUrl':business['cases'][0]['immutableUrl'],
              'chrome':'PASS',
              'actorCases':[2,3,4],
          }
          out={
              'schema':'ops.mobileAgentAllModelsPublicReceipt/2',
              'status':'PASS',
              'authority':False,
              'candidateSha':business['candidateSha'],
              'provider':business['provider'],
              'app':{
                  'bytes':2412388,
                  'sha256':'sha256:3a8db8703aeb78ed2aded4292c554930daf16e6825dd1ccde83fd9bf680408d6',
                  'sourcePartBlobs':[
                      'f65a8c180f0b65317ff0455712c2ecd5934a7031',
                      'a0904cf208a3a9ac87afa37b8b6dfc4fe13c368f',
                  ],
                  'stableReadback':'PASS',
                  'immutableReadback':'PASS',
              },
              'models':models,
              'proof':{
                  'graph':'PASS',
                  'map':'PASS',
                  'seq':'PASS',
                  'businessModel':'PASS',
                  'stableChrome':'PASS',
                  'immutableChrome':'PASS',
              },
          }
          (root/'all-models-public-receipt.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          print(json.dumps({'status':'PASS','models':list(models)}))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-exact-all-model-public-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/public-proof/
          if-no-files-found: error
          retention-days: 90
