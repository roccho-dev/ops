name: Artifact Runtime static host projection

on:
  pull_request:
    paths:
      - '.github/workflows/artifact-runtime-static-host.yml'
      - 'verification/artifact-runtime-static-host/**'
      - 'verification/artifact-runtime-publication/**'
      - 'verification/artifact-runtime-app/**'
      - 'ci.intent.v1.jsonl'
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  status:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 160 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/artifact-runtime-deploy-status'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve latest deploy comment to workflow run and jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          comments="$RUNNER_TEMP/comments.json"
          runs="$RUNNER_TEMP/runs.json"
          report="$RUNNER_TEMP/deploy-status.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/160/comments" > "$comments"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/artifact-runtime-static-host.yml/runs" -f event=issue_comment -f per_page=50 > "$runs"
          python3 - "$comments" "$runs" "$GITHUB_RUN_ID" "$report" <<'PY'
          import datetime,json,subprocess,sys
          comments_path,runs_path,current_run,report_path=sys.argv[1:]
          comments=json.load(open(comments_path,encoding='utf-8'))
          runs=json.load(open(runs_path,encoding='utf-8'))['workflow_runs']
          deploy=[c for c in comments if c.get('body')=='/artifact-runtime-deploy' and c.get('user',{}).get('login')=='roccho-dev']
          if not deploy: raise SystemExit('no owner /artifact-runtime-deploy comment found')
          target=max(deploy,key=lambda c:c['created_at'])
          def dt(value): return datetime.datetime.fromisoformat(value.replace('Z','+00:00'))
          t=dt(target['created_at'])
          candidates=[]
          for run in runs:
              if str(run['id'])==current_run: continue
              created=dt(run['created_at'])
              delta=abs((created-t).total_seconds())
              candidates.append((delta,run))
          if not candidates: raise SystemExit('no issue-comment workflow runs found')
          delta,run=min(candidates,key=lambda x:x[0])
          if delta>120: raise SystemExit(f'nearest workflow run is {delta}s from deploy comment')
          jobs=json.loads(subprocess.check_output(['gh','api',f"repos/{run['repository']['full_name']}/actions/runs/{run['id']}/jobs"],text=True))['jobs']
          result={
            'schema':'ops.artifactRuntimeDeployStatus/1','authority':False,
            'deployComment':{'id':target['id'],'createdAt':target['created_at']},
            'run':{'id':run['id'],'createdAt':run['created_at'],'status':run['status'],'conclusion':run.get('conclusion'),'htmlUrl':run['html_url'],'distanceSeconds':delta},
            'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion'),'startedAt':j.get('started_at'),'completedAt':j.get('completed_at')} for j in jobs],
          }
          open(report_path,'w',encoding='utf-8').write(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
          PY
          cat "$report"
          python3 - "$report" > "$RUNNER_TEMP/comment.md" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8')); r=x['run']
          print('## Artifact Runtime deploy status')
          print()
          print(f"- deploy comment: `{x['deployComment']['id']}` / `{x['deployComment']['createdAt']}`")
          print(f"- matched run: `{r['id']}`")
          print(f"- run status: `{r['status']}`")
          print(f"- run conclusion: `{r['conclusion']}`")
          print(f"- run URL: {r['htmlUrl']}")
          print(f"- comment/run distance: `{r['distanceSeconds']}s`")
          print('- jobs:')
          for j in x['jobs']:
              print(f"  - `{j['name']}`: status=`{j['status']}`, conclusion=`{j['conclusion']}`, job=`{j['id']}`")
          print()
          print('This is read-only operational observation; it performs no Cloudflare or repository mutation beyond this Issue comment.')
          PY
          gh issue comment 160 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

  materialize:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 160 &&
       github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/artifact-runtime-deploy')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      project: ${{ steps.contract.outputs.project }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
      tree_digest: ${{ steps.contract.outputs.tree_digest }}
      tree_id: ${{ steps.contract.outputs.tree_id }}
      expected_files: ${{ steps.contract.outputs.expected_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'proposals' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Resolve bounded static-host contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open('verification/artifact-runtime-static-host/manifest.json', encoding='utf-8'))
          p=json.load(open('verification/artifact-runtime-publication/manifest.json', encoding='utf-8'))
          a=json.load(open('verification/artifact-runtime-app/manifest.json', encoding='utf-8'))
          assert s['schema']=='ops.artifactRuntimeStaticHost/1'
          assert s['authority'] is False
          assert s['issue']==160 and s['appIssue']==193
          assert p['schema']=='ops.artifactRuntimePublication/1'
          assert p['authority'] is False and p['status']=='accepted-source' and p['issue']==193
          assert a['schema']=='ops.artifactRuntimeApp/1'
          assert a['authority'] is False and a["status"]=="accepted-source" and a["issue"]==193
          assert a["id"]=="artifact-runtime" and a["version"]=="1"
          assert s["trigger"]=={"kind":"owner-issue-comment","issue":160,"command":"/artifact-runtime-deploy"}
          assert s["publication"]["treeDigest"]==p["publication"]["treeDigest"]
          assert s["publication"]["tag"]==p["publication"]["tag"]
          assert s["publication"]["archive"]==p["publication"]["archive"]
          assert s["publication"]["listedFiles"]==p["publication"]["listedFiles"]
          app_source=a["sourceAuthorities"][0]
          assert p["source"]["repository"]==app_source["repository"]
          assert p["source"]["commit"]==app_source["commit"]
          assert p["source"]["tree"]==app_source["tree"]
          app_publication=a["publication"]
          for key in ("treeDigest","kernelDigest","tag","archive","carrier","listedFiles"):
              assert p["publication"][key]==app_publication[key], key
          assert p["publication"]["capabilities"]==len(app_publication["capabilities"])==3
          assert app_publication["capabilities"]==["inspect.json@1","render.a2ui@1","render.a2ui.app@1"]
          assert s["provider"]["kind"]=="cloudflare-pages"
          assert s["provider"]["environment"]=="cloudflare-production"
          assert s["provider"]["project"]=="stg-artifact-runtime"
          assert s["provider"]["productionBranch"]=="proposals"
          tree=s["publication"]["treeDigest"]; tree_id=tree.removeprefix("sha256:")
          assert s["provider"]["pathPrefix"]==f"releases/{tree_id}"
          assert s["readback"]["required"] is True and s["readback"]["verifyAllFileHashes"] is True
          assert s["readback"]["expectedListedFiles"]==p["publication"]["listedFiles"]==63
          assert s["readback"]["browserProof"]=={
            "capability":"render.a2ui.app@1","initialState":0,"nextState":1,
            "requirements":["click-updates-url","back-restores-state","fresh-open-restores-next-state","reload-preserves-next-state""],
          }
          values={
            "tree_digest":tree,"tree_id":tree_id,"tag":s["publication"]["tag"],
            "archive_name":s["publication"]["archive"]["name"],
            "archive_bytes":s{"publication"]["archive"]["bytes"],
            "archive_sha":s["publication"]["archive"]["sha256"].removeprefix("sha256:"),
            "expected_files":s["readback"]["expectedListedFiles"],
            "project":s["provider"]["project"],
          }
          for k,v in values.items(): print(f"{k}={v}")
          PY
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Materialize exact App publication
        env:
          ARCHIVE_BYTES: ${{ steps.contract.outputs.archive_bytes }}
          ARCHIVE_NAME: ${{ steps.contract.outputs.archive_name }}
          ARCHIVE_SHAS: ${{ steps.contract.outputs.archive_sha }}
          EXPECTED_FILES: ${{ steps.contract.outputs.expected_files }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.contract.outputs.tag }}
          TREE_DIGEST: ${{ steps.contract.outputs.tree_digest }}
          TREE_ID: ${{ steps.contract.outputs.tree_id }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$ARCHIVE_NAME"
          publication="$RUNNER_TEMP/publication"
          site="$RUNNER_TEMP/site"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ui_repo="$(python3 -c 'import json; print(json.load(open("verification/artifact-runtime-app/manifest.json"))["sourceAuthorities"][0]["repository"])')"
            ui_commit="$(python3 -c 'import json; print(json.load(open("verification/artifact-runtime-app/manifest.json"))["sourceAuthorities"][0]["commit"])')"
            ui_tree="$(python3 -c 'import json; print(json.load(open("verification/artifact-runtime-app/manifest.json"))["sourceAuthorities"][0]["tree"])')"
            ui="$RUNNER_TEMP/ui"
            git clone --filter=blob:none --no-checkout "https://github.com/$ui_repo.git" "$ui"
            git -C "$ui" fetch --depth=1 origin "$ui_commit"
            git -C "$ui" checkout --detach "$ui_commit"
            test "$(git -C "$ui" rev-parse HEAD)" = "$ui_commit"
            test "$(git -C "$ui" rev-parse 'HEAD^{tree}')" = "$ui_tree"
            (cd "$ui" && npm run check:artifact-runtime)
            (cd "$ui" && node apps/artifact-shell/scripts/build-publication.mjs --out="$publication")
            (cd "$publication" && tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX,go-s-®ιάjΧ