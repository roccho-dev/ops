name: Temporary finalize ops 115 L2 evidence

on:
  pull_request:
    types: [reopened, synchronize]
    branches: [proposals]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/ops-115-decision-closure-final-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ops-115-decision-closure-final-v2
          fetch-depth: 0

      - name: Fix false-negative Decision Room canary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/ops-decision-closure/bin/final-proof.py')
          s=p.read_text(encoding='utf-8')
          if 'import html\n' not in s:
              s=s.replace('import hashlib\n', 'import hashlib\nimport html\n', 1)
          start=s.index('def answerability(')
          end=s.index('\ndef dd_packet', start)
          replacement='''def answerability(packet, html_path):
              text = html.unescape(html_path.read_text(encoding='utf-8'))
              outcome = next((x for x in packet['outcomes'] if x.get('kind') == 'outcome'), packet['outcomes'][0] if packet['outcomes'] else {'id': 'None', 'statement': 'None'})
              checks = [
                  ('question', [packet['question']]),
                  ('recommendation', [str(packet['recommendation'])]),
                  ('evidence_for', [packet['evidence_for'][0]['statement'] if packet['evidence_for'] else 'None']),
                  ('evidence_against', [packet['evidence_against'][0]['statement'] if packet['evidence_against'] else 'None']),
                  ('alternatives', [packet['alternatives'][0]['name'] if packet['alternatives'] else 'None']),
                  ('gaps', [packet['gaps'][0]['statement'] if packet['gaps'] else 'None']),
                  ('next_action', [packet['next_action']]),
                  ('success_failure', [*packet['success_conditions'], *packet.get('stop_conditions', [])]),
                  ('outcomes', [outcome['id'], outcome['statement']]),
              ]
              results = [{'id': key, 'answers': values, 'visible': all(str(value) in text for value in values)} for key, values in checks]
              return {
                  'schema': 'ops.humanAdoptionAnswerability.v2',
                  'reviewer': 'independent-static-reader-fixture',
                  'reviewerClass': 'machine canary; literal independent human review remains separate',
                  'mandatoryQuestionCount': len(results),
                  'mandatoryQuestionAccuracy': sum(1 for x in results if x['visible']) / len(results),
                  'sqlOrJsonlDirectOperationCount': 0,
                  'results': results,
                  'status': 'PASS_MACHINE_ANSWERABILITY' if all(x['visible'] for x in results) else 'BLOCKED_HUMAN_ADOPTION',
              }
          '''
          replacement='\n'.join(line[14:] if line.startswith('              ') else line for line in replacement.splitlines())+'\n'
          p.write_text(s[:start]+replacement+s[end:],encoding='utf-8')

          t=Path('packages/ops-decision-closure/tests/final-e2e.mjs')
          x=t.read_text(encoding='utf-8')
          anchor='  assert.equal(receipt.humanAI.actionCandidateCount, 5);\n'
          addition=anchor+'  assert.equal(receipt.humanAI.machineAnswerability, "PASS_MACHINE_ANSWERABILITY");\n'
          if 'PASS_MACHINE_ANSWERABILITY' not in x:
              assert anchor in x
              x=x.replace(anchor,addition,1)
          t.write_text(x,encoding='utf-8')
          PY

      - name: Acquire exact DuckDB proof comparator
        id: duck
        shell: bash
        env:
          PAYLOAD_SHA: 3d33b1df037cb049155c393778df7853fafb23e9d49d7c9cacdde4dd67155788
          TAG: duckdb-carrier-v1.5.5-3d33b1df037c
        run: |
          set -euo pipefail
          carrier="$RUNNER_TEMP/duckdb.b64.txt"
          duckdb="$RUNNER_TEMP/duckdb"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/carrier.native.linux-amd64.$PAYLOAD_SHA.b64.txt" -o "$carrier"
          python3 - "$carrier" "$duckdb" "$PAYLOAD_SHA" <<'PY'
          import base64,hashlib,pathlib,sys
          src=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); expected=sys.argv[3]
          text=src.read_text(encoding='ascii')
          assert not any(c.isspace() for c in text)
          data=base64.b64decode(text,validate=True)
          assert base64.b64encode(data).decode('ascii')==text
          assert hashlib.sha256(data).hexdigest()==expected
          out.write_bytes(data)
          PY
          chmod 0555 "$duckdb"
          echo "path=$duckdb" >> "$GITHUB_OUTPUT"

      - name: Replay final proof and retain detailed evidence
        shell: bash
        env:
          DUCKDB: ${{ steps.duck.outputs.path }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ops115-final"
          OPS_DUCKDB="$DUCKDB" node packages/ops-decision-closure/tests/final-e2e.mjs
          python3 packages/ops-decision-closure/bin/final-proof.py \
            --out-dir "$RUNNER_TEMP/ops115-final" --duckdb "$DUCKDB" \
            --source-commit 0000000000000000000000000000000000000000 \
            --source-tree 0000000000000000000000000000000000000000

          evidence=evidence/ops-115-decision-closure
          cp "$RUNNER_TEMP/ops115-final/final-closure-receipt.json" "$evidence/implementation-proof.json"
          cp "$RUNNER_TEMP/ops115-final/human-adoption-answerability.json" "$evidence/human-adoption-answerability.json"
          cp "$RUNNER_TEMP/ops115-final/decision-packet.json" "$evidence/decision-packet.json"
          cp "$RUNNER_TEMP/ops115-final/decision-room.html" "$evidence/decision-room.html"
          cp "$RUNNER_TEMP/ops115-final/decision-economics-summary.json" "$evidence/decision-economics-summary.json"
          cp "$RUNNER_TEMP/ops115-final/decision-economics-runs.json" "$evidence/decision-economics-runs.json"
          cp "$RUNNER_TEMP/ops115-final/reuse-provenance.json" "$evidence/reuse-provenance.json"
          cp "$RUNNER_TEMP/ops115-final/artifact-manifest.json" "$evidence/implementation-artifact-manifest.json"
          rm -rf "$evidence/action-candidates"
          cp -R "$RUNNER_TEMP/ops115-final/action-candidates" "$evidence/action-candidates"

      - name: Commit focused result and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-ops115-l2-evidence.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: prove Decision Room answerability and economics details'
          git push origin HEAD:feat/ops-115-decision-closure-final-v2
