name: materialize-exact-candidate-ops

on:
  push:
    branches:
      - transport/exact-gov-package-receipts-260829
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-exact-candidate-ops
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize exact non-workflow candidate
        env:
          BASE_SHA: 3a6fda79212bdb646ea5597f794b5b9e6636daf6
          EXPECTED_TREE: c4567f3fe630603980193798f2fc03bc40491c29
          ARCHIVE_SHA256: 1d24f91e3f0111489e41dd74e85563f9e54586dde7fdb05f757174f04c680096
          TARGET_BRANCH: feat/exact-gov-package-obligation-receipts-260829
          FINAL_COMMIT: 6fcecb96585570081a53c81aa94b955a09721046
          FINAL_TREE: 4b227c0c9d8bf3120142cf2ba3b777a928452654
          COMMIT_MESSAGE: "feat: prepare exact gov package obligation receipts"
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if test "$remote_head" = "$FINAL_COMMIT"; then
            test "$(git rev-parse "$FINAL_COMMIT^{tree}")" = "$FINAL_TREE"
            {
              echo "candidate already materialized"
              echo "commit=$FINAL_COMMIT"
              echo "tree=$FINAL_TREE"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          transport="$RUNNER_TEMP/materializer"
          mkdir -p "$transport"
          cp .materializer/part-*.txt "$transport/"
          cp .materializer/files.txt .materializer/delete.txt "$transport/"
          git cat-file -e "$BASE_SHA^{commit}"
          git reset --hard "$BASE_SHA"
          git clean -fdx
          cat "$transport"/part-*.txt | base64 -d > "$transport/changes.tar.xz"
          test "$(sha256sum "$transport/changes.tar.xz" | awk '{print $1}')" = "$ARCHIVE_SHA256"
          python3 - "$transport/changes.tar.xz" "$transport/files.txt" <<'PY2'
          import pathlib,sys,tarfile
          archive=pathlib.Path(sys.argv[1])
          expected=[line for line in pathlib.Path(sys.argv[2]).read_text().splitlines() if line]
          with tarfile.open(archive,'r:xz') as tf:
              names=[]
              for member in tf.getmembers():
                  p=pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts or not member.isfile():
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  names.append(member.name)
              if sorted(names)!=sorted(expected):
                  raise SystemExit(f'archive inventory mismatch: expected={expected} observed={names}')
              tf.extractall('.',filter='data')
          PY2
          while IFS= read -r path; do
            test -z "$path" || rm -f -- "$path"
          done < "$transport/delete.txt"
          git checkout "$BASE_SHA" -- .github/workflows/gov-package-validation.yml
          git add -A
          observed_tree="$(git write-tree)"
          test "$observed_tree" = "$EXPECTED_TREE"
          node packages/ops-package-responses/tests/e2e.mjs
          node packages/ops-gov-package-output/tests/e2e.mjs
          python3 - <<'PY2'
          import json
          from pathlib import Path
          for name in ('build/packages.jsonl','build/checks.jsonl','ci.intent.v1.jsonl'):
              for line in Path(name).read_text().splitlines():
                  if line.strip(): json.loads(line)
          PY2
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$COMMIT_MESSAGE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          {
            echo "base=$BASE_SHA"
            echo "tree=$EXPECTED_TREE"
            echo "commit=$(git rev-parse HEAD)"
            echo "target=$TARGET_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"

  focused-nix:
    needs: materialize
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6fcecb96585570081a53c81aa94b955a09721046
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Build exact package response checks only
        run: |
          set -euo pipefail
          mkdir -p focused-proof
          nix build --no-write-lock-file --print-out-paths \
            .#checks.x86_64-linux.ops-package-responses \
            > focused-proof/ops-package-responses.out-path
          nix build --no-write-lock-file --print-out-paths \
            .#checks.x86_64-linux.ops-gov-package-output \
            > focused-proof/ops-gov-package-output.out-path
          nix path-info --json \
            "$(cat focused-proof/ops-package-responses.out-path)" \
            "$(cat focused-proof/ops-gov-package-output.out-path)" \
            > focused-proof/nix-path-info.json
          test "$(git rev-parse HEAD)" = 6fcecb96585570081a53c81aa94b955a09721046
          test "$(git rev-parse HEAD^{tree})" = 4b227c0c9d8bf3120142cf2ba3b777a928452654
          git diff --exit-code
          printf '%s\n' 6fcecb96585570081a53c81aa94b955a09721046 \
            > focused-proof/ops-commit.txt
          printf '%s\n' 4b227c0c9d8bf3120142cf2ba3b777a928452654 \
            > focused-proof/ops-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exact-gov-package-receipts-focused-nix
          path: focused-proof
          if-no-files-found: error
