name: materialize-exact-candidate-ops

on:
  push:
    branches:
      - transport/exact-gov-package-receipts-260829
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-exact-candidate-ops
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    outputs:
      candidate_commit: ${{ steps.candidate.outputs.candidate_commit }}
      candidate_tree: ${{ steps.candidate.outputs.candidate_tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - id: candidate
        name: Materialize receipt evidence binding fix
        env:
          BASE_SHA: 6fcecb96585570081a53c81aa94b955a09721046
          EXPECTED_TREE: f565788a9dd39ec65a33fc55a8311074689a19cb
          ARCHIVE_SHA256: 6a98f2970169c14d3bd6a96224a5ddb37aa9d412f979b9833ce54abdbd702ef5
          TARGET_BRANCH: feat/exact-gov-package-obligation-receipts-260829
          COMMIT_MESSAGE: "fix: bind execution logs into package receipts"
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          remote_head="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          if test "$remote_head" != "$BASE_SHA"; then
            remote_tree="$(git rev-parse "$remote_head^{tree}")"
            test "$remote_tree" = "$EXPECTED_TREE"
            echo "candidate_commit=$remote_head" >> "$GITHUB_OUTPUT"
            echo "candidate_tree=$remote_tree" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          transport="$RUNNER_TEMP/materializer"
          mkdir -p "$transport"
          cp .materializer/fix-part-*.txt "$transport/"
          cp .materializer/fix-files.txt "$transport/"
          git cat-file -e "$BASE_SHA^{commit}"
          git reset --hard "$BASE_SHA"
          git clean -fdx
          cat "$transport"/fix-part-*.txt | base64 -d > "$transport/changes.tar.xz"
          test "$(sha256sum "$transport/changes.tar.xz" | awk '{print $1}')" = "$ARCHIVE_SHA256"
          python3 - "$transport/changes.tar.xz" "$transport/fix-files.txt" <<'PY2'
          import pathlib,sys,tarfile
          archive=pathlib.Path(sys.argv[1])
          expected=[line for line in pathlib.Path(sys.argv[2]).read_text().splitlines() if line]
          with tarfile.open(archive,'r:xz') as tf:
              names=[]
              for member in tf.getmembers():
                  p=pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts or not member.isfile():
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  names.append(member.name)
              if sorted(names)!=sorted(expected):
                  raise SystemExit(f'archive inventory mismatch: expected={expected} observed={names}')
              tf.extractall('.',filter='data')
          PY2
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          node packages/ops-package-responses/tests/e2e.mjs
          node packages/ops-gov-package-output/tests/e2e.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$COMMIT_MESSAGE"
          candidate_commit="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          test "$candidate_tree" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "candidate_commit=$candidate_commit" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$candidate_tree" >> "$GITHUB_OUTPUT"
          {
            echo "commit=$candidate_commit"
            echo "tree=$candidate_tree"
            echo "target=$TARGET_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"

  focused-nix:
    needs: materialize
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.candidate_commit }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Build exact package response checks only
        env:
          EXPECTED_COMMIT: ${{ needs.materialize.outputs.candidate_commit }}
          EXPECTED_TREE: ${{ needs.materialize.outputs.candidate_tree }}
        run: |
          set -euo pipefail
          mkdir -p focused-proof
          test "$EXPECTED_TREE" = f565788a9dd39ec65a33fc55a8311074689a19cb
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          nix build --no-write-lock-file --print-out-paths \
            .#checks.x86_64-linux.ops-package-responses \
            > focused-proof/ops-package-responses.out-path
          nix build --no-write-lock-file --print-out-paths \
            .#checks.x86_64-linux.ops-gov-package-output \
            > focused-proof/ops-gov-package-output.out-path
          nix path-info --json \
            "$(cat focused-proof/ops-package-responses.out-path)" \
            "$(cat focused-proof/ops-gov-package-output.out-path)" \
            > focused-proof/nix-path-info.json
          git diff --exit-code
          printf '%s\n' "$EXPECTED_COMMIT" > focused-proof/ops-commit.txt
          printf '%s\n' "$EXPECTED_TREE" > focused-proof/ops-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exact-gov-package-receipts-focused-nix
          path: focused-proof
          if-no-files-found: error
