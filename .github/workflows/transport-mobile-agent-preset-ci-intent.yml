name: Transport Mobile Agent preset CI intent

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/transport-mobile-agent-preset-ci-intent.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_BRANCH: proposal/mobile-agent-preset-static-app-260821
      EXPECTED_HEAD: 06461defb65dbaaaff925d04998466d7c3fa4722
    steps:
      - name: Append exactly one checked-in CI intent row
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          test "$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk 'NR==1 {print $1}')" = "$EXPECTED_HEAD"
          git clone --quiet --depth=1 --branch "$TARGET_BRANCH" "$remote" product
          python3 - product/ci.intent.v1.jsonl <<'PY'
          import json,pathlib,sys
          path=pathlib.Path(sys.argv[1])
          rows=[json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          target='.github/workflows/mobile-agent-preset-static-host.yml'
          assert not any(row.get('path')==target for row in rows)
          rows.append({
            'kind':'ci.intent.v1',
            'path':target,
            'provider':'github-actions',
            'role':'bootstrap_exception',
            'entrypoint':'PR exact 54-file existing-App bootstrap and maxGraph interaction proof; proposals push immutable Release; owner /mobile-agent-preset-deploy issue comment -> dedicated Cloudflare Pages deploy -> stable/immutable 54-file readback -> exact preset interaction and URL result comments',
            'source':'verification/mobile-agent-preset-app/manifest.json plus exact 54-file existing public projection until source/mobile-agent-presets-v1 promotion',
            'authority':False,
            'dispatch':['pull_request','push','issue_comment'],
            'push_branches':['proposals'],
            'generation_mode':'checked_in',
            'workflow_definition':'checked_in',
            'artifact_source':'immutable existing-preset maxGraph App archive, Carrier, Pages deployment and browser receipts',
            'artifact_generation':'generated',
            'final_role':'static_mobile_agent_preset_projection',
            'all_repositories_enforced':False,
            'exception':{
              'owner':'ops#233',
              'reason':'bounded existing-App bootstrap and Pages adapter until the exact Mobile Agent Git source ref is promoted; no preset, renderer, shell or codec is reimplemented',
              'expiry':'2027-08-21',
              'return_condition':'remove only the bootstrap source after source/mobile-agent-presets-v1 becomes accepted Git authority; retain the App and provider contracts',
            },
          })
          path.write_text('\n'.join(json.dumps(row,sort_keys=True,separators=(',',':'),ensure_ascii=False) for row in rows)+'\n',encoding='utf-8')
          PY
          git -C product diff --check
          test "$(git -C product diff --name-only)" = ci.intent.v1.jsonl
          git -C product config user.name github-actions[bot]
          git -C product config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C product add ci.intent.v1.jsonl
          git -C product commit --quiet -m 'chore: register existing preset App workflow intent'
          git -C product push --quiet origin "$TARGET_BRANCH"
