name: One-shot PR309 CI intent cleanup

on:
  push:
    branches:
      - proposal/mobile-agent-business-model-public-260823
    paths:
      - '.github/workflows/pr309-ci-intent-repair.yml'
      - '.github/workflows/mobile-agent-business-model-public.yml'
      - 'verification/mobile-agent-business-model-public/**'
      - 'verification/mobile-agent-business-model-presentation/**'

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'roccho-dev/ops' && github.ref == 'refs/heads/proposal/mobile-agent-business-model-public-260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/mobile-agent-business-model-public-260823
          fetch-depth: 0
      - name: Normalize current workflow declarations
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('ci.intent.v1.jsonl')
          records=[json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          self_path='.github/workflows/pr309-ci-intent-repair.yml'
          target='.github/workflows/mobile-agent-business-model-public.yml'
          actual={item.as_posix() for item in Path('.github/workflows').glob('*.yml') if item.as_posix()!=self_path}

          current={record['path']:record for record in records if record.get('path') in actual}
          assert target in current,target
          current[target]={
              'all_repositories_enforced':False,
              'artifact_generation':'generated',
              'artifact_source':'content-addressed one-file business-model/1 static projection and provider readback receipts',
              'authority':False,
              'dispatch':['pull_request','push','workflow_dispatch'],
              'entrypoint':'fixed UI/JSONL tests -> deterministic business-model/index.html -> real-Chrome URL proof; proposals push immutable Release; explicit workflow_dispatch -> isolated Cloudflare Pages deploy and stable/immutable readback',
              'exception':{
                  'expiry':'2027-08-23',
                  'owner':'ops#233',
                  'reason':'bounded Ops publication adapter until the dedicated mobile-agent source repository and business-model/1 registry authority exist',
                  'return_condition':'move business-model/1 source into the dedicated mobile-agent repository; retain only immutable Release and static-host provider effects in Ops'
              },
              'final_role':'static_mobile_agent_business_model_projection',
              'generation_mode':'checked_in',
              'kind':'ci.intent.v1',
              'path':target,
              'provider':'github-actions',
              'push_branches':['proposals'],
              'role':'bootstrap_exception',
              'source':'verification/mobile-agent-business-model-presentation plus verification/mobile-agent-business-model-public/manifest.json',
              'workflow_definition':'checked_in'
          }

          ordered=[]; emitted=set()
          for record in records:
              workflow=record.get('path')
              if workflow not in actual or workflow in emitted:
                  continue
              ordered.append(current[workflow]); emitted.add(workflow)
          assert emitted==actual, {'missing':sorted(actual-emitted),'stale':sorted(emitted-actual)}
          path.write_text(''.join(json.dumps(record,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n' for record in ordered),encoding='utf-8')
          print(json.dumps({'status':'PASS','workflows':len(actual),'removedRecords':len(records)-len(ordered),'updated':target}))
          PY
          git diff --check
          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          git add ci.intent.v1.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: align PR309 CI intent with narrowed projection'
          git push origin HEAD:proposal/mobile-agent-business-model-public-260823
