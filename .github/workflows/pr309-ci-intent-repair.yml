name: One-shot PR309 CI intent cleanup

on:
  push:
    branches:
      - proposal/mobile-agent-business-model-public-260823
    paths:
      - '.github/workflows/pr309-ci-intent-repair.yml'
      - '.github/workflows/mobile-agent-business-model-public.yml'
      - 'verification/mobile-agent-business-model-public/**'
      - 'verification/mobile-agent-business-model-presentation/**'

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'roccho-dev/ops' && github.ref == 'refs/heads/proposal/mobile-agent-business-model-public-260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/mobile-agent-business-model-public-260823
          fetch-depth: 0
      - name: Remove stale workflow declarations only
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('ci.intent.v1.jsonl')
          records=[json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          self_path='.github/workflows/pr309-ci-intent-repair.yml'
          actual={item.as_posix() for item in Path('.github/workflows').glob('*.yml') if item.as_posix()!=self_path}
          kept=[]; emitted=set()
          for record in records:
              workflow=record['path']
              if workflow not in actual or workflow in emitted:
                  continue
              kept.append(record); emitted.add(workflow)
          assert emitted==actual, {'missing':sorted(actual-emitted),'stale':sorted(emitted-actual)}
          path.write_text(''.join(json.dumps(record,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n' for record in kept),encoding='utf-8')
          print(json.dumps({'status':'PASS','workflows':len(actual),'removedRecords':len(records)-len(kept)}))
          PY
          git diff --check
          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          git add ci.intent.v1.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: remove stale PR309 proof CI intent'
          git push origin HEAD:proposal/mobile-agent-business-model-public-260823
