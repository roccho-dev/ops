name: One-shot PR309 CI intent repair

on:
  push:
    branches:
      - proposal/mobile-agent-business-model-public-260823
    paths:
      - '.github/workflows/pr309-ci-intent-repair.yml'
      - '.github/workflows/mobile-agent-business-model-public.yml'
      - 'verification/mobile-agent-business-model-public/**'
      - 'verification/mobile-agent-business-model-presentation/**'

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'roccho-dev/ops' && github.ref == 'refs/heads/proposal/mobile-agent-business-model-public-260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/mobile-agent-business-model-public-260823
          fetch-depth: 0
      - name: Add exact missing workflow declarations
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          path = Path("ci.intent.v1.jsonl")
          records = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          additions = json.loads(base64.b64decode("").decode("utf-8"))
          by_path = {record["path"]: record for record in records}
          for record in additions:
              by_path.setdefault(record["path"], record)

          output = []
          emitted = set()
          for record in records:
              workflow = record["path"]
              if workflow in emitted:
                  continue
              output.append(by_path[workflow])
              emitted.add(workflow)
          for record in additions:
              workflow = record["path"]
              if workflow not in emitted:
                  output.append(record)
                  emitted.add(workflow)

          actual = {
              item.as_posix()
              for item in Path(".github/workflows").glob("*.yml")
              if item.name != "pr309-ci-intent-repair.yml"
          }
          assert emitted == actual, {
              "missing": sorted(actual - emitted),
              "stale": sorted(emitted - actual),
          }
          path.write_text(
              "".join(json.dumps(record, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n" for record in output),
              encoding="utf-8",
          )
          PY
          git diff --check
          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          git add ci.intent.v1.jsonl
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: declare all checked-in workflows"
          git push origin HEAD:proposal/mobile-agent-business-model-public-260823
