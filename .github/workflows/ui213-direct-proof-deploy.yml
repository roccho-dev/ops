name: UI213 deployed publication proof

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  deploy-proof:
    if: >-
      github.event.issue.number == 230 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/ui213-proof-42d84af5'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UI_SHA: 368fa24249661af7fb99709ede6a615e86884e30
      TREE_DIGEST: sha256:f97d66f4ad646109faed0ae6d44c78d5ce1d93d49ff323935c60121b7ecd5e1f
      EXPECTED_FILES: '589'
      DEPLOYMENT_URL: https://42d84af5.stg-artifact-runtime.pages.dev
      ROOT_URL: https://42d84af5.stg-artifact-runtime.pages.dev/releases/f97d66f4ad646109faed0ae6d44c78d5ce1d93d49ff323935c60121b7ecd5e1f
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch exact UI source
        shell: bash
        run: |
          set -euo pipefail
          ui="$RUNNER_TEMP/ui"
          git clone --filter=blob:none --no-checkout https://github.com/roccho-dev/ui.git "$ui"
          git -C "$ui" fetch --depth=1 origin "$UI_SHA"
          git -C "$ui" checkout --detach "$UI_SHA"
          test "$(git -C "$ui" rev-parse HEAD)" = "$UI_SHA"

      - name: Public all-file SHA readback over IPv4
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$ROOT_URL" "$TREE_DIGEST" "$EXPECTED_FILES" "$RUNNER_TEMP/readback.json" <<'PY'
          import concurrent.futures,hashlib,json,subprocess,sys
          from pathlib import Path
          root,expected_tree,expected_count,out=sys.argv[1],sys.argv[2],int(sys.argv[3]),Path(sys.argv[4])
          def get(url):
              return subprocess.check_output(['curl','-4','--fail','--silent','--show-error','--retry','5','--retry-all-errors','--connect-timeout','10','--max-time','30',url])
          manifest=json.loads(get(root+'/artifact-manifest.json'))
          assert manifest['treeDigest']==expected_tree,(manifest['treeDigest'],expected_tree)
          assert len(manifest['files'])==expected_count,(len(manifest['files']),expected_count)
          def check(item):
              data=get(root+'/'+item['path'])
              assert len(data)==item['bytes'],item['path']
              assert 'sha256:'+hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
              return item['path']
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              checked=list(pool.map(check,manifest['files']))
          receipt={'schema':'ui213-public-readback/1','status':'PASS','uiSha':'368fa24249661af7fb99709ede6a615e86884e30','treeDigest':expected_tree,'files':len(checked),'rootUrl':root,'network':'IPv4'}
          out.write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(receipt,sort_keys=True,separators=(',',':')))
          PY

      - name: Install Chromium proof tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.57.0'
          python3 -m playwright install --with-deps chromium

      - name: Public graph map seq Chrome proof over IPv4
        shell: bash
        run: |
          set -euo pipefail
          ui="$RUNNER_TEMP/ui"
          node --input-type=module - "$ui" "$ROOT_URL" "$RUNNER_TEMP/urls.json" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const [ui,root,out]=process.argv.slice(2);
          const { createUrlModuleUrl }=await import(pathToFileURL(path.join(ui,'packages/url-module/src/index.mjs')).href);
          const urls={};
          for (const id of ['graph','map','seq']) {
            const text=fs.readFileSync(path.join(ui,'examples',id,'example.jsonl'),'utf8');
            urls[id]=await createUrlModuleUrl({base:`${root}/adapters/${id}/`,fragment:'data',value:text});
          }
          fs.writeFileSync(out,JSON.stringify(urls));
          NODE
          python3 - "$RUNNER_TEMP/urls.json" "$RUNNER_TEMP/browser-proof.json" "$RUNNER_TEMP" <<'PY'
          import json,socket,sys
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          urls=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          out=Path(sys.argv[2]); temp=Path(sys.argv[3]); expected={'graph':'graph/1','map':'map/1','seq':'seq/1'}
          host=urlparse(next(iter(urls.values()))).hostname
          ip=socket.gethostbyname(host)
          receipts=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage',f'--host-resolver-rules=MAP {host} {ip}'])
              context=browser.new_context(viewport={'width':1280,'height':900})
              for feature,url in urls.items():
                  page=context.new_page(); errors=[]
                  page.on('pageerror',lambda error,bucket=errors: bucket.append(str(error)))
                  page.goto(url,wait_until='networkidle',timeout=30000); page.wait_for_timeout(1200)
                  status=page.locator('html').get_attribute('data-status'); fatal=page.locator('#fatal').text_content() or ''
                  assert status=='pass',(feature,status,fatal,errors)
                  proof=page.evaluate('() => globalThis.uiFeatureProof')
                  assert proof['feature']['id']==feature
                  assert proof['mounted']['pattern']==expected[feature]
                  assert proof['mounted']['records']>1 and proof['mounted']['svg'] is True
                  assert page.locator('iframe').count()==0
                  svg=page.locator('#feature svg').first; assert svg.count()==1
                  box=svg.bounding_box(); assert box and box['width']>0 and box['height']>0
                  assert svg.locator(':scope > *').count()>0
                  assert '#data=' in page.url and '#smap' not in page.url and 'smap-ref' not in page.url
                  assert errors==[],(feature,errors)
                  shot=temp/f'ui213-{feature}.png'; page.screenshot(path=str(shot),full_page=True)
                  receipts.append({'feature':feature,'pattern':expected[feature],'records':proof['mounted']['records'],'iframe':0,'svgVisible':True,'url':page.url})
                  page.close()
              context.close(); browser.close()
          receipt={'schema':'ui213-public-browser-proof/1','status':'PASS','uiSha':'368fa24249661af7fb99709ede6a615e86884e30','transport':'#data','network':'IPv4','features':receipts}
          out.write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True,separators=(',',':')))
          PY

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: ui213-deployed-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/readback.json
            ${{ runner.temp }}/browser-proof.json
            ${{ runner.temp }}/ui213-graph.png
            ${{ runner.temp }}/ui213-map.png
            ${{ runner.temp }}/ui213-seq.png
          if-no-files-found: error
          retention-days: 30

      - name: Report proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          ## UI #213 deployed proof — PASS

          - UI commit: \`$UI_SHA\`
          - publication tree: \`$TREE_DIGEST\`
          - deployment URL: $DEPLOYMENT_URL
          - content-addressed root: $ROOT_URL
          - public all-file SHA readback: **$EXPECTED_FILES/$EXPECTED_FILES PASS**
          - public graph/map/seq Chromium proof: **3/3 PASS**
          - URL transport: **#data**
          - iframe count: **0**
          - public verification network: **IPv4**

          \`$(cat "$RUNNER_TEMP/readback.json")\`
          \`$(cat "$RUNNER_TEMP/browser-proof.json")\`
          EOF
          gh issue comment 230 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
