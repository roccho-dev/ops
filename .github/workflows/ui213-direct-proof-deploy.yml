name: UI213 exact deploy proof

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  deploy-proof:
    if: >-
      github.event.issue.number == 230 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/ui213-deploy-368fa242'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: cloudflare-production
    env:
      UI_REPO: roccho-dev/ui
      UI_SHA: 368fa24249661af7fb99709ede6a615e86884e30
      PROJECT: stg-artifact-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize exact UI publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ui="$RUNNER_TEMP/ui"
          publication="$RUNNER_TEMP/publication"
          site="$RUNNER_TEMP/site"
          git clone --filter=blob:none --no-checkout "https://github.com/$UI_REPO.git" "$ui"
          git -C "$ui" fetch --depth=1 origin "$UI_SHA"
          git -C "$ui" checkout --detach "$UI_SHA"
          test "$(git -C "$ui" rev-parse HEAD)" = "$UI_SHA"
          (
            cd "$ui"
            node packages/source-compiler/tests/boundary.mjs
            node packages/url-module/tests/run.mjs
            node apps/artifact-shell/scripts/build-registry.mjs --check
            node apps/artifact-shell/tests/publication.mjs
            node tests/check-semantic-map-migration.mjs
            node apps/artifact-shell/tests/semantic-map-capability.mjs
            node tests/check-semantic-map-legacy-source-retirement.mjs
          )
          (cd "$ui" && node apps/artifact-shell/scripts/build-publication.mjs --out="$publication")
          mapfile -t meta < <(python3 - "$publication/artifact-manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding='utf-8'))
          assert m['schema']=='artifact-shell-publication-artifact/2'
          tree=m['treeDigest']
          print(tree)
          print(tree.removeprefix('sha256:'))
          print(len(m['files']))
          PY
          )
          TREE_DIGEST="${meta[0]}"
          TREE_ID="${meta[1]}"
          EXPECTED_FILES="${meta[2]}"
          printf 'TREE_DIGEST=%s\nTREE_ID=%s\nEXPECTED_FILES=%s\n' "$TREE_DIGEST" "$TREE_ID" "$EXPECTED_FILES" >> "$GITHUB_ENV"
          mkdir -p "$site/releases/$TREE_ID"
          cp -a "$publication/." "$site/releases/$TREE_ID/"

      - name: Validate Cloudflare project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/cloudflare-project.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' "$api")"
          if [ "$code" = "404" ]; then
            npx --yes wrangler@4.112.0 pages project create "$PROJECT" --production-branch proposals
          elif [ "$code" = "200" ]; then
            python3 - "$RUNNER_TEMP/cloudflare-project.json" "$PROJECT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x.get('success') is True
          assert x['result']['name']==sys.argv[2]
          assert x['result']['production_branch']=='proposals'
          PY
          else
            cat "$RUNNER_TEMP/cloudflare-project.json" >&2
            exit 1
          fi

      - name: Deploy exact UI publication
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          test -f "$site/releases/$TREE_ID/artifact-manifest.json"
          output="$(npx --yes wrangler@4.112.0 pages deploy "$site" \
            --project-name "$PROJECT" --branch proposals --commit-hash "$UI_SHA" \
            --commit-message "UI #213 exact proof $TREE_ID" 2>&1)"
          printf '%s\n' "$output"
          urls="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | awk '!seen[$0]++')"
          deployment_url="$(printf '%s\n' "$urls" | grep -v -F "https://$PROJECT.pages.dev" | head -n1 || true)"
          if [ -z "$deployment_url" ]; then deployment_url="$(printf '%s\n' "$urls" | head -n1)"; fi
          test -n "$deployment_url"
          root_url="$deployment_url/releases/$TREE_ID"
          echo "DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"
          echo "ROOT_URL=$root_url" >> "$GITHUB_ENV"

      - name: Public all-file SHA readback
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/publication" "$ROOT_URL" "$RUNNER_TEMP/readback.json" <<'PY'
          import hashlib,json,sys,time,urllib.request
          from pathlib import Path
          local=Path(sys.argv[1]); root=sys.argv[2].rstrip('/'); out=sys.argv[3]
          m=json.loads((local/'artifact-manifest.json').read_text(encoding='utf-8'))
          def get(url):
              last=None
              for _ in range(8):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as r:
                          if r.status==200: return r.read()
                  except Exception as e: last=e
                  time.sleep(1)
              raise RuntimeError(f'GET failed {url}: {last}')
          remote_manifest=json.loads(get(root+'/artifact-manifest.json'))
          assert remote_manifest==m
          checked=0
          for item in m['files']:
              data=get(root+'/'+item['path'])
              assert len(data)==item['bytes'], item['path']
              assert 'sha256:'+hashlib.sha256(data).hexdigest()==item['sha256'], item['path']
              checked+=1
          receipt={'schema':'ui213-public-readback/1','status':'PASS','uiSha':'368fa24249661af7fb99709ede6a615e86884e30','treeDigest':m['treeDigest'],'files':checked,'rootUrl':root}
          Path(out).write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(receipt,sort_keys=True,separators=(',',':')))
          PY

      - name: Install browser proof tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.57.0'
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(f"CHROMIUM_EXECUTABLE={p.chromium.executable_path}")
          PY

      - name: Public graph map seq Chrome proof
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/ui" "$ROOT_URL" "$RUNNER_TEMP/urls.json" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const [ui,root,out]=process.argv.slice(2);
          const { createUrlModuleUrl } = await import(pathToFileURL(path.join(ui,'packages/url-module/src/index.mjs')).href);
          const urls={};
          for (const id of ['graph','map','seq']) {
            const text=fs.readFileSync(path.join(ui,'examples',id,'example.jsonl'),'utf8');
            urls[id]=await createUrlModuleUrl({base:`${root}/adapters/${id}/`,fragment:'data',value:text});
          }
          fs.writeFileSync(out,JSON.stringify(urls));
          NODE
          python3 - "$RUNNER_TEMP/urls.json" "$RUNNER_TEMP/browser-proof.json" "$RUNNER_TEMP" <<'PY'
          import json,sys
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          urls=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          out=Path(sys.argv[2]); root=Path(sys.argv[3]); expected={'graph':'graph/1','map':'map/1','seq':'seq/1'}
          receipts=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              context=browser.new_context(viewport={'width':1280,'height':900})
              for feature,url in urls.items():
                  page=context.new_page(); errors=[]
                  page.on('pageerror',lambda error,bucket=errors: bucket.append(str(error)))
                  page.goto(url,wait_until='networkidle',timeout=30000); page.wait_for_timeout(1200)
                  status=page.locator('html').get_attribute('data-status')
                  fatal=page.locator('#fatal').text_content() or ''
                  assert status=='pass',(feature,status,fatal,errors)
                  proof=page.evaluate('() => globalThis.uiFeatureProof')
                  assert proof['feature']['id']==feature
                  assert proof['mounted']['pattern']==expected[feature]
                  assert proof['mounted']['records']>1
                  assert proof['mounted']['svg'] is True
                  assert page.locator('iframe').count()==0
                  svg=page.locator('#feature svg').first; assert svg.count()==1
                  box=svg.bounding_box(); assert box and box['width']>0 and box['height']>0
                  assert svg.locator(':scope > *').count()>0
                  assert '#data=' in page.url and '#smap' not in page.url and 'smap-ref' not in page.url
                  assert errors==[],(feature,errors)
                  shot=root/f'ui213-{feature}.png'; page.screenshot(path=str(shot),full_page=True)
                  receipts.append({'feature':feature,'pattern':expected[feature],'records':proof['mounted']['records'],'url':page.url,'iframe':0,'svgVisible':True})
                  page.close()
              context.close(); browser.close()
          receipt={'schema':'ui213-public-browser-proof/1','status':'PASS','uiSha':'368fa24249661af7fb99709ede6a615e86884e30','transport':'#data','features':receipts}
          out.write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True,separators=(',',':')))
          PY

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: ui213-exact-deploy-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/readback.json
            ${{ runner.temp }}/browser-proof.json
            ${{ runner.temp }}/ui213-graph.png
            ${{ runner.temp }}/ui213-map.png
            ${{ runner.temp }}/ui213-seq.png
          if-no-files-found: error
          retention-days: 30

      - name: Report proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          readback="$(cat "$RUNNER_TEMP/readback.json")"
          browser="$(cat "$RUNNER_TEMP/browser-proof.json")"
          cat > "$RUNNER_TEMP/comment.md" <<EOF
          ## UI #213 exact deploy proof — PASS

          - UI commit: \`$UI_SHA\`
          - publication tree: \`$TREE_DIGEST\`
          - deployment URL: $DEPLOYMENT_URL
          - content-addressed root: $ROOT_URL
          - public all-file SHA readback: **$EXPECTED_FILES/$EXPECTED_FILES PASS**
          - public graph/map/seq Chrome proof: **3/3 PASS**
          - URL transport: **#data**
          - iframe count: **0**

          \`$readback\`
          \`$browser\`
          EOF
          gh issue comment 230 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
