name: Transport Mobile Agent public URL CI intents

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/transport-mobile-agent-public-url-ci-intent.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_BRANCH: proposal/mobile-agent-public-url-acceptance-260823
      EXPECTED_HEAD: d7233520292ed9731283b401bd1b131d0ec0c375
    steps:
      - name: Append exactly three CI intent rows to the exact product head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          observed="$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk 'NR==1 {print $1}')"
          test "$observed" = "$EXPECTED_HEAD"
          git clone --quiet --depth=1 --branch "$TARGET_BRANCH" "$remote" product
          python3 - product/ci.intent.v1.jsonl <<'PY'
          import json,pathlib,sys
          path=pathlib.Path(sys.argv[1])
          rows=[json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          existing={row.get('path') for row in rows}
          additions=[
            {
              'kind':'ci.intent.v1',
              'path':'.github/workflows/mobile-agent-public-url-acceptance.yml',
              'provider':'github-actions',
              'role':'bootstrap_exception',
              'entrypoint':'successful Mobile Agent deploy workflow_run or exact workflow_dispatch run -> exact artifact download -> stable and immutable browser re-proof -> canonical PASS receipt -> accepted/mobile-agent-public-url -> receipt-only Issue reporting',
              'source':'successful exact Mobile Agent producer run plus verification/mobile-agent-public-url/contract.json and trusted validator',
              'authority':False,
              'dispatch':['workflow_run','workflow_dispatch'],
              'generation_mode':'checked_in',
              'workflow_definition':'checked_in',
              'artifact_source':'exact producer deployment artifact plus stable and deployment-specific public browser proof',
              'artifact_generation':'generated',
              'final_role':'static_mobile_agent_public_url_acceptance',
              'all_repositories_enforced':False,
              'exception':{
                'owner':'ops#293',
                'reason':'bounded GitHub Actions acceptance adapter until the same receipt contract is enforced by a provider-neutral admission surface',
                'expiry':'2027-08-23',
                'return_condition':'replace only the Actions adapter while retaining the public URL contract, accepted receipt ref, and fail-closed reporting rule',
              },
            },
            {
              'kind':'ci.intent.v1',
              'path':'.github/workflows/mobile-agent-public-url-required.yml',
              'provider':'github-actions',
              'role':'bootstrap_exception',
              'entrypoint':'Mobile Agent PR exact-head -> wait for accepted/mobile-agent-public-url receipt -> validate candidate SHA and public proof -> required gate',
              'source':'accepted/mobile-agent-public-url canonical receipt plus trusted public URL validator',
              'authority':False,
              'dispatch':['pull_request'],
              'generation_mode':'checked_in',
              'workflow_definition':'checked_in',
              'artifact_source':'exact accepted public URL receipt',
              'artifact_generation':'generated',
              'final_role':'mobile_agent_public_url_required_check',
              'all_repositories_enforced':False,
              'exception':{
                'owner':'ops#293',
                'reason':'bounded exact-head GitHub required-check adapter for Mobile Agent public URL acceptance',
                'expiry':'2027-08-23',
                'return_condition':'replace only the GitHub required-check effect while retaining receipt validation and exact-head binding',
              },
            },
            {
              'kind':'ci.intent.v1',
              'path':'.github/workflows/mobile-agent-public-url-gate-selftest.yml',
              'provider':'github-actions',
              'role':'artifact_exporter',
              'entrypoint':'compile public URL validators -> reject destructive false-green receipts -> normalize and validate one positive fixture -> upload selftest receipts',
              'source':'checked-in validators, acceptance contract, and synthetic non-authority fixtures',
              'authority':False,
              'dispatch':['pull_request'],
              'generation_mode':'checked_in',
              'workflow_definition':'checked_in',
              'artifact_source':'validator destructive-case and positive normalization receipts',
              'artifact_generation':'generated',
              'final_role':'mobile_agent_public_url_gate_selftest',
              'all_repositories_enforced':False,
            },
          ]
          paths={row['path'] for row in additions}
          assert not (paths & existing), sorted(paths & existing)
          rows.extend(additions)
          path.write_text('\n'.join(json.dumps(row,sort_keys=True,separators=(',',':'),ensure_ascii=False) for row in rows)+'\n',encoding='utf-8')
          PY
          git -C product diff --check
          test "$(git -C product diff --name-only)" = ci.intent.v1.jsonl
          python3 - product/ci.intent.v1.jsonl <<'PY'
          import json,sys
          rows=[json.loads(line) for line in open(sys.argv[1],encoding='utf-8') if line.strip()]
          paths=[row.get('path') for row in rows]
          expected={
            '.github/workflows/mobile-agent-public-url-acceptance.yml',
            '.github/workflows/mobile-agent-public-url-required.yml',
            '.github/workflows/mobile-agent-public-url-gate-selftest.yml',
          }
          assert all(paths.count(path)==1 for path in expected)
          PY
          git -C product config user.name github-actions[bot]
          git -C product config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C product add ci.intent.v1.jsonl
          git -C product commit --quiet -m 'chore: register Mobile Agent public URL CI intents'
          git -C product push --quiet origin "$TARGET_BRANCH"
