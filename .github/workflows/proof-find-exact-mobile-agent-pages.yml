name: Find exact existing Mobile Agent Pages deployment

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/proof-find-exact-mobile-agent-pages.yml'

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proposal/mobile-agent-preset-static-app-260821
          path: product
          persist-credentials: false

      - name: Enumerate Pages deployments and locate exact 54-file App
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          python3 - "$GITHUB_WORKSPACE/product/verification/mobile-agent-preset-app/expected.json" "$RUNNER_TEMP/result.json" <<'PY'
          import hashlib,json,os,sys,time,urllib.error,urllib.parse,urllib.request

          expected=json.load(open(sys.argv[1],encoding='utf-8'))
          output=sys.argv[2]
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          api=f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json','User-Agent':'ops-mobile-agent-exact-readback/1'}

          def api_get(url):
              request=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(request,timeout=30) as response:
                  value=json.load(response)
              assert value.get('success') is True,(url,value.get('errors'))
              return value

          def read(url,timeout=20):
              request=urllib.request.Request(url,headers={'User-Agent':'ops-mobile-agent-exact-readback/1','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(request,timeout=timeout) as response:
                      return response.read(),response.geturl(),response.status
              except urllib.error.HTTPError as error:
                  return error.read(),error.geturl(),error.code
              except Exception as error:
                  return b'',str(error),0

          projects=[]
          page=1
          while True:
              value=api_get(f'{api}?per_page=100&page={page}')
              projects.extend(value['result'])
              info=value.get('result_info') or {}
              if page >= int(info.get('total_pages') or 1): break
              page+=1

          codec='protocol/v3/codec.mjs'
          app='app/index.html'
          sentinel=[codec,app,'.well-known/semantic-map.json']
          observations=[]
          match=None
          for project in projects:
              name=project['name']
              deployments=[]
              page=1
              while page<=3:
                  value=api_get(f'{api}/{urllib.parse.quote(name,safe="")}/deployments?per_page=100&page={page}')
                  deployments.extend(value['result'])
                  info=value.get('result_info') or {}
                  if page >= int(info.get('total_pages') or 1): break
                  page+=1
              for deployment in deployments:
                  base=(deployment.get('url') or '').rstrip('/')+'/'
                  if not base.startswith('https://'): continue
                  first=expected['files'][codec]
                  data,observed,status=read(base+codec)
                  if status!=200 or len(data)!=first['bytes'] or hashlib.sha256(data).hexdigest()!=first['sha256']:
                      continue
                  row={'project':name,'deploymentId':deployment.get('id'),'base':base,'environment':deployment.get('environment'),'sentinels':[]}
                  sentinel_ok=True
                  for rel in sentinel:
                      spec=expected['files'][rel]
                      data,observed,status=read(base+rel)
                      ok=status==200 and len(data)==spec['bytes'] and hashlib.sha256(data).hexdigest()==spec['sha256']
                      row['sentinels'].append({'path':rel,'status':status,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'ok':ok,'observed':observed})
                      if not ok: sentinel_ok=False
                  observations.append(row)
                  if not sentinel_ok: continue
                  files=[]
                  failed=[]
                  for rel,spec in sorted(expected['files'].items()):
                      data,observed,status=read(base+rel)
                      observed_sha=hashlib.sha256(data).hexdigest()
                      ok=status==200 and len(data)==spec['bytes'] and observed_sha==spec['sha256']
                      files.append({'path':rel,'status':status,'bytes':len(data),'sha256':observed_sha,'ok':ok,'observed':observed})
                      if not ok: failed.append(rel)
                  row['files']=files
                  row['failed']=failed
                  if not failed:
                      match=row
                      break
              if match: break

          result={'schema':'ops.mobileAgentExactPagesSearch/1','status':'PASS' if match else 'NOT_FOUND','authority':False,'projects':[p['name'] for p in projects],'observations':observations,'match':match}
          open(output,'w',encoding='utf-8').write(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps({'status':result['status'],'projects':len(projects),'sentinelCandidates':len(observations),'match':None if not match else {'project':match['project'],'base':match['base'],'files':len(match['files'])}}))
          PY
          cat "$RUNNER_TEMP/result.json"

      - name: Upload read-only search receipt
        uses: actions/upload-artifact@v4
        with:
          name: exact-mobile-agent-pages-search-${{ github.run_id }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error
          retention-days: 14
