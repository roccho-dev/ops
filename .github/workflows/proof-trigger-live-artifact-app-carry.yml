name: Trigger accepted Artifact Runtime App Carry

on:
  push:
    branches:
      - proof/trigger-live-artifact-app-carry-260821

permissions:
  contents: read
  issues: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger the merged app-ID-only workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: "195"
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/request.md" <<'EOF'
          /artifact-app-carry
          {"schema":"artifact-app-carry/1","app_id":"artifact-runtime.bidirectional","request_id":"artifact-runtime-bidirectional-live-260821"}
          EOF
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/request.md"
