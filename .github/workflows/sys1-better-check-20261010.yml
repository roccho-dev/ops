name: Sys1 better-check evidence verification

# The paid trial at dfb40c2438a54aa9154c0594bd29e7fa83e467e9 is closed.
# Its first-run/first-attempt guard forbids replay. This current source has no model key or paid entry.
on:
  push:
    branches: [codex/sys1-eval-loop-20261010]
    paths:
      - '.github/workflows/sys1-better-check-20261010.yml'
      - 'experiments/sys1-eval-loop/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recompute retained comparison and reject false claims without model credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test experiments/sys1-eval-loop/test.mjs experiments/sys1-eval-loop/suites.test.mjs experiments/sys1-eval-loop/better-check.test.mjs
