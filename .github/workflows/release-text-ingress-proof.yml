name: Release text ingress proof

on:
  push:
    paths:
      - "packages/chatgpt-capability/ingress/**"
      - ".github/workflows/release-text-ingress-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Unit proof
        run: node packages/chatgpt-capability/ingress/release-text-worker.test.mjs

      - name: Live public Release Carrier proof
        run: |
          set -euo pipefail
          node packages/chatgpt-capability/ingress/release-text-worker.live.mjs | tee "$RUNNER_TEMP/release-text-ingress-proof.json"

      - name: Preserve proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-text-ingress-proof-${{ github.sha }}
          path: ${{ runner.temp }}/release-text-ingress-proof.json
          if-no-files-found: error
          retention-days: 30

  apply-private-migration-patch:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/chore/public-ops-control-surfaces-20260821' &&
      github.actor == github.repository_owner
    permissions:
      contents: write
      issues: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read and verify the one-time patch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: 7882b05533b8c4a40791f8b93d9ce26adcf7c94a
          EXPECTED_TREE: f34624bb1a5fe3cef219a86d8e33fec0b3867c20
          EXPECTED_BRANCH: chore/public-ops-control-surfaces-20260821
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF#refs/heads/}" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE"..HEAD)" -eq 2
          test "$(git diff --name-only "$EXPECTED_BASE" HEAD)" = ".github/workflows/release-text-ingress-proof.yml"
          comments="$RUNNER_TEMP/comments.json"
          request="$RUNNER_TEMP/request.json"
          patch_gz="$RUNNER_TEMP/change.patch.gz"
          patch="$RUNNER_TEMP/change.patch"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/234/comments" > "$comments"
          python3 - "$comments" "$request" "$patch_gz" "$patch" <<'PY'
          import base64, gzip, hashlib, json, pathlib, sys

          comments = json.load(open(sys.argv[1], encoding="utf-8"))
          prefix = "/private-migration-patch\n"
          candidates = [
              row for row in comments
              if row.get("user", {}).get("login") == "roccho-dev"
              and row.get("body", "").startswith(prefix)
          ]
          if len(candidates) != 1:
              raise SystemExit(f"expected exactly one owner patch comment, got {len(candidates)}")
          request = json.loads(candidates[0]["body"][len(prefix):])
          expected = {
              "schema": "ops.privateMigrationPatch/1",
              "base_sha": "7882b05533b8c4a40791f8b93d9ce26adcf7c94a",
              "target_branch": "chore/public-ops-control-surfaces-20260821",
              "patch_sha256": "5e76c66104d42874e8556bf850b4e39e6c72756fb9a98aee07203f24a819357d",
              "gzip_sha256": "f589140e1e61c06bd9c01f234d0eeadc7fda2435cc7ba3ca56a45a3f93ef9a42",
              "result_tree": "f34624bb1a5fe3cef219a86d8e33fec0b3867c20",
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"{key} mismatch")
          encoded = request.get("patch_gzip_base64", "")
          if not encoded or any(ch.isspace() for ch in encoded):
              raise SystemExit("patch_gzip_base64 must be non-empty canonical Base64 without whitespace")
          try:
              compressed = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit(f"invalid Base64: {error}")
          if base64.b64encode(compressed).decode("ascii") != encoded:
              raise SystemExit("non-canonical Base64")
          if hashlib.sha256(compressed).hexdigest() != expected["gzip_sha256"]:
              raise SystemExit("gzip SHA mismatch")
          decoded = gzip.decompress(compressed)
          if hashlib.sha256(decoded).hexdigest() != expected["patch_sha256"]:
              raise SystemExit("patch SHA mismatch")
          pathlib.Path(sys.argv[2]).write_text(json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          pathlib.Path(sys.argv[3]).write_bytes(compressed)
          pathlib.Path(sys.argv[4]).write_bytes(decoded)
          PY

          git apply --check "$patch"
          git apply --index "$patch"
          git checkout "$EXPECTED_BASE" -- .github/workflows/release-text-ingress-proof.yml
          git add .github/workflows/release-text-ingress-proof.yml

          python3 - <<'PY'
          import json
          for path in (
              "verification/artifact-runtime-static-host/manifest.json",
          ):
              json.load(open(path, encoding="utf-8"))
          for line in open("ci.intent.v1.jsonl", encoding="utf-8"):
              if line.strip(): json.loads(line)
          PY
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f, aliases: true) }' \
            .github/workflows/artifact-runtime-static-host.yml \
            .github/workflows/nway-github-proof.yml \
            .github/workflows/artifact-runtime-source-carry.yml
          node tools/check-ci-intent-workflow-branches.mjs .
          git diff --cached --check

          actual_paths="$(git diff --cached --name-only "$EXPECTED_BASE" | sort)"
          expected_paths="$(printf '%s\n' \
            .github/workflows/artifact-runtime-source-carry.yml \
            .github/workflows/artifact-runtime-static-host.yml \
            .github/workflows/nway-github-proof.yml \
            ci.intent.v1.jsonl \
            verification/artifact-runtime-static-host/manifest.json | sort)"
          test "$actual_paths" = "$expected_paths"
          test "$(git write-tree)" = "$EXPECTED_TREE"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: separate public operation request surfaces"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^2 2>/dev/null || true)" = ""

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$EXPECTED_BRANCH"

# registered trigger
