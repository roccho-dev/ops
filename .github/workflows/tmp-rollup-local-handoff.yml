name: temporary Rollup local handoff

on:
  push:
    branches:
      - bootstrap/rollup-2.80.0-20260803
    paths:
      - .github/workflows/tmp-rollup-local-handoff.yml

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify committed bundle
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/mjs-bundler/bundle.mjs
          bytes=$(wc -c < dist/mjs-bundler/bundle.mjs | tr -d ' ')
          sha256=$(sha256sum dist/mjs-bundler/bundle.mjs | awk '{print $1}')
          test "$bytes" = "401149"
          test "$sha256" = "d89aba96e8311285a141faceac56665ccea4a228e15a0522edc2e3e70de39b05"
          printf 'bytes=%s\nsha256=%s\n' "$bytes" "$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload exact bundle
        uses: actions/upload-artifact@v4
        with:
          name: rollup-local-handoff-${{ github.run_id }}
          path: dist/mjs-bundler/bundle.mjs
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Commit receipt and remove temporary workflow
        shell: bash
        env:
          ARTIFACT_NAME: rollup-local-handoff-${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_COMMIT: ${{ github.sha }}
          BYTES: ${{ steps.verify.outputs.bytes }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              "schemaVersion": "ops.mjsBundlerLocalHandoff.v1",
              "status": "PASS",
              "runId": int(os.environ["RUN_ID"]),
              "runAttempt": int(os.environ["RUN_ATTEMPT"]),
              "artifactName": os.environ["ARTIFACT_NAME"],
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "path": "dist/mjs-bundler/bundle.mjs",
              "bytes": int(os.environ["BYTES"]),
              "sha256": os.environ["SHA256"],
              "temporaryWorkflowRemoved": True,
          }
          Path("packages/mjs-bundler/local-handoff.receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git rm .github/workflows/tmp-rollup-local-handoff.yml
          git add packages/mjs-bundler/local-handoff.receipt.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: record Rollup local-execution handoff"
          git push origin HEAD:bootstrap/rollup-2.80.0-20260803
