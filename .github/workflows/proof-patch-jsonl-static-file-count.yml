name: Generate exact JSONL static-host file-count patch

on:
  pull_request:
    branches:
      - proposal/jsonl-artifact-app-260821
    paths:
      - '.github/workflows/proof-patch-jsonl-static-file-count.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Patch only the obsolete listed-file assertion
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/artifact-runtime-static-host.yml
          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1]); source=path.read_text(encoding='utf-8')
          old="assert s['readback']['expectedListedFiles']==p['publication']['listedFiles']==54"
          new="assert s['readback']['expectedListedFiles']==p['publication']['listedFiles']==63"
          assert source.count(old)==1
          source=source.replace(old,new)
          path.write_text(source,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "$target"
          test "$(git diff --numstat | awk '{print $1, $2}')" = "1 1"
          grep -Fx "          assert s['readback']['expectedListedFiles']==p['publication']['listedFiles']==63" "$target"
          ! grep -F "listedFiles']==54" "$target"
          cp "$target" "$RUNNER_TEMP/artifact-runtime-static-host.yml"

      - name: Upload exact replacement file
        uses: actions/upload-artifact@v4
        with:
          name: jsonl-static-host-file-count-${{ github.run_id }}
          path: ${{ runner.temp }}/artifact-runtime-static-host.yml
          if-no-files-found: error
          retention-days: 1
