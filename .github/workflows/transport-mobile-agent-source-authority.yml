name: Transport Mobile Agent preset source authority

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/transport-mobile-agent-source-authority.yml'
      - '.github/transport/mobile-agent-source.bundle.b64.part*'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REF: source/mobile-agent-presets-v1
      EXPECTED_COMMIT: 608229b5a0b6fe370b07cef7c11a062e7add5ae1
      EXPECTED_TREE: 2abfe78594e92831009236df6d34902990be020d
      EXPECTED_B64_SHA256: 428f8ecb3408fd1df0708151dbe0e045dd9992443beeb5e175643ddf1a5228f9
      EXPECTED_BUNDLE_SHA256: 077ec461c791901cf5a84cd79363ba9775a3da5a86e88c5bf444f38c1550e710
      ORIGINAL_COMMIT: 1daa001bf780053f4319e3fb20b4ea9a6e0d0442
      ORIGINAL_TREE: 59ff130fc7e20a4b5762c21fe97b417fc7a454ad
      ORIGINAL_BUNDLE_SHA256: 208a70f3038896c9f0bd70b31d33244e913489caa7356e7968262ef0dc58bde6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and verify exact Git bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transport/mobile-agent-source.bundle.b64.part* > "$RUNNER_TEMP/source.bundle.b64"
          test "$(sha256sum "$RUNNER_TEMP/source.bundle.b64" | cut -d' ' -f1)" = "$EXPECTED_B64_SHA256"
          test -z "$(LC_ALL=C tr -d 'A-Za-z0-9+/=' < "$RUNNER_TEMP/source.bundle.b64")"
          base64 --decode "$RUNNER_TEMP/source.bundle.b64" > "$RUNNER_TEMP/source.git.bundle"
          test "$(sha256sum "$RUNNER_TEMP/source.git.bundle" | cut -d' ' -f1)" = "$EXPECTED_BUNDLE_SHA256"
          git bundle verify "$RUNNER_TEMP/source.git.bundle"
          test "$(git bundle list-heads "$RUNNER_TEMP/source.git.bundle" | awk '$2=="refs/heads/source/mobile-agent-presets-v1" {print $1}')" = "$EXPECTED_COMMIT"

      - name: Import exact source commit and verify provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/source.git.bundle" "refs/heads/$TARGET_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git rev-list --count FETCH_HEAD)" = 1
          work="$RUNNER_TEMP/source-worktree"
          git worktree add --detach "$work" FETCH_HEAD
          python3 - "$work" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          authority=json.loads((root/'.source-authority.json').read_text(encoding='utf-8'))
          manifest=json.loads((root/'source-manifest.json').read_text(encoding='utf-8'))
          assert authority['schema']=='imported-source-authority/1'
          assert authority['status']=='candidate' and authority['authority'] is False
          assert authority['target']=='source/mobile-agent-presets-v1'
          assert authority['provenance']=={
            'sourceCommit':'1daa001bf780053f4319e3fb20b4ea9a6e0d0442',
            'sourceTree':'59ff130fc7e20a4b5762c21fe97b417fc7a454ad',
            'fullBundleSha256':'sha256:208a70f3038896c9f0bd70b31d33244e913489caa7356e7968262ef0dc58bde6',
            'sourceArchiveSha256':'sha256:dc10b62a030b8cda8cfa278fadb3c3fc00b6da2b145c9d194e07328f5a7a7a68',
          }
          assert authority['boundary']=={
            'implementationRewritten':False,
            'generatedDistIncluded':False,
            'fullHistoryIncluded':False,
            'exactSourceBytesVerifiedBy':'source-manifest.json',
          }
          assert manifest['schema']=='mobile-agent-preset-source/1' and manifest['authority'] is False
          assert manifest['provenance']['commit']=='1daa001bf780053f4319e3fb20b4ea9a6e0d0442'
          assert manifest['provenance']['tree']=='59ff130fc7e20a4b5762c21fe97b417fc7a454ad'
          listed={row['path']:row for row in manifest['files']}
          actual=[]
          excluded={'.source-authority.json','source-manifest.json'}
          for path in sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts):
            rel=path.relative_to(root).as_posix()
            if rel in excluded: continue
            data=path.read_bytes(); row=listed[rel]
            assert len(data)==row['bytes'],rel
            assert 'sha256:'+hashlib.sha256(data).hexdigest()==row['sha256'],rel
            actual.append(rel)
          assert actual==sorted(listed)
          registry=(root/'packages/pattern/view-types/registry.js').read_text(encoding='utf-8')
          renderer=(root/'packages/renderer-maxgraph/adapter.js').read_text(encoding='utf-8')
          shell=(root/'packages/app/main.js').read_text(encoding='utf-8')
          codec=(root/'packages/transport/smap-codec.js').read_text(encoding='utf-8')
          for value in ('map/1','graph/1','seq/1'): assert value in registry
          assert 'maxgraph' in registry.lower()
          assert len(renderer)>1000 and len(shell)>1000 and len(codec)>100
          PY
          (cd "$work" && node tests/pattern_test.mjs)
          (cd "$work" && node tests/protocol_test.mjs)

      - name: Publish exact Git source ref and read it back
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          current="$(git ls-remote "$remote" "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          if [ -n "$current" ]; then
            test "$current" = "$EXPECTED_COMMIT"
          else
            git push "$remote" "$EXPECTED_COMMIT:refs/heads/$TARGET_REF"
          fi
          test "$(git ls-remote "$remote" "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')" = "$EXPECTED_COMMIT"
          readback="$RUNNER_TEMP/readback"
          git init --quiet "$readback"
          git -C "$readback" remote add origin "$remote"
          git -C "$readback" fetch --quiet --depth=1 origin "$TARGET_REF"
          git -C "$readback" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$readback" rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git -C "$readback" rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git -C "$readback" rev-parse --is-shallow-repository)" = true
          test "$(git -C "$readback" rev-list --count HEAD)" = 1
          test -z "$(git -C "$readback" status --porcelain)"
          git -C "$readback" fsck --no-dangling
