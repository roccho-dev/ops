name: Proof readback Seq comment ingress

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/proof-readback-seq-comment-ingress.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read the latest completed Seq comment ingress run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 120); do
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/mobile-agent-seq-comment-ingress.yml/runs" \
              -f event=issue_comment -f per_page=20 > "$RUNNER_TEMP/runs.json"
            run_id="$(jq -r '.workflow_runs[0].id // empty' "$RUNNER_TEMP/runs.json")"
            status="$(jq -r '.workflow_runs[0].status // empty' "$RUNNER_TEMP/runs.json")"
            if [ -n "$run_id" ] && [ "$status" = completed ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          test "$(jq -r '.workflow_runs[0].status' "$RUNNER_TEMP/runs.json")" = completed
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          : > "$RUNNER_TEMP/failed.log"
          conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' "$RUNNER_TEMP/runs.json")"
          if [ "$conclusion" != success ]; then
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/failed.log" 2>&1 || true
          fi
          python3 - "$RUNNER_TEMP/runs.json" "$RUNNER_TEMP/jobs.json" "$RUNNER_TEMP/failed.log" > "$RUNNER_TEMP/comment.md" <<'PY'
          import json,pathlib,sys
          run=json.load(open(sys.argv[1],encoding='utf-8'))['workflow_runs'][0]
          jobs=json.load(open(sys.argv[2],encoding='utf-8'))['jobs']
          log=pathlib.Path(sys.argv[3]).read_text(encoding='utf-8',errors='replace')
          if len(log)>16000: log=log[-16000:]
          print('## Seq comment ingress run readback')
          print()
          print(f"- run: `{run['id']}`")
          print(f"- status / conclusion: `{run['status']} / {run.get('conclusion')}`")
          print(f"- head SHA: `{run['head_sha']}`")
          print(f"- event / created: `{run['event']} / {run['created_at']}`")
          print(f"- URL: {run['html_url']}")
          print('- jobs:')
          for job in jobs:
              print(f"  - `{job['name']}`: `{job['status']} / {job.get('conclusion')}` (job `{job['id']}`)")
              for step in job.get('steps',[]):
                  if step.get('conclusion') not in (None,'success','skipped'):
                      print(f"    - failed step `{step['number']} {step['name']}`: `{step['conclusion']}`")
          if log.strip():
              print()
              print('<details><summary>failed log tail</summary>')
              print()
              print('```text')
              print(log.rstrip())
              print('```')
              print('</details>')
          print()
          print('Read-only diagnostic. This PR must never merge.')
          PY
          gh issue comment 286 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
