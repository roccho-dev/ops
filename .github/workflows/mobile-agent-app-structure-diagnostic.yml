name: Mobile Agent App structure diagnostic

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/mobile-agent-app-structure-diagnostic.yml'
      - 'verification/mobile-agent-preset-app/migrate_projection.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect public App module embedding
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location --retry 5 --retry-all-errors --silent --show-error -H 'Cache-Control: no-cache' https://mobile-agent.roccho.workers.dev/app -o "$RUNNER_TEMP/app.html"
          python3 - "$RUNNER_TEMP/app.html" <<'PY'
          from html.parser import HTMLParser
          import hashlib,json,pathlib,sys
          path=pathlib.Path(sys.argv[1]); text=path.read_text(encoding='utf-8'); data=path.read_bytes()
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.rows=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='script': self.rows.append(dict(attrs))
          parser=Scripts(); parser.feed(text)
          terms=['importmap','data:text/javascript','semantic:packages/transport/index.js','semantic:packages/protocol/index.js','createSmapUrl','readSmapHash','SUPPORTED_PATTERNS','semanticMapRuntime','module-table','moduleTable']
          result={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'scripts':parser.rows,'terms':{}}
          for term in terms:
              positions=[]; start=0
              while True:
                  pos=text.find(term,start)
                  if pos<0: break
                  positions.append(pos); start=pos+1
                  if len(positions)>=5: break
              result['terms'][term]={'count':text.count(term),'positions':positions,'snippets':[text[max(0,p-160):p+360] for p in positions[:2]]}
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
