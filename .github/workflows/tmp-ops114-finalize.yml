name: Temporary finalize ops 114

on:
  push:
    branches:
      - feat/ops-114-git-write-closure-final
    paths:
      - .github/workflows/tmp-ops114-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble focused implementation, harden readback, and prove
        shell: bash
        env:
          SOURCE_SHA: 8c1787d94c4a6e451bbe2e2ccd6cf32797feb575
          SOURCE_BRANCH: proof/ops-114-115-260818
          PROOF_BRANCH: proposal/connector/ops114-raw-object-proof-260818-02
          PROOF_COMMIT: fe2486120b1277f62666090a38ee8e874bc089dd
          TARGET_BRANCH: feat/ops-114-git-write-closure-final
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/source-118"
          git fetch origin "refs/heads/$PROOF_BRANCH:refs/remotes/origin/proof-123"
          test "$(git rev-parse refs/remotes/origin/source-118)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/proof-123)" = "$PROOF_COMMIT"

          git archive "$SOURCE_SHA" \
            contracts/git_write/v1 \
            packages/ops-git-write-closure \
            runbooks/github-connector-write.md | tar -x

          mkdir -p evidence/ops-114-git-write-closure
          git show "refs/remotes/origin/proof-123:evidence/ops-114-git-write-closure/ops114-raw-object-proof-260818-02.jsonl" > /tmp/live-proof.jsonl
          test "$(git hash-object /tmp/live-proof.jsonl)" = 8cec83a3026b7900e92529020eccb97c7b13db12

          python3 .github/tmp/finalize-ops114.py
          rm -f .github/workflows/tmp-ops114-finalize.yml .github/tmp/finalize-ops114.py
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: productize GitHub write closure"
          git push origin "HEAD:$TARGET_BRANCH"
