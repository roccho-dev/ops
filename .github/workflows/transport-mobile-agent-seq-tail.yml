name: Transport exact Mobile Agent Seq tail

on:
  push:
    branches:
      - transport/mobile-agent-seq-tail-260823
    paths:
      - '.github/transport/mobile-agent-seq-tail/ready.json'

permissions:
  contents: read
  issues: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ISSUE_NUMBER: '286'
      OWNER: roccho-dev
      PREFIX_HEADER: SEQ-APP-BR/1
      TOTAL_CHUNKS: '11'
      EXISTING_CHUNKS: '8'
      TAIL_PARTS: '32'
      TAIL_CHARS: '109996'
      TAIL_SHA256: 34fedb0f86c174e04c0ecf24eb17178400160d84be17d2d2829f2068a7be057c
      PREFIX_CHARS: '400000'
      PREFIX_SHA256: 97b05fbf3dbee7399f175638b9815efb282388913e93ef928cdd56dfa9ad9be2
      FULL_CHARS: '509996'
      FULL_SHA256: a45fda69531262da67ba592fa026007107a1605117228bf149ccec64e8e3bd01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reconstruct, publish only missing chunks, and read back exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/seq-tail"
          mkdir -p "$root/comments"
          gh api -X GET "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f per_page=100 --paginate --slurp > "$root/pages-before.json"
          python3 - "$root/pages-before.json" "$root/full.b64" <<'PY'
          import hashlib,json,os,pathlib,re,sys
          pages=json.load(open(sys.argv[1],encoding='utf-8'))
          comments=[row for page in pages for row in page]
          owner=os.environ['OWNER']
          total=int(os.environ['TOTAL_CHUNKS'])
          existing=int(os.environ['EXISTING_CHUNKS'])
          header=re.escape(os.environ['PREFIX_HEADER'])
          pattern=re.compile(rf'^{header} ([0-9]{{2}})/{total:02d}\n([A-Za-z0-9+/=]+)$')
          found={}
          for row in comments:
              if row.get('user',{}).get('login') != owner:
                  continue
              match=pattern.fullmatch(str(row.get('body','')))
              if not match:
                  continue
              index=int(match.group(1))
              if index in found:
                  raise AssertionError(f'duplicate existing chunk {index}')
              found[index]=match.group(2)
          assert all(index in found for index in range(existing)), sorted(found)
          assert all(index not in found for index in range(existing,total)), sorted(found)
          prefix=''.join(found[index] for index in range(existing))
          assert len(prefix)==int(os.environ['PREFIX_CHARS'])
          assert hashlib.sha256(prefix.encode()).hexdigest()==os.environ['PREFIX_SHA256']
          parts_dir=pathlib.Path('.github/transport/mobile-agent-seq-tail/parts')
          paths=sorted(parts_dir.glob('part-*.txt'))
          assert len(paths)==int(os.environ['TAIL_PARTS']), [path.name for path in paths]
          tail=''.join(path.read_text(encoding='ascii') for path in paths)
          assert len(tail)==int(os.environ['TAIL_CHARS'])
          assert hashlib.sha256(tail.encode()).hexdigest()==os.environ['TAIL_SHA256']
          full=prefix+tail
          assert len(full)==int(os.environ['FULL_CHARS'])
          assert hashlib.sha256(full.encode()).hexdigest()==os.environ['FULL_SHA256']
          pathlib.Path(sys.argv[2]).write_text(full,encoding='ascii')
          for index in range(total):
              start=index*50000
              payload=full[start:start+50000]
              expected=50000 if index<10 else 9996
              assert len(payload)==expected,(index,len(payload))
              pathlib.Path(os.environ['RUNNER_TEMP'], 'seq-tail', 'comments', f'{index:02d}.md').write_text(
                  f"{os.environ['PREFIX_HEADER']} {index:02d}/{total:02d}\n{payload}",
                  encoding='ascii',
              )
          print(json.dumps({'status':'PASS','existing':sorted(found),'fullChars':len(full)}))
          PY
          for index in 08 09 10; do
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body-file "$root/comments/$index.md"
          done
          gh api -X GET "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f per_page=100 --paginate --slurp > "$root/pages-after.json"
          python3 - "$root/pages-after.json" <<'PY'
          import hashlib,json,os,re,sys
          pages=json.load(open(sys.argv[1],encoding='utf-8'))
          comments=[row for page in pages for row in page]
          owner=os.environ['OWNER']
          total=int(os.environ['TOTAL_CHUNKS'])
          header=re.escape(os.environ['PREFIX_HEADER'])
          pattern=re.compile(rf'^{header} ([0-9]{{2}})/{total:02d}\n([A-Za-z0-9+/=]+)$')
          found={}
          for row in comments:
              if row.get('user',{}).get('login') != owner:
                  continue
              match=pattern.fullmatch(str(row.get('body','')))
              if not match:
                  continue
              index=int(match.group(1))
              if index in found:
                  raise AssertionError(f'duplicate readback chunk {index}')
              found[index]=match.group(2)
          assert sorted(found)==list(range(total)),sorted(found)
          full=''.join(found[index] for index in range(total))
          assert len(full)==int(os.environ['FULL_CHARS'])
          assert hashlib.sha256(full.encode()).hexdigest()==os.environ['FULL_SHA256']
          print(json.dumps({'status':'PASS','chunks':len(found),'fullChars':len(full)}))
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body '/run-seq-comment-ingress'
