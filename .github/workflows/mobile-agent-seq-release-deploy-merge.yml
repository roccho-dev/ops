name: Merge Seq Release deploy after proof

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/mobile-agent-seq-release-deploy.yml'
      - '.github/workflows/mobile-agent-seq-release-deploy-merge.yml'
      - 'verification/mobile-agent-seq-release/**'

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Merge only after exact Release and local Chrome proof
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100")"
            conclusion="$(jq -r '[.check_runs[] | select(.name == "prove") | .conclusion] | map(select(. != null)) | last // empty' <<<"$checks")"
            if [ "$conclusion" = success ]; then
              gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch=false \
                --subject 'feat: deploy verified existing seq/1 URL' \
                --body 'Immutable GitHub Carrier, exact file identities, existing codec round-trip and local seq/1 maxGraph Chrome proof passed.'
              exit 0
            fi
            if [ -n "$conclusion" ] && [ "$conclusion" != success ]; then
              echo "prove concluded $conclusion" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'prove did not finish' >&2
          exit 1
