name: UI213 root-fixed deploy proof

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  deploy-proof:
    if: >-
      github.event.issue.number == 230 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/ui213-root-fix-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: cloudflare-production
    env:
      UI_REPO: roccho-dev/ui
      UI_SHA: 368fa24249661af7fb99709ede6a615e86884e30
      PROJECT: stg-artifact-runtime
      EXPECTED_TREE: sha256:f97d66f4ad646109faed0ae6d44c78d5ce1d93d49ff323935c60121b7ecd5e1f
      EXPECTED_FILES: '589'
      ALIAS_URL: https://stg-artifact-runtime.pages.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize exact publication and root projection
        shell: bash
        run: |
          set -euo pipefail
          ui="$RUNNER_TEMP/ui"
          publication="$RUNNER_TEMP/publication"
          site="$RUNNER_TEMP/site"
          git clone --filter=blob:none --no-checkout "https://github.com/$UI_REPO.git" "$ui"
          git -C "$ui" fetch --depth=1 origin "$UI_SHA"
          git -C "$ui" checkout --detach "$UI_SHA"
          test "$(git -C "$ui" rev-parse HEAD)" = "$UI_SHA"
          (
            cd "$ui"
            node packages/source-compiler/tests/boundary.mjs
            node packages/url-module/tests/run.mjs
            node apps/artifact-shell/scripts/build-registry.mjs --check
            node apps/artifact-shell/tests/publication.mjs
            node tests/check-semantic-map-migration.mjs
            node apps/artifact-shell/tests/semantic-map-capability.mjs
            node tests/check-semantic-map-legacy-source-retirement.mjs
            node apps/artifact-shell/scripts/build-publication.mjs --out="$publication"
          )
          python3 - "$publication/artifact-manifest.json" "$EXPECTED_TREE" "$EXPECTED_FILES" "$GITHUB_ENV" <<'PY'
          import json,sys
          path,expected_tree,expected_files,env=sys.argv[1],sys.argv[2],int(sys.argv[3]),sys.argv[4]
          m=json.load(open(path,encoding='utf-8'))
          assert m['schema']=='artifact-shell-publication-artifact/2'
          assert m['treeDigest']==expected_tree,(m['treeDigest'],expected_tree)
          assert len(m['files'])==expected_files,(len(m['files']),expected_files)
          tree_id=expected_tree.removeprefix('sha256:')
          with open(env,'a',encoding='utf-8') as out: out.write(f'TREE_ID={tree_id}\n')
          PY
          tree_id="${EXPECTED_TREE#sha256:}"
          mkdir -p "$site/releases/$tree_id"
          cp -a "$publication/." "$site/releases/$tree_id/"
          printf '/ /releases/%s/ 302\n' "$tree_id" > "$site/_redirects"
          test "$(cat "$site/_redirects")" = "/ /releases/$tree_id/ 302"
          test -f "$site/releases/$tree_id/index.html"
          test -f "$site/releases/$tree_id/artifact-manifest.json"

      - name: Validate Cloudflare project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/project.json" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")"
          test "$code" = 200
          python3 - "$RUNNER_TEMP/project.json" "$PROJECT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x.get('success') is True
          assert x['result']['name']==sys.argv[2]
          assert x['result']['production_branch']=='proposals'
          PY

      - name: Deploy root-fixed exact publication
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@4.112.0 pages deploy "$RUNNER_TEMP/site" --project-name "$PROJECT" --branch proposals --commit-hash "$UI_SHA" --commit-message "UI #213 root-fixed proof $TREE_ID" 2>&1)"
          printf '%s\n' "$output"
          urls="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' | awk '!seen[$0]++')"
          deployment_url="$(printf '%s\n' "$urls" | grep -v -F "https://$PROJECT.pages.dev" | head -n1 || true)"
          if [ -z "$deployment_url" ]; then deployment_url="$(printf '%s\n' "$urls" | head -n1)"; fi
          test -n "$deployment_url"
          echo "DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"
          echo "ROOT_URL=$deployment_url/releases/$TREE_ID" >> "$GITHUB_ENV"
          printf '%s\n' "$deployment_url" > "$RUNNER_TEMP/deployment-url.txt"

      - name: Verify bare roots and all publication bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/publication" "$DEPLOYMENT_URL" "$ALIAS_URL" "$TREE_ID" "$RUNNER_TEMP/readback.json" <<'PY'
          import concurrent.futures,hashlib,json,subprocess,sys,time
          from pathlib import Path
          local,deployment,alias,tree_id,out=Path(sys.argv[1]),sys.argv[2].rstrip('/'),sys.argv[3].rstrip('/'),sys.argv[4],Path(sys.argv[5])
          release=f'{deployment}/releases/{tree_id}'
          expected_location=f'/releases/{tree_id}/'
          def curl(args):
              return subprocess.check_output(['curl','-4','--silent','--show-error','--connect-timeout','10','--max-time','30',*args])
          def root_ready(base):
              last=None
              for _ in range(20):
                  try:
                      line=curl(['--output','/dev/null','--write-out','%{http_code}\t%{redirect_url}',base+'/']).decode()
                      code,target=line.split('\t',1)
                      if code=='302' and target.endswith(expected_location): return {'status':302,'redirect':target}
                      last=(code,target)
                  except Exception as e: last=repr(e)
                  time.sleep(1)
              raise AssertionError((base,last))
          root_deployment=root_ready(deployment)
          root_alias=root_ready(alias)
          local_index=(local/'index.html').read_bytes()
          for base in (deployment,alias):
              body=curl(['--location','--max-redirs','3','--fail','--retry','5','--retry-all-errors',base+'/'])
              assert hashlib.sha256(body).digest()==hashlib.sha256(local_index).digest(),base
          m=json.loads((local/'artifact-manifest.json').read_text(encoding='utf-8'))
          remote=json.loads(curl(['--location','--fail','--retry','5','--retry-all-errors',release+'/artifact-manifest.json']))
          assert remote==m
          def check(item):
              data=curl(['--location','--max-redirs','3','--fail','--retry','5','--retry-all-errors',release+'/'+item['path']])
              assert len(data)==item['bytes'],item['path']
              assert 'sha256:'+hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
              return item['path']
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool: checked=list(pool.map(check,m['files']))
          receipt={'schema':'ui213-root-public-readback/1','status':'PASS','uiSha':'368fa24249661af7fb99709ede6a615e86884e30','treeDigest':m['treeDigest'],'files':len(checked),'deploymentUrl':deployment,'aliasUrl':alias,'deploymentRoot':root_deployment,'aliasRoot':root_alias}
          out.write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(receipt,sort_keys=True,separators=(',',':')))
          PY

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.57.0'
          python3 -m playwright install --with-deps chromium

      - name: Verify exact bare URL and graph map seq in Chromium
        shell: bash
        run: |
          set -euo pipefail
          ui="$RUNNER_TEMP/ui"
          node --input-type=module - "$ui" "$ROOT_URL" "$RUNNER_TEMP/urls.json" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const [ui,root,out]=process.argv.slice(2);
          const { createUrlModuleUrl }=await import(pathToFileURL(path.join(ui,'packages/url-module/src/index.mjs')).href);
          const urls={};
          for (const id of ['graph','map','seq']) {
            const text=fs.readFileSync(path.join(ui,'examples',id,'example.jsonl'),'utf8');
            urls[id]=await createUrlModuleUrl({base:`${root}/adapters/${id}/`,fragment:'data',value:text});
          }
          fs.writeFileSync(out,JSON.stringify(urls));
          NODE
          python3 - "$DEPLOYMENT_URL" "$ALIAS_URL" "$TREE_ID" "$RUNNER_TEMP/urls.json" "$RUNNER_TEMP/browser-proof.json" "$RUNNER_TEMP" <<'PY'
          import json,socket,sys
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright
          deployment,alias,tree_id,urls_path,out_path,temp=sys.argv[1],sys.argv[2],sys.argv[3],Path(sys.argv[4]),Path(sys.argv[5]),Path(sys.argv[6])
          urls=json.loads(urls_path.read_text(encoding='utf-8'))
          expected_records={'graph':11,'map':9,'seq':17}; expected_pattern={'graph':'graph/1','map':'map/1','seq':'seq/1'}
          hosts={urlparse(deployment).hostname,urlparse(alias).hostname}
          rules=[]
          for host in sorted(hosts): rules.append(f'MAP {host} {socket.gethostbyname(host)}')
          receipts=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--host-resolver-rules='+','.join(rules)])
              context=browser.new_context(viewport={'width':1280,'height':900})
              for label,base in [('deployment',deployment),('alias',alias)]:
                  page=context.new_page(); errors=[]; failures=[]; bad=[]
                  page.on('pageerror',lambda e,b=errors:b.append(str(e)))
                  page.on('requestfailed',lambda r,b=failures:b.append((r.url,r.failure)))
                  page.on('response',lambda r,b=bad: b.append((r.url,r.status)) if r.status>=400 else None)
                  response=page.goto(base+'/',wait_until='networkidle',timeout=30000); page.wait_for_timeout(700)
                  assert response and response.ok,(label,response.status if response else None)
                  assert urlparse(page.url).path==f'/releases/{tree_id}/',(label,page.url)
                  assert page.title()=='UI',(label,page.title())
                  assert page.locator('body').get_attribute('data-mode')=='launcher'
                  links=page.locator('#launcher a'); assert links.count()==6,(label,links.count())
                  assert [links.nth(i).inner_text() for i in range(6)]==['graph','map','seq','presentation','control','graph-editor']
                  assert errors==[] and failures==[] and bad==[],(label,errors,failures,bad)
                  page.screenshot(path=str(temp/f'ui213-root-{label}.png'),full_page=True)
                  receipts.append({'surface':label+'-root','status':'PASS','finalUrl':page.url,'links':6,'httpFailures':0})
                  page.close()
              for feature,url in urls.items():
                  page=context.new_page(); errors=[]; failures=[]; bad=[]
                  page.on('pageerror',lambda e,b=errors:b.append(str(e)))
                  page.on('requestfailed',lambda r,b=failures:b.append((r.url,r.failure)))
                  page.on('response',lambda r,b=bad: b.append((r.url,r.status)) if r.status>=400 else None)
                  response=page.goto(url,wait_until='networkidle',timeout=30000); page.wait_for_timeout(1000)
                  assert response and response.ok,(feature,response.status if response else None)
                  status=page.locator('html').get_attribute('data-status'); fatal=page.locator('#fatal').text_content() or ''
                  assert status=='pass',(feature,status,fatal,errors,failures,bad)
                  proof=page.evaluate('() => globalThis.uiFeatureProof')
                  assert proof['feature']['id']==feature
                  assert proof['mounted']['pattern']==expected_pattern[feature]
                  assert proof['mounted']['records']==expected_records[feature]
                  assert proof['mounted']['svg'] is True
                  assert page.locator('iframe').count()==0
                  svg=page.locator('#feature svg').first; assert svg.count()==1
                  box=svg.bounding_box(); assert box and box['width']>0 and box['height']>0
                  assert svg.locator(':scope > *').count()>0
                  assert '#data=' in page.url and '#smap' not in page.url and 'smap-ref' not in page.url
                  assert errors==[] and failures==[] and bad==[],(feature,errors,failures,bad)
                  page.screenshot(path=str(temp/f'ui213-{feature}.png'),full_page=True)
                  receipts.append({'surface':feature,'status':'PASS','pattern':expected_pattern[feature],'records':expected_records[feature],'iframe':0,'svgVisible':True,'httpFailures':0,'url':page.url})
                  page.close()
              context.close(); browser.close()
          receipt={'schema':'ui213-root-browser-proof/1','status':'PASS','uiSha':'368fa24249661af7fb99709ede6a615e86884e30','transport':'#data','surfaces':receipts}
          out_path.write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True,separators=(',',':')))
          PY

      - name: Upload root proof
        uses: actions/upload-artifact@v4
        with:
          name: ui213-root-fixed-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/deployment-url.txt
            ${{ runner.temp }}/readback.json
            ${{ runner.temp }}/browser-proof.json
            ${{ runner.temp }}/ui213-root-deployment.png
            ${{ runner.temp }}/ui213-root-alias.png
            ${{ runner.temp }}/ui213-graph.png
            ${{ runner.temp }}/ui213-map.png
            ${{ runner.temp }}/ui213-seq.png
          if-no-files-found: error
          retention-days: 30
