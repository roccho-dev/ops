name: Build permanent public Artifact app proof gate

on:
  push:
    branches:
      - proof/build-artifact-app-public-proof-260821

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: proposal/artifact-app-public-proof-260821
    steps:
      - name: Resolve current accepted Ops base and create isolated candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          base_sha="$(git ls-remote "$remote" refs/heads/proposals | awk 'NR==1 {print $1}')"
          test "${#base_sha}" -eq 40
          if git ls-remote --exit-code "$remote" "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target exists: $TARGET_BRANCH" >&2
            exit 1
          fi
          git clone --depth=1 --branch proposals "$remote" candidate
          test "$(git -C candidate rev-parse HEAD)" = "$base_sha"
          git -C candidate switch -c "$TARGET_BRANCH"
          printf '%s\n' "$base_sha" > "$RUNNER_TEMP/base-sha"

      - name: Add self-contained public Action round-trip fixture and driver
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/artifact-runtime-app/fixtures
          cat > packages/artifact-runtime-app/fixtures/public-action.json <<'EOF'
          {
            "schema": "ops.artifactAppPublicActionFixture/1",
            "next": {
              "schema": "artifact-invocation/2",
              "id": "request.public-action-url.pass",
              "intent": "inspect",
              "inputs": [
                {
                  "id": "payload",
                  "mediaType": "application/json",
                  "schema": "artifact-app-public-proof/1",
                  "source": {
                    "kind": "inline",
                    "value": {
                      "carried": true,
                      "count": 2,
                      "title": "Public Action URL"
                    }
                  }
                }
              ],
              "constraints": {
                "allowedRuntimes": ["browser", "node"],
                "noUpload": true
              },
              "expects": ["json-inspection/1"]
            },
            "initial": {
              "schema": "artifact-invocation/2",
              "id": "request.public-action-url.render",
              "intent": "render",
              "inputs": [
                {
                  "id": "surface",
                  "mediaType": "application/vnd.roccho.a2ui-surface+json",
                  "schema": "a2ui-surface/1",
                  "source": {
                    "kind": "inline",
                    "value": {
                      "rootId": "root",
                      "surfaceId": "public-action-url-proof",
                      "dataModel": {},
                      "components": [
                        {
                          "id": "root",
                          "component": "Column",
                          "children": ["proof-next"]
                        },
                        {
                          "id": "proof-next",
                          "component": "Button",
                          "label": "Next",
                          "action": "artifact.invoke",
                          "context": {
                            "invocation": {
                              "schema": "artifact-invocation/2",
                              "id": "request.public-action-url.pass",
                              "intent": "inspect",
                              "inputs": [
                                {
                                  "id": "payload",
                                  "mediaType": "application/json",
                                  "schema": "artifact-app-public-proof/1",
                                  "source": {
                                    "kind": "inline",
                                    "value": {
                                      "carried": true,
                                      "count": 2,
                                      "title": "Public Action URL"
                                    }
                                  }
                                }
                              ],
                              "constraints": {
                                "allowedRuntimes": ["browser", "node"],
                                "noUpload": true
                              },
                              "expects": ["json-inspection/1"]
                            }
                          }
                        }
                      ]
                    }
                  }
                }
              ],
              "constraints": {
                "allowedRuntimes": ["browser"],
                "noUpload": true
              },
              "expects": ["a2ui-render-receipt/1"]
            }
          }
          EOF

          cat > packages/artifact-runtime-app/tests/public-browser.mjs <<'EOF'
          #!/usr/bin/env node
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import process from "node:process";
          import { pathToFileURL } from "node:url";
          import { chromium } from "playwright-core";

          const fail = message => { throw new Error(message); };
          const invariant = (condition, message) => { if (!condition) fail(message); };
          const sha256 = bytes => crypto.createHash("sha256").update(bytes).digest("hex");
          const canonical = value => {
            if (value === null || typeof value !== "object") return JSON.stringify(value);
            if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
            return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${canonical(value[key])}`).join(",")}}`;
          };
          const parse = argv => {
            const allowed = new Set(["--app", "--fixture", "--base", "--browser", "--out", "--initial-shot", "--changed-shot"]);
            const result = {};
            while (argv.length) {
              const key = argv.shift(); const value = argv.shift();
              invariant(allowed.has(key) && value && result[key] === undefined, "invalid options");
              result[key] = value;
            }
            for (const key of allowed) invariant(result[key], `missing ${key}`);
            return result;
          };
          const options = parse(process.argv.slice(2));
          const appRoot = path.resolve(options["--app"]);
          const fixture = JSON.parse(fs.readFileSync(path.resolve(options["--fixture"]), "utf8"));
          invariant(fixture.schema === "ops.artifactAppPublicActionFixture/1", "fixture schema mismatch");
          const manifestBytes = fs.readFileSync(path.join(appRoot, "artifact-manifest.json"));
          const manifest = JSON.parse(manifestBytes);
          const find = suffix => {
            const rows = manifest.files.filter(item => item.path.endsWith(suffix));
            invariant(rows.length === 1, `${suffix}: ${rows.map(item => item.path).join(",")}`);
            const item = rows[0];
            const target = path.join(appRoot, ...item.path.split("/"));
            const bytes = fs.readFileSync(target);
            invariant(bytes.length === item.bytes, `size mismatch: ${item.path}`);
            invariant(`sha256:${sha256(bytes)}` === item.sha256, `digest mismatch: ${item.path}`);
            return target;
          };
          const codec = await import(pathToFileURL(find("packages/url-module/src/index.mjs")).href);
          const invocation = await import(pathToFileURL(find("packages/artifact-invocation/src/index.mjs")).href);
          const a2ui = await import(pathToFileURL(find("packages/a2ui-browser/src/index.mjs")).href);
          const initial = invocation.validateArtifactInvocation(structuredClone(fixture.initial));
          const next = invocation.validateArtifactInvocation(structuredClone(fixture.next));
          const surface = initial.inputs[0].source.value;
          const catalog = a2ui.createBaseCatalog();
          for (const component of surface.components) catalog.validateComponent(component);
          const button = surface.components.find(component => component.id === "proof-next");
          invariant(button?.action === "artifact.invoke", "fixture action mismatch");
          invariant(canonical(button.context?.invocation) === canonical(next), "fixture next invocation mismatch");

          const base = new URL(options["--base"]);
          base.hash = "";
          const remoteManifest = Buffer.from(await (await fetch(new URL("artifact-manifest.json", base), { cache: "no-store" })).arrayBuffer());
          assert.deepEqual(remoteManifest, manifestBytes);
          const initialUrl = await codec.createUrlModuleUrl({ base: new URL("index.html", base).href, fragment: "invoke", value: initial });
          assert.deepEqual(await codec.readUrlModule({ fragment: "invoke", input: initialUrl }), initial);

          const browser = await chromium.launch({
            executablePath: path.resolve(options["--browser"]),
            headless: true,
            args: ["--no-sandbox", "--disable-dev-shm-usage"],
          });
          const errors = [];
          const watch = page => {
            page.on("pageerror", error => errors.push(String(error)));
            page.on("console", message => { if (message.type() === "error") errors.push(message.text()); });
          };
          const waitPass = page => page.waitForFunction(() => document.querySelector("#status")?.textContent?.trim() === "PASS");
          const waitInspection = page => page.waitForFunction(() => document.querySelector("#result")?.textContent?.includes("json-inspection/1"));
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          watch(page);
          await page.goto(initialUrl, { waitUntil: "networkidle" });
          await waitPass(page);
          const control = page.locator('[data-a2ui-id="proof-next"]');
          await control.waitFor({ state: "visible" });
          await page.screenshot({ path: path.resolve(options["--initial-shot"]), fullPage: true });
          await control.click();
          await page.waitForFunction(previous => location.href !== previous, initialUrl);
          await waitPass(page);
          await waitInspection(page);
          const changedUrl = page.url();
          invariant(changedUrl.includes("#invoke="), "changed URL lacks invocation");
          assert.deepEqual(await codec.readUrlModule({ fragment: "invoke", input: changedUrl }), next);
          const changedResult = JSON.parse(await page.locator("#result").textContent());
          invariant(changedResult.status === "PASS", "next result is not PASS");
          invariant(changedResult.outputs?.[0]?.contract === "json-inspection/1", "next output contract mismatch");
          await page.screenshot({ path: path.resolve(options["--changed-shot"]), fullPage: true });

          const fresh = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          watch(fresh);
          await fresh.goto(changedUrl, { waitUntil: "networkidle" });
          await waitPass(fresh);
          await waitInspection(fresh);
          assert.deepEqual(JSON.parse(await fresh.locator("#result").textContent()), changedResult);
          await fresh.reload({ waitUntil: "networkidle" });
          await waitPass(fresh);
          await waitInspection(fresh);
          assert.deepEqual(JSON.parse(await fresh.locator("#result").textContent()), changedResult);

          await page.goBack();
          await page.waitForFunction(expected => location.href === expected, initialUrl);
          await waitPass(page);
          await page.locator('[data-a2ui-id="proof-next"]').waitFor({ state: "visible" });
          await page.goForward();
          await page.waitForFunction(expected => location.href === expected, changedUrl);
          await waitPass(page);
          await waitInspection(page);
          assert.deepEqual(JSON.parse(await page.locator("#result").textContent()), changedResult);
          invariant(errors.length === 0, `browser errors: ${errors.join(" | ")}`);

          const receipt = {
            schema: "ops.artifactAppPublicBrowserReceipt/1",
            status: "PASS",
            authority: false,
            publicationTree: manifest.treeDigest,
            publicBase: base.href,
            initialUrlLength: initialUrl.length,
            changedUrlLength: changedUrl.length,
            observations: {
              publicManifestByteReadback: "PASS",
              initialRender: "PASS",
              realButtonClick: "PASS",
              actionToCanonicalUrl: "PASS",
              nextExecution: "PASS",
              freshUrlRestore: "PASS",
              reloadRestore: "PASS",
              backRestore: "PASS",
              forwardRestore: "PASS",
              browserErrors: 0
            },
            browser: {
              driver: "playwright-core@1.55.0",
              executablePath: path.resolve(options["--browser"])
            }
          };
          fs.writeFileSync(path.resolve(options["--out"]), `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(JSON.stringify(receipt));
          await browser.close();
          EOF
          chmod +x packages/artifact-runtime-app/tests/public-browser.mjs

      - name: Add the permanent GitHub-only public proof workflow
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/artifact-runtime-app-public-proof.yml <<'EOF'
          name: Artifact Runtime app public proof

          on:
            pull_request:
              paths:
                - '.github/workflows/artifact-runtime-app-public-proof.yml'
                - 'packages/artifact-runtime-app/**'
                - 'packages/chatgpt-capability/ingress/carrier-job.mjs'
                - 'ci.intent.v1.jsonl'
            workflow_dispatch:
            workflow_run:
              workflows: ['Artifact Runtime static host projection']
              types: [completed]

          permissions:
            contents: read
            issues: write

          jobs:
            proof:
              if: >-
                github.event_name != 'workflow_run' ||
                (github.event.workflow_run.conclusion == 'success' &&
                 github.event.workflow_run.event == 'issue_comment')
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.pull_request.head.sha || 'proposals' }}

                - uses: actions/setup-node@v4
                  with:
                    node-version: '22.16.0'

                - name: Carry the registered app from app ID only
                  shell: bash
                  run: |
                    set -euo pipefail
                    node packages/artifact-runtime-app/bin/artifact-runtime-app.mjs resolve \
                      --app-id artifact-runtime.bidirectional \
                      --request-id "public-proof-$GITHUB_RUN_ID" > "$RUNNER_TEMP/carrier-request.json"
                    node packages/chatgpt-capability/ingress/carrier-job.mjs materialize \
                      --request "$RUNNER_TEMP/carrier-request.json" --out "$RUNNER_TEMP/carrier"
                    node packages/chatgpt-capability/ingress/carrier-job.mjs verify \
                      --input "$RUNNER_TEMP/carrier" --receipt "$RUNNER_TEMP/carrier-verified.json"
                    cmp "$RUNNER_TEMP/carrier/receipt.json" "$RUNNER_TEMP/carrier-verified.json"
                    node packages/artifact-runtime-app/bin/artifact-runtime-app.mjs materialize \
                      --app-id artifact-runtime.bidirectional \
                      --input "$RUNNER_TEMP/carrier" --out "$RUNNER_TEMP/app" \
                      --receipt "$RUNNER_TEMP/carry-receipt.json"

                - name: Install the exact browser driver and select system Chrome
                  shell: bash
                  run: |
                    set -euo pipefail
                    npm install --ignore-scripts --no-save --no-audit --no-fund playwright-core@1.55.0
                    chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
                    test -n "$chrome"
                    printf '%s\n' "$chrome" > "$RUNNER_TEMP/chrome-bin"
                    "$chrome" --version > "$RUNNER_TEMP/chrome-version"

                - name: Prove real Action to URL and fresh-state restoration
                  shell: bash
                  run: |
                    set -euo pipefail
                    base="$(python3 - <<'PY'
                    import json
                    x=json.load(open('packages/artifact-runtime-app/app.json',encoding='utf-8'))
                    print('https://stg-artifact-runtime.pages.dev/'+x['staticHost']['pathPrefix'].strip('/')+'/')
                    PY
                    )"
                    node packages/artifact-runtime-app/tests/public-browser.mjs \
                      --app "$RUNNER_TEMP/app" \
                      --fixture packages/artifact-runtime-app/fixtures/public-action.json \
                      --base "$base" \
                      --browser "$(cat "$RUNNER_TEMP/chrome-bin")" \
                      --out "$RUNNER_TEMP/public-browser-receipt.json" \
                      --initial-shot "$RUNNER_TEMP/initial.png" \
                      --changed-shot "$RUNNER_TEMP/changed.png"

                - name: Upload non-authority public proof evidence
                  id: artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: artifact-runtime-app-public-proof-${{ github.run_id }}
                    path: |
                      ${{ runner.temp }}/carry-receipt.json
                      ${{ runner.temp }}/public-browser-receipt.json
                      ${{ runner.temp }}/chrome-version
                      ${{ runner.temp }}/initial.png
                      ${{ runner.temp }}/changed.png
                    if-no-files-found: error
                    retention-days: 30

                - name: Record the hosted receipt after accepted deployment
                  if: ${{ github.event_name != 'pull_request' }}
                  env:
                    GH_TOKEN: ${{ github.token }}
                    ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
                    ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
                    RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 - "$RUNNER_TEMP/public-browser-receipt.json" > "$RUNNER_TEMP/comment.md" <<'PY'
                    import json,os,sys
                    x=json.load(open(sys.argv[1],encoding='utf-8')); o=x['observations']
                    print('## Permanent public Artifact Action round-trip — PASS')
                    print()
                    print(f"- publication tree: `{x['publicationTree']}`")
                    print(f"- public base: {x['publicBase']}")
                    print(f"- initial / click / canonical URL: **{o['initialRender']} / {o['realButtonClick']} / {o['actionToCanonicalUrl']}**")
                    print(f"- next execution / Fresh / reload: **{o['nextExecution']} / {o['freshUrlRestore']} / {o['reloadRestore']}**")
                    print(f"- Back / Forward / browser errors: **{o['backRestore']} / {o['forwardRestore']} / {o['browserErrors']}**")
                    print(f"- run: {os.environ['RUN_URL']}")
                    print(f"- artifact ID / digest: `{os.environ['ARTIFACT_ID']}` / `{os.environ['ARTIFACT_DIGEST']}`")
                    print()
                    print('Git commits remain source authority; hosted bytes and this receipt are non-authority projections.')
                    PY
                    gh issue comment 193 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          EOF

      - name: Bind the public proof requirement and expose Carry observations
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          app_path=pathlib.Path('packages/artifact-runtime-app/app.json')
          app=json.loads(app_path.read_text(encoding='utf-8'))
          required=app['proof']['required']
          item='public-browser-action-url-roundtrip'
          assert item not in required
          required.append(item)
          app_path.write_text(json.dumps(app,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          readme=pathlib.Path('packages/artifact-runtime-app/README.md')
          text=readme.read_text(encoding='utf-8')
          text += '\nThe permanent public gate carries the app by ID, clicks a real A2UI Button, verifies canonical URL replacement, fresh-page and reload restoration, and Back/Forward history from the hosted content-addressed root.\n'
          readme.write_text(text,encoding='utf-8')

          e2e=pathlib.Path('packages/artifact-runtime-app/tests/e2e.mjs')
          source=e2e.read_text(encoding='utf-8')
          marker='const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");\n'
          assert source.count(marker)==1
          insert='''const fixture = JSON.parse(fs.readFileSync(path.join(root, "fixtures/public-action.json"), "utf8"));
          assert.equal(fixture.schema, "ops.artifactAppPublicActionFixture/1");
          assert.equal(fixture.initial.inputs[0].source.value.components.find(component => component.id === "proof-next").action, "artifact.invoke");
          assert.deepEqual(fixture.initial.inputs[0].source.value.components.find(component => component.id === "proof-next").context.invocation, fixture.next);
          '''
          source=source.replace(marker,marker+insert)
          source=source.replace('positive: 2, negative: 1','positive: 3, negative: 1')
          e2e.write_text(source,encoding='utf-8')

          workflow=pathlib.Path('.github/workflows/artifact-runtime-app-carry.yml')
          source=workflow.read_text(encoding='utf-8')
          needle='''                    - artifact: $ARTIFACT_URL
                    COMMENT
          '''
          replacement='''                    - artifact: $ARTIFACT_URL
                    - proof receipt: carried bytes verified encode, decode, execute, Action → URL, Fresh restore and destructive rejection before upload
                    COMMENT
          '''
          assert source.count(needle)==1
          workflow.write_text(source.replace(needle,replacement),encoding='utf-8')

          rows=[json.loads(line) for line in pathlib.Path('ci.intent.v1.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert not any('artifact-runtime-app-public-proof.yml' in json.dumps(row) for row in rows)
          template=next(row for row in rows if 'artifact-runtime-app-carry.yml' in json.dumps(row))
          def replace(value):
              if isinstance(value,str): return value.replace('artifact-runtime-app-carry','artifact-runtime-app-public-proof').replace('Artifact Runtime app carry','Artifact Runtime app public proof')
              if isinstance(value,list): return [replace(item) for item in value]
              if isinstance(value,dict): return {key:replace(item) for key,item in value.items()}
              return value
          rows.append(replace(template))
          rows.sort(key=lambda row:json.dumps(row,sort_keys=True))
          pathlib.Path('ci.intent.v1.jsonl').write_text('\n'.join(json.dumps(row,sort_keys=True,separators=(',',':')) for row in rows)+'\n',encoding='utf-8')
          PY

      - name: Run focused local gates
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/artifact-runtime-app/tests/public-browser.mjs
          node packages/artifact-runtime-app/tests/e2e.mjs
          node packages/artifact-runtime-app/bin/artifact-runtime-app.mjs check --app-id artifact-runtime.bidirectional
          git diff --check

      - name: Commit and publish the one-commit candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/artifact-runtime-app-public-proof.yml \
            .github/workflows/artifact-runtime-app-carry.yml \
            packages/artifact-runtime-app \
            ci.intent.v1.jsonl
          git diff --cached --check
          git commit -m "proof: institutionalize public Artifact Action URL round-trip"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
