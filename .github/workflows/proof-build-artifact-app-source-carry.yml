name: Build app-ID source Carry candidate

on:
  push:
    branches:
      - proof/build-artifact-app-source-carry-260821

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: proposal/artifact-app-source-carry-260821
    steps:
      - name: Resolve current accepted Ops base and create isolated candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          base_sha="$(git ls-remote "$remote" refs/heads/proposals | awk 'NR==1 {print $1}')"
          test "${#base_sha}" -eq 40
          if git ls-remote --exit-code "$remote" "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target exists: $TARGET_BRANCH" >&2
            exit 1
          fi
          git clone --depth=1 --branch proposals "$remote" candidate
          test "$(git -C candidate rev-parse HEAD)" = "$base_sha"
          git -C candidate switch -c "$TARGET_BRANCH"
          printf '%s\n' "$base_sha" > "$RUNNER_TEMP/base-sha"

      - name: Add exact app closure and binding identities to the core
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/artifact-runtime-app/bin/artifact-runtime-app.mjs')
          s=p.read_text(encoding='utf-8')
          marker='const readJson = target => JSON.parse(fs.readFileSync(target, "utf8"));\n'
          assert s.count(marker)==1
          s=s.replace(marker,marker+'''const gitSha = (value, label) => {\n  invariant(typeof value === "string" && /^[0-9a-f]{40}$/u.test(value), `${label} must be a full Git SHA`);\n  return value;\n};\nconst appClosureSha256 = target => `sha256:${sha256(fs.readFileSync(target))}`;\nconst repositoryName = (value, label) => {\n  invariant(typeof value === "string" && /^[A-Za-z0-9_.-]+\\/[A-Za-z0-9_.-]+$/u.test(value), `${label} is invalid`);\n  return value;\n};\n''')
          marker='const carryRequest = (closure, requestId) => {\n'
          assert s.count(marker)==1
          insert='''const sourcePlan = (closure, closureDigest, binding) => {\n  repositoryName(binding.repository, "binding repository");\n  gitSha(binding.commit, "binding commit");\n  gitSha(binding.tree, "binding tree");\n  const sources = closure.sourceAuthorities.map(source => {\n    invariant(typeof source.role === "string" && /^[a-z0-9.-]+$/u.test(source.role), "source role is invalid");\n    if (source.binding === "commit-containing-this-file") {\n      return Object.freeze({ role: source.role, repository: binding.repository, commit: binding.commit, tree: binding.tree });\n    }\n    return Object.freeze({\n      role: source.role,\n      repository: repositoryName(source.repository, `${source.role} repository`),\n      commit: gitSha(source.commit, `${source.role} commit`),\n      tree: gitSha(source.tree, `${source.role} tree`),\n    });\n  });\n  invariant(new Set(sources.map(source => source.role)).size === sources.length, "source roles are duplicated");\n  return Object.freeze({\n    schema: "ops.artifactAppSourcePlan/1",\n    status: "PASS",\n    authority: false,\n    appId: closure.id,\n    appClosureSha256: closureDigest,\n    kind: "one-commit-shallow-git",\n    sources,\n  });\n};\n'''
          s=s.replace(marker,insert+marker)
          old='const materialize = async (closure, input, out, receiptPath) => {\n'
          new='const materialize = async (closure, closureDigest, bindingCommit, bindingTree, input, out, receiptPath) => {\n'
          assert s.count(old)==1
          s=s.replace(old,new)
          old='''              appId: closure.id,\n              publicationTree: closure.publication.treeDigest,\n              sourceAuthorities: closure.sourceAuthorities,\n'''
          new='''              appId: closure.id,\n              appClosureSha256: closureDigest,\n              opsBindingCommit: gitSha(bindingCommit, "binding commit"),\n              opsBindingTree: gitSha(bindingTree, "binding tree"),\n              publicationTree: closure.publication.treeDigest,\n              sourceAuthorities: closure.sourceAuthorities,\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old='''              const target = resolveManifest(options);\n              const closure = loadClosure(target);\n              const request = carryRequest(closure, "check");\n              console.log(JSON.stringify({ schema: "ops.artifactAppCheck/1", status: "PASS", appId: closure.id, request }));\n'''
          new='''              const target = resolveManifest(options);\n              const closure = loadClosure(target);\n              const request = carryRequest(closure, "check");\n              console.log(JSON.stringify({ schema: "ops.artifactAppCheck/1", status: "PASS", appId: closure.id, appClosureSha256: appClosureSha256(target), request }));\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          marker='''            if (command === "materialize") {\n'''
          assert s.count(marker)==1
          block='''            if (command === "sources") {\n              const options = parse(argv, ["--app-id", "--manifest", "--binding-repository", "--binding-commit", "--binding-tree"]);\n              const target = resolveManifest(options);\n              const closure = loadClosure(target);\n              console.log(JSON.stringify(sourcePlan(closure, appClosureSha256(target), {\n                repository: options["--binding-repository"],\n                commit: options["--binding-commit"],\n                tree: options["--binding-tree"],\n              })));\n              return;\n            }\n'''
          s=s.replace(marker,block+marker)
          old='''              const options = parse(argv, ["--app-id", "--manifest", "--input", "--out", "--receipt"]);\n              const closure = loadClosure(resolveManifest(options));\n              console.log(JSON.stringify(await materialize(closure, path.resolve(options["--input"]), path.resolve(options["--out"]), path.resolve(options["--receipt"]))));\n'''
          new='''              const options = parse(argv, ["--app-id", "--manifest", "--binding-commit", "--binding-tree", "--input", "--out", "--receipt"]);\n              const target = resolveManifest(options);\n              const closure = loadClosure(target);\n              console.log(JSON.stringify(await materialize(\n                closure, appClosureSha256(target), options["--binding-commit"], options["--binding-tree"],\n                path.resolve(options["--input"]), path.resolve(options["--out"]), path.resolve(options["--receipt"]),\n              )));\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          s=s.replace('usage: artifact-runtime-app.mjs check|resolve|materialize','usage: artifact-runtime-app.mjs check|resolve|sources|materialize')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Add the ready-worktree source materializer
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > packages/artifact-runtime-app/bin/artifact-runtime-source-carry.py <<'PY'
          #!/usr/bin/env python3
          import argparse
          import json
          import pathlib
          import re
          import subprocess

          HEX40 = re.compile(r"^[0-9a-f]{40}$")
          SAFE_ROLE = re.compile(r"^[a-z0-9.-]+$")
          SAFE_REPO = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")

          def fail(message): raise SystemExit(f"artifact-runtime-source-carry: {message}")
          def run(args):
              result=subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if result.returncode != 0: fail(f"{' '.join(args)} failed: {result.stderr or result.stdout}")
              return result.stdout.strip()
          def read_plan(target):
              try: value=json.loads(target.read_text(encoding='utf-8'))
              except Exception as exc: fail(f"invalid plan: {exc}")
              if value.get('schema')!='ops.artifactAppSourcePlan/1' or value.get('status')!='PASS': fail('invalid plan contract')
              if value.get('authority') is not False or value.get('kind')!='one-commit-shallow-git': fail('invalid source-carry boundary')
              if not re.fullmatch(r'sha256:[0-9a-f]{64}',value.get('appClosureSha256','')): fail('invalid app closure identity')
              sources=value.get('sources')
              if not isinstance(sources,list) or len(sources)<2: fail('source inventory is incomplete')
              roles=set()
              for source in sources:
                  role=source.get('role',''); repo=source.get('repository','')
                  if not SAFE_ROLE.fullmatch(role) or role in roles: fail(f'invalid or duplicate source role: {role}')
                  if not SAFE_REPO.fullmatch(repo): fail(f'invalid repository: {repo}')
                  if not HEX40.fullmatch(source.get('commit','')) or not HEX40.fullmatch(source.get('tree','')): fail(f'invalid Git identity: {role}')
                  roles.add(role)
              return value
          def materialize(plan,out):
              if out.exists(): fail(f'out exists: {out}')
              repos=out/'repos'; repos.mkdir(parents=True)
              rows=[]
              for source in plan['sources']:
                  role=source['role']; target=repos/role; target.mkdir()
                  origin=f"https://github.com/{source['repository']}.git"
                  run(['git','init','--quiet',str(target)])
                  run(['git','-C',str(target),'remote','add','origin',origin])
                  run(['git','-C',str(target),'fetch','--quiet','--depth=1','origin',source['commit']])
                  run(['git','-C',str(target),'checkout','--quiet','-b','source','FETCH_HEAD'])
                  head=run(['git','-C',str(target),'rev-parse','HEAD'])
                  tree=run(['git','-C',str(target),'rev-parse','HEAD^{tree}'])
                  shallow=run(['git','-C',str(target),'rev-parse','--is-shallow-repository'])
                  count=run(['git','-C',str(target),'rev-list','--count','HEAD'])
                  branch=run(['git','-C',str(target),'branch','--show-current'])
                  remote=run(['git','-C',str(target),'remote','get-url','origin'])
                  status=run(['git','-C',str(target),'status','--porcelain'])
                  run(['git','-C',str(target),'fsck','--no-dangling'])
                  if head!=source['commit'] or tree!=source['tree']: fail(f'Git identity mismatch: {role}')
                  if shallow!='true' or count!='1' or branch!='source' or remote!=origin or status: fail(f'repository boundary mismatch: {role}')
                  row={**source,'path':f'repos/{role}','branch':branch,'shallow':True,'commitCount':1,'origin':origin,'fsck':'PASS','clean':True}
                  rows.append(row)
                  (target/'SOURCE-CARRY-RECEIPT.json').write_text(json.dumps({'schema':'ops.artifactAppSourceRepositoryReceipt/1','status':'PASS',**row},indent=2,sort_keys=True)+'\n',encoding='utf-8')
              return {'schema':'ops.artifactAppSourceCarryReceipt/1','status':'PASS','authority':False,'appId':plan['appId'],'appClosureSha256':plan['appClosureSha256'],'kind':plan['kind'],'sources':rows,'uploadedZipInputUsed':False,'sourceBuildUsed':False,'readyForLocalImprovement':True,'limitations':['history before exact HEAD is not included','submodule and Git LFS payload materialization are not guaranteed']}
          def main():
              parser=argparse.ArgumentParser(); parser.add_argument('--plan',required=True); parser.add_argument('--out',required=True); parser.add_argument('--receipt',required=True); args=parser.parse_args()
              plan=read_plan(pathlib.Path(args.plan).resolve()); out=pathlib.Path(args.out).resolve(); receipt=materialize(plan,out)
              pathlib.Path(args.receipt).resolve().write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps(receipt,sort_keys=True,separators=(',',':')))
          if __name__=='__main__': main()
          PY
          chmod +x packages/artifact-runtime-app/bin/artifact-runtime-source-carry.py

      - name: Add the explicit source Carry workflow
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/artifact-runtime-app-source-carry.yml <<'EOF'
          name: Artifact Runtime app source carry

          on:
            pull_request:
              paths:
                - '.github/workflows/artifact-runtime-app-source-carry.yml'
                - 'packages/artifact-runtime-app/**'
                - 'ci.intent.v1.jsonl'
            workflow_dispatch:
              inputs:
                app_id:
                  description: Registered app identity
                  required: true
                  default: artifact-runtime.bidirectional
                  type: string
                request_id:
                  description: Source Carry request identity
                  required: true
                  type: string
            issue_comment:
              types: [created]

          permissions:
            contents: read

          jobs:
            proof:
              if: github.event_name == 'pull_request'
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.pull_request.head.sha }}
                - name: Resolve app ID and materialize exact editable sources
                  shell: bash
                  run: |
                    set -euo pipefail
                    commit="$(git rev-parse HEAD)"; tree="$(git rev-parse 'HEAD^{tree}')"
                    node packages/artifact-runtime-app/bin/artifact-runtime-app.mjs sources \
                      --app-id artifact-runtime.bidirectional \
                      --binding-repository "$GITHUB_REPOSITORY" --binding-commit "$commit" --binding-tree "$tree" \
                      > "$RUNNER_TEMP/source-plan.json"
                    python3 packages/artifact-runtime-app/bin/artifact-runtime-source-carry.py \
                      --plan "$RUNNER_TEMP/source-plan.json" --out "$RUNNER_TEMP/source-result" \
                      --receipt "$RUNNER_TEMP/source-receipt.json"
                    python3 - "$RUNNER_TEMP/source-receipt.json" "$commit" "$tree" <<'PY'
                    import json,sys
                    x=json.load(open(sys.argv[1],encoding='utf-8'))
                    assert x['status']=='PASS' and x['readyForLocalImprovement'] is True
                    assert x['uploadedZipInputUsed'] is False and x['sourceBuildUsed'] is False
                    assert len(x['sources'])==2
                    ops=next(s for s in x['sources'] if s['repository']=='roccho-dev/ops')
                    assert ops['commit']==sys.argv[2] and ops['tree']==sys.argv[3]
                    assert all(s['shallow'] and s['commitCount']==1 and s['clean'] and s['fsck']=='PASS' for s in x['sources'])
                    PY

            carry:
              if: >-
                github.event_name == 'workflow_dispatch' ||
                (github.event_name == 'issue_comment' &&
                 github.event.issue.pull_request == null &&
                 github.event.comment.user.login == github.repository_owner &&
                 startsWith(github.event.comment.body, '/artifact-app-source-carry'))
              permissions:
                contents: read
                issues: write
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                  with:
                    ref: proposals

                - name: Resolve app identity only
                  shell: bash
                  env:
                    EVENT_NAME: ${{ github.event_name }}
                    COMMENT_BODY: ${{ github.event.comment.body }}
                    DISPATCH_APP_ID: ${{ inputs.app_id }}
                    DISPATCH_REQUEST_ID: ${{ inputs.request_id }}
                  run: |
                    set -euo pipefail
                    python3 - "$RUNNER_TEMP/request.json" <<'PY'
                    import json,os,pathlib,sys
                    if os.environ['EVENT_NAME']=='issue_comment':
                        body=os.environ.get('COMMENT_BODY','').replace('\r\n','\n'); prefix='/artifact-app-source-carry\n'
                        if not body.startswith(prefix): raise SystemExit('comment must contain raw artifact-app-source-carry/1 JSON')
                        x=json.loads(body[len(prefix):].strip()); assert x['schema']=='artifact-app-source-carry/1'
                        app_id=x['app_id']; request_id=x['request_id']
                    else:
                        app_id=os.environ['DISPATCH_APP_ID']; request_id=os.environ['DISPATCH_REQUEST_ID']
                    pathlib.Path(sys.argv[1]).write_text(json.dumps({'app_id':app_id,'request_id':request_id})+'\n')
                    PY
                    app_id="$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP"'/request.json"))["app_id"])')"
                    commit="$(git rev-parse HEAD)"; tree="$(git rev-parse 'HEAD^{tree}')"
                    node packages/artifact-runtime-app/bin/artifact-runtime-app.mjs sources \
                      --app-id "$app_id" --binding-repository "$GITHUB_REPOSITORY" \
                      --binding-commit "$commit" --binding-tree "$tree" > "$RUNNER_TEMP/source-plan.json"

                - name: Carry exact one-commit shallow repositories from GitHub
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p "$RUNNER_TEMP/result"
                    python3 packages/artifact-runtime-app/bin/artifact-runtime-source-carry.py \
                      --plan "$RUNNER_TEMP/source-plan.json" --out "$RUNNER_TEMP/result/source" \
                      --receipt "$RUNNER_TEMP/result/receipt.json"

                - name: Upload ready-to-improve source repositories
                  id: artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: artifact-runtime-app-source-${{ github.run_id }}
                    path: ${{ runner.temp }}/result/
                    include-hidden-files: true
                    if-no-files-found: error
                    retention-days: 30

                - name: Return exact source and artifact identity
                  if: ${{ always() && github.event_name == 'issue_comment' }}
                  env:
                    GH_TOKEN: ${{ github.token }}
                    ISSUE_NUMBER: ${{ github.event.issue.number }}
                    ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
                    ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
                    ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
                    JOB_STATUS: ${{ job.status }}
                  shell: bash
                  run: |
                    set -euo pipefail
                    app_id="$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP"'/request.json"))["app_id"])')"
                    request_id="$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP"'/request.json"))["request_id"])')"
                    summary="$(python3 - <<'PY'
                    import json,pathlib
                    p=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'result/receipt.json'
                    if not p.exists(): print('not-created')
                    else:
                      x=json.loads(p.read_text()); print(', '.join(f"{s['role']}={s['repository']}@{s['commit']} tree={s['tree']}" for s in x['sources']))
                    PY
                    )"
                    cat > "$RUNNER_TEMP/comment.md" <<COMMENT
                    ## Artifact Runtime app source carry result

                    - status: \`$JOB_STATUS\`
                    - app: \`$app_id\`
                    - request: \`$request_id\`
                    - exact sources: \`$summary\`
                    - ready worktrees: one-commit shallow / clean / fsck PASS
                    - uploaded ZIP input / source build: \`false / false\`
                    - artifact ID / digest: \`$ARTIFACT_ID\` / \`$ARTIFACT_DIGEST\`
                    - artifact: $ARTIFACT_URL
                    COMMENT
                    gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          EOF

      - name: Bind Source Carry to the app closure and existing receipts
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          app_path=pathlib.Path('packages/artifact-runtime-app/app.json')
          app=json.loads(app_path.read_text(encoding='utf-8'))
          assert 'sourceCarry' not in app
          app['sourceCarry']={
            'workflow':'.github/workflows/artifact-runtime-app-source-carry.yml',
            'input':'app_id + request_id',
            'planSchema':'ops.artifactAppSourcePlan/1',
            'receiptSchema':'ops.artifactAppSourceCarryReceipt/1',
            'output':'ready one-commit shallow Git worktrees',
            'uploadedZipInputRequired':False,
            'sourceBuildRequired':False,
          }
          required=app['proof']['required']; item='source-carry-exact-repositories'
          assert item not in required; required.append(item)
          app_path.write_text(json.dumps(app,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          readme=pathlib.Path('packages/artifact-runtime-app/README.md')
          text=readme.read_text(encoding='utf-8')
          text += '\nWhen improvement is required, `sources` and the explicit Source Carry workflow resolve the same app ID into exact UI/Ops commits and trees, then return clean one-commit shallow `.git` worktrees. No historical mobile-merge ZIP or source build is involved.\n'
          readme.write_text(text,encoding='utf-8')

          e2e=pathlib.Path('packages/artifact-runtime-app/tests/e2e.mjs')
          source=e2e.read_text(encoding='utf-8')
          marker='''          const resolved = run(["resolve", "--app-id", "artifact-runtime.bidirectional", "--request-id", "e2e"]);\n'''
          assert source.count(marker)==1
          insert='''          assert.match(check.appClosureSha256, /^sha256:[0-9a-f]{64}$/u);\n          const bindingCommit = "1".repeat(40);\n          const bindingTree = "2".repeat(40);\n          const sourcesResult = run([\n            "sources", "--app-id", "artifact-runtime.bidirectional",\n            "--binding-repository", "roccho-dev/ops", "--binding-commit", bindingCommit, "--binding-tree", bindingTree,\n          ]);\n          assert.equal(sourcesResult.status, 0, sourcesResult.stderr);\n          const sources = JSON.parse(sourcesResult.stdout);\n          assert.equal(sources.schema, "ops.artifactAppSourcePlan/1");\n          assert.equal(sources.status, "PASS");\n          assert.equal(sources.sources.length, 2);\n          const opsSource = sources.sources.find(source => source.repository === "roccho-dev/ops");\n          assert.equal(opsSource.commit, bindingCommit);\n          assert.equal(opsSource.tree, bindingTree);\n          assert.match(sources.appClosureSha256, /^sha256:[0-9a-f]{64}$/u);\n'''
          source=source.replace(marker,insert+marker)
          source=source.replace('positive: 3, negative: 1','positive: 4, negative: 1')
          e2e.write_text(source,encoding='utf-8')

          for workflow_path in ['.github/workflows/artifact-runtime-app-carry.yml','.github/workflows/artifact-runtime-app-public-proof.yml']:
            p=pathlib.Path(workflow_path); text=p.read_text(encoding='utf-8')
            needle='''                      --app-id artifact-runtime.bidirectional \\\n                      --input "$RUNNER_TEMP/carrier"'''
            if workflow_path.endswith('artifact-runtime-app-carry.yml'):
              needle='''                      --app-id "$app_id" --input "$RUNNER_TEMP/carrier" \\\n                      --out "$RUNNER_TEMP/result/app" --receipt "$RUNNER_TEMP/result/receipt.json"'''
              replacement='''                      --app-id "$app_id" --binding-commit "$(git rev-parse HEAD)" --binding-tree "$(git rev-parse 'HEAD^{tree}')" \\\n                      --input "$RUNNER_TEMP/carrier" --out "$RUNNER_TEMP/result/app" --receipt "$RUNNER_TEMP/result/receipt.json"'''
            else:
              needle='''                      --app-id artifact-runtime.bidirectional \\\n                      --input "$RUNNER_TEMP/carrier" --out "$RUNNER_TEMP/app" \\\n                      --receipt "$RUNNER_TEMP/carry-receipt.json"'''
              replacement='''                      --app-id artifact-runtime.bidirectional \\\n                      --binding-commit "$(git rev-parse HEAD)" --binding-tree "$(git rev-parse 'HEAD^{tree}')" \\\n                      --input "$RUNNER_TEMP/carrier" --out "$RUNNER_TEMP/app" \\\n                      --receipt "$RUNNER_TEMP/carry-receipt.json"'''
            assert text.count(needle)==1,(workflow_path,text.count(needle))
            p.write_text(text.replace(needle,replacement),encoding='utf-8')

          rows=[json.loads(line) for line in pathlib.Path('ci.intent.v1.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert not any('artifact-runtime-app-source-carry.yml' in json.dumps(row) for row in rows)
          template=next(row for row in rows if 'artifact-runtime-app-carry.yml' in json.dumps(row))
          def replace(value):
            if isinstance(value,str): return value.replace('artifact-runtime-app-carry','artifact-runtime-app-source-carry').replace('Artifact Runtime app carry','Artifact Runtime app source carry')
            if isinstance(value,list): return [replace(item) for item in value]
            if isinstance(value,dict): return {key:replace(item) for key,item in value.items()}
            return value
          rows.append(replace(template)); rows.sort(key=lambda row:json.dumps(row,sort_keys=True))
          pathlib.Path('ci.intent.v1.jsonl').write_text('\n'.join(json.dumps(row,sort_keys=True,separators=(',',':')) for row in rows)+'\n',encoding='utf-8')
          PY

      - name: Run focused local and GitHub-only source gates
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/artifact-runtime-app/bin/artifact-runtime-app.mjs
          python3 -m py_compile packages/artifact-runtime-app/bin/artifact-runtime-source-carry.py
          node packages/artifact-runtime-app/tests/e2e.mjs
          commit="$(git rev-parse HEAD)"; tree="$(git rev-parse 'HEAD^{tree}')"
          node packages/artifact-runtime-app/bin/artifact-runtime-app.mjs sources \
            --app-id artifact-runtime.bidirectional --binding-repository "$GITHUB_REPOSITORY" \
            --binding-commit "$commit" --binding-tree "$tree" > "$RUNNER_TEMP/source-plan.json"
          python3 packages/artifact-runtime-app/bin/artifact-runtime-source-carry.py \
            --plan "$RUNNER_TEMP/source-plan.json" --out "$RUNNER_TEMP/source-result" \
            --receipt "$RUNNER_TEMP/source-receipt.json"
          git diff --check

      - name: Commit and publish the one-commit candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
