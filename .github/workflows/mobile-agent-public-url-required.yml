name: Mobile Agent public URL required

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/mobile-agent-preset-static-host.yml'
      - '.github/workflows/mobile-agent-preset-url-dod.yml'
      - '.github/workflows/mobile-agent-live-bootstrap-deploy.yml'
      - '.github/workflows/mobile-agent-seq-carrier.yml'
      - '.github/workflows/mobile-agent-seq-carrier-deploy.yml'
      - '.github/workflows/mobile-agent-seq-publish-now.yml'
      - '.github/transport/mobile-agent-**'
      - 'verification/mobile-agent-preset-app/**'
      - 'verification/mobile-agent-preset-url-dod/**'
      - 'verification/mobile-agent-live-bootstrap/**'
      - 'verification/mobile-agent-seq-carrier/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      require_receipt: ${{ steps.paths.outputs.require_receipt }}
    steps:
      - id: paths
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.number,
              per_page: 100,
            });
            const productPrefixes = [
              'verification/mobile-agent-preset-app/',
              'verification/mobile-agent-preset-url-dod/',
              'verification/mobile-agent-live-bootstrap/',
              'verification/mobile-agent-seq-carrier/',
            ];
            const productChanged = files.some(({ filename }) =>
              productPrefixes.some((prefix) => filename.startsWith(prefix))
            );
            core.info(JSON.stringify({ productChanged }));
            core.setOutput('require_receipt', productChanged ? 'true' : 'false');

  gate:
    needs: changes
    if: ${{ needs.changes.outputs.require_receipt == 'true' }}
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@v4
        with:
          ref: proposals
          path: trusted
          persist-credentials: false

      - name: Prove the validator rejects destructive receipts
        run: |
          set -euo pipefail
          python3 trusted/tools/check-mobile-agent-public-url.py selftest \
            --out "$RUNNER_TEMP/public-url-selftest.json"

      - name: Require the accepted ref receipt for the exact PR head
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          accepted="$RUNNER_TEMP/accepted"
          test ! -e "$accepted"
          mkdir "$accepted"
          git -C "$accepted" init --quiet
          git -C "$accepted" remote add origin "$remote"
          for attempt in $(seq 1 120); do
            receipt="$RUNNER_TEMP/public-url-receipt-$attempt.json"
            if git -C "$accepted" fetch --quiet --depth=1 origin \
              refs/heads/accepted/mobile-agent-public-url 2>/dev/null &&
              git -C "$accepted" show FETCH_HEAD:accepted/public-url-receipt.json \
                > "$receipt" 2>/dev/null; then
              receipt_sha="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["candidateSha"])' "$receipt")"
              if [ "$receipt_sha" = "$CANDIDATE_SHA" ]; then
                python3 trusted/tools/check-mobile-agent-public-url.py check \
                  --contract trusted/verification/mobile-agent-public-url/contract.json \
                  --receipt "$receipt" \
                  --candidate-sha "$CANDIDATE_SHA" \
                  --out "$RUNNER_TEMP/required-public-url-receipt.json"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "No PASS public URL receipt exists for exact PR head $CANDIDATE_SHA" >&2
          exit 1

      - name: Upload the exact accepted receipt
        uses: actions/upload-artifact@v4
        with:
          name: required-mobile-agent-public-url-receipt
          path: |
            ${{ runner.temp }}/required-public-url-receipt.json
            ${{ runner.temp }}/public-url-selftest.json
          if-no-files-found: error
          retention-days: 30
