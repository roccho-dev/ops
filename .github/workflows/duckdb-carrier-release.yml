name: DuckDB Carrier release

on:
  push:
    paths:
      - ".github/workflows/duckdb-carrier-release.yml"
  pull_request:
    paths:
      - ".github/workflows/duckdb-carrier-release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  DUCKDB_VERSION: v1.5.5
  DUCKDB_UPSTREAM_ASSET: duckdb_cli-linux-amd64-musl.gz
  DUCKDB_UPSTREAM_SHA256: 59bc84a96f58777bb21b67129222628d0ac196bbf722d3107ceb94a8602429d2

jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact DuckDB binary and prove JSONL hot/cold flow
        id: build
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/duckdb-carrier"
          out="$RUNNER_TEMP/release-out"
          mkdir -p "$work" "$out"

          source_url="https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/${DUCKDB_UPSTREAM_ASSET}"
          upstream="$work/$DUCKDB_UPSTREAM_ASSET"
          duckdb="$work/duckdb"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error "$source_url" -o "$upstream"
          printf '%s  %s\n' "$DUCKDB_UPSTREAM_SHA256" "$upstream" | sha256sum --check --strict -
          gzip --decompress --stdout "$upstream" > "$duckdb"
          chmod 0755 "$duckdb"

          file "$duckdb"
          version="$($duckdb -version)"
          [[ "$version" == *"${DUCKDB_VERSION#v}"* ]]

          hot="$work/hot.jsonl"
          cold="$work/cold.parquet"
          printf '%s\n' '{"id":1,"value":10}' '{"id":2,"value":20}' > "$hot"
          hot_result="$($duckdb -csv -noheader -c "SELECT count(*), sum(value) FROM read_ndjson('$hot');")"
          [[ "$hot_result" == "2,30" ]]
          "$duckdb" -c "COPY (SELECT * FROM read_ndjson('$hot')) TO '$cold' (FORMAT parquet);"
          cold_result="$($duckdb -csv -noheader -c "SELECT count(*), sum(value) FROM read_parquet('$cold');")"
          [[ "$cold_result" == "2,30" ]]

          payload_sha="$(sha256sum "$duckdb" | awk '{print $1}')"
          payload_bytes="$(stat -c %s "$duckdb")"
          carrier="$out/carrier.native.linux-amd64-musl.${payload_sha}.b64.txt"
          base64 -w0 "$duckdb" > "$carrier"
          ! LC_ALL=C grep -q '[[:space:]]' "$carrier"
          base64 --decode "$carrier" > "$work/decoded"
          cmp "$duckdb" "$work/decoded"
          [[ "$(sha256sum "$work/decoded" | awk '{print $1}')" == "$payload_sha" ]]
          chmod 0755 "$work/decoded"
          [[ "$($work/decoded -version)" == "$version" ]]

          carrier_sha="$(sha256sum "$carrier" | awk '{print $1}')"
          carrier_bytes="$(stat -c %s "$carrier")"
          license="$out/duckdb.LICENSE.txt"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://raw.githubusercontent.com/duckdb/duckdb/${DUCKDB_VERSION}/LICENSE" -o "$license"
          grep -Fq 'Stichting DuckDB Foundation' "$license"

          if [[ "$GITHUB_REF" == refs/heads/proposals ]]; then
            tag="duckdb-carrier-${DUCKDB_VERSION}-${payload_sha:0:12}"
            prerelease=false
          else
            tag="duckdb-carrier-proof-${DUCKDB_VERSION}-${payload_sha:0:12}-${GITHUB_RUN_ID}"
            prerelease=true
          fi

          receipt="$out/duckdb.receipt.json"
          python3 - "$receipt" "$source_url" "$DUCKDB_VERSION" "$DUCKDB_UPSTREAM_ASSET" "$DUCKDB_UPSTREAM_SHA256" "$version" "$payload_sha" "$payload_bytes" "$carrier" "$carrier_sha" "$carrier_bytes" "$tag" "$prerelease" <<'PY'
          import json,pathlib,sys
          out,source_url,version,asset,upstream_sha,observed,payload_sha,payload_bytes,carrier,carrier_sha,carrier_bytes,tag,prerelease=sys.argv[1:]
          pathlib.Path(out).write_text(json.dumps({
              'schema':'duckdb-carrier/1',
              'status':'PASS',
              'source':{'url':source_url,'version':version,'asset':asset,'sha256':upstream_sha},
              'payload':{'kind':'native','target':'linux-amd64-musl','sha256':payload_sha,'bytes':int(payload_bytes),'version':observed},
              'carrier':{'codec':'base64-standard','whitespace':'forbidden','name':pathlib.Path(carrier).name,'sha256':carrier_sha,'bytes':int(carrier_bytes),'decodedSha256':payload_sha},
              'fixture':{'hot':'jsonl','cold':'parquet','rows':2,'sumValue':30,'status':'PASS'},
              'release':{'tag':tag,'prerelease':prerelease=='true'},
          },sort_keys=True,indent=2)+'\n')
          PY

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "carrier=$carrier" >> "$GITHUB_OUTPUT"
          echo "carrier_name=$(basename "$carrier")" >> "$GITHUB_OUTPUT"
          echo "payload_sha=$payload_sha" >> "$GITHUB_OUTPUT"
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"
          echo "license=$license" >> "$GITHUB_OUTPUT"

      - name: Create exact Release and upload Carrier
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          PRERELEASE: ${{ steps.build.outputs.prerelease }}
          CARRIER: ${{ steps.build.outputs.carrier }}
          RECEIPT: ${{ steps.build.outputs.receipt }}
          LICENSE: ${{ steps.build.outputs.license }}
        run: |
          set -euo pipefail
          existing="$RUNNER_TEMP/existing-release.json"
          if curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -o "$existing"; then
            upload_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["upload_url"].split("{")[0])' "$existing")"
            created=false
          else
            python3 - "$TAG" "$GITHUB_SHA" "$PRERELEASE" > "$RUNNER_TEMP/release-request.json" <<'PY'
          import json,sys
          tag,sha,prerelease=sys.argv[1:]
          print(json.dumps({
              'tag_name':tag,
              'target_commitish':sha,
              'name':tag,
              'body':'Pinned DuckDB CLI as canonical Base64 Carrier. Proof: JSONL is queried directly as hot data, copied to Parquet as cold data, read back, then the public Release Carrier is decoded and re-verified.',
              'draft':False,
              'prerelease':prerelease=='true',
              'make_latest':'false',
          }))
          PY
            curl --fail-with-body --silent --show-error \
              -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" --data-binary @"$RUNNER_TEMP/release-request.json" -o "$RUNNER_TEMP/release.json"
            upload_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["upload_url"].split("{")[0])' "$RUNNER_TEMP/release.json")"
            created=true
          fi

          if [[ "$created" == true ]]; then
            for spec in "$CARRIER:text/plain" "$RECEIPT:application/json" "$LICENSE:text/plain"; do
              file="${spec%%:*}"
              ctype="${spec#*:}"
              name="$(basename "$file")"
              q="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$name")"
              curl --fail-with-body --silent --show-error \
                -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' -H "Content-Type: $ctype" \
                "$upload_url?name=$q" --data-binary @"$file" >/dev/null
            done
          fi
          echo "created=$created" >> "$GITHUB_OUTPUT"

      - name: Verify public Release Carrier readback and reuse
        shell: bash
        env:
          TAG: ${{ steps.build.outputs.tag }}
          CARRIER: ${{ steps.build.outputs.carrier }}
          CARRIER_NAME: ${{ steps.build.outputs.carrier_name }}
          PAYLOAD_SHA: ${{ steps.build.outputs.payload_sha }}
          RECEIPT: ${{ steps.build.outputs.receipt }}
          LICENSE: ${{ steps.build.outputs.license }}
        run: |
          set -euo pipefail
          rb="$RUNNER_TEMP/readback"
          mkdir -p "$rb"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for src in "$CARRIER" "$RECEIPT" "$LICENSE"; do
            name="$(basename "$src")"
            curl --fail --location --retry 5 --retry-all-errors --silent --show-error "$base/$name" -o "$rb/$name"
            cmp "$src" "$rb/$name"
          done

          ! LC_ALL=C grep -q '[[:space:]]' "$rb/$CARRIER_NAME"
          base64 --decode "$rb/$CARRIER_NAME" > "$rb/duckdb"
          [[ "$(sha256sum "$rb/duckdb" | awk '{print $1}')" == "$PAYLOAD_SHA" ]]
          chmod 0755 "$rb/duckdb"
          "$rb/duckdb" -version

          printf '%s\n' '{"id":1,"value":10}' '{"id":2,"value":20}' > "$rb/hot.jsonl"
          [[ "$("$rb/duckdb" -csv -noheader -c "SELECT count(*), sum(value) FROM read_ndjson('$rb/hot.jsonl');")" == "2,30" ]]
          "$rb/duckdb" -c "COPY (SELECT * FROM read_ndjson('$rb/hot.jsonl')) TO '$rb/cold.parquet' (FORMAT parquet);"
          [[ "$("$rb/duckdb" -csv -noheader -c "SELECT count(*), sum(value) FROM read_parquet('$rb/cold.parquet');")" == "2,30" ]]
