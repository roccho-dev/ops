name: GitHub approval evidence proof

on:
  pull_request:
    branches: [proposals]
    paths:
      - tools/github-approval-evidence.py
      - nix/github-approval-evidence.nix
      - docs/github-approval-evidence/**
      - .github/workflows/github-approval-evidence.yml
      - ci.intent.v1.jsonl
      - flake.nix
      - flake.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run recorded provider proof twice
        run: |
          set -euo pipefail
          mkdir -p proof
          python3 tools/github-approval-evidence.py selftest > proof/selftest-a.json
          python3 tools/github-approval-evidence.py selftest > proof/selftest-b.json
          cmp proof/selftest-a.json proof/selftest-b.json
          grep -q '"status": "PASS"' proof/selftest-a.json
      - name: Enforce read-only and claim ceiling
        run: |
          python3 - <<'PY'
          import ast
          import importlib.util
          from pathlib import Path

          path = Path('tools/github-approval-evidence.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          forbidden_modules = {'requests', 'httpx', 'github'}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  assert not ({alias.name.split('.')[0] for alias in node.names} & forbidden_modules)
              if isinstance(node, ast.ImportFrom) and node.module:
                  assert node.module.split('.')[0] not in forbidden_modules
              if isinstance(node, ast.Call):
                  for keyword in node.keywords:
                      if keyword.arg == 'method' and isinstance(keyword.value, ast.Constant):
                          assert str(keyword.value.value).upper() == 'GET'
          for forbidden in ('method="POST"', "method='POST'", 'method="PUT"', "method='PUT'", 'method="PATCH"', "method='PATCH'", 'method="DELETE"', "method='DELETE'"):
              assert forbidden not in source

          spec = importlib.util.spec_from_file_location('adapter', path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          bundle, request, observed_at, identity = module.fixture()
          envelope = module.normalize_github_approval_evidence(bundle, request, observed_at, identity)
          assert envelope['status'] == 'COMPLETE'
          assert envelope['current_approval'] is True
          assert all(value is False for value in envelope['claim_ceiling'].values())
          serialized = module.canonical(envelope)
          assert 'secret' not in serialized.lower()
          assert 'token' not in serialized.lower()
          PY
      - uses: cachix/install-nix-action@v31.10.6
      - name: Run Nix gates with retained diagnostics
        run: |
          set +e
          nix-build --impure --expr '
            let
              pkgs = (builtins.getFlake "github:NixOS/nixpkgs/1c3fe55ad329cbcb28471bb30f05c9827f724c76").legacyPackages.x86_64-linux;
            in import ./nix/github-approval-evidence.nix { inherit pkgs; }
          ' -o result-github-approval-evidence > proof/nix-build.log 2>&1
          echo $? > proof/nix-build.status
          nix flake check -L --no-write-lock-file \
            --override-input governance github:roccho-dev/governance/proposal/182-approval-receipt-verifier \
            --override-input conventionGovernance github:roccho-dev/governance/proposal/182-approval-receipt-verifier \
            > proof/flake-check.log 2>&1
          echo $? > proof/flake-check.status
          if test -x result-github-approval-evidence/bin/github-approval-evidence; then
            result-github-approval-evidence/bin/github-approval-evidence selftest > proof/nix-selftest.json 2> proof/nix-selftest.stderr
            echo $? > proof/nix-selftest.status
          else
            echo 127 > proof/nix-selftest.status
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: github-approval-evidence-proof
          path: proof/
          if-no-files-found: error
      - name: Enforce Nix gates
        run: |
          test "$(cat proof/nix-build.status)" = 0
          test "$(cat proof/flake-check.status)" = 0
          test "$(cat proof/nix-selftest.status)" = 0
