name: Diagnose Mobile Agent bootstrap paths

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/diagnose-mobile-agent-bootstrap.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: proposal/mobile-agent-preset-static-app-260821
      SOURCE_BASE: https://mobile-agent.roccho.workers.dev/
    steps:
      - name: Read candidate path inventory and probe every public path
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git clone --quiet --depth=1 --branch "$TARGET_BRANCH" "$remote" product
          python3 - product/verification/mobile-agent-preset-app/expected.json "$SOURCE_BASE" <<'PY'
          import concurrent.futures,json,sys,urllib.error,urllib.parse,urllib.request
          expected=json.load(open(sys.argv[1],encoding='utf-8'))
          base=sys.argv[2]
          def fetch(rel):
              url=urllib.parse.urljoin(base,rel)
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'ops-mobile-agent-bootstrap-diagnose/1','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=30) as response:
                      data=response.read()
                      return {'path':rel,'status':response.status,'bytes':len(data),'url':response.geturl()}
              except urllib.error.HTTPError as error:
                  return {'path':rel,'status':error.code,'error':str(error),'url':url}
              except Exception as error:
                  return {'path':rel,'status':None,'error':repr(error),'url':url}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as executor:
              rows=list(executor.map(fetch,sorted(expected['files'])))
          failures=[row for row in rows if row['status']!=200]
          print(json.dumps({'schema':'ops.mobileAgentBootstrapDiagnosis/1','files':len(rows),'failures':failures,'rows':rows},sort_keys=True,separators=(',',':')))
          if failures:
              raise SystemExit(f'{len(failures)} public bootstrap paths failed')
          PY
