name: UI213 registry proof

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  registry:
    if: >-
      github.event.issue.number == 230 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/ui213-registry-5bf45bf7'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate exact registry
        shell: bash
        run: |
          set -euo pipefail
          ui="$RUNNER_TEMP/ui"
          git clone --filter=blob:none --no-checkout https://github.com/roccho-dev/ui.git "$ui"
          git -C "$ui" fetch --depth=1 origin 5bf45bf7e2740bec88002f2d6197a4ee2938ef61
          git -C "$ui" checkout --detach 5bf45bf7e2740bec88002f2d6197a4ee2938ef61
          (cd "$ui" && node apps/artifact-shell/scripts/build-registry.mjs)
          test -s "$ui/apps/artifact-shell/generated/capability-registry.mjs"
          git -C "$ui" diff --exit-code --quiet -- apps/artifact-shell/generated/capability-registry.mjs && { echo 'registry unexpectedly unchanged' >&2; exit 1; } || true
          cp "$ui/apps/artifact-shell/generated/capability-registry.mjs" "$RUNNER_TEMP/capability-registry.mjs"
          sha256sum "$RUNNER_TEMP/capability-registry.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: ui213-capability-registry
          path: ${{ runner.temp }}/capability-registry.mjs
          if-no-files-found: error
          retention-days: 1
