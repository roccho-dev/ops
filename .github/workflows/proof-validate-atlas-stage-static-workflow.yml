name: Persist validated AtlasStage static workflow blob

on:
  pull_request:
    branches: [proposals]
    paths:
      - '.github/workflows/proof-validate-atlas-stage-static-workflow.yml'
      - '.github/workflows/artifact-runtime-static-host.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'proposal/atlas-stage-artifact-publication-260821'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair and validate the one escaped newline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/artifact-runtime-static-host.yml')
          lines=path.read_text(encoding='utf-8').splitlines()
          matches=[]
          for index,line in enumerate(lines[:-1]):
              if "open(sys.argv[3],'w',encoding='utf-8').write(json.dumps(out,sort_keys=True,separators=(',',':'))+'" in line and lines[index+1].strip()=="')":
                  matches.append(index)
          assert len(matches)==1,matches
          index=matches[0]
          lines[index]=lines[index][:-2] + "+'" + chr(92) + "n')"
          del lines[index+1]
          path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); puts "yaml-parse-pass"' .github/workflows/artifact-runtime-static-host.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/artifact-runtime-static-host.yml').read_text(encoding='utf-8')
          required=[
            "if [ \"$GITHUB_EVENT_NAME\" = pull_request ]; then",
            "npm run check:artifact-runtime",
            "atlas-stage.mjs",
            "expectedListedFiles']==p['publication']['listedFiles']==54",
          ]
          for value in required: assert value in text,value
          lines=text.splitlines()
          assert sum(line=='jobs:' for line in lines)==1
          assert sum(line=='  materialize:' for line in lines)==1
          assert sum(line=='  deploy:' for line in lines)==1
          print('static-contract-pass')
          PY
          git diff --check

      - name: Commit validated bytes only at a regular path
        shell: bash
        run: |
          set -euo pipefail
          target=verification/atlas-stage-publication/validated-static-workflow.yml
          test ! -e "$target"
          mkdir -p "$(dirname "$target")"
          cp .github/workflows/artifact-runtime-static-host.yml "$target"
          sha256sum "$target"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          git commit -m "proof: persist validated AtlasStage static workflow bytes"
          git push origin HEAD:${GITHUB_HEAD_REF}
