name: Transport bidirectional Artifact Runtime static-host candidate

on:
  pull_request:
    branches: [proposals]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_BASE: 10e64726df069b71a1022d21e195d30427762018
      TARGET_BRANCH: proposal/artifact-runtime-bidirectional-static-host-260821
      PATCH_B64_SHA256: 4c9b302ebf74d2d5735f9bd5460d7ab8647d8534fda3a70a202f5feb2ea0b5e0
      PATCH_GZ_SHA256: 81feb8592c0a5da675593c982d169fb47da1a41282bfc8db9558d1e34b5f4af0
      PATCH_SHA256: 22be99f1c04bbdfbd7ca9373c6de76f75565d2bab532f806080168cfe53bfd8d
      APP_TAG: artifact-runtime-b1f12244cc627fc27a97fc22f3da9e813dab10954c972c7033f99ab8d909184b
      APP_ARCHIVE: artifact-runtime.b1f12244cc627fc27a97fc22f3da9e813dab10954c972c7033f99ab8d909184b.tar.gz
      APP_ARCHIVE_SHA256: 571592795ca9e4405330c8dfdc11fbd5db6b27d7ef0d672587e58fdbf6cdca6b
      APP_TREE: sha256:b1f12244cc627fc27a97fc22f3da9e813dab10954c972c7033f99ab8d909184b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact candidate from bounded patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transport/artifact-runtime-bidirectional-static-host.current.part{0,1,2,3} > "$RUNNER_TEMP/change.patch.gz.b64"
          test "$(sha256sum "$RUNNER_TEMP/change.patch.gz.b64" | awk '{print $1}')" = "$PATCH_B64_SHA256"
          base64 --decode "$RUNNER_TEMP/change.patch.gz.b64" > "$RUNNER_TEMP/change.patch.gz"
          test "$(sha256sum "$RUNNER_TEMP/change.patch.gz" | awk '{print $1}')" = "$PATCH_GZ_SHA256"
          gzip --decompress --stdout "$RUNNER_TEMP/change.patch.gz" > "$RUNNER_TEMP/change.patch"
          test "$(sha256sum "$RUNNER_TEMP/change.patch" | awk '{print $1}')" = "$PATCH_SHA256"

          test "$(git ls-remote origin refs/heads/proposals | awk 'NR==1 {print $1}')" = "$EXPECTED_BASE"
          test -z "$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"
          git reset --hard "$EXPECTED_BASE"
          git clean -fdx
          git apply --check --exclude=ci.intent.v1.jsonl "$RUNNER_TEMP/change.patch"
          git apply --exclude=ci.intent.v1.jsonl "$RUNNER_TEMP/change.patch"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('ci.intent.v1.jsonl')
          lines=path.read_text(encoding='utf-8').splitlines()
          replacement='{"kind":"ci.intent.v1","path":".github/workflows/artifact-runtime-static-host.yml","provider":"github-actions","role":"bootstrap_exception","entrypoint":"PR exact bidirectional Artifact App Release materialization and hash proof; owner /artifact-runtime-deploy issue comment -> existing Cloudflare Pages deploy -> public 53-file readback -> UI click/URL/Back/Forward/fresh-browser proof -> Issue result comment","source":"verification/artifact-runtime-static-host/manifest.json plus verification/artifact-runtime-app/manifest.json and immutable bidirectional Artifact Runtime Release projection","authority":false,"dispatch":["pull_request","issue_comment"],"generation_mode":"checked_in","workflow_definition":"checked_in","artifact_source":"content-addressed bidirectional app static-site proof and Cloudflare deployment/browser receipts","artifact_generation":"generated","final_role":"static_bidirectional_artifact_app_projection","all_repositories_enforced":false,"exception":{"owner":"ops#193","reason":"bounded existing Cloudflare Pages adapter for the same GitHub-only carryable Artifact App bytes; Git source authority and immutable Release identity remain unchanged","expiry":"2027-08-21","return_condition":"replace only the provider effect when another static-host adapter is adopted"}}'
          matches=0
          for index,line in enumerate(lines):
              if '"path":".github/workflows/artifact-runtime-static-host.yml"' in line:
                  lines[index]=replacement
                  matches+=1
          assert matches==1
          path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | LC_ALL=C sort | paste -sd, -)" = ".github/workflows/artifact-runtime-static-host.yml,ci.intent.v1.jsonl,verification/artifact-runtime-static-host/browser_smoke.py,verification/artifact-runtime-static-host/manifest.json"

          python3 -m py_compile \
            verification/artifact-runtime-static-host/browser_smoke.py \
            verification/artifact-runtime-static-host/readback.py
          python3 - <<'PY'
          import json
          s=json.load(open('verification/artifact-runtime-static-host/manifest.json',encoding='utf-8'))
          p=json.load(open('verification/artifact-runtime-app/manifest.json',encoding='utf-8'))
          assert s['schema']=='ops.artifactRuntimeStaticHost/1' and s['issue']==193 and s['authority'] is False
          assert p['schema']=='ops.artifactRuntimeApp/1' and p['issue']==193 and p['authority'] is False
          assert s['publication']['treeDigest']==p['publication']['treeDigest']=='sha256:b1f12244cc627fc27a97fc22f3da9e813dab10954c972c7033f99ab8d909184b'
          assert s['publication']['tag']==p['publication']['tag']
          assert s['publication']['archive']==p['publication']['archive']
          assert s['publication']['listedFiles']==p['publication']['listedFiles']==53
          assert p['publication']['capabilities']==['inspect.json@1','render.a2ui@1','render.a2ui.app@1']
          assert p['boundaries']['uploadedZipAllowedAsSource'] is False
          rows=[json.loads(line) for line in open('ci.intent.v1.jsonl',encoding='utf-8') if line.strip()]
          static=[row for row in rows if row.get('path')=='.github/workflows/artifact-runtime-static-host.yml']
          assert len(static)==1 and static[0]['exception']['owner']=='ops#193'
          PY

          gh release download "$APP_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$APP_ARCHIVE" --dir "$RUNNER_TEMP"
          test "$(sha256sum "$RUNNER_TEMP/$APP_ARCHIVE" | awk '{print $1}')" = "$APP_ARCHIVE_SHA256"
          mkdir "$RUNNER_TEMP/publication"
          tar -xzf "$RUNNER_TEMP/$APP_ARCHIVE" -C "$RUNNER_TEMP/publication"
          python3 - "$RUNNER_TEMP/publication" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          root=Path(sys.argv[1]); m=json.loads((root/'artifact-manifest.json').read_text())
          assert m['treeDigest']=='sha256:b1f12244cc627fc27a97fc22f3da9e813dab10954c972c7033f99ab8d909184b'
          assert len(m['files'])==53
          for item in m['files']:
              data=(root/item['path']).read_bytes()
              assert len(data)==item['bytes']
              assert 'sha256:'+hashlib.sha256(data).hexdigest()==item['sha256']
          actual=sorted(str(path.relative_to(root)).replace(os.sep,'/') for path in root.rglob('*') if path.is_file())
          assert actual==sorted([item['path'] for item in m['files']]+['artifact-manifest.json'])
          canon=json.dumps(m['files'],sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          assert 'sha256:'+hashlib.sha256(canon).hexdigest()==m['treeDigest']
          PY

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/workflows/artifact-runtime-static-host.yml ci.intent.v1.jsonl \
            verification/artifact-runtime-static-host/browser_smoke.py \
            verification/artifact-runtime-static-host/manifest.json
          git commit -m "feat: prove bidirectional Artifact App on static host"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
