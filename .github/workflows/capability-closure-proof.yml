name: ChatGPT capability closure proof

on:
  push:
    branches:
      - proof/chatgpt-capability-closure-2608170736
    paths:
      - .github/workflows/capability-closure-proof.yml

permissions:
  contents: write

concurrency:
  group: chatgpt-capability-closure-2608170736-final
  cancel-in-progress: false

env:
  SOURCE_BASE_URL: https://stg-cap02.roccho.workers.dev
  EXPECTED_BASE_SOURCE_KIT_SHA256: 7e5ec9aed5f185c48eb977ef4d4d41e8751909b54f30eb9d45f51f1ca5a6f711
  EXPECTED_BASE_TREE: 265a2d757b4b25e98286a1b7bd822931a6a54193
  EXPECTED_TARGET_TREE: 9b505413965f7686d451534528de5a3576660016
  EXPECTED_TARGET_HEAD: d9140b5fbea53f4c708c770beefa2a8febb2371c
  INTAKE_BUNDLE_SHA256: fb3561680cc67596c52b672441ad031f982cc9d5daa5577ad9baa6a8df606e22
  INTAKE_BUNDLE_BYTES: "1442630"
  DELTA_CARRIER_SHA256: 236330bf6a492556a5b0a5a9257aade3c6b451352ac58acd097d93d1d414490d
  DELTA_PATCH_SHA256: 86d9256e0d29b519379b62d3d563a6b88d7ddb4c81e72c858cfc48c4c08a375b
  RELEASE_ID: 6a819b1d-0d40-83e8-855a-00e20dd48e56
  PACKAGE_PATH: packages/chatgpt-capability
  SELF_WORKFLOW: .github/workflows/capability-closure-proof.yml
  DELTA_DIR: .github/closure

jobs:
  close-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize exact target source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/capability-closure"
          src="$work/source"
          proof="$work/proof"
          mkdir -p "$src" "$proof"

          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "$SOURCE_BASE_URL/.well-known/bootstrap.json" -o "$work/bootstrap.json"
          mapfile -t kit < <(python3 - "$work/bootstrap.json" <<'PY'
          import json, pathlib, sys
          b=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(b["sourceKit"]["carrierPath"].removeprefix("./"))
          print(b["sourceKit"]["sha256"])
          PY
          )
          [[ "${kit[1]}" == "$EXPECTED_BASE_SOURCE_KIT_SHA256" ]]
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "$SOURCE_BASE_URL/${kit[0]}" -o "$work/source-kit.b64.txt"

          python3 - "$work/source-kit.b64.txt" "$work/source.zip" "$EXPECTED_BASE_SOURCE_KIT_SHA256" "$src" <<'PY'
          import base64, hashlib, pathlib, sys, zipfile
          carrier, out, expected, dest=map(pathlib.Path, sys.argv[1:])
          raw=carrier.read_text()
          if any(c.isspace() for c in raw): raise SystemExit("source carrier whitespace")
          data=base64.b64decode(raw, validate=True)
          if base64.b64encode(data).decode()!=raw: raise SystemExit("source carrier noncanonical")
          if hashlib.sha256(data).hexdigest()!=str(expected): raise SystemExit("source kit sha mismatch")
          out.write_bytes(data)
          with zipfile.ZipFile(out) as z:
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  if p.is_absolute() or ".." in p.parts: raise SystemExit(f"unsafe path {i.filename}")
              z.extractall(dest)
          PY

          rm -rf "$src/.capforge"
          find "$src" -type f -exec chmod 0644 {} +
          git -C "$src" init -q
          git -C "$src" config core.autocrlf false
          git -C "$src" add -A
          base_tree="$(git -C "$src" write-tree)"
          [[ "$base_tree" == "$EXPECTED_BASE_TREE" ]]

          cat "$DELTA_DIR"/part-*.b64 > "$work/delta.patch.gz.b64"
          echo "$DELTA_CARRIER_SHA256  $work/delta.patch.gz.b64" | sha256sum -c -
          base64 -d "$work/delta.patch.gz.b64" | gzip -d > "$work/delta.patch"
          echo "$DELTA_PATCH_SHA256  $work/delta.patch" | sha256sum -c -
          git -C "$src" apply --index --binary "$work/delta.patch"
          target_tree="$(git -C "$src" write-tree)"
          [[ "$target_tree" == "$EXPECTED_TARGET_TREE" ]]

          printf '%s\n' "$base_tree" > "$proof/base-tree.txt"
          printf '%s\n' "$target_tree" > "$proof/target-tree.txt"
          printf '%s\n' "$EXPECTED_BASE_SOURCE_KIT_SHA256" > "$proof/base-source-kit-sha256.txt"
          printf '%s\n' "$DELTA_CARRIER_SHA256" > "$proof/delta-carrier-sha256.txt"
          printf '%s\n' "$DELTA_PATCH_SHA256" > "$proof/delta-patch-sha256.txt"
          echo "target_tree=$target_tree" >> "$GITHUB_OUTPUT"

      - name: Repoize exact source and erase bootstrap transport
        id: repoize
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/capability-closure"
          src="$work/source"
          rm -rf "$PACKAGE_PATH"
          mkdir -p "$PACKAGE_PATH"
          git -C "$src" checkout-index -a --prefix="$GITHUB_WORKSPACE/$PACKAGE_PATH/"
          rm -f "$SELF_WORKFLOW"
          rm -rf "$DELTA_DIR"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- "$PACKAGE_PATH" "$SELF_WORKFLOW" "$DELTA_DIR"
          git commit -m "feat: import chatgpt capability source authority"
          source_commit="$(git rev-parse HEAD)"
          subtree="$(git rev-parse HEAD:"$PACKAGE_PATH")"
          [[ "$subtree" == "$EXPECTED_TARGET_TREE" ]]
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "subtree=$subtree" >> "$GITHUB_OUTPUT"

      - name: Test and build Publisher from repoized source
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/capability-closure"
          go -C "$PACKAGE_PATH" test ./...
          go -C "$PACKAGE_PATH" build -trimpath -o "$work/capforge" ./cmd/capforge
          "$work/capforge" version > "$work/proof/capforge-version.txt"

      - name: Build release projections
        id: build
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/capability-closure"
          src="$work/release-source"
          out="$work/release-out"
          assets="$work/assets"
          mkdir -p "$src" "$out" "$assets"
          git archive "${{ steps.repoize.outputs.source_commit }}:$PACKAGE_PATH" | tar -x -C "$src"
          timestamp="$(TZ=Asia/Tokyo date +%y%m%d%H%M%S)"
          "$work/capforge" publish --root "$src" --dist "$src/dist" --out "$out" --timestamp "$timestamp" > "$work/publish.json"
          python3 - "$work/publish.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x["project"]["status"]==x["verify"]["status"]==x["release"]["status"]=="PASS",x
          PY

          python3 - "$src/dist" "$out" "$assets" "$work/publish.json" "${{ steps.repoize.outputs.source_commit }}" "$EXPECTED_TARGET_TREE" "$EXPECTED_TARGET_HEAD" "$INTAKE_BUNDLE_SHA256" "$INTAKE_BUNDLE_BYTES" <<'PY'
          import hashlib,json,pathlib,shutil,sys
          dist,out,assets,publish=map(pathlib.Path,sys.argv[1:5]); commit,tree,head,intake_sha,intake_bytes=sys.argv[5:]
          assets.mkdir(exist_ok=True)
          pub=json.loads(publish.read_text()); boot=json.loads((dist/".well-known/bootstrap.json").read_text())
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          staged=[]
          def put(src,name,ctype,payload=None):
              dst=assets/name; shutil.copyfile(src,dst); staged.append((dst,ctype,payload))
          rel=pub["release"]
          put(out/rel["bundle"],rel["bundle"],"application/octet-stream")
          put(out/rel["distZip"],rel["distZip"],"application/zip")
          put(dist/".well-known/bootstrap.json","bootstrap.json","application/json")
          put(dist/".well-known/registry.jsonl","registry.jsonl","application/x-ndjson")
          put(dist/".well-known/verify.json","verify.json","application/json")
          for p in sorted((dist/"cap/v1").glob("*/*/*.b64.txt")):
              kind,target,fn=p.relative_to(dist).parts[2:5]; payload=fn.removesuffix(".b64.txt")
              put(p,f"carrier.{kind}.{target}.{fn}","text/plain",payload)
          kitsha=boot["sourceKit"]["sha256"]; kit=dist/boot["sourceKit"]["carrierPath"].removeprefix("./")
          put(kit,f"source-kit.{kitsha}.b64.txt","text/plain",kitsha)
          manifest={"schema":"chatgpt-capability-release/1","source":{"opsCommit":commit,"subtree":tree,"intakeBundleHead":head,"intakeBundleSha256":intake_sha,"intakeBundleBytes":int(intake_bytes)},"build":pub,"assets":[]}
          for p,ctype,payload in staged:
              row={"name":p.name,"bytes":p.stat().st_size,"sha256":sha(p),"contentType":ctype}
              if payload: row["payloadSha256"]=payload
              manifest["assets"].append(row)
          (assets/"release-manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          PY
          tag="cap-${timestamp}-${RELEASE_ID}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.repoize.outputs.source_commit }}
          TAG: ${{ steps.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/capability-closure"
          python3 - "$TAG" "$SOURCE_COMMIT" "$EXPECTED_TARGET_TREE" > "$work/release-request.json" <<'PY'
          import json,sys
          tag,commit,tree=sys.argv[1:]
          print(json.dumps({"tag_name":tag,"target_commitish":commit,"name":tag,"body":f"ChatGPT closure proof; source={commit}; subtree={tree}","draft":False,"prerelease":True,"make_latest":"false"}))
          PY
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" --data-binary @"$work/release-request.json" -o "$work/release.json"
          python3 - "$work/release.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); print(f"release_id={r['id']}"); print(f"release_url={r['html_url']}"); print(f"upload_url={r['upload_url'].split('{')[0]}")
          PY

      - name: Upload Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
          ASSETS: ${{ steps.build.outputs.assets }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/capability-closure"; : > "$work/uploaded.jsonl"
          for f in "$ASSETS"/*; do
            n="$(basename "$f")"; case "$n" in *.b64.txt) ct=text/plain;; *.json) ct=application/json;; *.jsonl) ct=application/x-ndjson;; *.dist.zip) ct=application/zip;; *) ct=application/octet-stream;; esac
            q="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$n")"
            curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: $ct" "$UPLOAD_URL?name=$q" --data-binary @"$f" -o "$work/u.json"
            python3 - "$work/u.json" >> "$work/uploaded.jsonl" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert r["state"]=="uploaded",r; print(json.dumps({k:r.get(k) for k in ("id","name","content_type","size","digest","browser_download_url")},sort_keys=True))
          PY
          done

      - name: Prove public unauthenticated Release readback and ingestion
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/capability-closure"; rb="$work/readback"; mkdir -p "$rb"
          python3 - "$work/uploaded.jsonl" "$work/assets.tsv" <<'PY'
          import json,pathlib,sys
          pathlib.Path(sys.argv[2]).write_text("".join(f"{r['name']}\t{r['browser_download_url']}\n" for r in map(json.loads,pathlib.Path(sys.argv[1]).read_text().splitlines())))
          PY
          while IFS=$'\t' read -r n u; do curl --fail --location --retry 5 --retry-all-errors --silent --show-error "$u" -o "$rb/$n"; cmp "${{ steps.build.outputs.assets }}/$n" "$rb/$n"; done < "$work/assets.tsv"
          python3 - "$rb/bootstrap.json" "$rb" "$EXPECTED_TARGET_TREE" <<'PY'
          import base64,hashlib,json,pathlib,subprocess,sys,zipfile
          boot=json.load(open(sys.argv[1])); root=pathlib.Path(sys.argv[2]); expected=sys.argv[3]
          cap=boot["capforge"]; cn=f"carrier.{cap['kind']}.{cap['target']}.{cap['payloadSha256']}.b64.txt"; raw=(root/cn).read_text(); data=base64.b64decode(raw,validate=True); assert hashlib.sha256(data).hexdigest()==cap["payloadSha256"]
          exe=root/"capforge"; exe.write_bytes(data); exe.chmod(0o755); version=subprocess.check_output([str(exe),"version"],text=True).strip()
          kit=boot["sourceKit"]; kn=f"source-kit.{kit['sha256']}.b64.txt"; kd=base64.b64decode((root/kn).read_text(),validate=True); assert hashlib.sha256(kd).hexdigest()==kit["sha256"]
          zp=root/"source.zip"; zp.write_bytes(kd); src=root/"source"; src.mkdir()
          with zipfile.ZipFile(zp) as z:
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename); assert not p.is_absolute() and ".." not in p.parts
              z.extractall(src)
          import shutil
          shutil.rmtree(src/".capforge",ignore_errors=True)
          for p in src.rglob("*"):
              if p.is_file(): p.chmod(0o644)
          subprocess.run(["git","-C",str(src),"init","-q"],check=True); subprocess.run(["git","-C",str(src),"config","core.autocrlf","false"],check=True); subprocess.run(["git","-C",str(src),"add","-A"],check=True)
          tree=subprocess.check_output(["git","-C",str(src),"write-tree"],text=True).strip(); assert tree==expected,(tree,expected)
          (root/"ingestion-proof.json").write_text(json.dumps({"status":"PASS","capforgeVersion":version,"sourceTree":tree},indent=2)+"\n")
          PY

      - name: Publish closure receipt
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/capability-closure"; receipt="$work/proof/closure-receipt.json"
          python3 - "$receipt" "${{ steps.repoize.outputs.source_commit }}" "${{ steps.release.outputs.release_url }}" "${{ steps.build.outputs.tag }}" "$work/uploaded.jsonl" "$work/readback/ingestion-proof.json" <<'PY'
          import json,pathlib,sys,os
          out,commit,url,tag,uploads,ing=sys.argv[1:]
          r={"schema":"chatgpt-capability-closure/1","status":"PASS","intake":{"bundleSha256":os.environ["INTAKE_BUNDLE_SHA256"],"bundleBytes":int(os.environ["INTAKE_BUNDLE_BYTES"]),"bundleHead":os.environ["EXPECTED_TARGET_HEAD"],"sourceTree":os.environ["EXPECTED_TARGET_TREE"],"deltaCarrierSha256":os.environ["DELTA_CARRIER_SHA256"]},"repo":{"repository":os.environ["GITHUB_REPOSITORY"],"base":"proposals","branch":os.environ["GITHUB_REF_NAME"],"commit":commit,"package":os.environ["PACKAGE_PATH"]},"release":{"tag":tag,"url":url,"assets":[json.loads(x) for x in pathlib.Path(uploads).read_text().splitlines()]},"publicReadback":json.loads(pathlib.Path(ing).read_text())}
          pathlib.Path(out).write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" "$UPLOAD_URL?name=closure-receipt.json" --data-binary @"$receipt" -o "$work/receipt-upload.json"

      - name: Preserve proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-capability-closure-proof
          path: ${{ runner.temp }}/capability-closure/proof/
          if-no-files-found: warn
