name: Sandbox large multi-file source materializer v3

on:
  push:
    branches: ['ingress/sandbox-large-source-pr-2608280625']
    paths:
      - '.github/workflows/sandbox-large-source-materialize-2608280625.yml'
      - 'verification/sandbox-large-source-ingress-2608280625/**'

permissions:
  contents: write

concurrency:
  group: sandbox-large-source-materialize-2608280625
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify and run exact materializer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,lzma,pathlib
          root=pathlib.Path('verification/sandbox-large-source-ingress-2608280625/materializer')
          rows=[
            ('part-000.b64',1000,'d45e6646631050b2fb5dd879259eb0c805bda7bc027588446be756aecb6690b4'),
            ('part-001.b64',1000,'ac3f911671723989e719d55ca9f7950657634a3019d394182b4713db35302cc6'),
            ('part-002.b64',1000,'71f51bf97a787e293ddaf2bf677ec73b2d1ca74683e60c0cba138047d12bd57b'),
            ('part-003.b64',760,'bec3dbec0136fb63e18dcca547c5888c13055d02273e863057aefcb3f38744a8'),
          ]
          chunks=[]
          for name,size,digest in rows:
              data=(root/name).read_bytes()
              assert len(data)==size and hashlib.sha256(data).hexdigest()==digest
              chunks.append(data)
          carrier=b''.join(chunks)
          assert len(carrier)==3760 and hashlib.sha256(carrier).hexdigest()=='f78b011973402245ffb070a5b7fc39026eee5a171bd59060e3a9dac4be91ba44'
          packed=base64.b64decode(carrier,validate=True)
          assert len(packed)==2820 and hashlib.sha256(packed).hexdigest()=='42bd185a82329201e52779b4a595801d4e95e42054005e8eb2f7a90facd1ab7f'
          script=lzma.decompress(packed)
          assert len(script)==8096 and hashlib.sha256(script).hexdigest()=='3e0865462b0182bffa85e98423eca57ae31ca8251dc8e7b8f7fbb3f6076b512a'
          pathlib.Path('/tmp/materializer.py').write_bytes(script)
          PY
          python3 /tmp/materializer.py
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-large-source-pr-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
