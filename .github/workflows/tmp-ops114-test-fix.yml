name: Temporary fix ops 114 same-status fixture

on:
  push:
    branches:
      - feat/ops-114-git-write-closure-final
    paths:
      - .github/workflows/tmp-ops114-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix fixture, run focused test, and self-remove
        shell: bash
        env:
          TARGET_BRANCH: feat/ops-114-git-write-closure-final
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("packages/ops-git-write-closure/tests/e2e.mjs"); s=p.read_text(); old="require(\u0027fs\u0027).writeFileSync(\u0027src/update.txt\u0027,\u0027mutated"+chr(92)+"n\u0027)"; assert old in s, repr(old); p.write_text(s.replace(old, "require(\u0027fs\u0027).writeFileSync(\u0027src/update.txt\u0027,\u0027mutated\u0027)", 1))'
          node packages/ops-git-write-closure/tests/e2e.mjs
          rm -f .github/workflows/tmp-ops114-test-fix.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: fix same-status mutation fixture"
          git push origin "HEAD:$TARGET_BRANCH"
