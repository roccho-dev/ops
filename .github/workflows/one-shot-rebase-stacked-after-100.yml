name: one-shot rebase stacked dist PRs after 100

on:
  push:
    branches:
      - bootstrap/dist-index-finalize-20260803

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase stacked branches
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin proposals feat/excalidraw-dist-split-bundler-20260803 feat/dist-runner-20260803

          git checkout -B feat/excalidraw-dist-split-bundler-20260803 origin/feat/excalidraw-dist-split-bundler-20260803
          test "$(git rev-parse HEAD)" = "5ba615fa0cd45459cbec7b79b51415198b132b89"
          git rebase --onto origin/proposals 6e4eddfc73a0255a651465a170186d4059f67591
          new98="$(git rev-parse HEAD)"
          git push --force-with-lease origin HEAD:refs/heads/feat/excalidraw-dist-split-bundler-20260803

          git checkout -B feat/dist-runner-20260803 origin/feat/dist-runner-20260803
          test "$(git rev-parse HEAD)" = "369c034fce8502c50cbcdbff4054f473a521256e"
          git rebase --onto "$new98" 5ba615fa0cd45459cbec7b79b51415198b132b89
          git push --force-with-lease origin HEAD:refs/heads/feat/dist-runner-20260803
