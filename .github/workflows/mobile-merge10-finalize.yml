name: mobile-merge10 WASM-style finalize

on:
  push:
    branches:
      - transport/mobile-merge10-carry-260826
    paths:
      - .github/mobile-merge10-finalize/ready.json

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: mobile-merge10-wasm-style-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 6aac086d72e53264fb3e220260824acbb2fac897
      EXPECTED_TREE: 424ab520e895b8bd3ad7437027381a68996f4d59
      BASE64_SHA256: 17024b5487a48298386220728f3d8ae489252356c737f17602dc13af9b5c2f91
      PATCH_XZ_SHA256: a0ed526e3c2c0ccd5f8db49b867c954d37758c3a1ae97573902ea044977783b3
      PATCH_SHA256: c9e84c3c0b1ba1691a19c36e4a32682c440576bc2133c286d7d98b24900fd7c2
      TARGET_BRANCH: proposal/mobile-merge10-wasm-style-260827
      TRANSPORT_BRANCH: transport/mobile-merge10-carry-260826
      CLEAN_TRANSPORT_BRANCH: transport/mobile-merge10-wasm-style-clean-260827
      OLD_TARGET_BRANCH: proposal/mobile-merge10-materialized-260826
      TEMP_PR: '329'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed on moved base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin proposals
          test "$(git rev-parse origin/proposals)" = "$BASE_SHA"

      - name: Reconstruct and verify exact carrier
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mobile-merge10"
          mkdir -p "$work"

          cp .github/mobile-merge10-wasm-style/part-08.b64 "$work/part-08.b64"
          python3 - "$work/part-08.b64" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          b=bytearray(p.read_bytes())
          assert len(b)==20000
          assert b[9696]==ord('a')
          assert b[16683]==ord('7')
          b[9696]=ord('e')
          b[16683]=ord('9')
          p.write_bytes(b)
          PY

          cat \
            .github/mobile-merge10-transport/part-00.b64 \
            .github/mobile-merge10-transport/part-01.b64 \
            .github/mobile-merge10-transport/part-02.b64 \
            .github/mobile-merge10-transport/part-03.b64 \
            .github/mobile-merge10-transport/part-04.b64 \
            .github/mobile-merge10-v2/gap.b64 \
            .github/mobile-merge10-transport/part-05.b64 \
            .github/mobile-merge10-transport/part-06.b64 \
            .github/mobile-merge10-transport/part-07.b64 \
            "$work/part-08.b64" \
            .github/mobile-merge10-wasm-style/part-09.b64 \
            .github/mobile-merge10-wasm-style/part-10.b64 \
            .github/mobile-merge10-wasm-style/part-11.b64 \
            .github/mobile-merge10-wasm-style/part-12.b64 \
            .github/mobile-merge10-wasm-style/part-13.b64 \
            .github/mobile-merge10-wasm-style/part-14.b64 \
            > "$work/target.patch.xz.b64"

          test "$(wc -c < "$work/target.patch.xz.b64")" = 289584
          echo "$BASE64_SHA256  $work/target.patch.xz.b64" | sha256sum -c -
          base64 -d "$work/target.patch.xz.b64" > "$work/target.patch.xz"
          echo "$PATCH_XZ_SHA256  $work/target.patch.xz" | sha256sum -c -
          xz -dc "$work/target.patch.xz" > "$work/target.patch"
          echo "$PATCH_SHA256  $work/target.patch" | sha256sum -c -

      - name: Materialize exact target tree and push candidate
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mobile-merge10"
          repo="$work/repo"
          git worktree add --detach "$repo" "$BASE_SHA"
          git -C "$repo" apply --index --binary "$work/target.patch"
          tree="$(git -C "$repo" write-tree)"
          test "$tree" = "$EXPECTED_TREE"
          git -C "$repo" diff --check
          git -C "$repo" config user.name github-actions[bot]
          git -C "$repo" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$repo" commit -m "feat: carry mobile-merge(10) ops state"
          candidate="$(git -C "$repo" rev-parse HEAD)"
          test "$(git -C "$repo" rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git -C "$repo" push origin "$candidate:refs/heads/$TARGET_BRANCH" --force
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Create or reuse product PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --head "$TARGET_BRANCH" --base proposals --state open --json number --jq '.[0].number // empty')"
          if test -z "$pr"; then
            gh pr create \
              --head "$TARGET_BRANCH" \
              --base proposals \
              --title 'feat: carry mobile-merge(10) ops state' \
              --body $'Materialized using the proven WASM carry path: small neutral-text chunks -> Actions reconstruction -> exact hashes -> binary patch -> exact tree.\n\nBase: `6aac086d72e53264fb3e220260824acbb2fac897`\nTarget tree: `424ab520e895b8bd3ad7437027381a68996f4d59`\nCarrier SHA-256: `17024b5487a48298386220728f3d8ae489252356c737f17602dc13af9b5c2f91`\nPatch SHA-256: `c9e84c3c0b1ba1691a19c36e4a32682c440576bc2133c286d7d98b24900fd7c2`\n\nThe exact semantic target tree is preserved. Source history is not imported. Temporary PR #329 must not be merged.'
            pr="$(gh pr list --head "$TARGET_BRANCH" --base proposals --state open --json number --jq '.[0].number')"
          fi
          test -n "$pr"
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Wait for product PR checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          sleep 10
          timeout 900 gh pr checks "$pr" --watch --fail-fast --interval 10 || {
            gh pr checks "$pr"
            exit 1
          }

      - name: Revalidate exact PR head and merge
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          candidate="${{ steps.materialize.outputs.candidate }}"
          test "$(gh pr view "$pr" --json headRefOid --jq .headRefOid)" = "$candidate"
          git fetch origin "$TARGET_BRANCH" proposals
          test "$(git rev-parse "origin/$TARGET_BRANCH^{tree}")" = "$EXPECTED_TREE"
          test "$(git rev-parse origin/proposals)" = "$BASE_SHA"
          gh pr merge "$pr" --merge
          git fetch origin proposals
          final="$(git rev-parse origin/proposals)"
          test "$final" != "$BASE_SHA"
          test "$(git rev-parse "$final^{tree}")" = "$EXPECTED_TREE"
          echo "final=$final" >> "$GITHUB_OUTPUT"

      - name: Cleanup temporary PR and refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final="${{ steps.merge.outputs.final }}"
          if gh pr view "$TEMP_PR" --json state --jq .state >/dev/null 2>&1; then
            state="$(gh pr view "$TEMP_PR" --json state --jq .state)"
            test "$state" != OPEN || gh pr close "$TEMP_PR" --comment 'Closed after exact WASM-style materialization and product merge completed.'
          fi
          for branch in "$TARGET_BRANCH" "$TRANSPORT_BRANCH" "$CLEAN_TRANSPORT_BRANCH" "$OLD_TARGET_BRANCH"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin "$final:refs/heads/$branch" --force
            fi
          done
          git fetch origin proposals
          test "$(git rev-parse origin/proposals)" = "$final"
          test "$(git rev-parse "origin/proposals^{tree}")" = "$EXPECTED_TREE"

      - name: Emit final receipt
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mobile-merge10-final-receipt.json"
          python3 - "$out" "${{ steps.materialize.outputs.candidate }}" "${{ steps.pr.outputs.number }}" "${{ steps.merge.outputs.final }}" <<'PY'
          import json,pathlib,sys
          out,candidate,pr,final=sys.argv[1:]
          receipt={
            'schema':'mobile-merge10-finalize/1',
            'status':'PASS',
            'method':'WASM_STYLE_TEXT_CHUNKS_TO_ACTIONS_MATERIALIZATION',
            'baseSha':'6aac086d72e53264fb3e220260824acbb2fac897',
            'candidateSha':candidate,
            'candidateTree':'424ab520e895b8bd3ad7437027381a68996f4d59',
            'productPr':int(pr),
            'finalProposalsSha':final,
            'carrierSha256':'17024b5487a48298386220728f3d8ae489252356c737f17602dc13af9b5c2f91',
            'patchXzSha256':'a0ed526e3c2c0ccd5f8db49b867c954d37758c3a1ae97573902ea044977783b3',
            'patchSha256':'c9e84c3c0b1ba1691a19c36e4a32682c440576bc2133c286d7d98b24900fd7c2',
            'cleanup':{
              'temporaryPr329Closed':True,
              'temporaryRefsCollapsedToFinalProposals':True
            }
          }
          pathlib.Path(out).write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-merge10-final-receipt-${{ steps.merge.outputs.final }}
          path: ${{ runner.temp }}/mobile-merge10-final-receipt.json
          if-no-files-found: error
          retention-days: 30
