name: Connectorless Release bootstrap proof

on:
  push:
    paths:
      - ".github/workflows/connectorless-release-proof.yml"

permissions:
  contents: write

env:
  TAG: cap-proof-58825bd52728-6a819b1d-0d40-83e8-855a-00e20dd48e56

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/chatgpt-capability/go.mod
      - name: Build exact source and bootstrap assets
        id: build
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/packages/chatgpt-capability"
          dist="$RUNNER_TEMP/dist"
          out="$RUNNER_TEMP/out"
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$out" "$assets"
          go -C "$root" test ./...
          go -C "$root" build -trimpath -o "$RUNNER_TEMP/capforge" ./cmd/capforge
          "$RUNNER_TEMP/capforge" publish --root "$root" --dist "$dist" --out "$out" --timestamp 260817115300 > "$RUNNER_TEMP/publish.json"
          python3 - "$RUNNER_TEMP/publish.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['project']['status']==x['verify']['status']==x['release']['status']=='PASS',x
          PY
          mapfile -t intake < <(python3 - "$dist/.well-known/registry.jsonl" <<'PY'
          import json,sys
          for line in open(sys.argv[1]):
            r=json.loads(line)
            if r.get('id')=='bootstrap-intake' and r.get('status')=='active':
              i=r['implementation']; print(i['carrierPath'].removeprefix('./')); print(i['payloadSha256']); break
          else: raise SystemExit('bootstrap-intake missing')
          PY
          )
          "$RUNNER_TEMP/capforge" materialize --carrier "$dist/${intake[0]}" --sha256 "${intake[1]}" --out "$RUNNER_TEMP/bootstrap-intake" --executable
          "$RUNNER_TEMP/bootstrap-intake" --bootstrap "$dist/.well-known/bootstrap.json" --registry "$dist/.well-known/registry.jsonl" --release-tag "$TAG" > "$assets/bootstrap-guide.json"
          cp "$dist/.well-known/bootstrap.json" "$assets/bootstrap.json"
          cp "$dist/.well-known/registry.jsonl" "$assets/registry.jsonl"
          while IFS= read -r carrier; do
            rel="${carrier#"$dist/"}"
            IFS=/ read -r _ _ kind target filename <<< "$rel"
            cp "$carrier" "$assets/carrier.${kind}.${target}.${filename}"
          done < <(find "$dist/cap/v1" -type f -name '*.b64.txt' | sort)
          python3 - "$assets/bootstrap-guide.json" <<'PY'
          import json,sys
          g=json.load(open(sys.argv[1])); assert g['status']=='PASS' and g['canExtend'] is True,g
          ids={x['id'] for x in g['capabilities']}; assert {'bootstrap-intake','go-sum','capforge'} <= ids,ids
          PY
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
      - name: Create public prerelease
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/release-request.json" <<'PY'
          import json,sys
          tag,sha=sys.argv[1:]
          print(json.dumps({'tag_name':tag,'target_commitish':sha,'name':tag,'body':'Connectorless consumer proof: public bootstrap and carriers.','draft':False,'prerelease':True,'make_latest':'false'}))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" --data-binary @"$RUNNER_TEMP/release-request.json" -o "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); print('upload_url='+r['upload_url'].split('{')[0]); print('release_url='+r['html_url'])
          PY
      - name: Upload public bootstrap and carriers
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
          ASSETS: ${{ steps.build.outputs.assets }}
        shell: bash
        run: |
          set -euo pipefail
          for file in "$ASSETS"/*; do
            name="$(basename "$file")"
            case "$name" in *.b64.txt) ct=text/plain;; *.json) ct=application/json;; *.jsonl) ct=application/x-ndjson;; *) ct=application/octet-stream;; esac
            q="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$name")"
            curl --fail-with-body --silent --show-error -X POST \
              -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: $ct" \
              "$UPLOAD_URL?name=$q" --data-binary @"$file" -o "$RUNNER_TEMP/u.json"
            python3 - "$RUNNER_TEMP/u.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); assert r['state']=='uploaded',r
          PY
          done
      - name: Public readback sanity check
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          curl --fail --location --silent --show-error "$base/bootstrap-guide.json" -o "$RUNNER_TEMP/readback.json"
          cmp "$RUNNER_TEMP/assets/bootstrap-guide.json" "$RUNNER_TEMP/readback.json"
# registered trigger
