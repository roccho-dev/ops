name: hq

on:
  pull_request:
    paths:
      - 'packages/hq/**'
      - 'packages/hq-modeling-runtime/**'
      - '.github/workflows/hq.yml'

jobs:
  go-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/hq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test -count=1 ./...
      - run: go build ./cmd/hq

  local-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node packages/hq-modeling-runtime/tests/local-root.mjs
