name: control-ui lock materialization

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .github/workflows/control-ui-lock.yml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Materialize exact lock
        run: nix flake lock --update-input controlUi
      - name: Upload lock
        uses: actions/upload-artifact@v4
        with:
          name: control-ui-flake-lock
          path: flake.lock
          if-no-files-found: error
