name: Temporary add selected SQLite query runtime

on:
  pull_request:
    types: [reopened, synchronize]
    branches: [proposals]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/ops-115-decision-closure-final-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ops-115-decision-closure-final-v2
          fetch-depth: 0

      - name: Add the selected SQLite-only query entry
        shell: bash
        run: |
          set -euo pipefail
          cat > packages/ops-decision-closure/bin/query.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          from pathlib import Path
          import argparse
          import hashlib
          import importlib.util
          import json
          import sys

          def fail(code: str, message: str) -> None:
              raise SystemExit(json.dumps({'schema':'ops.selectedQueryFailure.v1','status':'FAILED','code':code,'message':message},sort_keys=True))

          def read_json(path: Path):
              return json.loads(path.read_text(encoding='utf-8'))

          def sha256_file(path: Path) -> str:
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          def load_core(path: Path):
              spec=importlib.util.spec_from_file_location('ops_decision_selected_core',path)
              if spec is None or spec.loader is None: fail('CORE_LOAD','cannot load selected query core')
              module=importlib.util.module_from_spec(spec)
              sys.modules[spec.name]=module
              spec.loader.exec_module(module)
              return module

          def main() -> int:
              p=argparse.ArgumentParser()
              p.add_argument('--projection',required=True)
              p.add_argument('--query',required=True)
              p.add_argument('--params-json',default='{}')
              args=p.parse_args()
              projection=Path(args.projection).resolve()
              manifest_path=projection/'manifest.json'
              if not manifest_path.is_file(): fail('MANIFEST_MISSING',str(manifest_path))
              manifest=read_json(manifest_path)
              if manifest.get('schema')!='ops.sqliteShardProjection.v1' or manifest.get('projectionKind')!='sqlite-shards':
                  fail('PROJECTION_KIND','selected query accepts SQLite shards only')
              expected={x['name']:x for x in manifest.get('assets',[])}
              actual={x.name for x in projection.iterdir() if x.is_file() and x.suffix=='.sqlite'}
              if actual!=set(expected): fail('ASSET_SET_MISMATCH',json.dumps({'expected':sorted(expected),'actual':sorted(actual)}))
              for name,row in expected.items():
                  path=projection/name
                  if path.stat().st_size!=row['bytes'] or sha256_file(path)!=row['sha256']:
                      fail('ASSET_IDENTITY_MISMATCH',name)
              try: params=json.loads(args.params_json)
              except json.JSONDecodeError as exc: fail('PARAMS_JSON',str(exc))
              if not isinstance(params,dict) or any(not isinstance(k,str) or not isinstance(v,str) for k,v in params.items()):
                  fail('PARAMS_SHAPE','params must be a string-to-string JSON object')
              core=load_core(Path(__file__).with_name('ops-decision-closure.py'))
              rows,metrics=core.query_sqlite(projection,args.query,params)
              result={
                  'schema':'ops.selectedSQLiteQueryResult.v1','status':'PASS',
                  'projectionKind':'sqlite-shards','checkpointId':manifest['checkpointId'],
                  'authorityRootDigest':manifest['authorityRootDigest'],'queryId':args.query,
                  'params':params,'rows':rows,'semanticDigest':hashlib.sha256(core.canonical(rows)).hexdigest(),
                  'metrics':metrics,
              }
              print(json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':')))
              return 0

          if __name__=='__main__': raise SystemExit(main())
          PY
          chmod 0555 packages/ops-decision-closure/bin/query.py

          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('build/packages.jsonl')
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          row={'bin':'ops-decision-closure','deps':['python'],'entry':'packages/ops-decision-closure/bin/query.py','env':[],'kind':'package','name':'ops-decision-closure','runtime':'python'}
          rows=[x for x in rows if x.get('name')!=row['name']]+[row]
          p.write_text(''.join(json.dumps(x,sort_keys=True,separators=(',',':'))+'\n' for x in rows),encoding='utf-8')

          t=Path('packages/ops-decision-closure/tests/final-e2e.mjs')
          s=t.read_text(encoding='utf-8')
          anchor='  assert.ok(fs.statSync(path.join(out, "dd-packet", "known-limitations.json")).size > 10);\n'
          addition=anchor+'''  const querySource = fs.readFileSync(path.join(root, "packages/ops-decision-closure/bin/query.py"), "utf8");
          assert.equal(querySource.includes("duckdb"), false);
          const selected = spawnSync("python3", [path.join(root, "packages/ops-decision-closure/bin/query.py"), "--projection", path.join(out, "checkpoint-selected"), "--query", "current_decisions", "--params-json", JSON.stringify({ domain: "decision-ledger" })], { encoding: "utf8" });
          if (selected.error) throw selected.error;
          if (selected.status !== 0) throw new Error(`${selected.stdout}\\n${selected.stderr}`);
          const selectedResult = JSON.parse(selected.stdout);
          assert.equal(selectedResult.status, "PASS");
          assert.deepEqual(selectedResult.rows.map((x) => x.id), ["d-lease-current"]);
          assert.equal(selectedResult.semanticDigest, JSON.parse(fs.readFileSync(path.join(out, "decision-packet.json"), "utf8")).canonical_result_digests.current_decisions);
          '''
          addition='\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines())+'\n'
          if 'selectedResult.semanticDigest' not in s:
              assert anchor in s
              s=s.replace(anchor,addition,1)
          t.write_text(s,encoding='utf-8')

          r=Path('packages/ops-decision-closure/README.md')
          text=r.read_text(encoding='utf-8')
          note='''\n## Selected normal runtime\n\n`bin/query.py` is the normal read-only entry and accepts only `ops.sqliteShardProjection.v1`; it depends on Python standard-library SQLite and verifies every manifest asset before query. DuckDB remains only in the exact comparison/check path and is not a normal runtime dependency.\n'''
          if '## Selected normal runtime' not in text: r.write_text(text.rstrip()+note,encoding='utf-8')
          PY

      - name: Acquire exact DuckDB proof comparator
        id: duck
        shell: bash
        env:
          PAYLOAD_SHA: 3d33b1df037cb049155c393778df7853fafb23e9d49d7c9cacdde4dd67155788
          TAG: duckdb-carrier-v1.5.5-3d33b1df037c
        run: |
          set -euo pipefail
          carrier="$RUNNER_TEMP/duckdb.b64.txt"; duckdb="$RUNNER_TEMP/duckdb"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/carrier.native.linux-amd64.$PAYLOAD_SHA.b64.txt" -o "$carrier"
          python3 - "$carrier" "$duckdb" "$PAYLOAD_SHA" <<'PY'
          import base64,hashlib,pathlib,sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='ascii'); data=base64.b64decode(text,validate=True)
          assert not any(c.isspace() for c in text) and base64.b64encode(data).decode('ascii')==text
          assert hashlib.sha256(data).hexdigest()==sys.argv[3]
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PY
          chmod 0555 "$duckdb"; echo "path=$duckdb" >> "$GITHUB_OUTPUT"

      - name: Prove selected runtime without a DuckDB dependency
        shell: bash
        env:
          DUCKDB: ${{ steps.duck.outputs.path }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ops115-final"
          OPS_DUCKDB="$DUCKDB" node packages/ops-decision-closure/tests/final-e2e.mjs
          python3 packages/ops-decision-closure/bin/final-proof.py \
            --out-dir "$RUNNER_TEMP/ops115-final" --duckdb "$DUCKDB" \
            --source-commit 0000000000000000000000000000000000000000 \
            --source-tree 0000000000000000000000000000000000000000
          python3 packages/ops-decision-closure/bin/query.py \
            --projection "$RUNNER_TEMP/ops115-final/checkpoint-selected" \
            --query current_decisions --params-json '{"domain":"decision-ledger"}' \
            > evidence/ops-115-decision-closure/selected-query-proof.json

      - name: Commit focused result and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-ops115-selected-query.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: expose SQLite-only selected query runtime'
          git push origin HEAD:feat/ops-115-decision-closure-final-v2
