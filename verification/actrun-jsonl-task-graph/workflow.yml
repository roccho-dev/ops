name: actrun JSONL task graph fixture

on:
  push:

jobs:
  task-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Execute JSONL target
        run: node run-task-graph.mjs --graph tasks.jsonl --target verify --receipt out/receipt.json
      - name: Verify materialized result
        run: test "$(cat out/value.txt)" = "42" && test "$(cat out/status.txt)" = "PASS"
