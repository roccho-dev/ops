<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; }
  .slide { width: 320px; height: 180px; background: rgb(255,255,255); border: 2px solid rgb(30,30,30); position: relative; }
  .card { position: absolute; left: 20px; top: 30px; width: 180px; height: 80px; background: rgb(230,240,255); border: 1px solid rgb(0,80,160); border-radius: 8px; }
  .card::before { content: ""; position: absolute; left: 10px; top: 10px; width: 8px; height: 8px; background: rgb(255,0,0); }
  .label { margin: 20px; font: 16px Arial; color: rgb(20,20,20); }
</style>
<section class="slide" id="minimal">
  <div class="card"><span class="label">Hello Excalidraw</span></div>
</section>
